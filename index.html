<style>

@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/bricolage-grotesque-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Bricolage Grotesque';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/bricolage-grotesque-latin-600-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/dm-sans-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'DM Sans';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/dm-sans-latin-500-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'IBM Plex Mono';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/ibm-plex-mono-latin-400-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Noto Sans Devanagari';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/noto-sans-devanagari-devanagari-400-normal.woff2) format('woff2');unicode-range:U+0900-097F,U+1CD0-1CF9,U+200C-200D,U+20A8,U+20B9,U+25CC,U+A830-A839,U+A8E0-A8FF}

/* Layout: workshop notebook. Quiet ink-grey chrome, one pencil-yellow accent, a ruled "Try it" worksheet as the single rich moment. */
:root{
  --bg:#f5f7fa; --card:#ffffff; --raised:#eceff4; --line:rgba(17,24,39,.10); --line-strong:rgba(17,24,39,.22);
  --fg:#111827; --fg2:#4b5565; --fg3:#5f697c;
  --accent:#f5b800; --on-accent:#1a1405; --accent-ink:#8a6400;
  --shadow:0 1px 2px rgba(0,0,0,.05); --shadow-lg:0 8px 24px rgba(0,0,0,.08);
  --ease:cubic-bezier(.22,1,.36,1);
  --f-display:'Bricolage Grotesque','Noto Sans Devanagari',system-ui,sans-serif;
  --f-body:'DM Sans','Noto Sans Devanagari',system-ui,sans-serif;
  --f-mono:'IBM Plex Mono','Noto Sans Devanagari',ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b0d14; --card:#11141c; --raised:#1a1e28; --line:rgba(238,240,245,.10); --line-strong:rgba(238,240,245,.24);
  --fg:#eef0f5; --fg2:#a3a9b8; --fg3:#8c94a8; --accent:#f5c000; --on-accent:#1a1405; --accent-ink:#f5c000;
  --shadow:none; --shadow-lg:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b0d14; --card:#11141c; --raised:#1a1e28; --line:rgba(238,240,245,.10); --line-strong:rgba(238,240,245,.24);
  --fg:#eef0f5; --fg2:#a3a9b8; --fg3:#8c94a8; --accent:#f5c000; --on-accent:#1a1405; --accent-ink:#f5c000;
  --shadow:none; --shadow-lg:0 8px 24px rgba(0,0,0,.5); color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:400 15px/1.6 var(--f-body);-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
html[lang="hi"] body{line-height:1.75}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.wrap{max-width:1200px;margin-inline:auto}
.mono{font-family:var(--f-mono);font-size:12px;line-height:16px;color:var(--fg3)}
h1,h2,h3{font-family:var(--f-display);font-weight:500;margin:0;text-wrap:balance}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;height:64px}
.logo{font:600 18px/1 var(--f-display);letter-spacing:-.01em;display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg)}
.logo i{display:block;width:20px;height:20px;border-radius:4px;background:var(--accent);position:relative}
.logo i::before{content:"";position:absolute;left:5px;top:5px;width:10px;height:2px;background:var(--on-accent);box-shadow:0 4px 0 var(--on-accent),0 8px 0 var(--on-accent)}
.top-r{display:flex;align-items:center;gap:12px}
.seg{display:inline-flex;background:var(--raised);border:1px solid var(--line);border-radius:10px;padding:2px}
.seg button{border:0;background:transparent;height:32px;padding:0 12px;border-radius:8px;color:var(--fg2);transition:background-color .15s var(--ease),color .15s var(--ease)}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--fg);font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 1px var(--line)}
.linkbtn{border:0;background:none;padding:0 4px;height:32px;color:var(--fg2);display:inline-flex;align-items:center;gap:8px;border-radius:8px}
.linkbtn:hover{color:var(--fg)}
.linkbtn b{font-weight:500;font-family:var(--f-mono);font-size:12px;background:var(--raised);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:20px;color:var(--fg)}

/* hero */
.hero{display:grid;gap:40px;padding-block:48px 64px;align-items:center}
@media(min-width:960px){.hero{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:64px;padding-block:64px 80px}}
.hero h1{font-size:clamp(36px,6vw,64px);line-height:1.06;letter-spacing:-.025em}
html[lang="hi"] .hero h1{line-height:1.25;letter-spacing:0}
.hl{background:linear-gradient(transparent 62%,var(--accent) 62%,var(--accent) 92%,transparent 92%);padding-inline:2px;color:var(--fg)}
.hero p.sub{margin:24px 0 0;font-size:18px;line-height:28px;color:var(--fg2);max-width:36rem}
html[lang="hi"] .hero p.sub{line-height:32px}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{height:44px;padding:0 20px;border-radius:10px;border:1px solid var(--line-strong);background:var(--raised);display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg);font-weight:500;transition:background-color .15s var(--ease),transform .15s var(--ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--on-accent);box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
.btn.sm{height:36px;padding:0 14px;font-size:14px}
.btn:hover{background:var(--card)}
.btn.primary:hover{background:var(--accent);filter:brightness(.96)}

/* worksheet moment */
.sheet{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);padding:24px 24px 24px 56px;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);background-position:0 8px;background-color:var(--card)}
.sheet::before{content:"";position:absolute;left:40px;top:0;bottom:0;width:1px;background:var(--line-strong)}
.sheet .tab{position:absolute;top:-12px;left:56px;background:var(--accent);color:var(--on-accent);font:500 13px/24px var(--f-body);padding:0 12px;border-radius:6px}
.sheet-head{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin-top:8px;flex-wrap:wrap}
.sheet h2,.sheet h3{font-size:24px;line-height:32px;letter-spacing:-.01em;margin-top:4px;background:var(--card);display:inline}
.sheet .alt{display:block;color:var(--fg2);line-height:32px;background:var(--card);width:fit-content}
.sheet .what{margin:8px 0 0;color:var(--fg2);line-height:32px}
.sheet .what span,.sheet .res span{background:var(--card);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.steps{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:0}
.steps li{display:grid;grid-template-columns:24px 1fr;gap:12px;align-items:start;line-height:32px}
.steps label{display:contents;cursor:pointer}
.steps input{appearance:none;-webkit-appearance:none;width:20px;height:20px;margin:6px 2px;border:1.5px solid var(--fg3);border-radius:5px;background:var(--card);display:grid;place-content:center}
.steps input:checked{background:var(--accent);border-color:var(--accent)}
.steps input:checked::after{content:"";width:10px;height:5px;border-left:2px solid var(--on-accent);border-bottom:2px solid var(--on-accent);transform:translateY(-1px) rotate(-45deg)}
.steps .tx{background:var(--card);box-decoration-break:clone;-webkit-box-decoration-break:clone;display:inline}
.steps li:has(input:checked) .tx{color:var(--fg3);text-decoration:line-through;text-decoration-color:var(--line-strong)}
.res{margin:16px 0 0;line-height:32px}
.res b{font-weight:500;background:var(--card)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 8px;border-radius:6px;background:var(--raised);border:1px solid var(--line);font:400 12px/16px var(--f-mono);color:var(--fg2)}
.sheet-foot{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}
.sheet .alt, .sheet h2, .sheet h3{padding-right:4px}

/* sections */
section.block{padding-top:32px}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:24px}
.sec-head h2{font-size:clamp(28px,4vw,36px);line-height:1.15;letter-spacing:-.02em}
html[lang="hi"] .sec-head h2{line-height:1.3;letter-spacing:0}
.sec-head p{margin:8px 0 0;color:var(--fg2);max-width:40rem}

.filters{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line);display:grid;gap:12px}
.frow{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.field{height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);padding:0 12px;min-width:0}
.search{flex:1 1 220px;display:flex;align-items:center;gap:8px;padding:0 12px}
.search input{border:0;background:transparent;outline:0;width:100%;height:38px}
.search:focus-within{outline:2px solid var(--fg);outline-offset:2px}
.search svg{flex:none;color:var(--fg3)}
select.field{max-width:100%}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.chip{flex:none;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--line-strong);background:transparent;color:var(--fg2);transition:background-color .15s var(--ease),color .15s var(--ease)}
.chip:hover{background:var(--raised)}
.chip[aria-pressed="true"]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.tabs{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.tabs .seg button{height:32px}
.count{color:var(--fg3);font-size:13px}
.chk{display:inline-flex;align-items:center;gap:8px;color:var(--fg2);font-size:14px;cursor:pointer}
.chk input{width:16px;height:16px;accent-color:var(--fg)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:16px;margin-top:24px}
.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow);transition:border-color .15s var(--ease),background-color .15s var(--ease)}
.card:hover{border-color:var(--line-strong)}
.card.skipped{opacity:.55}
.card.liked{border-color:var(--accent)}
.c-top{display:flex;justify-content:space-between;gap:8px;align-items:center}
.c-sec{font-size:12px;line-height:16px;color:var(--fg3)}
.card h3{font-size:19px;line-height:26px;letter-spacing:-.01em}
html[lang="hi"] .card h3{line-height:30px;letter-spacing:0}
.card h3 button{all:unset;cursor:pointer}
.card h3 button::after{content:"";position:absolute;inset:0;border-radius:14px}
.card h3 button:focus-visible::after{outline:2px solid var(--fg);outline-offset:2px}
.c-alt{font-size:13px;color:var(--fg3);margin-top:2px;line-height:18px}
.c-what{margin:0;color:var(--fg2);font-size:14px;line-height:22px}
html[lang="hi"] .c-what{line-height:26px}
.c-try{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}
.c-try .lbl{font-size:12px;line-height:16px;color:var(--accent-ink);font-weight:500}
.c-try .ttl{font-size:14px;line-height:20px;font-weight:500}
html[lang="hi"] .c-try .ttl{line-height:24px}
.c-act{display:flex;gap:8px;position:relative;z-index:1}
.vbtn{flex:1;height:36px;border-radius:8px;border:1px solid var(--line-strong);background:transparent;color:var(--fg2);font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:background-color .15s var(--ease),color .15s var(--ease)}
.vbtn:hover{background:var(--raised);color:var(--fg)}
.vbtn[aria-pressed="true"].y{background:var(--accent);border-color:transparent;color:var(--on-accent);font-weight:500}
.vbtn[aria-pressed="true"].n{background:var(--raised);color:var(--fg);font-weight:500}
.vbtn svg{width:16px;height:16px;stroke-width:1.5}
.empty{padding:48px 0;color:var(--fg2);text-align:center;display:grid;gap:16px;justify-items:center}

/* dialog */
dialog{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:20px;padding:0;width:min(640px,calc(100vw - 32px));max-height:min(90vh,900px);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(5,8,15,.55)}
.dlg{padding:32px 16px 24px;position:relative}
@media(min-width:560px){.dlg{padding:32px 32px 24px}}
.dlg .x{position:absolute;right:12px;top:12px;height:32px;width:32px;border-radius:8px;border:0;background:var(--raised);display:grid;place-items:center;color:var(--fg2);z-index:2}
.dlg .head{padding-right:40px;margin-bottom:24px}
.dlg .head h2{font-size:26px;line-height:32px;letter-spacing:-.015em}
html[lang="hi"] .dlg .head h2{line-height:38px;letter-spacing:0}
.dlg .head .c-alt{font-size:14px}
.dlg .head .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.dlg .sheet{margin-top:20px}
.dlg .verdict{display:flex;gap:12px;margin-top:24px;flex-wrap:wrap}
.dlg .verdict .vbtn{height:44px;font-size:15px;flex:1 1 180px}
.src{margin:20px 0 0;color:var(--fg2);font-size:14px;line-height:22px;border-top:1px solid var(--line);padding-top:16px}
html[lang="hi"] .src{line-height:26px}

/* footer */
footer{margin-top:80px;border-top:1px solid var(--line);padding-top:24px;color:var(--fg2);font-size:14px;display:grid;gap:12px;max-width:48rem}
footer p{margin:0}
.fb{width:100%;min-height:96px;margin-top:12px;border-radius:10px;border:1px solid var(--line-strong);background:var(--card);padding:12px}

@media(max-width:560px){
  .sheet{padding:20px 16px 20px 44px}
  .sheet::before{left:30px}
  .sheet .tab{left:44px}
  .top-r{gap:8px}
  .linkbtn span.t{display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <a class="logo" href="#top"><i aria-hidden="true"></i>Career Saathi</a>
    <div class="top-r">
      <button class="linkbtn" id="goMine" type="button"><span class="t" data-i="mine"></span><b id="mineN">0</b></button>
      <div class="seg" id="langSeg" role="group" aria-label="Language"></div>
    </div>
  </header>

  <main id="top">
    <div class="hero">
      <div>
        <h1 id="h1"></h1>
        <p class="sub" data-i="heroSub"></p>
        <div class="cta">
          <a class="btn primary" href="#browse" data-i="browse"></a>
          <button class="btn" id="rand" type="button" data-i="random"></button>
        </div>
      </div>
      <div id="hero" aria-live="polite"></div>
    </div>

    <section class="block" id="browse">
      <div class="sec-head">
        <div><h2 data-i="allTitle"></h2><p data-i="allSub"></p></div>
      </div>
      <div class="filters">
        <div class="frow">
          <label class="field search"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" autocomplete="off"></label>
          <select class="field" id="selSec" aria-label="Field"></select>
          <select class="field" id="selTime" aria-label="Time"></select>
        </div>
        <div class="chips" id="chips"></div>
        <div class="tabs">
          <div class="seg" id="tabs" role="group"></div>
          <div class="frow"><label class="chk"><input type="checkbox" id="hide"><span data-i="hideSkipped"></span></label><span class="count" id="count"></span></div>
        </div>
      </div>
      <div id="list"></div>
    </section>
  </main>

  <footer>
    <p data-i="foot1"></p>
    <p data-i="foot2"></p>
  </footer>
</div>

<script>
const DATA=[{"id":"c001","s":"eng","p":449,"n":{"en":"Aeronautical Engineer","hi":"एयरोनॉटिकल इंजीनियर"},"w":{"en":"Designs, tests and improves aircraft, helicopters and rockets so they fly safely and efficiently.","hi":"हवाई जहाज, हेलिकॉप्टर और रॉकेट को डिजाइन, टेस्ट और बेहतर बनाता है ताकि वे सुरक्षित और अच्छी तरह उड़ सकें।"},"t":{"title":{"en":"Fold and test a paper plane","hi":"पेपर प्लेन बनाओ और उड़ाकर टेस्ट करो"},"steps":{"en":["Fold two A4 paper planes: one with long thin wings, one with short wide wings.","Throw each one five times from the same spot and measure how far it flies.","Clip a small paper-clip on the nose of the best plane, fly it again and note the change."],"hi":["A4 कागज से दो पेपर प्लेन बनाओ: एक लंबे पतले पंखों वाला, दूसरा छोटे चौड़े पंखों वाला।","हर प्लेन को एक ही जगह से पाँच बार उड़ाओ और देखो कि वह कितनी दूर जाता है।","सबसे अच्छे प्लेन की नाक पर छोटी पेपर-क्लिप लगाकर फिर उड़ाओ और फर्क लिखो।"]},"result":{"en":"A table of flight distances showing which wing design flies farthest.","hi":"एक टेबल जो बताएगी कि कौन-सा विंग डिजाइन सबसे दूर उड़ता है।"},"time":"30 min","cost":"Free"},"g":["build","machines","science"]},{"id":"c002","s":"eng","p":451,"n":{"en":"Automobile Engineer","hi":"ऑटोमोबाइल इंजीनियर"},"w":{"en":"Designs and improves cars, bikes and trucks, working on engines, brakes, safety and fuel use.","hi":"कार, बाइक और ट्रक को डिजाइन और बेहतर बनाता है, जैसे इंजन, ब्रेक, सुरक्षा और ईंधन की बचत पर काम करता है।"},"t":{"title":{"en":"Ramp test for a toy car","hi":"खिलौना कार का रैंप टेस्ट"},"steps":{"en":["Rest a plank or thick card on a pile of books to make a ramp, and roll a toy car down it.","Mark where it stops, then add coins on the car one by one and roll again each time.","Make the ramp higher, repeat, and note whether weight or slope changes the distance more."],"hi":["किताबों के ढेर पर तख्ता या मोटा गत्ता रखकर रैंप बनाओ और खिलौना कार को नीचे लुढ़काओ।","जहाँ कार रुके वहाँ निशान लगाओ, फिर कार पर एक-एक सिक्का रखकर बार-बार लुढ़काओ।","रैंप को ऊँचा करके फिर करो और देखो कि वजन या ढलान, किससे दूरी ज्यादा बदलती है।"]},"result":{"en":"A small chart showing how weight and slope change how far a car rolls.","hi":"एक छोटा चार्ट जो दिखाएगा कि वजन और ढलान से कार कितनी दूर जाती है।"},"time":"30 min","cost":"Free"},"g":["machines","build","science"]},{"id":"c003","s":"eng","p":453,"n":{"en":"Bioinformatics Engineer","hi":"जैवसूचना विज्ञान अभियंता"},"w":{"en":"Uses computers and data to study DNA and protein sequences, helping scientists understand genes and diseases.","hi":"कंप्यूटर और डेटा की मदद से DNA और प्रोटीन के क्रम को पढ़ता है, ताकि वैज्ञानिक जीन और बीमारियाँ समझ सकें।"},"t":{"title":{"en":"Count DNA letters in Google Sheets","hi":"गूगल शीट्स में DNA के अक्षर गिनो"},"steps":{"en":["Type a made-up 40-letter DNA string using only A, C, G and T into one Google Sheets cell.","Use LEN and SUBSTITUTE formulas to count how many times each letter appears in the string.","Draw a bar chart, then change a few letters and watch the counts update automatically."],"hi":["गूगल शीट्स के एक सेल में A, C, G, T से बना अपना 40 अक्षरों का नकली DNA लिखो।","LEN और SUBSTITUTE फॉर्मूला से गिनो कि हर अक्षर कितनी बार आया है।","बार चार्ट बनाओ, फिर कुछ अक्षर बदलो और देखो कि गिनती अपने-आप बदल जाती है।"]},"result":{"en":"A working sheet that counts DNA letters automatically.","hi":"एक स्प्रेडशीट जो DNA के अक्षर अपने-आप गिन देती है।"},"time":"45 min","cost":"Free"},"g":["code","science","numbers"]},{"id":"c004","s":"eng","p":455,"n":{"en":"Biomedical Engineer","hi":"जैवचिकित्सा अभियंता"},"w":{"en":"Designs medical devices like heart monitors, artificial limbs and scanners, using engineering together with biology.","hi":"हार्ट मॉनिटर, कृत्रिम अंग और स्कैनर जैसे मेडिकल उपकरण बनाता है, जिसमें इंजीनियरिंग और जीव विज्ञान दोनों काम आते हैं।"},"t":{"title":{"en":"Measure your pulse before and after exercise","hi":"कसरत से पहले और बाद में अपनी नब्ज़ नापो"},"steps":{"en":["Find your pulse at the wrist, count beats for 30 seconds and double the number.","Do 20 jumping jacks, then measure your pulse again every minute for three minutes.","Write the numbers in a notebook or Sheet and draw a line graph of your heart rate."],"hi":["कलाई पर नब्ज़ ढूँढो, 30 सेकंड धड़कनें गिनो और संख्या को दोगुना कर दो।","20 जंपिंग जैक करो, फिर तीन मिनट तक हर मिनट पर दोबारा नब्ज़ नापो।","संख्याएँ कॉपी या शीट में लिखो और अपनी हार्ट रेट का लाइन ग्राफ बनाओ।"]},"result":{"en":"A graph showing how your heart rate rises and then settles back.","hi":"एक ग्राफ जो दिखाएगा कि आपकी धड़कन कैसे बढ़ती है और फिर सामान्य होती है।"},"time":"15 min","cost":"Free"},"g":["health","science","numbers"]},{"id":"c005","s":"eng","p":457,"n":{"en":"Biotechnology Engineer","hi":"जैव प्रौद्योगिकी अभियंता"},"w":{"en":"Uses living things like microbes and cells to make useful products such as medicines, vaccines, curd and better crops.","hi":"सूक्ष्म जीवों और कोशिकाओं का इस्तेमाल करके दवाइयाँ, टीके, दही और बेहतर फसलें जैसी उपयोगी चीजें बनाता है।"},"t":{"title":{"en":"Watch yeast make dough rise","hi":"यीस्ट से आटे को फूलते हुए देखो"},"steps":{"en":["Mix flour, lukewarm water and a pinch of yeast in two cups; add a spoon of sugar to only one.","Mark the starting dough level on each cup with a pen and wait 45 minutes somewhere warm.","Measure how much each dough has risen and note which one grew more."],"hi":["दो कपों में मैदा, गुनगुना पानी और चुटकी भर यीस्ट मिलाओ; सिर्फ एक में चम्मच भर चीनी डालो।","हर कप में आटे का शुरुआती स्तर पेन से निशान लगाओ और 45 मिनट गर्म जगह पर रखो।","नापो कि हर आटा कितना फूला और देखो कि कौन-सा ज्यादा बढ़ा।"]},"result":{"en":"A simple experiment showing how food changes the way yeast works.","hi":"एक छोटा प्रयोग जो दिखाता है कि खाना यीस्ट के काम को कैसे बदलता है।"},"time":"1 hour","cost":"Under ₹100"},"g":["science","nature","food"]},{"id":"c006","s":"eng","p":459,"n":{"en":"Broadcast Engineer","hi":"प्रसारण अभियंता"},"w":{"en":"Sets up and looks after the equipment that sends TV and radio programmes, keeping sound and picture clear.","hi":"टीवी और रेडियो कार्यक्रम भेजने वाले उपकरण लगाता और संभालता है, ताकि आवाज और तस्वीर साफ रहे।"},"t":{"title":{"en":"Record a 2-minute radio show","hi":"2 मिनट का रेडियो शो रिकॉर्ड करो"},"steps":{"en":["Write a short script, then record it on your phone in a quiet room, once close and once far.","Play both recordings with earphones and compare which one sounds clearer and why.","Trim mistakes using your phone's editor or a free tool like Audacity and save the final clip."],"hi":["छोटी स्क्रिप्ट लिखो और शांत कमरे में मोबाइल पर रिकॉर्ड करो, एक बार पास से और एक बार दूर से।","दोनों रिकॉर्डिंग इयरफोन से सुनो और तुलना करो कि कौन-सी ज्यादा साफ है और क्यों।","मोबाइल के एडिटर या Audacity जैसे फ्री टूल से गलतियाँ काटो और फाइनल क्लिप सेव करो।"]},"result":{"en":"A clean short audio clip and a clear idea of the best microphone distance.","hi":"एक साफ छोटी ऑडियो क्लिप और यह जानकारी कि माइक कितनी दूरी पर सबसे अच्छा रहता है।"},"time":"45 min","cost":"Free"},"g":["art","people","machines"]},{"id":"c007","s":"eng","p":461,"n":{"en":"CAD Designer for Carpets","hi":"कालीनों के लिए कैड डिजाइनर"},"w":{"en":"Uses design software to create carpet patterns, colours and borders that weavers can turn into real carpets.","hi":"डिजाइन सॉफ्टवेयर से कालीन के पैटर्न, रंग और बॉर्डर बनाता है, जिन्हें बुनकर असली कालीन में बदलते हैं।"},"t":{"title":{"en":"Design a symmetrical carpet pattern","hi":"एक सममित कालीन का पैटर्न डिजाइन करो"},"steps":{"en":["Open Canva or Google Drawings (both free), make a square and draw one small motif, like a flower or diamond.","Copy and flip the motif to repeat it along the border and mirror it across the centre.","Try two different colour sets and pick the one that looks best."],"hi":["Canva या गूगल ड्रॉइंग्स (दोनों फ्री) खोलो, एक चौकोर बनाओ और उसमें फूल या डायमंड जैसा छोटा डिजाइन बनाओ।","डिजाइन को कॉपी करके पलटो और बॉर्डर में दोहराओ, फिर बीच में उसकी मिरर इमेज बनाओ।","दो अलग रंग-सेट आज़माओ और जो सबसे सुंदर लगे वह चुनो।"]},"result":{"en":"A digital carpet design in two colour options.","hi":"दो रंगों के विकल्पों वाला एक डिजिटल कालीन डिजाइन।"},"time":"45 min","cost":"Free"},"g":["art","build"]},{"id":"c008","s":"eng","p":463,"n":{"en":"CAD Jewellery Designer","hi":"कैड आभूषण डिजाइनर"},"w":{"en":"Uses 3D software to design rings, pendants and earrings, checking their size, shape and look on screen before they are made.","hi":"3D सॉफ्टवेयर से अंगूठी, पेंडेंट और झुमके डिजाइन करता है और बनने से पहले स्क्रीन पर उनका साइज और शेप देखता है।"},"t":{"title":{"en":"Model a pendant in Tinkercad","hi":"Tinkercad में पेंडेंट बनाओ"},"steps":{"en":["Open Tinkercad (free), start a new 3D design and place a heart or ring shape on the workplane.","Resize it to about 3 cm and add a small hole near the top for a chain.","Rotate it to check every side, then change the shape or colour to make a second version."],"hi":["Tinkercad (फ्री) खोलो, नया 3D डिजाइन शुरू करो और वर्कप्लेन पर दिल या छल्ले का आकार रखो।","उसे लगभग 3 सेमी का करो और ऊपर चेन के लिए एक छोटा छेद बनाओ।","उसे घुमाकर हर तरफ से देखो, फिर आकार या रंग बदलकर दूसरा वर्जन बनाओ।"]},"result":{"en":"A 3D pendant model with two design versions.","hi":"दो डिजाइन वाला एक 3D पेंडेंट मॉडल।"},"time":"1 hour","cost":"Free"},"g":["art","build","code"]},{"id":"c009","s":"eng","p":465,"n":{"en":"Ceramic Technologist / Engineer","hi":"सिरेमिक टेक्नोलॉजिस्ट/इंजीनियर"},"w":{"en":"Works with clay and similar materials to make pots, tiles, bathroom fittings and heat-resistant parts, and tests how strong they are.","hi":"मिट्टी जैसे पदार्थों से बर्तन, टाइल, बाथरूम का सामान और गर्मी सहने वाले पुर्जे बनाता है और उनकी मजबूती जाँचता है।"},"t":{"title":{"en":"Make and test a pinch pot","hi":"पिंच पॉट बनाओ और उसकी मजबूती जाँचो"},"steps":{"en":["Mix atta, a pinch of salt and water into a firm dough and pinch it into a small pot.","Make a second pot with thicker walls, then dry both in the sun for a day.","Press each pot gently with a finger and note which feels stronger or cracks."],"hi":["आटे, चुटकी भर नमक और पानी से सख्त आटा गूँधो और अंगूठे से दबाकर छोटा कटोरा बनाओ।","दूसरा कटोरा मोटी दीवारों वाला बनाओ, फिर दोनों को एक दिन धूप में सुखाओ।","हर कटोरे को उंगली से हल्का दबाओ और देखो कि कौन-सा ज्यादा मजबूत है या चटकता है।"]},"result":{"en":"Two dried pots and a note on how wall thickness affects strength.","hi":"दो सूखे कटोरे और यह जानकारी कि दीवार की मोटाई का मजबूती पर क्या असर पड़ता है।"},"time":"weekend","cost":"Free"},"g":["art","build","science"]},{"id":"c010","s":"eng","p":467,"n":{"en":"Chemical Engineer","hi":"रसायन अभियंता"},"w":{"en":"Designs large-scale processes that turn raw materials into useful products such as fuels, plastics, medicines and fertilisers.","hi":"ऐसी बड़ी प्रक्रियाएँ डिजाइन करता है जो कच्चे माल को ईंधन, प्लास्टिक, दवाइयाँ और खाद जैसी चीजों में बदलती हैं।"},"t":{"title":{"en":"Separate a salt and sand mixture","hi":"नमक और रेत का मिश्रण अलग करो"},"steps":{"en":["Mix a spoon of salt with a spoon of sand, add warm tap water and stir until the salt dissolves.","Pour it through a clean cloth into a plate; the sand stays behind on the cloth.","Leave the plate in the sun until the water dries and salt crystals appear."],"hi":["एक चम्मच नमक और एक चम्मच रेत मिलाओ, गुनगुना पानी डालो और नमक घुलने तक चलाओ।","उसे साफ कपड़े से छानकर प्लेट में डालो; रेत कपड़े पर रह जाएगी।","प्लेट को धूप में रखो जब तक पानी सूखकर नमक के कण न दिखने लगें।"]},"result":{"en":"Separated sand and salt, and a feel for how mixtures are separated step by step.","hi":"अलग किए हुए रेत और नमक, और यह समझ कि मिश्रण चरण-दर-चरण कैसे अलग होते हैं।"},"time":"weekend","cost":"Free"},"g":["science","build"]},{"id":"c011","s":"eng","p":469,"n":{"en":"Civil / Structural Engineer","hi":"सिविल इंजीनियर/स्ट्रक्चरल इंजीनियर"},"w":{"en":"Plans and supervises buildings, bridges, roads and dams, making sure they are strong, safe and long-lasting.","hi":"इमारतें, पुल, सड़कें और बाँध की योजना बनाता और निगरानी करता है, ताकि वे मजबूत, सुरक्षित और टिकाऊ हों।"},"t":{"title":{"en":"Build and load-test a paper bridge","hi":"कागज का पुल बनाओ और उस पर वजन परखो"},"steps":{"en":["Place two books 15 cm apart, lay a flat A4 sheet across and add coins until it sags.","Fold a second sheet into zigzag pleats and test it the same way.","Count the coins each bridge held and guess why one was stronger."],"hi":["दो किताबें 15 सेमी दूर रखो, उन पर सपाट A4 कागज बिछाओ और झुकने तक सिक्के रखते जाओ।","दूसरे कागज को ज़िगज़ैग तहों में मोड़ो और वैसे ही परखो।","गिनो कि हर पुल ने कितने सिक्के संभाले और सोचो कि एक ज्यादा मजबूत क्यों था।"]},"result":{"en":"Proof of how shape can make the same material much stronger.","hi":"इस बात का सबूत कि आकार से एक ही चीज कितनी मजबूत हो सकती है।"},"time":"30 min","cost":"Free"},"g":["build","science"]},{"id":"c012","s":"eng","p":471,"n":{"en":"Corrosion Engineer","hi":"कोरोजन इंजीनियर"},"w":{"en":"Studies how metals rust or wear away and finds ways to protect pipes, bridges, ships and machines.","hi":"यह पढ़ता है कि धातुएँ कैसे जंग खाती या घिसती हैं और पाइप, पुल, जहाज और मशीनों को बचाने के तरीके खोजता है।"},"t":{"title":{"en":"Rust race with three nails","hi":"तीन कीलों की जंग की रेस"},"steps":{"en":["Put iron nails in three cups: plain water, salty water, and salty water with one nail coated in a little oil.","Take a photo of all three cups every day for four or five days.","Compare which nail rusted most and which stayed cleanest."],"hi":["तीन कपों में लोहे की कीलें रखो: सादा पानी, नमकीन पानी, और नमकीन पानी में थोड़े तेल से ढकी कील।","चार-पाँच दिन तक रोज हर कप की फोटो लो।","तुलना करो कि किस कील में सबसे ज्यादा जंग लगी और कौन-सी सबसे साफ रही।"]},"result":{"en":"A photo log showing what speeds up rusting and what protects metal.","hi":"फोटो की एक डायरी जो दिखाती है कि जंग किससे तेज होती है और धातु किससे बचती है।"},"time":"weekend","cost":"Under ₹100"},"g":["science","machines"]},{"id":"c013","s":"eng","p":473,"n":{"en":"Design Engineer","hi":"डिजाइन इंजीनियर"},"w":{"en":"Turns an idea for a product or machine into detailed drawings and working prototypes, balancing strength, cost and ease of use.","hi":"किसी प्रोडक्ट या मशीन के आइडिया को विस्तृत ड्रॉइंग और चलते हुए प्रोटोटाइप में बदलता है, जिसमें मजबूती, खर्च और आसानी का ध्यान रखता है।"},"t":{"title":{"en":"Design and improve a pen stand","hi":"पेन स्टैंड डिजाइन करो और उसे बेहतर बनाओ"},"steps":{"en":["Sketch a pen stand with sizes on paper, then build it from cardboard and tape.","Test it with five pens and a heavy book nearby: does it stay upright and strong?","Fix the weakest point, rebuild it and compare version 1 with version 2."],"hi":["कागज पर नाप के साथ पेन स्टैंड का स्केच बनाओ, फिर गत्ते और टेप से बनाओ।","उसमें पाँच पेन रखकर परखो: क्या वह सीधा और मजबूत खड़ा रहता है?","सबसे कमजोर हिस्सा ठीक करो, दोबारा बनाओ और वर्जन 1 व वर्जन 2 की तुलना करो।"]},"result":{"en":"A working prototype and a sketch showing what you improved.","hi":"एक चलता हुआ प्रोटोटाइप और स्केच जो दिखाए कि आपने क्या बेहतर किया।"},"time":"1 hour","cost":"Free"},"g":["build","machines","art"]},{"id":"c014","s":"eng","p":475,"n":{"en":"DevOps Engineer","hi":"डेवलपमेंट ऑपरेशंस इंजीनियर"},"w":{"en":"Connects software writing with testing and release, using automation so new features reach users quickly without breaking things.","hi":"सॉफ्टवेयर लिखने, टेस्ट करने और रिलीज करने को जोड़ता है और ऑटोमेशन से नए फीचर बिना गड़बड़ी के जल्दी यूजर तक पहुँचाता है।"},"t":{"title":{"en":"Test and release a tiny web page","hi":"छोटा वेब पेज बनाओ, टेस्ट करो और रिलीज करो"},"steps":{"en":["In a free online editor like W3Schools Try-it, write a five-line HTML page with a heading and a button.","Make a three-point test checklist: does it load, does the button work, does it look fine on a phone?","Fix any failure, run the checklist again, then save the final code as your release."],"hi":["W3Schools Try-it जैसे फ्री ऑनलाइन एडिटर में हेडिंग और बटन वाला पाँच लाइन का HTML पेज लिखो।","तीन टेस्ट की चेकलिस्ट बनाओ: पेज खुलता है, बटन चलता है, मोबाइल पर ठीक दिखता है?","जो टेस्ट फेल हो उसे ठीक करो, चेकलिस्ट दोबारा चलाओ और फाइनल कोड को अपनी रिलीज के रूप में सेव करो।"]},"result":{"en":"A tested web page and a checklist you can reuse every time.","hi":"एक टेस्ट किया हुआ वेब पेज और एक चेकलिस्ट जिसे आप हर बार इस्तेमाल कर सकते हैं।"},"time":"45 min","cost":"Free"},"g":["code","build"]},{"id":"c015","s":"eng","p":477,"n":{"en":"Electrical and Electronics Engineer","hi":"इलेक्ट्रिकल एवं इलेक्ट्रॉनिक्स इंजीनियर"},"w":{"en":"Designs and maintains electrical systems and electronic devices, from power supply and wiring to the circuits inside gadgets.","hi":"बिजली की व्यवस्था और इलेक्ट्रॉनिक उपकरण बनाता और संभालता है, बिजली की सप्लाई और वायरिंग से लेकर गैजेट के अंदर के सर्किट तक।"},"t":{"title":{"en":"Light an LED in a circuit simulator","hi":"सर्किट सिमुलेटर में LED जलाओ"},"steps":{"en":["Open Tinkercad Circuits (free) and place a battery, a resistor and an LED on the board.","Connect them with wires and press Start Simulation to see the LED light up.","Change the resistor value up and down and watch how the LED brightness changes."],"hi":["Tinkercad Circuits (फ्री) खोलो और बोर्ड पर एक बैटरी, एक रेजिस्टर और एक LED रखो।","तारों से जोड़ो और Start Simulation दबाकर देखो कि LED जलती है।","रेजिस्टर की वैल्यू घटाओ-बढ़ाओ और देखो कि LED की चमक कैसे बदलती है।"]},"result":{"en":"A working virtual circuit and a first idea of how resistance controls current.","hi":"एक चलता हुआ वर्चुअल सर्किट और यह शुरुआती समझ कि रेजिस्टेंस करंट को कैसे काबू करता है।"},"time":"45 min","cost":"Free"},"g":["machines","science","build"]},{"id":"c016","s":"eng","p":479,"n":{"en":"Electronic Designer / VLSI / Embedded System Designer","hi":"इलेक्ट्रॉनिक डिजाइनर/वी.एल.एस.आई./एम्बेडेड सिस्टम डिजाइनर"},"w":{"en":"Designs tiny chips and the small computers inside gadgets, working out how circuits make decisions and control devices.","hi":"छोटी चिप और गैजेट के अंदर के छोटे कंप्यूटर डिजाइन करता है और तय करता है कि सर्किट कैसे फैसले लेकर उपकरण चलाएँ।"},"t":{"title":{"en":"Build a door alarm with logic gates","hi":"लॉजिक गेट से डोर अलार्म बनाओ"},"steps":{"en":["Open CircuitVerse (free) and place two switches, an AND gate and an LED bulb.","Connect them so the LED lights only when both switches are on.","Write a truth table for all four switch combinations and check each one in the simulator."],"hi":["CircuitVerse (फ्री) खोलो और दो स्विच, एक AND गेट और एक LED बल्ब रखो।","उन्हें ऐसे जोड़ो कि LED तभी जले जब दोनों स्विच ऑन हों।","चारों स्विच संयोजनों की ट्रुथ टेबल लिखो और सिमुलेटर में हर एक जाँचो।"]},"result":{"en":"A working logic circuit and a truth table that proves it.","hi":"एक चलता हुआ लॉजिक सर्किट और उसे साबित करने वाली ट्रुथ टेबल।"},"time":"45 min","cost":"Free"},"g":["code","machines","build"]},{"id":"c017","s":"eng","p":481,"n":{"en":"Electronics and Communication Engineer","hi":"इलेक्ट्रॉनिक्स एवं संचार अभियंता"},"w":{"en":"Designs systems that send information, like mobile networks, Wi-Fi, TV and satellites, along with the electronics inside them.","hi":"जानकारी भेजने वाले सिस्टम, जैसे मोबाइल नेटवर्क, वाई-फाई, टीवी और सैटेलाइट, और उनके अंदर की इलेक्ट्रॉनिक्स बनाता है।"},"t":{"title":{"en":"Make a string telephone","hi":"धागे वाला फोन बनाओ"},"steps":{"en":["Make a small hole in the bottom of two paper cups and join them with 3 metres of thread.","With a friend, walk apart until the thread is tight; one speaks, the other listens.","Try loose thread and different lengths, and note when the voice is clearest."],"hi":["दो कागज के कपों की तली में छोटा छेद करो और 3 मीटर धागे से जोड़ दो।","दोस्त के साथ दूर जाओ जब तक धागा तन न जाए; एक बोले, दूसरा सुने।","ढीला धागा और अलग-अलग लंबाई आज़माओ और देखो कि आवाज कब सबसे साफ आती है।"]},"result":{"en":"A working signal link and a clear idea of what makes a message weaker or stronger.","hi":"एक चलता हुआ संदेश-लिंक और यह समझ कि संदेश कब कमजोर या साफ होता है।"},"time":"30 min","cost":"Free"},"g":["machines","science","people"]},{"id":"c018","s":"eng","p":483,"n":{"en":"Environmental Engineer","hi":"पर्यावरण अभियंता"},"w":{"en":"Finds ways to reduce pollution and manage water, waste and air, so towns and industries become cleaner and safer.","hi":"प्रदूषण घटाने और पानी, कचरे व हवा को संभालने के तरीके खोजता है, ताकि शहर और उद्योग साफ और सुरक्षित बनें।"},"t":{"title":{"en":"Do a one-day dry waste audit at home","hi":"घर के सूखे कचरे का एक दिन का ऑडिट करो"},"steps":{"en":["For one day, collect dry waste from one room in a bag. Skip food and sharp items.","Sort it into paper, plastic, metal and other, then count or weigh each group. Wash your hands afterwards.","Put the counts in Google Sheets, make a pie chart and write two ideas to cut the biggest group."],"hi":["एक दिन किसी एक कमरे का सूखा कचरा थैली में जमा करो। खाने की चीजें और नुकीली चीजें न लो।","उसे कागज, प्लास्टिक, धातु और बाकी में छाँटो और हर ढेर गिनो या तौलो। बाद में हाथ धो लो।","गिनती गूगल शीट्स में डालो, पाई चार्ट बनाओ और सबसे बड़े ढेर को घटाने के दो आइडिया लिखो।"]},"result":{"en":"A chart of your home's waste and two practical ideas to reduce it.","hi":"आपके घर के कचरे का चार्ट और उसे घटाने के दो व्यावहारिक आइडिया।"},"time":"weekend","cost":"Free"},"g":["nature","numbers","service"]},{"id":"c019","s":"eng","p":485,"n":{"en":"Fire and Safety Engineer","hi":"अग्नि और सुरक्षा अभियंता"},"w":{"en":"Plans how to prevent fires and accidents in buildings and factories, designs alarms and exits, and trains people to respond.","hi":"इमारतों और फैक्ट्रियों में आग और हादसे रोकने की योजना बनाता है, अलार्म और निकास डिजाइन करता है और लोगों को सही कदम उठाना सिखाता है।"},"t":{"title":{"en":"Make a home fire escape plan","hi":"घर के लिए आग से बचने का नक्शा बनाओ"},"steps":{"en":["Draw a floor plan of your home and mark every door, window and exit.","Mark possible hazards like loose wires or clutter, and tell an adult about the three most serious.","Draw two escape routes from each room and walk them through with your family."],"hi":["अपने घर का नक्शा बनाओ और हर दरवाजा, खिड़की और निकास का रास्ता दिखाओ।","ढीले तार या सामान के ढेर जैसे खतरे चिह्नित करो और सबसे गंभीर तीन के बारे में बड़ों को बताओ।","हर कमरे से बाहर निकलने के दो रास्ते बनाओ और परिवार के साथ चलकर देखो।"]},"result":{"en":"A labelled escape map your family can actually use.","hi":"एक नाम-लिखा बचाव नक्शा जो आपका परिवार सच में इस्तेमाल कर सकता है।"},"time":"45 min","cost":"Free"},"g":["service","build"]},{"id":"c020","s":"eng","p":487,"n":{"en":"Food Engineer","hi":"खाद्य अभियंता"},"w":{"en":"Designs how food is processed, preserved and packed so it stays fresh, safe and tasty for many people.","hi":"तय करता है कि खाना कैसे तैयार, सुरक्षित और पैक हो, ताकि वह ताजा, सुरक्षित और स्वादिष्ट रहकर कई लोगों तक पहुँचे।"},"t":{"title":{"en":"Stop apple slices turning brown","hi":"कटे सेब को भूरा होने से रोको"},"steps":{"en":["With an adult's help, cut an apple into four slices: leave one plain, dip one in lemon juice, one in salt water, one in plain water.","Take a photo of all four slices every 15 minutes for one hour.","Rank them from least to most brown and note which method worked best."],"hi":["बड़ों की मदद से सेब के चार टुकड़े करो: एक सादा रखो, एक नींबू के रस में, एक नमक के पानी में, एक सादे पानी में डुबाओ।","एक घंटे तक हर 15 मिनट पर चारों टुकड़ों की फोटो लो।","कम से ज्यादा भूरे के क्रम में लगाओ और लिखो कि कौन-सा तरीका सबसे अच्छा रहा।"]},"result":{"en":"A photo timeline showing the best way to keep cut fruit fresh.","hi":"फोटो की टाइमलाइन जो बताती है कि कटा फल ताजा रखने का सबसे अच्छा तरीका क्या है।"},"time":"1 hour","cost":"Free"},"g":["food","science"]},{"id":"c021","s":"eng","p":489,"n":{"en":"Footwear Designer","hi":"फुटवियर डिजाइनर"},"w":{"en":"Designs shoes, sandals and chappals for comfort, fit, style and durability, choosing materials and making patterns.","hi":"जूते, सैंडल और चप्पल को आराम, फिटिंग, स्टाइल और टिकाऊपन के हिसाब से डिजाइन करता है और सामान व पैटर्न चुनता है।"},"t":{"title":{"en":"Design and test a paper sandal","hi":"कागज की सैंडल डिजाइन करो और पहनकर देखो"},"steps":{"en":["Trace your foot on cardboard, draw a sole 1 cm bigger all around and cut it out with safe scissors.","Add a strap from a paper strip or ribbon, try it on and mark where it presses.","Sketch changes for comfort and style, then make an improved version."],"hi":["गत्ते पर अपने पैर की रेखा खींचो, चारों ओर 1 सेमी बड़ा सोल बनाओ और सावधानी से काटो।","कागज की पट्टी या रिबन से स्ट्रैप लगाओ, पहनकर देखो और जहाँ दबे वहाँ निशान लगाओ।","आराम और स्टाइल के लिए बदलावों का स्केच बनाओ, फिर बेहतर वर्जन बनाओ।"]},"result":{"en":"A cardboard sandal model and a sketch of an improved design.","hi":"गत्ते की सैंडल का मॉडल और बेहतर डिजाइन का स्केच।"},"time":"1 hour","cost":"Free"},"g":["art","build"]},{"id":"c022","s":"eng","p":491,"n":{"en":"Forensic Engineer","hi":"फॉरेंसिक इंजीनियर"},"w":{"en":"Investigates why machines, buildings or products failed or crashed, and writes careful reports about what went wrong.","hi":"जाँच करता है कि मशीन, इमारत या कोई सामान क्यों खराब हुआ या टूटा, और क्या गलत हुआ इसकी ध्यान से रिपोर्ट लिखता है।"},"t":{"title":{"en":"Write a failure report on a broken object","hi":"टूटी चीज की फेल्योर रिपोर्ट लिखो"},"steps":{"en":["With permission, pick a broken item at home, such as a snapped pencil, torn bag strap or cracked toy.","Examine it closely, photograph it and mark where it broke, noting signs like wear, bending or glue.","Write a five-line report: what happened, the likely cause and how it could have been prevented."],"hi":["इजाजत लेकर घर की कोई टूटी चीज चुनो, जैसे टूटी पेंसिल, फटा बैग-स्ट्रैप या दरार वाला खिलौना।","उसे ध्यान से देखो, फोटो लो और टूटने की जगह चिह्नित करो; घिसाव, मुड़ाव या गोंद जैसे संकेत लिखो।","पाँच लाइन की रिपोर्ट लिखो: क्या हुआ, संभावित कारण क्या था और इसे कैसे रोका जा सकता था।"]},"result":{"en":"A short evidence-based failure report with a prevention idea.","hi":"सबूतों पर आधारित एक छोटी फेल्योर रिपोर्ट और बचाव का एक आइडिया।"},"time":"30 min","cost":"Free"},"g":["justice","science","machines"]},{"id":"c023","s":"eng","p":493,"n":{"en":"Geoinformatics Engineer","hi":"भू-सूचना विज्ञान अभियंता"},"w":{"en":"Uses maps, satellite images and location data to study places, helping with city planning, farming, disasters and weather.","hi":"नक्शों, सैटेलाइट तस्वीरों और लोकेशन डेटा से जगहों का अध्ययन करता है, जिससे शहर की योजना, खेती, आपदा और मौसम में मदद मिलती है।"},"t":{"title":{"en":"Map your neighbourhood in Google My Maps","hi":"गूगल माय मैप्स में अपना मोहल्ला बनाओ"},"steps":{"en":["Open Google My Maps (free) and create a new map of your locality.","Add eight pins such as school, hospital, park and shops, and keep them in separate layers.","Use the measure tool to find the distance from your home to each place."],"hi":["गूगल माय मैप्स (फ्री) खोलो और अपने इलाके का नया नक्शा बनाओ।","स्कूल, अस्पताल, पार्क और दुकानों जैसी आठ जगहों पर पिन लगाओ और उन्हें अलग-अलग लेयर में रखो।","माप टूल से अपने घर से हर जगह की दूरी निकालो।"]},"result":{"en":"A layered digital map of your area with distances marked.","hi":"आपके इलाके का लेयर वाला डिजिटल नक्शा, जिस पर दूरियाँ लिखी हों।"},"time":"45 min","cost":"Free"},"g":["code","numbers","travel"]},{"id":"c024","s":"eng","p":495,"n":{"en":"Graphic Designer","hi":"ग्राफिक डिजाइनर"},"w":{"en":"Creates posters, logos, social media posts and book covers that put across an idea clearly and look attractive.","hi":"पोस्टर, लोगो, सोशल मीडिया पोस्ट और किताब के कवर बनाता है, जो बात साफ बताएँ और अच्छे भी दिखें।"},"t":{"title":{"en":"Design a poster for a school event","hi":"स्कूल के कार्यक्रम का पोस्टर बनाओ"},"steps":{"en":["Open Canva (free), pick a poster size and write the event name, date and place.","Use only two fonts and three colours, and make the most important words biggest.","Show it to a friend from two metres away, ask what they read first, then adjust."],"hi":["Canva (फ्री) खोलो, पोस्टर साइज चुनो और कार्यक्रम का नाम, तारीख और जगह लिखो।","सिर्फ दो फॉन्ट और तीन रंग इस्तेमाल करो और सबसे जरूरी शब्द सबसे बड़े रखो।","दोस्त को दो मीटर दूर से दिखाओ, पूछो कि पहले क्या पढ़ा, फिर उसी हिसाब से सुधारो।"]},"result":{"en":"A finished poster, improved by real feedback.","hi":"एक तैयार पोस्टर, जो असली फीडबैक से और बेहतर बना।"},"time":"45 min","cost":"Free"},"g":["art","people"]},{"id":"c025","s":"eng","p":497,"n":{"en":"Industrial Designer","hi":"इंडस्ट्रियल डिजाइनर"},"w":{"en":"Designs everyday products like phones, chairs and bottles so they look good, feel comfortable and are easy to use.","hi":"फोन, कुर्सी और बोतल जैसी रोज की चीजें ऐसे डिजाइन करता है कि वे अच्छी दिखें, आरामदायक हों और इस्तेमाल में आसान हों।"},"t":{"title":{"en":"Redesign a TV remote","hi":"टीवी रिमोट को नया डिजाइन दो"},"steps":{"en":["Watch someone use a remote for a few minutes and note which buttons they press most and where they struggle.","Sketch three new layouts that make the most-used buttons big and easy to reach.","Cut a cardboard model of your best sketch and ask the person to try it."],"hi":["किसी को कुछ मिनट रिमोट चलाते देखो और लिखो कि कौन-से बटन सबसे ज्यादा दबते हैं और कहाँ दिक्कत होती है।","तीन नए लेआउट का स्केच बनाओ जिनमें ज्यादा दबने वाले बटन बड़े और पास हों।","अपने सबसे अच्छे स्केच का गत्ते का मॉडल काटो और उस व्यक्ति से आज़माने को कहो।"]},"result":{"en":"Three sketches and a cardboard mock-up tested with a real user.","hi":"तीन स्केच और एक गत्ते का मॉडल, जिसे असली यूजर ने आज़माया।"},"time":"1 hour","cost":"Free"},"g":["art","build","people"]},{"id":"c026","s":"eng","p":499,"n":{"en":"Industrial Engineer","hi":"औद्योगिक अभियंता"},"w":{"en":"Studies how people, machines and materials work together, and finds ways to make a factory, hospital or shop faster with less waste.","hi":"देखता है कि लोग, मशीनें और सामान साथ में कैसे काम करते हैं, और फैक्ट्री, अस्पताल या दुकान को तेज और कम बर्बादी वाला बनाता है।"},"t":{"title":{"en":"Cut the steps in a routine","hi":"किसी रोज के काम के कदम घटाओ"},"steps":{"en":["Draw a map of your room, then trace your walking path while packing your school bag.","Count the steps and time the whole task with your phone stopwatch.","Rearrange items to shorten the path, repeat the task and compare steps and time."],"hi":["अपने कमरे का नक्शा बनाओ, फिर स्कूल बैग लगाते समय अपने चलने का रास्ता उस पर खींचो।","कदम गिनो और मोबाइल के स्टॉपवॉच से पूरे काम का समय नापो।","सामान की जगह बदलकर रास्ता छोटा करो, काम दोबारा करो और कदम व समय की तुलना करो।"]},"result":{"en":"Before-and-after step counts and times showing what a better layout can do.","hi":"पहले और बाद के कदम और समय, जो दिखाते हैं कि बेहतर सजावट से क्या फर्क पड़ता है।"},"time":"30 min","cost":"Free"},"g":["numbers","build"]},{"id":"c027","s":"eng","p":501,"n":{"en":"Instrumentation Engineer","hi":"इंस्ट्रूमेंटेशन इंजीनियर"},"w":{"en":"Designs and maintains instruments that measure and control things like temperature, pressure, flow and level in factories and power plants.","hi":"ऐसे उपकरण बनाता और संभालता है जो फैक्ट्री और बिजलीघर में तापमान, दबाव, बहाव और स्तर को नापते और काबू करते हैं।"},"t":{"title":{"en":"Calibrate your own water-level gauge","hi":"अपना पानी-स्तर मापक बनाओ और उसे जाँचो"},"steps":{"en":["Stick a paper strip on a clear bottle. Pour one small cup of water at a time and mark each level.","Pour a random amount of water and read your scale; compare it with the number of cups used.","Note how far off each reading was, then improve the markings and test again."],"hi":["साफ बोतल पर कागज की पट्टी चिपकाओ। एक-एक छोटा कप पानी डालो और हर स्तर पर निशान लगाओ।","कोई भी मात्रा में पानी डालो और अपनी स्केल से पढ़ो; इस्तेमाल हुए कपों से मिलाओ।","देखो कि हर रीडिंग कितनी गलत थी, फिर निशान सुधारो और दोबारा जाँचो।"]},"result":{"en":"A calibrated water-level gauge and a small table of reading errors.","hi":"जाँचा हुआ पानी-स्तर मापक और रीडिंग की गलतियों की छोटी टेबल।"},"time":"45 min","cost":"Free"},"g":["machines","science","numbers"]},{"id":"c028","s":"eng","p":503,"n":{"en":"Manufacturing Engineer","hi":"मैन्युफैक्चरिंग इंजीनियर"},"w":{"en":"Plans and runs the production lines that make products in large numbers, balancing speed, cost and quality.","hi":"वे प्रोडक्शन लाइनें बनाता और चलाता है जिनमें बड़ी संख्या में सामान बनता है, और गति, खर्च व क्वालिटी का संतुलन रखता है।"},"t":{"title":{"en":"Run a paper-boat assembly line","hi":"कागज की नाव की असेंबली लाइन चलाओ"},"steps":{"en":["Alone, time yourself making 10 paper boats from start to finish.","With two friends, split the folding into three stages, one stage each, and time 10 boats.","Compare the times and count how many boats came out neat in each method."],"hi":["अकेले 10 कागज की नावें शुरू से अंत तक बनाने का समय नापो।","दो दोस्तों के साथ तह करने को तीन चरणों में बाँटो, हर कोई एक चरण करे, और 10 नावों का समय नापो।","समय की तुलना करो और गिनो कि हर तरीके में कितनी नावें साफ बनीं।"]},"result":{"en":"A time and quality comparison showing how an assembly line works.","hi":"समय और क्वालिटी की तुलना, जो दिखाती है कि असेंबली लाइन कैसे काम करती है।"},"time":"30 min","cost":"Free"},"g":["build","machines","people"]},{"id":"c029","s":"eng","p":505,"n":{"en":"Marine Engineer","hi":"मरीन इंजीनियर"},"w":{"en":"Designs, runs and repairs ship engines and onboard systems, keeping vessels moving safely and efficiently at sea.","hi":"जहाज के इंजन और दूसरे सिस्टम डिजाइन करता, चलाता और ठीक करता है, ताकि जहाज समुद्र में सुरक्षित और कुशलता से चलें।"},"t":{"title":{"en":"Foil boat cargo challenge","hi":"फॉइल की नाव और सामान ढोने की चुनौती"},"steps":{"en":["Shape a square of aluminium foil into a boat and float it in a tub or bucket of water.","Add coins one at a time until it sinks and record how many it carried.","Redesign the hull, wider, flatter or with higher sides, and see which shape carries the most."],"hi":["एल्युमिनियम फॉइल के चौकोर टुकड़े से नाव बनाओ और उसे टब या बाल्टी के पानी में तैराओ।","एक-एक करके सिक्के रखो जब तक नाव डूब न जाए और लिखो कि कितने संभाले।","नाव का आकार बदलो, चौड़ा, चपटा या ऊँचे किनारों वाला, और देखो कि कौन-सा सबसे ज्यादा वजन उठाता है।"]},"result":{"en":"A record of how hull shape changes the load a boat can carry.","hi":"इस बात का रिकॉर्ड कि नाव के आकार से उसकी वजन उठाने की ताकत कैसे बदलती है।"},"time":"30 min","cost":"Free"},"g":["machines","build","science"]},{"id":"c030","s":"eng","p":507,"n":{"en":"Mechanical Engineer","hi":"मैकेनिकल इंजीनियर"},"w":{"en":"Designs and improves machines, engines and tools, working with motion, force and heat, from fans and pumps to robots.","hi":"मशीनें, इंजन और औजार डिजाइन और बेहतर बनाता है, जो गति, बल और गर्मी से जुड़े हैं, जैसे पंखे, पंप और रोबोट।"},"t":{"title":{"en":"Lift a load with a lever","hi":"लीवर से वजन उठाओ"},"steps":{"en":["Balance a ruler on a pencil and put a small pile of coins on one end as the load.","Hang or stack coins on the other end until the load lifts, and count them.","Move the pencil closer to the load, repeat and see how the coin count changes."],"hi":["स्केल को पेंसिल पर संतुलित करो और एक सिरे पर सिक्कों का छोटा ढेर रखो।","दूसरे सिरे पर सिक्के रखते जाओ जब तक वजन उठ न जाए, और गिनो कितने लगे।","पेंसिल को वजन के पास खिसकाओ, फिर करो और देखो कि सिक्कों की संख्या कैसे बदलती है।"]},"result":{"en":"A table showing how the pivot position changes the effort needed.","hi":"एक टेबल जो दिखाती है कि धुरी की जगह बदलने से कितना बल लगता है।"},"time":"30 min","cost":"Free"},"g":["machines","build","science"]},{"id":"c031","s":"eng","p":509,"n":{"en":"Metallurgy Engineer","hi":"मेटलर्जी इंजीनियर"},"w":{"en":"Studies metals and how to extract, mix and treat them, to make steel and alloys strong enough for their job.","hi":"धातुओं और उन्हें निकालने, मिलाने और ट्रीट करने के तरीकों का अध्ययन करता है, ताकि स्टील और मिश्रधातु अपने काम के लिए पर्याप्त मजबूत बनें।"},"t":{"title":{"en":"Bend a paper clip until it breaks","hi":"पेपर क्लिप को मोड़ते हुए तोड़ो"},"steps":{"en":["Hold a paper clip away from your face. Bend one end 90 degrees and back, counting each bend until it snaps.","Repeat with three more clips, this time bending only a small angle each time.","Touch the bent spot and note any warmth. Write how bend angle changed the number of bends."],"hi":["पेपर क्लिप को चेहरे से दूर पकड़ो। एक सिरे को 90 डिग्री मोड़कर वापस सीधा करो और टूटने तक हर बार गिनो।","तीन और क्लिप के साथ दोहराओ, इस बार हर बार सिर्फ थोड़ा कोण मोड़ो।","मुड़ी जगह को छूकर गर्मी महसूस करो और लिखो कि कोण बदलने से मोड़ों की संख्या कैसे बदली।"]},"result":{"en":"Your own data on how bending angle affects how long a metal lasts.","hi":"आपका अपना डेटा कि मोड़ने का कोण धातु की उम्र पर कैसे असर डालता है।"},"time":"15 min","cost":"Free"},"g":["science","machines","build"]},{"id":"c032","s":"eng","p":511,"n":{"en":"Mining Engineer","hi":"खनन अभियंता"},"w":{"en":"Plans how to safely find minerals under the ground and bring them out, designing tunnels, ventilation and safety systems.","hi":"ज़मीन के नीचे के खनिज ढूँढने और उन्हें सुरक्षित बाहर निकालने की योजना बनाता है, सुरंग, हवा और सुरक्षा का इंतज़ाम डिज़ाइन करता है।"},"t":{"title":{"en":"Plan a dig on a paper map of the ground","hi":"कागज़ पर ज़मीन का नक्शा बनाकर खुदाई की योजना बनाएँ"},"steps":{"en":["Draw a side view of the ground with 4 layers. Secretly colour 3 small patches as ore.","Pretend you can drill only 5 test holes. Mark them and note what each one finds.","Choose the best spot for a tunnel and draw it, avoiding the water layer."],"hi":["कागज़ पर ज़मीन की चार परतों वाला साइड व्यू बनाइए। चुपचाप तीन छोटे हिस्सों को खनिज मानकर रंग दीजिए।","मान लीजिए आप सिर्फ़ पाँच टेस्ट होल कर सकते हैं। उन्हें निशान लगाइए और हर एक में क्या मिला, लिखिए।","सुरंग के लिए सबसे अच्छी जगह चुनकर उसे बनाइए, पानी वाली परत से बचते हुए।"]},"result":{"en":"You will have a simple mining plan sketch and see why testing before digging matters.","hi":"आपके पास खनन की एक सादी योजना का स्केच होगा और समझ आएगा कि खुदाई से पहले जाँच क्यों ज़रूरी है।"},"time":"30 min","cost":"Free"},"g":["science","machines"]},{"id":"c033","s":"eng","p":513,"n":{"en":"Nanotechnology / Nanoscience Engineer","hi":"नैनो टेक्नोलॉजी/नैनोसाइंस इंजीनियर"},"w":{"en":"Works with materials at an extremely tiny scale to create stronger, lighter or smarter materials, coatings and devices.","hi":"बहुत ही छोटे स्तर पर पदार्थों के साथ काम करता है ताकि ज़्यादा मज़बूत, हल्की या स्मार्ट चीज़ें, कोटिंग और उपकरण बन सकें।"},"t":{"title":{"en":"Test which surface makes water bead up","hi":"जाँचिए किस सतह पर पानी की बूँद गोल बनती है"},"steps":{"en":["Collect 4 surfaces: an arbi (colocasia) leaf, plastic sheet, paper and cloth.","Put one drop of water on each, tilt it gently, and note which drops roll off.","Make a small table of results, then search why lotus and arbi leaves repel water."],"hi":["चार सतहें इकट्ठी कीजिए: अरबी का पत्ता, प्लास्टिक शीट, कागज़ और कपड़ा।","हर एक पर पानी की एक बूँद रखिए, हल्का तिरछा कीजिए और देखिए कौन-सी बूँद लुढ़कती है।","नतीजों की छोटी तालिका बनाइए, फिर खोजिए कि कमल और अरबी के पत्ते पानी क्यों नहीं सोखते।"]},"result":{"en":"You will see how tiny surface textures change behaviour, an idea nanoscience engineers copy.","hi":"आप देखेंगे कि सतह की बहुत छोटी बनावट व्यवहार कैसे बदल देती है, यही विचार नैनो इंजीनियर इस्तेमाल करते हैं।"},"time":"30 min","cost":"Free"},"g":["science"]},{"id":"c034","s":"eng","p":515,"n":{"en":"Optical Engineer","hi":"ऑप्टिकल इंजीनियर"},"w":{"en":"Designs lenses, mirrors and light-based devices such as cameras, microscopes, telescopes and lasers, and tests how well they work.","hi":"लेंस, शीशे और रोशनी से चलने वाले उपकरण, जैसे कैमरा, माइक्रोस्कोप और टेलीस्कोप डिज़ाइन करता है और जाँचता है कि वे कितना अच्छा काम करते हैं।"},"t":{"title":{"en":"Make a water-drop magnifying lens","hi":"पानी की बूँद से मैग्निफाइंग लेंस बनाएँ"},"steps":{"en":["Place a clear plastic sheet over small printed text, like a newspaper line.","Drop a tiny bead of water on the sheet and look at the text through it.","Try bigger and smaller drops, and note which size magnifies the most."],"hi":["अख़बार की छोटी छपी लाइन पर एक साफ़ प्लास्टिक शीट रखिए।","शीट पर पानी की एक छोटी बूँद डालिए और उसके आर-पार अक्षर देखिए।","बड़ी और छोटी बूँदें आज़माइए और लिखिए कि कौन-सी बूँद सबसे ज़्यादा बड़ा दिखाती है।"]},"result":{"en":"You will have a working homemade lens and know how its curve changes what you see.","hi":"आपके पास घर का बना काम करने वाला लेंस होगा और समझ आएगा कि उसका घुमाव दिखने वाली चीज़ को कैसे बदलता है।"},"time":"15 min","cost":"Free"},"g":["science","build"]},{"id":"c035","s":"eng","p":517,"n":{"en":"Petroleum Engineer","hi":"पेट्रोलियम इंजीनियर"},"w":{"en":"Studies rocks to find oil and gas deep underground, then plans safe and efficient ways to bring them to the surface.","hi":"चट्टानों का अध्ययन करके ज़मीन के नीचे तेल और गैस ढूँढता है, फिर उन्हें सुरक्षित और कुशलता से बाहर निकालने की योजना बनाता है।"},"t":{"title":{"en":"Compare how fast liquid flows through rice and sand","hi":"चावल और रेत में तरल कितनी तेज़ बहता है, तुलना करें"},"steps":{"en":["Fill two clear glasses, one with rice and one with fine sand, up to the same level.","Pour a quarter cup of haldi-coloured water on each and time how long it takes to reach the bottom.","Write which material is like a rock that lets oil flow easily, and why."],"hi":["दो साफ़ गिलासों में बराबर ऊँचाई तक एक में चावल और दूसरे में बारीक रेत भरिए।","हर एक पर चौथाई कप हल्दी वाला पानी डालिए और नापिए कि तली तक पहुँचने में कितना समय लगा।","लिखिए कि कौन-सी चीज़ उस चट्टान जैसी है जिसमें तेल आसानी से बहता है, और क्यों।"]},"result":{"en":"You will see why the type of rock decides how easily oil or water can be taken out.","hi":"आप देखेंगे कि चट्टान का प्रकार तय करता है कि तेल या पानी कितनी आसानी से निकल सकता है।"},"time":"30 min","cost":"Free"},"g":["science","machines"]},{"id":"c036","s":"eng","p":519,"n":{"en":"Pharmaceutical Engineer","hi":"फार्मास्युटिकल इंजीनियर"},"w":{"en":"Designs and runs the processes that make medicines in large amounts, keeping every batch safe, clean and of the same quality.","hi":"वो प्रक्रियाएँ डिज़ाइन और चलाता है जिनसे बड़ी मात्रा में दवाइयाँ बनती हैं, ताकि हर बैच सुरक्षित, साफ़ और एक जैसी गुणवत्ता का हो।"},"t":{"title":{"en":"Scale up a nimbu-pani recipe, batch by batch","hi":"नींबू पानी की रेसिपी को बड़े बैच में बदलें"},"steps":{"en":["Make one glass of nimbu-pani using spoon measures and write the exact quantities.","In Google Sheets, scale the recipe to 10 glasses using simple multiplication formulas.","Make another glass from the same measures and compare taste with the first. Note any difference."],"hi":["चम्मच के नाप से एक गिलास नींबू पानी बनाइए और सही मात्राएँ लिख लीजिए।","गूगल शीट्स में गुणा के फ़ॉर्मूले से रेसिपी को 10 गिलास के हिसाब से बढ़ाइए।","उन्हीं नापों से एक और गिलास बनाइए और पहले से स्वाद मिलाइए। कोई फ़र्क हो तो लिखिए।"]},"result":{"en":"You will have a scaled-up recipe and know why exact measures keep every batch the same.","hi":"आपके पास बढ़ाई हुई रेसिपी होगी और समझ आएगा कि सही नाप से हर बैच एक जैसा क्यों बनता है।"},"time":"45 min","cost":"Free"},"g":["science","numbers"]},{"id":"c037","s":"eng","p":521,"n":{"en":"Printing Engineer / Technologist","hi":"प्रिंटिंग इंजीनियर/टेक्नोलॉजिस्ट"},"w":{"en":"Manages printing machines, inks, paper and colour settings so that books, newspapers and packaging print sharp and correct.","hi":"प्रिंटिंग मशीनें, स्याही, कागज़ और रंग की सेटिंग संभालता है ताकि किताबें, अख़बार और पैकेजिंग साफ़ और सही छपें।"},"t":{"title":{"en":"Draw a picture using only printing dots","hi":"सिर्फ़ छपाई वाले बिंदुओं से तस्वीर बनाएँ"},"steps":{"en":["Zoom your phone camera onto a coloured newspaper or magazine photo and notice the tiny dots.","Draw a smiley in pencil using only dots: many close dots for dark parts, few for light.","Hold it at arm's length and see the dots blend into a picture."],"hi":["फ़ोन कैमरा से किसी रंगीन अख़बार या पत्रिका की फ़ोटो को ज़ूम कीजिए और छोटे बिंदु देखिए।","पेंसिल से सिर्फ़ बिंदुओं से स्माइली बनाइए: गहरे हिस्से में ज़्यादा पास-पास बिंदु, हल्के में कम।","इसे हाथ भर दूर रखकर देखिए कि बिंदु मिलकर तस्वीर बन जाते हैं।"]},"result":{"en":"You will have a dot picture and understand how printers create shades from dots.","hi":"आपके पास बिंदुओं वाली तस्वीर होगी और समझ आएगा कि प्रिंटर बिंदुओं से रंगों की गहराई कैसे बनाते हैं।"},"time":"30 min","cost":"Free"},"g":["art","machines"]},{"id":"c038","s":"eng","p":523,"n":{"en":"Process Engineer","hi":"प्रक्रिया अभियंता"},"w":{"en":"Designs and improves the step-by-step way factories make things, so work runs smoothly with less waste, time and cost.","hi":"फैक्ट्री में चीज़ें बनाने के चरण डिज़ाइन और बेहतर करता है, ताकि काम आसानी से चले और समय, सामग्री और खर्च कम लगे।"},"t":{"title":{"en":"Race one-by-one against an assembly line","hi":"अकेले-अकेले बनाम असेंबली लाइन की दौड़ लगाएँ"},"steps":{"en":["Fold 5 paper boats, each from start to finish, and time the whole batch.","Now fold 5 more in a line: fold 1 on all, then fold 2 on all. Time it.","Compare both times and find the slowest step, the bottleneck."],"hi":["पाँच कागज़ की नावें बनाइए, हर एक शुरू से आख़िर तक, और पूरे बैच का समय नापिए।","अब पाँच और लाइन से बनाइए: सबका पहला मोड़, फिर सबका दूसरा मोड़, ऐसे ही आगे। समय नापिए।","दोनों समय मिलाइए और सबसे धीमा चरण ढूँढिए, जिसे बॉटलनेक कहते हैं।"]},"result":{"en":"You will know which way was faster and how to spot the slow step in any process.","hi":"आपको पता चलेगा कि कौन-सा तरीका तेज़ था और किसी भी प्रक्रिया में धीमा चरण कैसे पकड़ें।"},"time":"30 min","cost":"Free"},"g":["machines","numbers"]},{"id":"c039","s":"eng","p":525,"n":{"en":"Product Designer","hi":"उत्पाद डिजाइनर"},"w":{"en":"Designs everyday things, from bottles to chairs, so they are useful, comfortable, good-looking and practical to make.","hi":"रोज़ की चीज़ें, बोतल से कुर्सी तक, इस तरह डिज़ाइन करता है कि वे काम की, आरामदायक, सुंदर हों और बनाने में आसान भी।"},"t":{"title":{"en":"Redesign an annoying everyday object","hi":"रोज़ की किसी परेशान करने वाली चीज़ को दोबारा डिज़ाइन करें"},"steps":{"en":["Pick an everyday object that annoys you, such as a bag strap, and write 3 problems with it.","Sketch 3 quick ideas that fix those problems.","Build a paper or cardboard model of your best idea and ask a friend to try it."],"hi":["रोज़ की कोई चीज़ चुनिए जो आपको परेशान करती है, जैसे बैग का स्ट्रैप, और उसकी तीन दिक्कतें लिखिए।","इन दिक्कतों को ठीक करने वाले तीन आइडिया जल्दी से स्केच कीजिए।","सबसे अच्छे आइडिया का कागज़ या गत्ते का मॉडल बनाइए और किसी दोस्त से आज़माने को कहिए।"]},"result":{"en":"You will have a prototype and real feedback, the way designers improve a product.","hi":"आपके पास एक प्रोटोटाइप और असली फ़ीडबैक होगा, ठीक वैसे जैसे डिज़ाइनर किसी प्रोडक्ट को बेहतर बनाते हैं।"},"time":"1 hour","cost":"Free"},"g":["art","build"]},{"id":"c040","s":"eng","p":527,"n":{"en":"Quality Assurance Engineer","hi":"गुणवत्ता आश्वासन अभियंता"},"w":{"en":"Checks products and processes against set standards, finds defects, and works out the cause so problems are fixed before customers see them.","hi":"प्रोडक्ट और प्रक्रिया को तय मानकों पर जाँचता है, कमियाँ ढूँढता है और उनकी वजह पता करता है ताकि ग्राहक तक पहुँचने से पहले ठीक हो जाएँ।"},"t":{"title":{"en":"Run a quality check on a pack of pencils","hi":"पेंसिल के पैकेट की क्वालिटी जाँच करें"},"steps":{"en":["Take 10 pencils from one pack or biscuits from one packet. Decide 3 checks, like length, breakage and colour.","Measure each item with a ruler, record in a table, and mark pass or fail.","Count the failures and guess what in the making process could cause them."],"hi":["एक पैक से 10 पेंसिलें या एक पैकेट से बिस्कुट लीजिए। तीन जाँचें तय कीजिए, जैसे लंबाई, टूट-फूट और रंग।","हर चीज़ को स्केल से नापिए, तालिका में लिखिए और पास या फ़ेल का निशान लगाइए।","फ़ेल की गिनती कीजिए और अंदाज़ा लगाइए कि बनाने की प्रक्रिया में क्या गड़बड़ी हो सकती है।"]},"result":{"en":"You will have a mini inspection report with a pass and fail count.","hi":"आपके पास पास और फ़ेल की गिनती वाली एक छोटी जाँच रिपोर्ट होगी।"},"time":"30 min","cost":"Free"},"g":["numbers","machines"]},{"id":"c041","s":"eng","p":529,"n":{"en":"Railway Engineer","hi":"रेलवे अभियंता"},"w":{"en":"Plans, builds and maintains tracks, bridges, signals and stations so that trains can run safely and on time.","hi":"पटरियाँ, पुल, सिग्नल और स्टेशन की योजना बनाता है, उन्हें बनवाता और संभालता है ताकि ट्रेनें सुरक्षित और समय पर चलें।"},"t":{"title":{"en":"Build and load-test a paper bridge","hi":"कागज़ का पुल बनाकर उस पर वज़न जाँचें"},"steps":{"en":["Place two books 15 cm apart and lay a flat sheet of paper across as a bridge.","Add coins one by one until it sags. Then fold a new sheet into pleats and repeat.","Record how many coins each bridge held and note which shape is stronger."],"hi":["दो किताबें 15 सेंटीमीटर दूर रखिए और उन पर सपाट कागज़ पुल की तरह बिछाइए।","एक-एक करके सिक्के रखिए जब तक पुल झुक न जाए। फिर नया कागज़ प्लेट में मोड़कर यही कीजिए।","लिखिए हर पुल ने कितने सिक्के सँभाले और कौन-सी बनावट ज़्यादा मज़बूत निकली।"]},"result":{"en":"You will see how shape, not just material, makes a bridge strong.","hi":"आप देखेंगे कि पुल को मज़बूत सिर्फ़ सामग्री नहीं, उसकी बनावट भी बनाती है।"},"time":"30 min","cost":"Free"},"g":["build","travel"]},{"id":"c042","s":"eng","p":531,"n":{"en":"Robotics Engineer","hi":"रोबोटिक्स इंजीनियर"},"w":{"en":"Designs, builds and programs robots that sense their surroundings and carry out tasks in factories, hospitals, homes and other places.","hi":"ऐसे रोबोट डिज़ाइन, तैयार और प्रोग्राम करता है जो आसपास को महसूस करके फैक्ट्री, अस्पताल, घर और दूसरी जगहों पर काम करते हैं।"},"t":{"title":{"en":"Program a Scratch robot to escape a maze","hi":"स्क्रैच में रोबोट को भूलभुलैया से निकालना सिखाएँ"},"steps":{"en":["Open Scratch for free, draw a maze with black walls as the backdrop, and add a robot sprite.","Use forever, move and if touching black blocks to make the robot turn when it hits a wall.","Run it and tweak the turns until the robot reaches the exit."],"hi":["स्क्रैच फ़्री में खोलिए, काली दीवारों वाली भूलभुलैया बैकड्रॉप में बनाइए और एक रोबोट स्प्राइट जोड़िए।","फ़ॉरएवर, मूव और इफ़ टचिंग ब्लैक ब्लॉक से रोबोट को दीवार छूते ही मुड़ना सिखाइए।","चलाकर देखिए और मोड़ बदलते रहिए जब तक रोबोट बाहर निकलने की जगह तक न पहुँच जाए।"]},"result":{"en":"You will have a tiny robot program that senses and reacts, just like real robots.","hi":"आपके पास एक छोटा रोबोट प्रोग्राम होगा जो महसूस करके प्रतिक्रिया देता है, असली रोबोट की तरह।"},"time":"1 hour","cost":"Free"},"g":["code","machines"]},{"id":"c043","s":"eng","p":533,"n":{"en":"Sales Engineer","hi":"विक्रय अभियंता"},"w":{"en":"Understands what customers need, explains technical products in simple words, and recommends the right machine or solution for them.","hi":"ग्राहक की ज़रूरत समझता है, तकनीकी प्रोडक्ट आसान शब्दों में समझाता है और उनके लिए सही मशीन या हल सुझाता है।"},"t":{"title":{"en":"Pitch a gadget to a family member","hi":"परिवार के किसी सदस्य को एक गैजेट बेचने का पिच दें"},"steps":{"en":["Pick a household gadget, such as a torch, and list its 4 main features.","Ask a family member 3 questions about what they need from such a product.","Give a 1-minute pitch matching features to their needs, then ask for honest feedback."],"hi":["घर का कोई गैजेट चुनिए, जैसे टॉर्च, और उसकी चार मुख्य ख़ूबियाँ लिखिए।","परिवार के किसी सदस्य से तीन सवाल पूछिए कि ऐसी चीज़ से उन्हें क्या चाहिए।","उनकी ज़रूरत से ख़ूबियाँ जोड़कर एक मिनट का पिच दीजिए, फिर ईमानदार फ़ीडबैक माँगिए।"]},"result":{"en":"You will learn that good selling starts with listening, not talking.","hi":"आप सीखेंगे कि अच्छी बिक्री बोलने से नहीं, सुनने से शुरू होती है।"},"time":"30 min","cost":"Free"},"g":["people","machines"]},{"id":"c044","s":"eng","p":535,"n":{"en":"Smart Manufacturing and Automation Engineer","hi":"स्मार्ट मैन्युफैक्चरिंग और ऑटोमेशन इंजीनियरिंग"},"w":{"en":"Sets up factory lines where sensors, machines and software work together automatically, and keeps improving them.","hi":"ऐसी फैक्ट्री लाइनें तैयार करता है जिनमें सेंसर, मशीन और सॉफ़्टवेयर अपने आप मिलकर काम करते हैं, और उन्हें लगातार बेहतर बनाता है।"},"t":{"title":{"en":"Design and act out an automatic bottle-filling line","hi":"बोतल भरने की ऑटोमैटिक लाइन डिज़ाइन करके उसे करके दिखाएँ"},"steps":{"en":["Draw a conveyor belt with 4 stations on paper: sensor, filler, cap check, packing.","Write one if-then rule for each station, like: if no bottle, wait.","Act it out with paper cups, following only your rules, and fix any gaps you find."],"hi":["कागज़ पर चार स्टेशन वाली कन्वेयर बेल्ट बनाइए: सेंसर, भरने वाला, ढक्कन जाँच और पैकिंग।","हर स्टेशन के लिए एक अगर-तो नियम लिखिए, जैसे: अगर बोतल नहीं है, तो रुको।","काग़ज़ के कपों से सिर्फ़ अपने नियमों पर चलकर इसे करके देखिए और जो कमी मिले उसे ठीक कीजिए।"]},"result":{"en":"You will have a working automation flowchart and see how rules let machines run without a person.","hi":"आपके पास काम करने वाला ऑटोमेशन फ़्लोचार्ट होगा और दिखेगा कि नियमों से मशीनें बिना इंसान के कैसे चलती हैं।"},"time":"45 min","cost":"Free"},"g":["machines","build"]},{"id":"c045","s":"eng","p":537,"n":{"en":"Sound Engineer","hi":"साउंड इंजीनियर"},"w":{"en":"Records, mixes and cleans up sound for music, films, shows and events so that it is clear and well balanced.","hi":"संगीत, फ़िल्म, शो और कार्यक्रमों की आवाज़ रिकॉर्ड, मिक्स और साफ़ करता है ताकि वह साफ़ और संतुलित सुनाई दे।"},"t":{"title":{"en":"Find the best spot to record your voice","hi":"आवाज़ रिकॉर्ड करने की सबसे अच्छी जगह ढूँढें"},"steps":{"en":["Record yourself reading 20 seconds of text on your phone in a quiet room, then near a fan or kitchen.","Hang a blanket or pillows behind you and record the same text again.","Listen with earphones and note which recording is clearest and why."],"hi":["फ़ोन पर शांत कमरे में 20 सेकंड कुछ पढ़कर रिकॉर्ड कीजिए, फिर पंखे या रसोई के पास।","अपने पीछे कंबल या तकिए टाँगिए और वही पाठ दोबारा रिकॉर्ड कीजिए।","ईयरफ़ोन से सुनिए और लिखिए कि कौन-सी रिकॉर्डिंग सबसे साफ़ है और क्यों।"]},"result":{"en":"You will know how room, noise and soft materials change recorded sound.","hi":"आपको पता चलेगा कि कमरा, शोर और नरम चीज़ें रिकॉर्ड की गई आवाज़ को कैसे बदलती हैं।"},"time":"30 min","cost":"Free"},"g":["art","machines"]},{"id":"c046","s":"eng","p":539,"n":{"en":"Textile Engineer","hi":"टेक्सटाइल इंजीनियर"},"w":{"en":"Works on fibres, yarns and fabrics, making them stronger, more comfortable and longer lasting, and improving how they are made.","hi":"रेशों, धागों और कपड़ों पर काम करता है, उन्हें ज़्यादा मज़बूत, आरामदायक और टिकाऊ बनाता है और बनाने के तरीके सुधारता है।"},"t":{"title":{"en":"Compare fabrics with three mini tests","hi":"तीन छोटे टेस्ट से कपड़ों की तुलना करें"},"steps":{"en":["Collect 4 old fabric scraps, like cotton, polyester, nylon and wool. Check labels if present.","Test each: time a water drop soaking in, how far it stretches, and how much it wrinkles when scrunched.","Fill a table and decide which fabric suits a raincoat, a summer shirt and a sweater."],"hi":["चार पुराने कपड़ों के टुकड़े इकट्ठे कीजिए, जैसे सूती, पॉलिएस्टर, नायलॉन और ऊनी। लेबल हो तो पढ़िए।","हर एक की जाँच कीजिए: पानी की बूँद कितनी जल्दी सोखी, कितना खिंचा और मुट्ठी में दबाने पर कितनी सिलवटें पड़ीं।","तालिका भरिए और तय कीजिए कि रेनकोट, गर्मी की शर्ट और स्वेटर के लिए कौन-सा कपड़ा ठीक रहेगा।"]},"result":{"en":"You will have a fabric comparison chart and see why different uses need different fabrics.","hi":"आपके पास कपड़ों की तुलना की तालिका होगी और दिखेगा कि अलग काम के लिए अलग कपड़े क्यों चाहिए।"},"time":"45 min","cost":"Free"},"g":["science","build"]},{"id":"c047","s":"eng","p":541,"n":{"en":"Tool Engineer","hi":"टूल इंजीनियर"},"w":{"en":"Designs the tools, moulds and holding fixtures that factories use, so every part comes out the same shape and size.","hi":"फैक्ट्री में इस्तेमाल होने वाले औज़ार, साँचे और पकड़ने वाले फ़िक्सचर डिज़ाइन करता है ताकि हर पुर्ज़ा एक ही आकार और नाप का बने।"},"t":{"title":{"en":"Make a stencil so every shape comes out identical","hi":"स्टेंसिल बनाइए ताकि हर आकृति एक जैसी बने"},"steps":{"en":["Draw a star freehand 5 times and notice how each one comes out different.","Cut a star-shaped hole in a piece of thin card with scissors to make a stencil.","Trace through the stencil 5 times and compare how similar the shapes are now."],"hi":["बिना सहारे के पाँच बार तारा बनाइए और देखिए कि हर बार थोड़ा अलग बनता है।","पतले गत्ते में कैंची से तारे के आकार का छेद काटकर स्टेंसिल बनाइए।","स्टेंसिल से पाँच बार तारा बनाइए और देखिए कि अब आकृतियाँ कितनी एक जैसी हैं।"]},"result":{"en":"You will have a stencil and see how a simple tool brings consistency to every part.","hi":"आपके पास एक स्टेंसिल होगा और दिखेगा कि एक साधारण औज़ार हर पुर्ज़े को एक जैसा कैसे बनाता है।"},"time":"30 min","cost":"Free"},"g":["build","machines"]},{"id":"c048","s":"eng","p":543,"n":{"en":"Water Resources Engineer","hi":"जल संसाधन अभियंता"},"w":{"en":"Plans how to collect, store, move and share water, from dams and canals to rainwater harvesting and drains.","hi":"पानी को इकट्ठा करने, जमा करने, पहुँचाने और बाँटने की योजना बनाता है, बाँध और नहर से लेकर बारिश के पानी के संचय और नालियों तक।"},"t":{"title":{"en":"Model rain runoff and catch the water","hi":"बारिश के बहाव का मॉडल बनाकर पानी रोकें"},"steps":{"en":["Heap soil on one side of a tray to make a hill, then slowly pour a mug of water.","Use pebbles or folded paper to build a channel that guides the water into a bowl.","Measure how much water you caught and how much was lost. Improve the channel and retry."],"hi":["ट्रे या टब के एक तरफ़ मिट्टी का ढेर लगाकर पहाड़ी बनाइए और ऊपर से एक मग पानी धीरे-धीरे डालिए।","कंकड़ या मुड़े कागज़ से ऐसी नाली बनाइए जो पानी को कटोरे में पहुँचाए।","नापिए कितना पानी पकड़ा और कितना बह गया। नाली सुधारकर फिर आज़माइए।"]},"result":{"en":"You will see how landscape and channels control where water goes, the core of water planning.","hi":"आप देखेंगे कि ज़मीन की बनावट और नालियाँ पानी का रास्ता कैसे तय करती हैं, यही जल-योजना की बुनियाद है।"},"time":"45 min","cost":"Free"},"g":["nature","build"]},{"id":"c049","s":"govt","p":547,"n":{"en":"Agniveer","hi":"अग्निवीर"},"w":{"en":"A young recruit in the armed forces who trains in fitness, discipline and teamwork, and carries out duties as part of a unit.","hi":"सशस्त्र बलों में भर्ती हुआ युवा जो फ़िटनेस, अनुशासन और टीमवर्क की ट्रेनिंग लेता है और टुकड़ी के हिस्से के रूप में ड्यूटी निभाता है।"},"t":{"title":{"en":"Try a 15-minute fitness circuit and log it","hi":"15 मिनट का फ़िटनेस सर्किट करें और उसका रिकॉर्ड रखें"},"steps":{"en":["Warm up for 3 minutes with marching on the spot, arm circles and light stretches.","Do 3 rounds: 10 squats, 5 push-ups (knees allowed), 20-second plank, with 1 minute rest.","Note your counts in a notebook. Repeat tomorrow and see if you improve."],"hi":["तीन मिनट वार्म-अप कीजिए: जगह पर मार्च, बाँहें घुमाना और हल्की स्ट्रेचिंग।","तीन राउंड कीजिए: 10 स्क्वैट, 5 पुश-अप (घुटनों पर भी चलेगा), 20 सेकंड प्लैंक, बीच में एक मिनट आराम।","अपनी गिनती नोटबुक में लिखिए। कल फिर कीजिए और देखिए सुधार हुआ या नहीं।"]},"result":{"en":"You will have a baseline fitness log and a feel for the daily discipline of training.","hi":"आपके पास अपनी फ़िटनेस का पहला रिकॉर्ड होगा और रोज़ की ट्रेनिंग के अनुशासन का अंदाज़ा।"},"time":"15 min","cost":"Free"},"g":["service","health"]},{"id":"c050","s":"govt","p":549,"n":{"en":"Border Security Force (BSF)","hi":"सीमा सुरक्षा बल"},"w":{"en":"Guards India's land borders by patrolling, watching for illegal crossing and smuggling, and supporting people living in border areas.","hi":"भारत की ज़मीनी सीमाओं पर गश्त करके, अवैध घुसपैठ और तस्करी पर नज़र रखकर और सीमावर्ती इलाक़ों के लोगों की मदद करके सीमा की रक्षा करता है।"},"t":{"title":{"en":"Plan a patrol route on a grid map","hi":"ग्रिड नक्शे पर गश्त का रास्ता बनाएँ"},"steps":{"en":["Draw a grid map of your street or school ground with north marked and a few landmarks.","Mark 4 checkpoints and plan the shortest route that visits all of them.","Give a friend directions using only north, south, east, west and landmarks, and see if they reach every point."],"hi":["अपनी गली या स्कूल के मैदान का ग्रिड वाला नक्शा बनाइए, उत्तर दिशा और कुछ निशान दिखाते हुए।","चार चौकियाँ चिह्नित कीजिए और सबसे छोटा रास्ता सोचिए जो सभी तक जाए।","किसी दोस्त को सिर्फ़ उत्तर, दक्षिण, पूर्व, पश्चिम और निशानों से रास्ता बताइए और देखिए वह हर जगह पहुँचता है या नहीं।"]},"result":{"en":"You will have a patrol plan and practice at giving clear directions by map.","hi":"आपके पास गश्त की योजना होगी और नक्शे से साफ़ रास्ता बताने का अभ्यास।"},"time":"45 min","cost":"Free"},"g":["service","travel"]},{"id":"c051","s":"govt","p":551,"n":{"en":"CISF Officer","hi":"सी.आई.एस.एफ. अधिकारी"},"w":{"en":"Provides security at airports, metro stations, industrial plants and key buildings by checking people and belongings and guarding against threats.","hi":"हवाई अड्डों, मेट्रो स्टेशनों, उद्योगों और ज़रूरी इमारतों पर लोगों और सामान की जाँच करके और ख़तरों से बचाव करके सुरक्षा देता है।"},"t":{"title":{"en":"Do a safety check of your home and set up a visitor register","hi":"अपने घर की सुरक्षा जाँच करें और विज़िटर रजिस्टर बनाएँ"},"steps":{"en":["Walk around your home with an adult and list 5 places where safety could be better, like a loose latch.","Make a visitor register sheet with name, time in, time out and purpose.","Ask family or guests to sign it for a day and check it is complete."],"hi":["किसी बड़े के साथ घर में घूमिए और पाँच जगहें लिखिए जहाँ सुरक्षा बेहतर हो सकती है, जैसे ढीली कुंडी।","नाम, आने का समय, जाने का समय और काम वाला विज़िटर रजिस्टर का पन्ना बनाइए।","एक दिन तक परिवार या मेहमानों से इसमें दस्तख़त करवाइए और देखिए कि हर जानकारी भरी है या नहीं।"]},"result":{"en":"You will have a simple safety checklist and a working entry register.","hi":"आपके पास सुरक्षा की एक सादी चेकलिस्ट और काम करने वाला एंट्री रजिस्टर होगा।"},"time":"30 min","cost":"Free"},"g":["service","people"]},{"id":"c052","s":"govt","p":553,"n":{"en":"Indian Coast Guard Officer","hi":"तटरक्षक"},"w":{"en":"Protects India's coastline and sea waters through patrols, search and rescue at sea, and checks against pollution and illegal activity.","hi":"गश्त, समुद्र में खोज और बचाव, तथा प्रदूषण और ग़ैरक़ानूनी गतिविधियों की जाँच करके भारत के तट और समुद्री इलाक़े की रक्षा करता है।"},"t":{"title":{"en":"Plan a sea rescue on a paper chart","hi":"कागज़ के समुद्री चार्ट पर बचाव की योजना बनाएँ"},"steps":{"en":["Draw a 10 by 10 sea grid. Mark the coast, a ship base and a boat in trouble with coordinates.","Pick a ship speed, say 2 squares per minute, and count how long the rescue ship takes to arrive.","Write a short radio message: who you are, where, what happene
