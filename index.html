ow genes pass on by chance.","hi":"20 संतानों की गिनती और यह समझ कि जीन संयोग से आगे कैसे जाते हैं।"},"time":"30 min","cost":"Free"},"g":["science","numbers"]},{"id":"c183","s":"research","p":825,"n":{"en":"Geographer","hi":"भूगोलवेत्ता"},"w":{"en":"Studies places on Earth, their land, people and how they change, often using maps and satellite images.","hi":"धरती के अलग-अलग स्थानों, उनकी ज़मीन, लोगों और बदलावों का अध्ययन करता है, अक्सर नक्शों और सैटेलाइट तस्वीरों की मदद से।"},"t":{"title":{"en":"Draw your neighbourhood map, then check it","hi":"अपने मोहल्ले का नक्शा बनाएँ, फिर जाँचें"},"steps":{"en":["From memory, sketch the area within a 10-minute walk of home. Add a key, a north arrow and five landmarks.","Open free Google Maps or OpenStreetMap on your phone, switch to satellite view and compare with your sketch.","Correct your map, and note what you remembered wrong or missed."],"hi":["याद से घर के 10 मिनट पैदल के इलाके का नक्शा बनाएँ। उसमें संकेत-सूची, उत्तर का तीर और पाँच निशान जोड़ें।","फ़ोन पर मुफ़्त गूगल मैप्स या ओपनस्ट्रीटमैप खोलें, सैटेलाइट व्यू लगाएँ और अपने नक्शे से मिलाएँ।","अपना नक्शा ठीक करें, और लिखें कि क्या गलत याद था या छूट गया।"]},"result":{"en":"A corrected neighbourhood map with a key and landmarks.","hi":"संकेत-सूची और निशानों वाला सुधारा हुआ मोहल्ले का नक्शा।"},"time":"45 min","cost":"Free"},"g":["travel","nature"]},{"id":"c184","s":"research","p":827,"n":{"en":"Geologist","hi":"भूविज्ञानी"},"w":{"en":"Studies rocks, soil and the Earth's layers to understand how the planet formed and where resources like water and minerals are found.","hi":"चट्टानों, मिट्टी और धरती की परतों का अध्ययन करता है, ताकि समझ सके कि पृथ्वी कैसे बनी और पानी या खनिज जैसे संसाधन कहाँ मिलते हैं।"},"t":{"title":{"en":"Sort six stones like a geologist","hi":"छह पत्थरों को भूविज्ञानी की तरह छाँटें"},"steps":{"en":["Collect six different stones from a safe place near home. Wash them and number each one.","Make a table noting colour, texture, weight and a scratch test: which stone can scratch which, or a coin.","Group the stones by what you found, and give each group a name of your own."],"hi":["घर के पास किसी सुरक्षित जगह से छह अलग पत्थर इकट्ठे करें। उन्हें धोकर हर एक पर नंबर डालें।","तालिका बनाएँ: रंग, बनावट, वज़न और खरोंच की जाँच, यानी कौन-सा पत्थर किसे खरोंचता है, या सिक्का।","जो पाया उसके हिसाब से पत्थरों के समूह बनाएँ और हर समूह को अपना नाम दें।"]},"result":{"en":"A six-stone data table and your own rock groups.","hi":"छह पत्थरों की डेटा तालिका और आपके अपने बनाए चट्टान समूह।"},"time":"45 min","cost":"Free"},"g":["nature","science"]},{"id":"c185","s":"research","p":829,"n":{"en":"Historian","hi":"इतिहासकार"},"w":{"en":"Studies the past using records, objects and people's memories, and explains how and why events happened.","hi":"पुराने रिकॉर्ड, चीज़ों और लोगों की यादों की मदद से अतीत का अध्ययन करता है और समझाता है कि घटनाएँ कैसे और क्यों हुईं।"},"t":{"title":{"en":"Record a grandparent's oral history","hi":"दादा-दादी की ज़ुबानी इतिहास दर्ज करें"},"steps":{"en":["Choose a grandparent or elder. Prepare five questions about how daily life, school or travel has changed in their lifetime.","Interview them and take notes, or record with permission on your phone. Ask for dates and places.","Write a five-line timeline, and mark which facts you could check with another source."],"hi":["किसी दादा-दादी या बड़े को चुनें। उनके जीवन में रोज़मर्रा की ज़िंदगी, स्कूल या सफ़र कैसे बदले, इस पर पाँच सवाल तैयार करें।","इंटरव्यू लें और नोट्स बनाएँ, या इजाज़त लेकर फ़ोन पर रिकॉर्ड करें। तारीखें और जगहें पूछें।","पाँच लाइन की टाइमलाइन लिखें, और निशान लगाएँ कि कौन-से तथ्य किसी दूसरे स्रोत से जाँचे जा सकते हैं।"]},"result":{"en":"A short timeline from a living source, like a real historian's first draft.","hi":"एक जीवित स्रोत से बनी छोटी टाइमलाइन, जैसे असली इतिहासकार का पहला मसौदा।"},"time":"1 hour","cost":"Free"},"g":["people","art"]},{"id":"c186","s":"research","p":831,"n":{"en":"Mathematician","hi":"गणितज्ञ"},"w":{"en":"Looks for patterns, solves problems and proves why ideas are always true, in pure maths and in real-world uses.","hi":"पैटर्न ढूँढता है, समस्याएँ हल करता है और साबित करता है कि कोई बात हमेशा सच क्यों होती है, शुद्ध गणित में भी और असली ज़िंदगी के कामों में भी।"},"t":{"title":{"en":"Crack the handshake pattern","hi":"हैंडशेक का पैटर्न खोजें"},"steps":{"en":["Ask: if everyone in a group shakes hands once with everyone else, how many handshakes? Draw dots and lines for 2, 3, 4 and 5 people.","Count the handshakes for each group and write them in a table. Look for a pattern in how the numbers grow.","Guess the rule, use it to predict for 10 people, and check by drawing or counting."],"hi":["सवाल: अगर समूह में हर कोई बाकी सबसे एक बार हाथ मिलाए, तो कुल कितने हैंडशेक? 2, 3, 4 और 5 लोगों के लिए बिंदु और रेखाएँ बनाएँ।","हर समूह के हैंडशेक गिनकर तालिका में लिखें। देखें कि संख्याएँ किस तरह बढ़ रही हैं।","नियम का अंदाज़ा लगाएँ, उससे 10 लोगों का जवाब बताएँ, और बनाकर या गिनकर जाँचें।"]},"result":{"en":"A rule you discovered yourself, tested on 10 people.","hi":"एक नियम जो आपने खुद खोजा और 10 लोगों पर परखा।"},"time":"30 min","cost":"Free"},"g":["numbers"]},{"id":"c187","s":"research","p":833,"n":{"en":"Meteorologist","hi":"मौसम विज्ञानी"},"w":{"en":"Studies temperature, wind, clouds and rain to understand today's weather and predict what is coming next.","hi":"तापमान, हवा, बादल और बारिश का अध्ययन करके बताता है कि आज मौसम कैसा है और आगे कैसा रहेगा।"},"t":{"title":{"en":"Keep a weather log and forecast day 4","hi":"मौसम की डायरी बनाओ और चौथे दिन का अनुमान लगाओ"},"steps":{"en":["For 3 days, note the temperature, sky and wind at morning, noon and evening in a notebook.","Look for a pattern, like temperature rising until afternoon or clouds before rain.","Write your forecast for day 4, then check it against the real weather."],"hi":["3 दिन तक सुबह, दोपहर और शाम को तापमान, आसमान और हवा कॉपी में लिखो।","पैटर्न ढूँढो, जैसे दोपहर तक गर्मी बढ़ना या बारिश से पहले बादल आना।","चौथे दिन का अपना अनुमान लिखो, फिर असली मौसम से मिलाकर देखो।"]},"result":{"en":"You will have a mini weather record and know how close your forecast was.","hi":"तुम्हारे पास अपना छोटा मौसम रिकॉर्ड होगा और पता चलेगा कि अनुमान कितना सही रहा।"},"time":"weekend","cost":"Free"},"g":["science","nature","numbers"]},{"id":"c188","s":"research","p":835,"n":{"en":"Museologist (Museum Scientist)","hi":"संग्रहालय विज्ञानी"},"w":{"en":"Cares for, labels and arranges old objects, art and specimens in a museum so visitors can learn from them.","hi":"संग्रहालय में पुरानी चीज़ों, कला और नमूनों की देखभाल करता है, उन पर लेबल लगाता है और उन्हें सजाता है ताकि लोग उनसे सीख सकें।"},"t":{"title":{"en":"Set up a mini museum at home","hi":"घर में अपना छोटा संग्रहालय सजाओ"},"steps":{"en":["Pick 3 old or interesting objects at home, like a brass lota, an old coin or a toy.","Write a label card for each: name, what it was used for, and who used it.","Arrange them on a table with the cards and ask a family member to be your visitor."],"hi":["घर से 3 पुरानी या दिलचस्प चीज़ें चुनो, जैसे पीतल का लोटा, पुराना सिक्का या खिलौना।","हर चीज़ के लिए एक लेबल कार्ड लिखो: नाम, किस काम आती थी और कौन इस्तेमाल करता था।","चीज़ों को कार्ड के साथ मेज़ पर सजाओ और परिवार के किसी सदस्य को दर्शक बनाओ।"]},"result":{"en":"You will have a tiny museum display and know how it feels to tell an object's story.","hi":"तुम्हारा छोटा सा संग्रहालय तैयार होगा और पता चलेगा कि किसी चीज़ की कहानी सुनाना कैसा लगता है।"},"time":"30 min","cost":"Free"},"g":["art","science","people"]},{"id":"c189","s":"research","p":837,"n":{"en":"Nanoscientist","hi":"नैनो वैज्ञानिक"},"w":{"en":"Studies and designs materials at an extremely tiny scale, smaller than we can see, to make stronger, cleaner or smarter products.","hi":"बेहद छोटे स्तर पर, जो आँखों से दिखता भी नहीं, पदार्थों का अध्ययन और डिज़ाइन करता है ताकि मज़बूत, साफ़ और स्मार्ट चीज़ें बन सकें।"},"t":{"title":{"en":"Test which surfaces repel water","hi":"देखो कौन सी सतह पानी को दूर रखती है"},"steps":{"en":["Collect 5 surfaces: a leaf, steel spoon, plastic sheet, cloth and paper. Keep them flat.","Put one drop of water on each and watch whether it beads up or spreads.","Sketch each drop and rank the surfaces from most to least water-repelling."],"hi":["5 सतहें इकट्ठा करो: पत्ता, स्टील की चम्मच, प्लास्टिक शीट, कपड़ा और कागज़। इन्हें समतल रखो।","हर पर पानी की एक बूँद डालो और देखो कि वह गोल रहती है या फैल जाती है।","हर बूँद का चित्र बनाओ और सतहों को पानी दूर रखने के हिसाब से क्रम में लगाओ।"]},"result":{"en":"You will see how surface structure changes behaviour, an idea nanoscientists use to design materials.","hi":"तुम देखोगे कि सतह की बनावट से व्यवहार कैसे बदलता है, यही बात नैनो वैज्ञानिक नई चीज़ें बनाने में इस्तेमाल करते हैं।"},"time":"15 min","cost":"Free"},"g":["science"]},{"id":"c190","s":"research","p":839,"n":{"en":"Palaeontologist","hi":"जीवाश्म विज्ञानी"},"w":{"en":"Studies fossils of ancient plants and animals to learn how life on Earth looked and changed over millions of years.","hi":"प्राचीन पौधों और जानवरों के जीवाश्मों का अध्ययन करके पता लगाता है कि लाखों सालों में धरती पर जीवन कैसा था और कैसे बदला।"},"t":{"title":{"en":"Make a fossil imprint and play detective","hi":"जीवाश्म जैसा निशान बनाओ और जासूस बनो"},"steps":{"en":["Flatten soft clay or atta dough, press a shell, leaf or key into it, then remove it gently.","Let it dry, then give the imprint to a friend without showing the object.","Ask your friend to guess the object from the imprint alone, then reveal it."],"hi":["मिट्टी या आटे की लोई को चपटा करो, उसमें सीप, पत्ता या चाबी दबाओ और धीरे से निकाल लो।","उसे सूखने दो, फिर बिना चीज़ दिखाए निशान किसी दोस्त को दो।","दोस्त से सिर्फ़ निशान देखकर चीज़ का अंदाज़ा लगवाओ, फिर असली चीज़ दिखाओ।"]},"result":{"en":"You will have a fossil-style imprint and feel how scientists work out the past from clues.","hi":"तुम्हारे पास जीवाश्म जैसा निशान होगा और समझ आएगा कि वैज्ञानिक सुरागों से बीता हुआ समय कैसे पहचानते हैं।"},"time":"45 min","cost":"Free"},"g":["science","nature"]},{"id":"c191","s":"research","p":841,"n":{"en":"Physicist","hi":"भौतिक विज्ञानी"},"w":{"en":"Uses experiments and mathematics to understand how matter, energy, motion, light and forces work in the universe.","hi":"प्रयोगों और गणित से समझता है कि पदार्थ, ऊर्जा, गति, रोशनी और बल कैसे काम करते हैं।"},"t":{"title":{"en":"Run a pendulum experiment","hi":"पेंडुलम का प्रयोग करो"},"steps":{"en":["Tie a small stone to a string and hang it from a fixed point, like a door handle.","Time 10 swings with your phone stopwatch for three string lengths: 20, 40 and 60 cm.","Write the results in a table and find how length changes the time of one swing."],"hi":["एक छोटे पत्थर को धागे से बाँधकर दरवाज़े के हैंडल जैसी किसी टिकी जगह से लटकाओ।","फ़ोन के स्टॉपवॉच से धागे की तीन लंबाइयों, 20, 40 और 60 सेमी, पर 10 झूलों का समय नापो।","नतीजे टेबल में लिखो और देखो कि लंबाई बदलने से एक झूले का समय कैसे बदलता है।"]},"result":{"en":"You will have your own data and a clear pattern, just like a real physics experiment.","hi":"तुम्हारे पास अपना डेटा और साफ़ पैटर्न होगा, बिल्कुल असली भौतिकी प्रयोग की तरह।"},"time":"30 min","cost":"Free"},"g":["science","numbers"]},{"id":"c192","s":"research","p":843,"n":{"en":"Political Scientist","hi":"राजनीति वैज्ञानिक"},"w":{"en":"Studies how governments, laws, elections and public opinion work, and explains how decisions affect people.","hi":"सरकार, कानून, चुनाव और जनता की राय कैसे काम करती है, इसका अध्ययन करता है और बताता है कि फ़ैसलों का लोगों पर क्या असर होता है।"},"t":{"title":{"en":"Run a mini opinion poll on a school issue","hi":"स्कूल के किसी मुद्दे पर छोटा सर्वे करो"},"steps":{"en":["Pick one issue, like the school canteen menu, and write 3 clear options to choose from.","Ask 10 people to pick one option and keep a tally on paper.","Write a short finding: which option won, by how much, and one reason people gave."],"hi":["एक मुद्दा चुनो, जैसे स्कूल कैंटीन का मेन्यू, और चुनने के लिए 3 साफ़ विकल्प लिखो।","10 लोगों से एक विकल्प चुनने को कहो और कागज़ पर गिनती रखो।","छोटा निष्कर्ष लिखो: कौन सा विकल्प जीता, कितने से जीता और लोगों ने एक कारण क्या बताया।"]},"result":{"en":"You will have a mini poll report showing how public opinion can be measured.","hi":"तुम्हारे पास एक छोटी पोल रिपोर्ट होगी जो दिखाती है कि जनता की राय कैसे नापी जाती है।"},"time":"45 min","cost":"Free"},"g":["people","justice","numbers"]},{"id":"c193","s":"research","p":845,"n":{"en":"Scientific Assistant","hi":"वैज्ञानिक सहायक"},"w":{"en":"Helps scientists by preparing samples, running routine tests, recording readings carefully and keeping lab equipment and records in order.","hi":"वैज्ञानिकों की मदद करता है: नमूने तैयार करता है, रोज़ के टेस्ट चलाता है, रीडिंग ध्यान से लिखता है और लैब का सामान व रिकॉर्ड सँभालता है।"},"t":{"title":{"en":"Do a fair test: warm or cold water?","hi":"निष्पक्ष टेस्ट करो: गर्म या ठंडे पानी में क्या जल्दी घुलता है?"},"steps":{"en":["Fill two identical glasses with equal water, one tap-warm and one cold. Never use boiling water.","Add one spoon of sugar to each, stir equally, and time how long it takes to vanish.","Record both times in a neat table and note what you kept the same."],"hi":["दो एक जैसे गिलास बराबर पानी से भरो, एक में नल का गुनगुना और दूसरे में ठंडा। उबलता पानी बिल्कुल नहीं।","दोनों में एक-एक चम्मच चीनी डालो, बराबर चलाओ और गिनो कि कितनी देर में गायब होती है।","दोनों समय साफ़ टेबल में लिखो और यह भी लिखो कि तुमने क्या-क्या एक जैसा रखा।"]},"result":{"en":"You will practise careful measuring and neat record-keeping, the heart of lab assistant work.","hi":"तुम ध्यान से नापना और साफ़ रिकॉर्ड रखना सीखोगे, जो लैब असिस्टेंट के काम का मुख्य हिस्सा है।"},"time":"15 min","cost":"Free"},"g":["science","numbers"]},{"id":"c194","s":"research","p":847,"n":{"en":"Seismologist","hi":"भूकंप विज्ञानी"},"w":{"en":"Studies earthquakes and the waves they create, using instruments to understand how the ground shakes and how to make buildings safer.","hi":"भूकंप और उनसे बनने वाली तरंगों का अध्ययन करता है और यंत्रों से समझता है कि ज़मीन कैसे हिलती है और इमारतें कैसे सुरक्षित बनें।"},"t":{"title":{"en":"Build a tower and test it on a shake tray","hi":"मीनार बनाओ और हिलती ट्रे पर परखो"},"steps":{"en":["Build a tower from playing cards, small boxes or paper cups on a flat tray.","Shake the tray gently, then harder, and note when the tower falls.","Rebuild with a wider base and test again. Compare which design survives better."],"hi":["ताश के पत्तों, छोटे डिब्बों या कागज़ के कपों से एक समतल ट्रे पर मीनार बनाओ।","ट्रे को पहले हल्के से, फिर तेज़ हिलाओ और नोट करो कि मीनार कब गिरी।","चौड़ा आधार बनाकर दोबारा परखो और देखो कौन सा डिज़ाइन ज़्यादा टिकता है।"]},"result":{"en":"You will see how building shape and base help in shaking, the key idea behind earthquake safety.","hi":"तुम देखोगे कि हिलने पर इमारत की बनावट और आधार कैसे मदद करते हैं, यही भूकंप सुरक्षा की मुख्य बात है।"},"time":"30 min","cost":"Free"},"g":["science","build"]},{"id":"c195","s":"research","p":849,"n":{"en":"Sociologist","hi":"समाजशास्त्री"},"w":{"en":"Studies how people live in groups, how families, communities and customs change, and why society works the way it does.","hi":"देखता-समझता है कि लोग समूहों में कैसे रहते हैं, परिवार, समाज और रीति-रिवाज कैसे बदलते हैं और समाज ऐसा क्यों है।"},"t":{"title":{"en":"Interview three generations: then and now","hi":"तीन पीढ़ियों से बात करो: पहले और अब"},"steps":{"en":["Choose one topic, like how people played or got news as children, and write 4 questions.","Interview three people of different ages, such as a grandparent, a parent and a sibling.","Make a then-and-now chart and write one sentence on what changed and why."],"hi":["एक विषय चुनो, जैसे बचपन में लोग कैसे खेलते थे या ख़बरें कैसे मिलती थीं, और 4 सवाल लिखो।","अलग-अलग उम्र के तीन लोगों से बात करो, जैसे दादा-दादी, माता-पिता और भाई-बहन।","पहले और अब का चार्ट बनाओ और एक वाक्य लिखो कि क्या बदला और क्यों।"]},"result":{"en":"You will have a small social study showing how everyday life changes across generations.","hi":"तुम्हारे पास एक छोटा सामाजिक अध्ययन होगा जो दिखाता है कि पीढ़ियों में रोज़ की ज़िंदगी कैसे बदलती है।"},"time":"1 hour","cost":"Free"},"g":["people"]},{"id":"c196","s":"research","p":851,"n":{"en":"Space Scientist","hi":"अंतरिक्ष वैज्ञानिक"},"w":{"en":"Studies the Sun, planets, stars and space using telescopes, satellites and data to understand how the universe works.","hi":"टेलीस्कोप, उपग्रह और डेटा की मदद से सूरज, ग्रहों, तारों और अंतरिक्ष का अध्ययन करता है और ब्रह्मांड को समझता है।"},"t":{"title":{"en":"Make the Moon's phases with a torch","hi":"टॉर्च से चाँद की कलाएँ बनाओ"},"steps":{"en":["In a dark room, put a phone torch on a shelf as the Sun. Hold a ball as the Moon.","Slowly circle the ball around your head and watch how the lit part of it changes.","Sketch four phases you see and label them new, half, full and crescent."],"hi":["अँधेरे कमरे में फ़ोन की टॉर्च को शेल्फ़ पर सूरज की तरह रखो और हाथ में गेंद को चाँद मानो।","गेंद को धीरे-धीरे अपने सिर के चारों ओर घुमाओ और देखो कि उसका चमकता हिस्सा कैसे बदलता है।","चार रूप बनाओ जो दिखे और उन पर नाम लिखो: अमावस्या, आधा, पूर्णिमा और पतला चाँद।"]},"result":{"en":"You will understand why the Moon seems to change shape, by modelling it yourself.","hi":"खुद मॉडल बनाकर तुम समझ जाओगे कि चाँद का आकार बदलता क्यों दिखता है।"},"time":"15 min","cost":"Free"},"g":["science"]},{"id":"c197","s":"research","p":853,"n":{"en":"Statistician","hi":"सांख्यिकीविद्"},"w":{"en":"Collects and analyses numbers to find patterns, check how reliable they are, and help people make better decisions.","hi":"आँकड़े इकट्ठा करके उनमें पैटर्न ढूँढता है, देखता है कि वे कितने भरोसेमंद हैं और लोगों को बेहतर फ़ैसले लेने में मदद करता है।"},"t":{"title":{"en":"Roll a die 30 times and chart it","hi":"पासा 30 बार फेंको और चार्ट बनाओ"},"steps":{"en":["Roll a die 30 times and write each result in a Google Sheets column.","Count how often each number 1 to 6 came up and make a bar chart.","Check the average and ask: were all numbers equally common? Try 60 rolls and compare."],"hi":["पासा 30 बार फेंको और हर नतीजा गूगल शीट्स के एक कॉलम में लिखो।","गिनो कि 1 से 6 तक हर संख्या कितनी बार आई और बार चार्ट बनाओ।","औसत निकालो और सोचो: क्या सब संख्याएँ बराबर बार आईं? 60 बार फेंककर तुलना करो।"]},"result":{"en":"You will have a real chart and see how patterns settle down with more data.","hi":"तुम्हारे पास असली चार्ट होगा और दिखेगा कि ज़्यादा डेटा होने पर पैटर्न कैसे साफ़ होता है।"},"time":"30 min","cost":"Free"},"g":["numbers","science"]},{"id":"c198","s":"research","p":855,"n":{"en":"Toxicologist","hi":"विष विज्ञानी"},"w":{"en":"Studies how substances can harm people, animals or the environment, and works out how much is safe and how to prevent poisoning.","hi":"पता लगाता है कि कौन सी चीज़ें इंसानों, जानवरों या पर्यावरण को नुकसान पहुँचा सकती हैं, कितनी मात्रा सुरक्षित है और ज़हर से कैसे बचें।"},"t":{"title":{"en":"Make a household safety label chart","hi":"घर के सामान की सुरक्षा लेबल का चार्ट बनाओ"},"steps":{"en":["Collect 5 empty product packs or bottles, like detergent, floor cleaner and medicine strips. Do not open them.","Read each label's warnings and write them down: keep away from kids, do not swallow, ventilate.","Sort the products into groups by type of warning and make a safe-storage chart."],"hi":["5 खाली पैकेट या बोतलें इकट्ठा करो, जैसे डिटर्जेंट, फ़र्श क्लीनर और दवा की पट्टी। इन्हें खोलना नहीं है।","हर लेबल की चेतावनियाँ पढ़कर लिखो: बच्चों से दूर रखें, न निगलें, हवादार जगह में इस्तेमाल करें।","चीज़ों को चेतावनी के प्रकार से समूहों में बाँटो और सुरक्षित रखने का चार्ट बनाओ।"]},"result":{"en":"You will know how to read safety labels and have a chart that can protect your family.","hi":"तुम्हें सुरक्षा लेबल पढ़ना आ जाएगा और तुम्हारे पास एक चार्ट होगा जो परिवार को सुरक्षित रखने में काम आएगा।"},"time":"30 min","cost":"Free"},"g":["health","science"]},{"id":"c199","s":"research","p":857,"n":{"en":"Virologist","hi":"विषाणु विज्ञानी"},"w":{"en":"Studies viruses, how they spread and make people ill, and helps develop ways to prevent and treat infections.","hi":"वायरस का अध्ययन करता है कि वे कैसे फैलते हैं और लोगों को बीमार करते हैं, और बचाव व इलाज के तरीके खोजने में मदद करता है।"},"t":{"title":{"en":"Simulate how an infection spreads","hi":"संक्रमण फैलने का खेल बनाओ"},"steps":{"en":["Draw 20 circles in a row. Colour one red as infected. Each round, every red circle roll a die for each neighbour.","If you roll 4, 5 or 6, colour that neighbour red. Play 5 rounds and count the reds.","Replay but infect only on a 6, like wearing masks. Compare the two counts."],"hi":["एक पंक्ति में 20 गोले बनाओ। एक को लाल करो, यानी संक्रमित। हर दौर में हर लाल गोले के पड़ोसी के लिए पासा फेंको।","4, 5 या 6 आए तो वह पड़ोसी लाल कर दो। 5 दौर खेलो और लाल गोले गिनो।","अब सिर्फ़ 6 आने पर संक्रमण मानो, जैसे मास्क लगाने पर। दोनों गिनतियों की तुलना करो।"]},"result":{"en":"You will see how small protective habits can slow the spread of a virus.","hi":"तुम देखोगे कि सुरक्षा की छोटी आदतें वायरस का फैलना कैसे धीमा कर सकती हैं।"},"time":"30 min","cost":"Free"},"g":["science","health","numbers"]},{"id":"c200","s":"research","p":859,"n":{"en":"Zoologist","hi":"प्राणी विज्ञानी"},"w":{"en":"Studies animals, how they behave, where they live and how they survive, in the wild or in labs and zoos.","hi":"जानवरों का अध्ययन करता है कि वे कैसे बर्ताव करते हैं, कहाँ रहते हैं और कैसे जीवित रहते हैं, जंगल में भी और लैब या चिड़ियाघर में भी।"},"t":{"title":{"en":"Watch an animal and record its behaviour","hi":"किसी जानवर को देखो और उसकी हरकतें दर्ज करो"},"steps":{"en":["Pick a bird, squirrel, ant or street animal you can watch from a safe distance. Do not disturb it.","For 15 minutes, write down what it is doing every minute: eating, resting, moving, calling.","Count each behaviour and make a small bar chart of how it spent its time."],"hi":["कोई चिड़िया, गिलहरी, चींटी या सड़क का जानवर चुनो जिसे सुरक्षित दूरी से देख सको। उसे परेशान मत करो।","15 मिनट तक हर मिनट लिखो कि वह क्या कर रहा है: खाना, आराम, चलना या आवाज़ निकालना।","हर हरकत गिनो और छोटा बार चार्ट बनाओ कि उसने अपना समय कैसे बिताया।"]},"result":{"en":"You will have a real field record of an animal's behaviour, just as zoologists make.","hi":"तुम्हारे पास किसी जानवर के व्यवहार का असली फ़ील्ड रिकॉर्ड होगा, जैसा प्राणी विज्ञानी बनाते हैं।"},"time":"30 min","cost":"Free"},"g":["nature","science"]},{"id":"c201","s":"trades","p":863,"n":{"en":"Applique Artisan","hi":"एप्लीक आर्टिसन"},"w":{"en":"Cuts shapes from fabric and stitches or sticks them onto a cloth base to make decorative patterns on bags, quilts and clothes.","hi":"कपड़े के टुकड़े काटकर उन्हें दूसरे कपड़े पर सिलता या चिपकाता है और बैग, रज़ाई और कपड़ों पर सजावटी डिज़ाइन बनाता है।"},"t":{"title":{"en":"Make an applique patch from cloth scraps","hi":"कपड़े की कतरनों से एप्लीक पैच बनाओ"},"steps":{"en":["Sketch a simple design, like a flower or fish, on paper and cut out its parts as templates.","Trace the templates on old cloth scraps and cut them out with blunt scissors.","Arrange the pieces on a plain cloth base and stick them down with fabric glue or flour paste."],"hi":["कागज़ पर फूल या मछली जैसा आसान डिज़ाइन बनाओ और उसके हिस्से काटकर साँचे बना लो।","साँचे पुराने कपड़े की कतरनों पर उतारो और कुंद कैंची से काट लो।","टुकड़ों को सादे कपड़े पर सजाओ और फ़ैब्रिक ग्लू या आटे की लेई से चिपका दो।"]},"result":{"en":"You will have a finished applique patch and know if cutting and arranging fabric is fun for you.","hi":"तुम्हारा एप्लीक पैच तैयार होगा और पता चलेगा कि कपड़ा काटना-सजाना तुम्हें अच्छा लगता है या नहीं।"},"time":"45 min","cost":"Free"},"g":["art","build"]},{"id":"c202","s":"trades","p":865,"n":{"en":"Assistant Beauty Therapist","hi":"सहायक सौंदर्य चिकित्सक"},"w":{"en":"Helps clients with skin, hand, foot and face care, keeps tools clean, and learns to listen to what each client needs.","hi":"ग्राहकों की त्वचा, हाथ-पैर और चेहरे की देखभाल में मदद करता है, औज़ार साफ़ रखता है और हर ग्राहक की ज़रूरत ध्यान से सुनता है।"},"t":{"title":{"en":"Do a client consultation and a gentle hand massage","hi":"ग्राहक से बातचीत करो और हाथ की हल्की मालिश करो"},"steps":{"en":["Make a card with 5 questions: skin type, allergies, daily routine, products used, and what they want.","Ask a family member the questions. Wash both hands, then give a gentle hand massage with their own moisturiser. Skip if they have allergies.","Write a simple 3-step care plan for them and ask for honest feedback."],"hi":["5 सवालों का कार्ड बनाओ: त्वचा का प्रकार, एलर्जी, रोज़ की दिनचर्या, इस्तेमाल की चीज़ें और वे क्या चाहते हैं।","परिवार के किसी सदस्य से ये सवाल पूछो। दोनों हाथ धोकर उनकी अपनी क्रीम से हाथ की हल्की मालिश करो। एलर्जी हो तो मत करो।","उनके लिए 3 आसान कदमों की देखभाल योजना लिखो और ईमानदार राय माँगो।"]},"result":{"en":"You will learn how to listen first and care second, the base of good client service.","hi":"तुम सीखोगे कि पहले सुनना और फिर देखभाल करना है, यही अच्छी ग्राहक सेवा की नींव है।"},"time":"30 min","cost":"Free"},"g":["people","health","art"]},{"id":"c203","s":"trades","p":867,"n":{"en":"Assistant Carpenter (Wooden Furniture)","hi":"सहायक बढ़ई (लकड़ी का फर्नीचर)"},"w":{"en":"Helps a carpenter measure, mark, cut, join and finish wood to make furniture like tables, beds, shelves and cupboards.","hi":"बढ़ई की मदद करता है: लकड़ी को नापना, निशान लगाना, काटना, जोड़ना और चिकना करना, ताकि मेज़, पलंग, शेल्फ़ और अलमारी जैसा फ़र्नीचर बने।"},"t":{"title":{"en":"Build a cardboard stool that holds a book","hi":"गत्ते का स्टूल बनाओ जो किताब सँभाल ले"},"steps":{"en":["Draw a small stool on paper and write down the length of its top and each leg.","Measure and mark thick cardboard with a ruler, then cut the pieces with scissors.","Join the pieces with glue or tape, then test whether it holds a heavy book."],"hi":["कागज़ पर छोटा स्टूल बनाओ और उसके ऊपरी हिस्से और हर पाए की लंबाई लिखो।","मोटे गत्ते पर स्केल से नापकर निशान लगाओ और कैंची से टुकड़े काटो।","टुकड़ों को गोंद या टेप से जोड़ो और जाँचो कि वह भारी किताब सँभाल पाता है या नहीं।"]},"result":{"en":"You will have a working model and feel how exact measuring decides if furniture fits and stands firm.","hi":"तुम्हारा चलता-फिरता मॉडल होगा और समझ आएगा कि सही नाप से ही फ़र्नीचर ठीक बैठता और मज़बूत खड़ा रहता है।"},"time":"1 hour","cost":"Free"},"g":["build","machines"]},{"id":"c204","s":"trades","p":869,"n":{"en":"Assistant False Ceiling and Drywall Installer","hi":"असिस्टेंट फाल्स सीलिंग और ड्राईवॉल इंस्टॉलर"},"w":{"en":"Helps fit light frames and boards on ceilings and walls, measuring carefully so surfaces are flat, level and neatly finished.","hi":"छत और दीवारों पर हल्के फ़्रेम और बोर्ड लगाने में मदद करता है और ध्यान से नापता है ताकि सतह सीधी, बराबर और साफ़ दिखे।"},"t":{"title":{"en":"Build a model ceiling grid with panels","hi":"पैनल वाली छत की ग्रिड का मॉडल बनाओ"},"steps":{"en":["Draw a 30 by 30 cm ceiling plan on paper and divide it into 6 cm squares.","Glue cardboard strips along the lines onto a flat base to make the grid.","Cut paper panels to fit each square exactly and drop them in. Check they sit flat."],"hi":["कागज़ पर 30 गुणा 30 सेमी की छत का नक्शा बनाओ और उसे 6 सेमी के खानों में बाँटो।","गत्ते की पट्टियाँ रेखाओं पर समतल आधार पर चिपकाकर ग्रिड बनाओ।","हर खाने के नाप के पेपर पैनल काटकर बिठाओ और जाँचो कि वे बराबर बैठे हैं।"]},"result":{"en":"You will see how small measuring errors show up quickly, and why careful layout matters.","hi":"तुम देखोगे कि नाप की छोटी गलती भी तुरंत दिख जाती है, इसलिए सही नक्शा ज़रूरी है।"},"time":"45 min","cost":"Free"},"g":["build","numbers"]},{"id":"c205","s":"trades","p":871,"n":{"en":"Assistant Fitter (Levelling, Alignment and Balancing)","hi":"असिस्टेंट फिटर (लेवलिंग, अलाइनमेंट और बैलेंसिंग)"},"w":{"en":"Helps fit and set up machine parts so they sit level, line up straight and run smoothly without shaking.","hi":"मशीन के पुर्ज़े लगाने और सेट करने में मदद करता है ताकि वे बराबर रहें, सीध में जुड़ें और बिना हिले-डुले चलें।"},"t":{"title":{"en":"Balance a ruler and check a level with water","hi":"स्केल को संतुलित करो और पानी से सतह की जाँच करो"},"steps":{"en":["Balance a ruler on a pencil. Put two coins on one side and find where one coin balances them.","Note the distances from the middle. See how weight and distance work together.","Place a half-filled clear bottle on a table or shelf and check if the water line is level."],"hi":["स्केल को पेंसिल पर संतुलित करो। एक तरफ़ दो सिक्के रखो और देखो कि दूसरी तरफ़ एक सिक्का कहाँ रखने पर संतुलन बनता है।","बीच से दूरियाँ नोट करो और देखो कि वज़न और दूरी साथ में कैसे काम करते हैं।","आधी भरी साफ़ बोतल को मेज़ या शेल्फ़ पर लिटाओ और देखो कि पानी की रेखा सीधी है या नहीं।"]},"result":{"en":"You will understand balance and levelling by feel, the base skills of fitting machines.","hi":"तुम संतुलन और बराबरी को खुद करके समझोगे, जो मशीन फ़िटिंग की बुनियादी बातें हैं।"},"time":"30 min","cost":"Free"},"g":["machines","build"]},{"id":"c206","s":"trades","p":873,"n":{"en":"Assistant Hair Stylist","hi":"असिस्टेंट हेयर स्टाइलिस्ट"},"w":{"en":"Helps a stylist wash, comb, cut and style hair, keeps tools clean, and makes clients comfortable.","hi":"स्टाइलिस्ट की मदद करता है: बाल धोना, कंघी करना, काटना और स्टाइल करना, औज़ार साफ़ रखना और ग्राहकों को सहज महसूस कराना।"},"t":{"title":{"en":"Practise braids and plan a hairstyle","hi":"चोटी बनाने का अभ्यास करो और हेयरस्टाइल सोचो"},"steps":{"en":["Tie 3 strands of wool or cloth strips to a hook and practise a neat plain braid 15 cm long.","Try a four-strand or fishtail braid following a free video, still on the wool.","Sketch two styles for a face shape of a friend or relative and ask which they like."],"hi":["ऊन या कपड़े की 3 पट्टियाँ किसी हुक से बाँधकर 15 सेमी की साफ़ चोटी बनाने का अभ्यास करो।","अब किसी मुफ़्त वीडियो को देखकर चार लड़ी या फ़िशटेल चोटी बनाओ, अभी ऊन पर ही।","किसी दोस्त या रिश्तेदार के चेहरे के आकार के लिए दो स्टाइल बनाओ और पूछो कि उन्हें कौन सा पसंद है।"]},"result":{"en":"You will have a neat braid sample and a style sketch, and know if working with hands and looks suits you.","hi":"तुम्हारे पास साफ़ चोटी का नमूना और स्टाइल का स्केच होगा और पता चलेगा कि हाथ के काम और लुक्स का काम तुम्हें जँचता है या नहीं।"},"time":"45 min","cost":"Free"},"g":["art","people"]},{"id":"c207","s":"trades","p":875,"n":{"en":"Assistant Surveyor","hi":"सहायक सर्वेक्षक"},"w":{"en":"Helps measure land and buildings with tapes and instruments, records distances and angles, and prepares maps and plans.","hi":"फ़ीते और यंत्रों से ज़मीन और इमारतों को नापने में मदद करता है, दूरी और कोण लिखता है और नक्शे व प्लान तैयार करता है।"},"t":{"title":{"en":"Measure and draw a scale map of a room","hi":"कमरे का पैमाने वाला नक्शा बनाओ"},"steps":{"en":["Measure one of your footsteps with a ruler or tape, then pace out the length and width of a room.","Convert your paces to metres and write the numbers down for each wall.","Draw the room on paper at a scale like 1 cm to 1 m, marking doors and windows."],"hi":["अपने एक कदम की लंबाई स्केल या फ़ीते से नापो, फिर कमरे की लंबाई-चौड़ाई कदमों से नापो।","कदमों को मीटर में बदलो और हर दीवार का नाप लिख लो।","कागज़ पर 1 सेमी बराबर 1 मीटर जैसे पैमाने से कमरा बनाओ और दरवाज़े-खिड़कियाँ दिखाओ।"]},"result":{"en":"You will have a scaled plan and see how surveyors turn real space into a map.","hi":"तुम्हारे पास पैमाने वाला नक्शा होगा और दिखेगा कि सर्वेक्षक असली जगह को नक्शे में कैसे बदलते हैं।"},"time":"45 min","cost":"Free"},"g":["numbers","build"]},{"id":"c208","s":"trades","p":877,"n":{"en":"Auto Service Technician","hi":"ऑटो सर्विस तकनीशियन"},"w":{"en":"Inspects, services and repairs vehicles, checking brakes, tyres, engine and other parts so they run safely.","hi":"गाड़ियों की जाँच, सर्विस और मरम्मत करता है और ब्रेक, टायर, इंजन जैसे हिस्से देखता है ताकि गाड़ी सुरक्षित चले।"},"t":{"title":{"en":"Give a bicycle a full check-up","hi":"साइकिल की पूरी जाँच करो"},"steps":{"en":["Make a checklist: tyres, brakes, chain, bell or light, seat and handlebar. Park the cycle on a flat spot.","Check each item: press the tyres, squeeze the brakes, spin the pedals, see if the chain is loose or dry.","Mark each OK or needs attention, then wipe the chain and rims with a dry cloth."],"hi":["चेकलिस्ट बनाओ: टायर, ब्रेक, चेन, घंटी या लाइट, सीट और हैंडल। साइकिल समतल जगह पर खड़ी करो।","हर चीज़ जाँचो: टायर दबाकर देखो, ब्रेक दबाओ, पैडल घुमाओ और देखो कि चेन ढीली या सूखी तो नहीं।","हर चीज़ पर ठीक या ध्यान चाहिए लिखो, फिर चेन और रिम को सूखे कपड़े से पोंछ दो।"]},"result":{"en":"You will have a service report for the cycle and know how it feels to diagnose a machine.","hi":"साइकिल की सर्विस रिपोर्ट तैयार होगी और पता चलेगा कि मशीन की खराबी पहचानना कैसा लगता है।"},"time":"30 min","cost":"Free"},"g":["machines","build"]},{"id":"c209","s":"trades","p":879,"n":{"en":"Auto/E-Rickshaw Driver and Technician","hi":"ऑटो/ई-रिक्शा चालक एवं तकनीशियन"},"w":{"en":"Drives passengers safely on local routes, knows the roads, charges fair fares, and looks after the vehicle's basic upkeep.","hi":"सवारियों को लोकल रास्तों पर सुरक्षित पहुँचाता है, सड़कें जानता है, सही किराया लेता है और गाड़ी की बुनियादी देखभाल करता है।"},"t":{"title":{"en":"Plan a route and fare chart for pretend passengers","hi":"काल्पनिक सवारियों के लिए रूट और किराया चार्ट बनाओ"},"steps":{"en":["Sketch a map of your area with 5 stops and write the approximate distance between them.","A passenger must visit 3 stops. Find the shortest route and explain your choice.","Make a pretend fare chart with a per-km rate you choose and work out bills for 3 trips."],"hi":["अपने इलाके का 5 स्टॉप वाला नक्शा बनाओ और उनके बीच की अंदाज़न दूरी लिखो।","एक सवारी को 3 स्टॉप जाना है। सबसे छोटा रास्ता ढूँढो और बताओ कि यही क्यों चुना।","अपनी चुनी हुई प्रति किमी दर से काल्पनिक किराया चार्ट बनाओ और 3 सफ़रों के बिल निकालो।"]},"result":{"en":"You will practise route thinking and fare maths, the daily brain-work behind the driving.","hi":"तुम रास्ता सोचना और किराया जोड़ना सीखोगे, जो गाड़ी चलाने के पीछे का रोज़ का दिमागी काम है।"},"time":"30 min","cost":"Free"},"g":["travel","numbers","machines"]},{"id":"c210","s":"trades","p":881,"n":{"en":"Automotive Electrician","hi":"ऑटोमोटिव इलेक्ट्रीशियन"},"w":{"en":"Installs, tests and repairs vehicle electrical parts like the battery, lights, horn, indicators and wiring.","hi":"गाड़ी के बिजली वाले हिस्से जैसे बैटरी, लाइट, हॉर्न, इंडिकेटर और वायरिंग लगाता, जाँचता और ठीक करता है।"},"t":{"title":{"en":"Wire a headlight and indicator in a free simulator","hi":"फ़्री सिमुलेटर में हेडलाइट और इंडिकेटर की वायरिंग करो"},"steps":{"en":["Open Tinkercad Circuits free online. Place a battery, a switch and one LED as the headlight.","Wire them in a loop and press Simulate. Switch the light on and off.","Add a second LED with its own switch as an indicator, and test both together."],"hi":["टिंकरकैड सर्किट्स फ़्री में ऑनलाइन खोलो। एक बैटरी, एक स्विच और हेडलाइट के रूप में एक LED रखो।","इन्हें लूप में तार से जोड़ो और सिमुलेट दबाओ। लाइट को चालू-बंद करके देखो।","इंडिकेटर के लिए अपने स्विच वाली दूसरी LED जोड़ो और दोनों को साथ में परखो।"]},"result":{"en":"You will have a working vehicle-style circuit and see how electricity flows, with no real wires needed.","hi":"तुम्हारा गाड़ी जैसा चलता सर्किट होगा और दिखेगा कि बिजली कैसे बहती है, वह भी बिना असली तारों के।"},"time":"45 min","cost":"Free"},"g":["machines","build","code"]},{"id":"c211","s":"trades","p":883,"n":{"en":"Bamboo Mat Weaver","hi":"बाँस की चटाई बुनकर"},"w":{"en":"Splits and smooths bamboo into thin strips and weaves them over and under to make mats, screens and baskets.","hi":"बाँस को चीरकर पतली पट्टियाँ बनाता है और उन्हें ऊपर-नीचे बुनकर चटाई, परदे और टोकरियाँ तैयार करता है।"},"t":{"title":{"en":"Weave a paper mat over and under","hi":"कागज़ की चटाई ऊपर-नीचे बुनो"},"steps":{"en":["Cut 10 paper strips 2 cm wide from newspaper or chart paper. Lay 5 side by side as the base.","Weave the other 5 across them, going over one and under one, then switching in the next row.","Press the strips close together and tape the edges to finish a small mat."],"hi":["अख़बार या चार्ट पेपर से 2 सेमी चौड़ी 10 पट्टियाँ काटो। 5 पट्टियाँ साथ-साथ बिछाओ, यह आधार है।","बाकी 5 को आड़ा बुनो: एक के ऊपर, एक के नीचे, और अगली पंक्ति में उल्टा।","पट्टियों को पास-पास दबाओ और किनारों पर टेप लगाकर छोटी चटाई पूरी करो।"]},"result":{"en":"You will have a small woven mat and know if patient, repeating handwork feels satisfying to you.","hi":"तुम्हारी छोटी बुनी हुई चटाई होगी और पता चलेगा कि धैर्य वाला, दोहराने वाला हाथ का काम तुम्हें अच्छा लगता है या नहीं।"},"time":"30 min","cost":"Free"},"g":["art","build"]},{"id":"c212","s":"trades","p":885,"n":{"en":"Bamboo Product Tailor","hi":"बाँस उपयोगी उत्पाद टेलर"},"w":{"en":"Turns bamboo pieces into useful items like baskets, trays, pen stands and lamp shades by shaping, joining and finishing them.","hi":"बाँस के टुकड़ों को आकार देकर, जोड़कर और चिकना करके टोकरी, ट्रे, पेन स्टैंड और लैंपशेड जैसी काम की चीज़ें बनाता है।"},"t":{"title":{"en":"Roll newspaper sticks into a pen stand","hi":"अख़बार की डंडियों से पेन स्टैंड बनाओ"},"steps":{"en":["Roll 16 sheets of newspaper tightly into thin sticks like bamboo and tape each one.","Glue 4 sticks into a square base, then stack and glue more layers upward like a log cabin.","Bind the sides with thread, let the glue dry, then test if it holds your pens."],"hi":["अख़बार के 16 पन्नों को कसकर बाँस जैसी पतली डंडियों में लपेटो और हर एक पर टेप लगाओ।","4 डंडियों को चौकोर आधार में चिपकाओ, फिर ऊपर की ओर परतें चिपकाते जाओ, जैसे लकड़ी की झोपड़ी।","किनारों को धागे से बाँधो, गोंद सूखने दो और जाँचो कि वह तुम्हारे पेन सँभालता है या नहीं।"]},"result":{"en":"You will have a useful pen stand and see how many small pieces become a strong product.","hi":"तुम्हारा काम का पेन स्टैंड बनेगा और दिखेगा कि कई छोटे टुकड़े मिलकर मज़बूत चीज़ कैसे बनते हैं।"},"time":"1 hour","cost":"Free"},"g":["build","art"]},{"id":"c213","s":"trades","p":887,"n":{"en":"Cake Artist","hi":"केक आर्टिस्ट"},"w":{"en":"Bakes and decorates cakes with icing, colours and shapes to match a customer's theme, taste and occasion.","hi":"ग्राहक की थीम, पसंद और मौके के हिसाब से केक बनाता है और उसे आइसिंग, रंगों और आकारों से सजाता है।"},"t":{"title":{"en":"Design a cake, then decorate a biscuit","hi":"केक का डिज़ाइन बनाओ और बिस्किट पर सजाओ"},"steps":{"en":["Choose a theme, like cricket or a birthday, and sketch 3 cake designs on paper. Pick your favourite.","Decorate a big plain biscuit or bread slice with cream, jam, fruit or sprinkles to copy the sketch.","Photograph it, compare with your sketch, and write one thing you would change."],"hi":["कोई थीम चुनो, जैसे क्रिकेट या जन्मदिन, और कागज़ पर केक के 3 डिज़ाइन बनाओ। अपना पसंदीदा चुनो।","बड़े सादे बिस्किट या ब्रेड स्लाइस पर क्रीम, जैम, फल या स्प्रिंकल्स से स्केच जैसी सजावट करो।","उसकी फ़ोटो खींचो, स्केच से मिलाओ और एक बात लिखो जो तुम बदलना चाहोगे।"]},"result":{"en":"You will have an edible mini design and learn how planning on paper helps the final look.","hi":"तुम्हारे पास खाने लायक छोटा डिज़ाइन होगा और समझ आएगा कि कागज़ पर योजना से आख़िरी रूप बेहतर बनता है।"},"time":"45 min","cost":"Under ₹100"},"g":["food","art"]},{"id":"c214","s":"trades","p":889,"n":{"en":"Camp Assistant","hi":"शिविर सहायक"},"w":{"en":"Helps run camps and outdoor trips by setting up, guiding games and activities, looking after participants and keeping everyone safe.","hi":"कैंप और आउटडोर ट्रिप में तैयारी करता है, खेल और गतिविधियाँ कराता है, प्रतिभागियों का ध्यान रखता है और सबको सुरक्षित रखता है।"},"t":{"title":{"en":"Plan a mini camp day and run one game","hi":"एक दिन के मिनी कैंप की योजना बनाओ और एक खेल कराओ"},"steps":{"en":["Plan a 3-hour camp for 8 children: a timetable, a kit list, water breaks and two safety rules.","Pick a team game with simple rules, like a treasure hunt, and write how you will explain it.","Run it for 10 minutes with family or friends, then note what worked and what confused people."],"hi":["8 बच्चों के लिए 3 घंटे का कैंप सोचो: समय-सारणी, सामान की सूची, पानी के ब्रेक और दो सुरक्षा नियम।","आसान नियमों वाला टीम गेम चुनो, जैसे खज़ाना खोज, और लिखो कि उसे कैसे समझाओगे।","10 मिनट परिवार या दोस्तों के साथ खेलकर कराओ, फिर लिखो क्या ठीक रहा और किसमें उलझन हुई।"]},"result":{"en":"You will have a camp plan and a taste of leading a group.","hi":"तुम्हारे पास कैंप की योजना होगी और एक समूह को सँभालने का थोड़ा अनुभव मिलेगा।"},"time":"1 hour","cost":"Free"},"g":["people","service","nature"]},{"id":"c215","s":"trades","p":891,"n":{"en":"CCTV Installation Technician","hi":"सी.सी.टी.वी. इंस्टॉलेशन तकनीशियन"},"w":{"en":"Plans where cameras should go, fixes them safely, connects the wiring and recorder, and checks that the whole area is covered.","hi":"तय करता है कि कैमरे कहाँ लगें, उन्हें सुरक्षित लगाता है, तार और रिकॉर्डर जोड़ता है और जाँचता है कि पूरा इलाक़ा कवर हो रहा है।"},"t":{"title":{"en":"Plan camera spots and test the view","hi":"कैमरे की जगहें तय करो और व्यू जाँचो"},"steps":{"en":["Draw a floor plan of your house entrance or a school corridor. Mark 2 camera spots and draw each view as a triangle.","Find blind spots on the plan where no camera can see, and adjust your spots.","Stand at each spot with your phone camera, check what it really sees, and fix your plan."],"hi":["अपने घर के प्रवेश या स्कूल के गलियारे का नक्शा बनाओ। 2 कैमरा जगहें चिह्नित करो और हर का दृश्य त्रिभुज से दिखाओ।","नक्शे पर वे अंधे कोने ढूँढो जहाँ कोई कैमरा नहीं देख पाता और जगहें ठीक करो।","हर जगह खड़े होकर फ़ोन कैमरे से देखो कि असल में क्या दिखता है और नक्शा सुधारो।"]},"result":{"en":"You will have a camera-coverage plan and see why placement matters as much as the camera.","hi":"तुम्हारा कैमरा कवरेज प्लान बनेगा और समझ आएगा कि कैमरे जितनी ही ज़रूरी उसकी जगह भी है।"},"time":"30 min","cost":"Free"},"g":["machines","build"]},{"id":"c216","s":"trades","p":893,"n":{"en":"Chef","hi":"शेफ"},"w":{"en":"Plans menus and prepares tasty, safe food, balancing flavours and keeping the kitchen clean and organised.","hi":"मेन्यू सोचता है और स्वादिष्ट, सुरक्षित खाना बनाता है, स्वादों का संतुलन रखता है और रसोई साफ़ व व्यवस्थित रखता है।"},"t":{"title":{"en":"Create a no-cook chaat and taste-test it","hi":"बिना पकाए चाट बनाओ और स्वाद परखो"},"steps":{"en":["Wash your hands. With a grown-up chopping, prepare cucumber, tomato, sprouts or boiled chana, plus lemon, salt and chaat masala.","Mix two versions with different seasoning amounts, such as more tangy and more spicy.","Let 3 family members taste and score each out of 5. Note which balance of flavours won."],"hi":["हाथ धोओ। किसी बड़े की मदद से खीरा, टमाटर, अंकुरित अनाज या उबले चने काटो, साथ में नींबू, नमक और चाट मसाला लो।","अलग मसाले की मात्रा से दो तरह की चाट मिलाओ, जैसे एक ज़्यादा खट्टी और एक ज़्यादा तीखी।","परिवार के 3 लोगों से चखवाओ और 5 में से नंबर दिलवाओ। देखो किस स्वाद का संतुलन जीता।"]},"result":{"en":"You will have a dish people tasted and scored, and learn how a chef balances flavours.","hi":"तुम्हारी बनाई चाट पर लोगों के नंबर होंगे और समझ आएगा कि शेफ़ स्वाद का संतुलन कैसे बनाता है।"},"time":"45 min","cost":"Under ₹100"},"g":["food","people"]},{"id":"c217","s":"trades","p":895,"n":{"en":"Child Caregiver (Non-clinical)","hi":"बाल देखभालकर्ता (गैर-नैदानिक)"},"w":{"en":"Looks after young children, keeps them safe, and helps them play, eat, rest and learn through daily routines.","hi":"छोटे बच्चों की देखभाल करता है, उन्हें सुरक्षित रखता है और रोज़ की दिनचर्या में खेलने, खाने, आराम करने और सीखने में मदद करता है।"},"t":{"title":{"en":"Run a 15-minute story and play session","hi":"15 मिनट की कहानी और खेल की गतिविधि कराओ"},"steps":{"en":["Make 2 paper puppets or story cards for a short story. Ask a grown-up to stay nearby.","Tell the story to a younger sibling or neighbour child using different voices and ask 2 simple questions.","Notice what held their attention and what made them lose interest, then jot down what you would change."],"hi":["छोटी कहानी के लिए 2 कागज़ की कठपुतलियाँ या कहानी कार्ड बनाओ। किसी बड़े को पास रहने को कहो।","छोटे भाई-बहन या पड़ोस के बच्चे को अलग-अलग आवाज़ों में कहानी सुनाओ और 2 आसान सवाल पूछो।","देखो किस बात पर उसका ध्यान टिका और कब हटा, फिर लिखो कि तुम क्या बदलोगे।"]},"result":{"en":"You will learn how patience and play help young children, and how you feel being in charge of one.","hi":"तुम सीखोगे कि धैर्य और खेल छोटे बच्चों की कैसे मदद करते हैं और किसी बच्चे की ज़िम्मेदारी लेना कैसा लगता है।"},"time":"30 min","cost":"Free"},"g":["people","service","art"]},{"id":"c218","s":"trades","p":897,"n":{"en":"Chocolatier","hi":"चॉकलेटियर"},"w":{"en":"Makes chocolates and sweets by melting, flavouring, shaping and decorating chocolate with careful attention to taste and texture.","hi":"चॉकलेटियर चॉकलेट को पिघलाकर, फ्लेवर देकर और सजाकर स्वाद और बनावट का ध्यान रखते हुए मिठाइयाँ और चॉकलेट बनाता है।"},"t":{"title":{"en":"Run a three-chocolate taste test","hi":"तीन चॉकलेट का स्वाद-परीक्षण करें"},"steps":{"en":["Get three different chocolates (dark, milk, any other) and cover the wrappers so you can't see the brand.","Break each piece. Note the snap sound, smell, how fast it melts on your tongue, and the flavour.","Score each from 1 to 5 in a small table and write one line on why."],"hi":["तीन अलग चॉकलेट लें (डार्क, मिल्क या कोई और) और रैपर ढक दें ताकि ब्रांड न दिखे।","हर टुकड़ा तोड़ें। आवाज़, खुशबू, ज़बान पर पिघलने की स्पीड और स्वाद नोट करें।","एक छोटी तालिका में हर चॉकलेट को 1 से 5 अंक दें और कारण की एक लाइन लिखें।"]},"result":{"en":"You will have your own tasting sheet and know if judging flavour and texture feels fun.","hi":"आपके पास अपनी टेस्टिंग शीट होगी और पता चलेगा कि स्वाद और बनावट परखना आपको मज़ेदार लगता है या नहीं।"},"time":"30 min","cost":"Under ₹100"},"g":["food","science"]},{"id":"c219","s":"trades","p":899,"n":{"en":"CNC Operator (Turning)","hi":"सी.एन.सी. ऑपरेटर (टर्निंग)"},"w":{"en":"Sets up and runs a computer-controlled lathe that spins metal and cuts it into exact round parts like shafts and bolts.","hi":"सी.एन.सी. ऑपरेटर कंप्यूटर से चलने वाली लेथ मशीन चलाता है, जो घूमते धातु को काटकर शाफ्ट और बोल्ट जैसे सटीक गोल पुर्ज़े बनाती है।"},"t":{"title":{"en":"Plan a tool path for a bolt","hi":"एक बोल्ट के लिए टूल का रास्ता बनाएँ"},"steps":{"en":["On graph paper, draw the side view of a simple bolt, 1 square equal to 1 mm, with a length and a thicker head.","Mark the start point of the cutting tool and list the X (width) and Z (length) points it must pass through.","Trace the list with a pencil point in order and check that you get the same bolt shape."],"hi":["ग्राफ़ पेपर पर 1 खाने को 1 मिमी मानकर एक सादे बोल्ट का साइड व्यू बनाएँ, जिसमें लंबाई और मोटा सिर हो।","कटिंग टूल का शुरुआती बिंदु लिखें और उन X (चौड़ाई) और Z (लंबाई) बिंदुओं की सूची बनाएँ जिनसे वह गुज़रेगा।","पेंसिल की नोक से सूची के बिंदुओं को क्रम से जोड़ें और जाँचें कि वही बोल्ट बना या नहीं।"]},"result":{"en":"You will have a coordinate list that draws a real part, a taste of how CNC programs think.","hi":"आपके पास निर्देशांकों की एक सूची होगी जो असली पुर्ज़ा बनाती है, यानी सी.एन.सी. प्रोग्राम कैसे सोचता है इसका अंदाज़ा।"},"time":"45 min","cost":"Free"},"g":["machines","numbers"]},{"id":"c220","s":"trades","p":901,"n":{"en":"Coffee Tester / Barista / Q Grader","hi":"कॉफी टेस्टर/बरिस्ता/क्यू ग्रेडर"},"w":{"en":"Smells and tastes coffee to judge its quality, brews it carefully, and serves or grades it for customers or buyers.","hi":"कॉफी टेस्टर, बरिस्ता या क्यू ग्रेडर कॉफी की खुशबू और स्वाद से उसकी क्वालिटी परखता है, उसे ध्यान से बनाता है और ग्राहकों या खरीदारों को परोसता या ग्रेड देता है।"},"t":{"title":{"en":"Play a blind smell-test game","hi":"आँख बंद करके खुशबू पहचानने का खेल खेलें"},"steps":{"en":["Ask a family member to put five kitchen items (cardamom, tea, cloves, jaggery, coffee or similar) in small covered cups.","With eyes closed, smell each cup and write words like sweet, smoky, nutty, floral. Then guess the item.","Check your answers and count how many you got right. Repeat the next day."],"hi":["परिवार के किसी सदस्य से पाँच रसोई की चीज़ें (इलायची, चाय, लौंग, गुड़, कॉफी आदि) छोटे ढके कपों में रखवाएँ।","आँखें बंद करके हर कप सूँघें और मीठा, धुआँ-सा, मेवे जैसा, फूलों जैसा जैसे शब्द लिखें। फिर चीज़ का अंदाज़ा लगाएँ।","जवाब मिलाएँ और गिनें कितने सही निकले। अगले दिन फिर कोशिश करें।"]},"result":{"en":"You will know how sharp your nose and tongue are, the core skill of a tester.","hi":"आपको पता चलेगा कि आपकी नाक और ज़बान कितनी तेज़ हैं, जो टेस्टर का सबसे ज़रूरी हुनर है।"},"time":"30 min","cost":"Free"},"g":["food","science"]},{"id":"c221","s":"trades","p":903,"n":{"en":"Construction Painter and Decorator","hi":"निर्माण-चित्रकार और सज्जाकार"},"w":{"en":"Prepares walls and surfaces, then paints and decorates them neatly to give buildings a clean, finished look.","hi":"निर्माण-चित्रकार और सज्जाकार दीवारों को तैयार करके उन पर साफ़-सुथरा रंग और सजावट करता है, ताकि इमारत पूरी और सुंदर दिखे।"},"t":{"title":{"en":"Plan and colour-test one wall","hi":"एक दीवार की योजना बनाकर रंग टेस्ट करें"},"steps":{"en":["Measure one wall of a room with a tape or a footscale. Multiply height by width to find its area.","Draw the wall on paper and colour two different colour schemes with pencils or crayons.","Paint a small test patch of your favourite on spare paper with a brush and ask family which they prefer."],"hi":["टेप या स्केल से कमरे की एक दीवार नापें। ऊँचाई को चौड़ाई से गुणा करके उसका क्षेत्रफल निकालें।","दीवार का चित्र बनाकर पेंसिल या क्रेयॉन से दो अलग रंग-योजनाएँ भरें।","अपने पसंदीदा रंग का छोटा टेस्ट पैच ब्रश से फालतू कागज़ पर लगाएँ और घरवालों से पूछें कौन-सा पसंद है।"]},"result":{"en":"You will have a measured wall plan with colour choices, like a real painter's first step.","hi":"आपके पास नाप के साथ दीवार की योजना और रंगों के विकल्प होंगे, जैसे असली पेंटर का पहला कदम।"},"time":"45 min","cost":"Free"},"g":["art","build"]},{"id":"c222","s":"trades","p":905,"n":{"en":"Crochet Lace Maker (Furnishing)","hi":"क्रोशिया लेस मेकर-फर्निशिंग"},"w":{"en":"Uses a hook and thread to crochet lace, doilies and borders that decorate curtains, tablecloths and other home furnishings.","hi":"क्रोशिया लेस मेकर हुक और धागे से क्रोशिया की लेस, डोइली और किनारी बनाती है, जो परदों, मेज़पोश और घर के सामान को सजाती है।"},"t":{"title":{"en":"Crochet a small coaster","hi":"क्रोशिया से छोटा कोस्टर बनाएँ"},"steps":{"en":["Pick a thick cotton thread or wool and a crochet hook (about ₹30), or use your fingers to start. Make a slip knot.","Make a chain of 20 stitches, then turn and work a row of stitches into each chain.","Keep adding rows until it is square, then fasten off the end and tuck it in."],"hi":["मोटा सूती धागा या ऊन और एक क्रोशिया हुक (करीब ₹30) लें, या उँगलियों से शुरू करें। एक फंदा बनाएँ।","20 फंदों की चेन बनाएँ, फिर पलटकर हर चेन में एक-एक टाँका डालते हुए एक पंक्ति बनाएँ।","चौकोर होने तक पंक्तियाँ जोड़ते रहें, फिर सिरा बाँधकर अंदर दबा दें।"]},"result":{"en":"You will have a handmade coaster and know if slow, careful handwork suits you.","hi":"आपके पास हाथ से बना कोस्टर होगा और पता चलेगा कि धीरे-धीरे बारीक हाथ का काम आपको जँचता है या नहीं।"},"time":"1 hour","cost":"Under ₹100"},"g":["art","build"]},{"id":"c223","s":"trades","p":907,"n":{"en":"Doors and Windows Fixer","hi":"डोर्स एंड विंडोज फिक्सर"},"w":{"en":"Repairs and adjusts doors, windows, hinges, locks and frames so they open, close and lock smoothly.","hi":"डोर्स एंड विंडोज फिक्सर दरवाज़ों, खिड़कियों, कब्ज़ों, ताले और चौखट की मरम्मत और सेटिंग करता है ताकि वे आसानी से खुलें, बंद हों और लॉक हों।"},"t":{"title":{"en":"Run a door check-up at home","hi":"घर के दरवाज़े की जाँच करें"},"steps":{"en":["Close a door and slide a paper strip around all edges. Mark spots where the strip sticks or slips easily.","Make a plumb line with a string and a small weight. Hold it beside the frame to check if it is straight.","Write your findings and guess what fix each problem needs, such as tightening a hinge screw."],"hi":["दरवाज़ा बंद करें और किनारों के चारों ओर कागज़ की पट्टी सरकाएँ। जहाँ वह अटके या आसानी से निकले, वहाँ निशान लगाएँ।","धागे और छोटे वज़न से साहुल बनाएँ। उसे चौखट के पास पकड़कर देखें कि चौखट सीधी है या नहीं।","अपनी जाँच लिखें और अंदाज़ा लगाएँ कि हर समस्या का क्या इलाज होगा, जैसे कब्ज़े का पेंच कसना।"]},"result":{"en":"You will have a short fault report and a feel for fitting and fixing work.","hi":"आपके पास एक छोटी खराबी-रिपोर्ट होगी और फिटिंग व मरम्मत के काम का अंदाज़ा मिलेगा।"},"time":"30 min","cost":"Free"},"g":["build","machines"]},{"id":"c224","s":"trades","p":909,"n":{"en":"Draughtsman","hi":"ड्राफ्ट्समैन"},"w":{"en":"Draws accurate technical drawings of buildings, parts and machines, showing exact sizes so others can make them.","hi":"ड्राफ्ट्समैन इमारतों, पुर्ज़ों और मशीनों के सटीक तकनीकी ड्रॉइंग बनाता है, जिनमें सही नाप होती है ताकि दूसरे लोग उन्हें बना सकें।"},"t":{"title":{"en":"Draw three views of a box","hi":"एक डिब्बे के तीन व्यू बनाएँ"},"steps":{"en":["Pick a small box, like a matchbox or tea box, and measure its length, width and height in mm.","On graph paper, draw its front view, top view and side view to scale, say 1 square equal to 5 mm.","Write each measurement on your drawing with neat lines and have a friend check them with a ruler."],"hi":["माचिस या चाय का छोटा डिब्बा लें और उसकी लंबाई, चौड़ाई, ऊँचाई मिमी में नापें।","ग्राफ़ पेपर पर स्केल से, जैसे 1 खाना बराबर 5 मिमी, उसका सामने, ऊपर और बगल का व्यू बनाएँ।","साफ़ रेखाओं से हर नाप ड्रॉइंग पर लिखें और किसी दोस्त से स्केल से जँचवाएँ।"]},"result":{"en":"You will have a scaled drawing someone else could use to make the box.","hi":"आपके पास स्केल वाली ड्रॉइंग होगी जिससे कोई और वह डिब्बा बना सके।"},"time":"45 min","cost":"Free"},"g":["build","art"]},{"id":"c225","s":"trades","p":911,"n":{"en":"DTH Set Top Box Installation and Service Technician","hi":"डी.टी.एच. सेट टॉप बॉक्स इंस्टॉलेशन और सर्विस तकनीशियन"},"w":{"en":"Installs and repairs DTH dishes and set top boxes at homes, and helps customers when their TV signal or channels stop working.","hi":"डी.टी.एच. सेट टॉप बॉक्स टेक्नीशियन घरों में डिश और सेट टॉप बॉक्स लगाता और ठीक करता है और टीवी सिग्नल या चैनल बंद होने पर ग्राहक की मदद करता है।"},"t":{"title":{"en":"Make a 'No Signal' fix flowchart","hi":"'नो सिग्नल' ठीक करने का फ़्लोचार्ट बनाएँ"},"steps":{"en":["Draw how TV signal travels: dish, cable, set top box, TV. Label each part and each connection.","Write a flowchart of yes/no questions to find the fault, for example 'Is the cable plugged in?'","Ask a family member to be the customer who says 'No signal'. Guide them using only your chart."],"hi":["टीवी सिग्नल का रास्ता बनाएँ: डिश, केबल, सेट टॉप बॉक्स, टीवी। हर हिस्से और जोड़ पर नाम लिखें।","खराबी ढूँढने के लिए हाँ/नहीं सवालों का फ़्लोचार्ट बनाएँ, जैसे 'क्या केबल ठीक से लगी है?'","घर के किसी सदस्य को ग्राहक बनाएँ जो कहे 'सिग्नल नहीं आ रहा'। सिर्फ़ अपने चार्ट से उसे गाइड करें।"]},"result":{"en":"You will have a working troubleshooting chart and a feel for talking customers through a fault.","hi":"आपके पास काम करने वाला खराबी-जाँच चार्ट होगा और ग्राहक को खराबी समझाने का अनुभव मिलेगा।"},"time":"45 min","cost":"Free"},"g":["machines","people"]},{"id":"c226","s":"trades","p":913,"n":{"en":"Electric Vehicle Assembly Technician","hi":"इलेक्ट्रिक वाहन संयोजन तकनीशियन"},"w":{"en":"Assembles electric vehicle parts like motors, battery packs and wiring in the right order and checks that everything fits and works.","hi":"इलेक्ट्रिक वाहन संयोजन तकनीशियन मोटर, बैटरी पैक और वायरिंग जैसे पुर्ज़ों को सही क्रम में जोड़ता है और जाँचता है कि सब फिट होकर काम कर रहा है।"},"t":{"title":{"en":"Assemble a cardboard toy car","hi":"गत्ते की खिलौना कार जोड़ें"},"steps":{"en":["Write an assembly sequence first: body, axles, wheels, check. Use cardboard, straws, sticks and four bottle caps.","Follow your own sequence step by step. Tick each step on a checklist as you finish it.","Roll the car down a slope. If it veers or sticks, find which step needs fixing and redo it."],"hi":["पहले जोड़ने का क्रम लिखें: बॉडी, एक्सल, पहिए, जाँच। गत्ता, स्ट्रॉ, डंडियाँ और चार बोतल के ढक्कन लें।","अपने क्रम से एक-एक कदम जोड़ें। हर कदम पूरा होने पर चेकलिस्ट में सही का निशान लगाएँ।","कार को ढलान पर लुढ़काएँ। अगर वह टेढ़ी जाए या अटके तो देखें कौन-सा कदम सुधारना है और दोबारा करें।"]},"result":{"en":"You will have a rolling model and know how it feels to assemble by a sequence and a checklist.","hi":"आपके पास चलने वाला मॉडल होगा और क्रम व चेकलिस्ट से असेंबल करने का अनुभव मिलेगा।"},"time":"45 min","cost":"Free"},"g":["build","machines"]},{"id":"c227","s":"trades","p":915,"n":{"en":"Electrician (General)","hi":"इलेक्ट्रीशियन (सामान्य)"},"w":{"en":"Installs, tests and repairs electrical wiring, switches and fittings in homes and buildings, following safety rules at all times.","hi":"इलेक्ट्रीशियन घरों और इमारतों में बिजली की वायरिंग, स्विच और फिटिंग लगाता, जाँचता और ठीक करता है और हमेशा सुरक्षा नियमों का पालन करता है।"},"t":{"title":{"en":"Build circuits on a free simulator","hi":"फ्री सिमुलेटर पर सर्किट बनाएँ"},"steps":{"en":["Open the free PhET 'Circuit Construction Kit' on a browser. Build a battery, switch and one bulb circuit.","Add a second bulb in a series loop, then try another in parallel. Remove one bulb each time.","Note which bulbs stay lit and which go off, and which design suits home lighting."],"hi":["ब्राउज़र में फ्री PhET 'सर्किट कंस्ट्रक्शन किट' खोलें। बैटरी, स्विच और एक बल्ब का सर्किट बनाएँ।","सीरीज़ लूप में दूसरा बल्ब जोड़ें, फिर पैरेलल में जोड़कर देखें। हर बार एक बल्ब हटाएँ।","लिखें कि कौन-से बल्ब जलते रहे और कौन-से बुझे, और घर की लाइटिंग के लिए कौन-सा तरीका ठीक है।"]},"result":{"en":"You will understand why house lights are wired side by side, with no risk from real electricity.","hi":"आपको समझ आएगा कि घर की लाइटें अलग-अलग क्यों जोड़ी जाती हैं, और असली बिजली का कोई खतरा भी नहीं होगा।"},"time":"30 min","cost":"Free"},"g":["machines","science"]},{"id":"c228","s":"trades","p":917,"n":{"en":"E-Waste Collector","hi":"ई-कचरा संग्रहकर्ता"},"w":{"en":"Collects old phones, chargers and other electronic junk and sorts it so it can be safely recycled, not thrown away.","hi":"ई-कचरा संग्रहकर्ता पुराने फ़ोन, चार्जर और दूसरा इलेक्ट्रॉनिक कचरा इकट्ठा करके छाँटता है, ताकि उसे सुरक्षित रीसायकल किया जा सके, फेंका न जाए।"},"t":{"title":{"en":"Run an e-waste survey at home","hi":"घर में ई-कचरे का सर्वे करें"},"steps":{"en":["Search your home for old chargers, cables, remotes, dead batteries and broken gadgets. Don't open anything.","Sort them into three piles: still works, can be repaired, can't be used. Count items in each pile.","Make a table in a notebook or Google Sheets and ask family how they'd hand over the last pile to an authorised collector."],"hi":["घर में पुराने चार्जर, केबल, रिमोट, खत्म बैटरी और टूटे गैजेट ढूँढें। कुछ भी खोलें नहीं।","तीन ढेर बनाएँ: चल रहा है, ठीक हो सकता है, बेकार। हर ढेर की चीज़ें गिनें।","कॉपी या गूगल शीट में तालिका बनाएँ और घरवालों से पूछें कि आख़िरी ढेर किसी अधिकृत कलेक्टर को कैसे देंगे।"]},"result":{"en":"You will have a count of your home's e-waste and a plan for handing it over safely.","hi":"आपके पास घर के ई-कचरे की गिनती होगी और उसे सुरक्षित तरीके से देने की योजना भी।"},"time":"30 min","cost":"Free"},"g":["nature","service"]},{"id":"c229","s":"trades","p":919,"n":{"en":"Field Technician (Other Home Appliances)","hi":"फील्ड तकनीशियन (अन्य घरेलू उपकरण)"},"w":{"en":"Visits homes to find faults in appliances like coolers, mixers or irons, repairs them, and explains the problem to the customer.","hi":"फील्ड तकनीशियन घरों में जाकर कूलर, मिक्सर या प्रेस जैसे उपकरणों की खराबी ढूँढता है, उन्हें ठीक करता है और ग्राहक को समस्या समझाता है।"},"t":{"title":{"en":"Make a fix card from a manual","hi":"मैनुअल से 'फ़िक्स कार्ड' बनाएँ"},"steps":{"en":["Pick one home appliance and find its manual or label. Read the troubleshooting or care section, without plugging in or opening it.","Make a one-page card listing three common problems, likely causes, and what to check first.","Role-play a service visit: a family member describes a problem and you ask questions using your card."],"hi":["घर का कोई एक उपकरण चुनें और उसका मैनुअल या लेबल ढूँढें। बिना चालू किए या खोले उसका समस्या-समाधान वाला हिस्सा पढ़ें।","एक पेज का कार्ड बनाएँ जिसमें तीन आम समस्याएँ, उनके संभावित कारण और पहले क्या जाँचें, लिखा हो।","सर्विस विज़िट का रोल-प्ले करें: घर का कोई सदस्य समस्या बताए और आप कार्ड से सवाल पूछें।"]},"result":{"en":"You will have a handy fix card and know if solving a customer's problem feels exciting.","hi":"आपके पास काम का फ़िक्स कार्ड होगा और पता चलेगा कि ग्राहक की समस्या सुलझाना आपको रोमांचक लगता है या नहीं।"},"time":"45 min","cost":"Free"},"g":["machines","people"]},{"id":"c230","s":"trades","p":921,"n":{"en":"Fitter (Electrical and Electronic Assembly)","hi":"फिटर (इलेक्ट्रिकल और इलेक्ट्रॉनिक असेंबली)"},"w":{"en":"Assembles electrical and electronic parts by cutting, fitting and connecting wires and components exactly as the wiring diagram shows.","hi":"फिटर (इलेक्ट्रिकल और इलेक्ट्रॉनिक असेंबली) वायरिंग डायग्राम के अनुसार तारों और पुर्ज़ों को काटकर, फिट करके और जोड़कर बिजली-इलेक्ट्रॉनिक सामान असेंबल करता है।"},"t":{"title":{"en":"Make a mock wire harness","hi":"नकली वायर हार्नेस बनाएँ"},"steps":{"en":["Take four colours of thread or wool. Write a chart: red 20 cm, blue 25 cm, green 15 cm, yellow 30 cm.","Measure and cut each thread exactly, then tie a small paper tag with its name at both ends.","Bundle them neatly with tape and check every piece against your chart."],"hi":["चार रंगों के धागे या ऊन लें। चार्ट लिखें: लाल 20 सेमी, नीला 25 सेमी, हरा 15 सेमी, पीला 30 सेमी।","हर धागा ठीक नाप से काटें और दोनों सिरों पर नाम वाली छोटी पर्ची बाँधें।","सबको टेप से सलीके से बाँधें और हर धागे को चार्ट से मिलाकर जाँचें।"]},"result":{"en":"You will have a neat labelled harness and know if exact, careful work suits you.","hi":"आपके पास नाम लगा हुआ सलीकेदार हार्नेस होगा और पता चलेगा कि सटीक, ध्यान वाला काम आपको जँचता है या नहीं।"},"time":"30 min","cost":"Free"},"g":["machines","build"]},{"id":"c231","s":"trades","p":923,"n":{"en":"Fitter (Fabrication)","hi":"फिटर (फैब्रिकेशन)"},"w":{"en":"Marks, cuts, shapes and joins metal sheets and sections to build frames, tanks and structures from a drawing.","hi":"फिटर (फैब्रिकेशन) ड्रॉइंग देखकर धातु की चादरों और सेक्शनों पर निशान लगाता, उन्हें काटता, मोड़ता और जोड़कर फ्रेम, टंकी और ढाँचे बनाता है।"},"t":{"title":{"en":"Fabricate a cardboard pen stand","hi":"गत्ते का पेन स्टैंड बनाएँ"},"steps":{"en":["Sketch a pen stand with sizes. Mark every piece on cardboard with a ruler and pencil before cutting.","Cut the pieces with blunt scissors, then measure each. Aim to stay within 2 mm of your drawing.","Join the pieces with glue or tape, and check that the stand is square and stands steady."],"hi":["नाप के साथ पेन स्टैंड का स्केच बनाएँ। काटने से पहले स्केल और पेंसिल से हर टुकड़े पर गत्ते में निशान लगाएँ।","कुंद कैंची से टुकड़े काटें और हर एक को नापें। कोशिश करें कि ड्रॉइंग से सिर्फ़ 2 मिमी का फ़र्क रहे।","टुकड़ों को गोंद या टेप से जोड़ें और जाँचें कि स्टैंड सीधा है और मज़बूती से खड़ा है।"]},"result":{"en":"You will have a working pen stand made from your own drawing.","hi":"आपके पास अपनी ड्रॉइंग से बना, काम करने वाला पेन स्टैंड होगा।"},"time":"1 hour","cost":"Free"},"g":["build","machines"]},{"id":"c232","s":"trades","p":925,"n":{"en":"Fitter (Mechanical Assembly)","hi":"फिटर (मैकेनिकल असेंबली)"},"w":{"en":"Fits together machine parts like gears, shafts, springs and bearings in the right order so the machine runs smoothly.","hi":"फिटर (मैकेनिकल असेंबली) गियर, शाफ्ट, स्प्रिंग और बेयरिंग जैसे मशीन के पुर्ज़ों को सही क्रम में जोड़ता है ताकि मशीन आसानी से चले।"},"t":{"title":{"en":"Disassemble and rebuild a click pen","hi":"क्लिक पेन खोलकर दोबारा जोड़ें"},"steps":{"en":["Take an old click pen. Open it gently over a tray so the spring doesn't fly. Lay parts in order on paper.","Draw each part and number the order you removed it. Notice what each part does.","Rebuild it using your numbers in reverse and test that the click and refill work."],"hi":["एक पुराना क्लिक पेन लें। ट्रे के ऊपर धीरे से खोलें ताकि स्प्रिंग उछले नहीं। पुर्ज़े कागज़ पर क्रम से रखें।","हर पुर्ज़े का चित्र बनाएँ और जिस क्रम में हटाया उसके नंबर लिखें। देखें हर पुर्ज़ा क्या काम करता है।","नंबरों के उलटे क्रम से उसे दोबारा जोड़ें और जाँचें कि क्लिक और रिफ़िल ठीक चल रहे हैं।"]},"result":{"en":"You will have a working pen again and know if taking apart and fitting machines excites you.","hi":"आपका पेन दोबारा चलेगा और पता चलेगा कि मशीन खोलना-जोड़ना आपको अच्छा लगता है या नहीं।"},"time":"30 min","cost":"Free"},"g":["machines","build"]},{"id":"c233","s":"trades","p":927,"n":{"en":"Fitter (Processing)","hi":"फिटर (प्रोसेसिंग)"},"w":{"en":"Installs, adjusts and maintains pipes, valves and pumps in process plants so liquids and gases flow safely.","hi":"फिटर (प्रोसेसिंग) प्रोसेस प्लांट में पाइप, वाल्व और पंप लगाता, सेट करता और उनकी देखभाल करता है, ताकि तरल और गैस सुरक्षित तरीके से बहें।"},"t":{"title":{"en":"Test a siphon with a valve","hi":"वाल्व के साथ साइफ़न का टेस्ट करें"},"steps":{"en":["Place a full jug higher than an empty one. Fill a clear tube (about ₹50) with water, pinch both ends, and put the ends in the two vessels.","Release and watch the water flow. Pinch the tube to act as a valve and stop or slow it.","Time how long one cup takes to move at two different heights and write both times."],"hi":["भरा जग खाली जग से ऊपर रखें। एक पारदर्शी नली (करीब ₹50) पानी से भरें, दोनों सिरे दबाएँ और सिरे दोनों बर्तनों में डालें।","सिरे छोड़कर पानी का बहना देखें। नली दबाकर उसे वाल्व की तरह इस्तेमाल करें और बहाव रोकें या धीमा करें।","दो अलग ऊँचाइयों पर एक कप पानी जाने में कितना समय लगा, दोनों समय लिखें।"]},"result":{"en":"You will see how height and a valve control flow, the idea behind plant pipework.","hi":"आप देखेंगे कि ऊँचाई और वाल्व बहाव को कैसे काबू करते हैं, यही प्लांट की पाइपिंग का आधार है।"},"time":"30 min","cost":"Under ₹100"},"g":["machines","science"]},{"id":"c234","s":"trades","p":929,"n":{"en":"Food and Beverage Service Manager","hi":"खाद्य एवं पेय सेवा प्रबंधक"},"w":{"en":"Runs a restaurant or cafe's service: plans menus, leads the serving staff, looks after customers and keeps standards high.","hi":"खाद्य एवं पेय सेवा प्रबंधक रेस्तराँ या कैफ़े की सर्विस चलाता है: मेनू बनाता है, वेटर टीम को संभालता है, ग्राहकों का ध्यान रखता है और क्वालिटी बनाए रखता है।"},"t":{"title":{"en":"Run a mini home cafe","hi":"घर में मिनी कैफ़े चलाएँ"},"steps":{"en":["Design a menu of five items with prices on paper or free Canva. Add one special of the day.","Set up a table and have family order. Take each order on a small pad and serve politely.","Tally orders and total the bill. Ask guests one thing to improve."],"hi":["कागज़ या फ्री कैनवा पर पाँच चीज़ों का दाम सहित मेनू बनाएँ। एक 'आज का स्पेशल' जोड़ें।","मेज़ सजाएँ और घरवालों से ऑर्डर करवाएँ। छोटी पैड पर ऑर्डर लिखें और विनम्रता से परोसें।","ऑर्डर गिनें और बिल का जोड़ निकालें। मेहमानों से पूछें कि एक चीज़ कैसे बेहतर हो सकती है।"]},"result":{"en":"You will have run a tiny cafe service and know if looking after guests feels fun.","hi":"आपने एक छोटा कैफ़े चलाया होगा और पता चलेगा कि मेहमानों की देखभाल करना आपको अच्छा लगता है या नहीं।"},"time":"1 hour","cost":"Free"},"g":["food","people","money"]},{"id":"c235","s":"trades","p":931,"n":{"en":"General Housekeeper","hi":"जनरल हाउसकीपर"},"w":{"en":"Keeps homes, hotels or offices clean and tidy by cleaning rooms, changing linen and arranging things neatly.","hi":"जनरल हाउसकीपर घरों, होटलों या दफ़्तरों को कमरों की सफ़ाई, चादरें बदलकर और सामान सलीके से रखकर साफ़ और सजा-सँवरा रखता है।"},"t":{"title":{"en":"Clean and reset one shelf in 15 minutes","hi":"15 मिनट में एक अलमारी साफ़ करके सजाएँ"},"steps":{"en":["Pick one shelf or desk. Write a cleaning order from top to bottom: remove items, dust, wipe, put back.","Set a timer and follow your list, grouping similar items together.","Check it like an inspector: any dust, crooked item or missed spot? Fix it."],"hi":["कोई एक शेल्फ़ या मेज़ चुनें। ऊपर से नीचे सफ़ाई का क्रम लिखें: सामान हटाएँ, धूल झाड़ें, पोंछें, वापस रखें।","टाइमर लगाएँ और अपनी सूची के अनुसार काम करें, एक जैसी चीज़ें साथ रखें।","इंस्पेक्टर की तरह जाँचें: कहीं धूल, टेढ़ा सामान या छूटी जगह तो नहीं? ठीक करें।"]},"result":{"en":"You will have a neat shelf and a cleaning checklist you can reuse.","hi":"आपके पास साफ़ शेल्फ़ और दोबारा काम आने वाली सफ़ाई की सूची होगी।"},"time":"15 min","cost":"Free"},"g":["service","health"]},{"id":"c236","s":"trades","p":933,"n":{"en":"Helper (Carpenter)","hi":"हेल्पर (बढ़ई)"},"w":{"en":"Assists a carpenter by measuring, marking, sanding and holding wood, and fetching tools while furniture or doors are being made.","hi":"हेल्पर (बढ़ई) फ़र्नीचर या दरवाज़े बनते समय लकड़ी को नापने, निशान लगाने, घिसने और पकड़ने में और औज़ार लाने में बढ़ई की मदद करता है।"},"t":{"title":{"en":"Build a square frame from sticks","hi":"डंडियों से चौकोर फ्रेम बनाएँ"},"steps":{"en":["Take four ice-cream sticks. Measure and pencil-mark where two sticks overlap at each corner.","Glue the corners together. Use a corner of folded paper as a try-square.","Measure both diagonals after gluing. If they are equal, your frame is truly square."],"hi":["आइसक्रीम की चार डंडियाँ लें। नापकर पेंसिल से निशान लगाएँ कि हर कोने पर दो डंडियाँ कहाँ मिलेंगी।","कोनों को गोंद से जोड़ें। मुड़े कागज़ के कोने को सेट-स्क्वायर की तरह इस्तेमाल करें।","जुड़ने के बाद दोनों विकर्ण नापें। अगर बराबर हों तो आपका फ्रेम सचमुच चौकोर है।"]},"result":{"en":"You will have a square frame and have learned how carpenters check right angles.","hi":"आपके पास चौकोर फ्रेम होगा और आप जानेंगे कि बढ़ई सही कोण कैसे जाँचते हैं।"},"time":"30 min","cost":"Under ₹100"},"g":["build"]},{"id":"c237","s":"trades","p":935,"n":{"en":"Helper (Fabrication)","hi":"हेल्पर फेब्रिकेशन"},"w":{"en":"Helps fabricators by carrying and holding metal pieces, marking and cleaning them, and keeping tools and the workspace ready and safe.","hi":"हेल्पर फेब्रिकेशन फैब्रिकेटर की मदद के लिए धातु के टुकड़े उठाता और पकड़ता है, निशान लगाता और साफ़ करता है, और औज़ार तथा कामकाज की जगह तैयार और सुरक्षित रखता है।"},"t":{"title":{"en":"Test which bracket holds the most","hi":"टेस्ट करें कौन-सा ब्रैकेट ज़्यादा भार सँभालता है"},"steps":{"en":["Cut three equal cardboard strips and fold them into an L, a U and a flat strip. Prop each across two books.","Add coins one by one on each shape. Count how many coins each holds before it bends.","Write which shape was strongest and guess why folding makes it stiffer."],"hi":["गत्ते की तीन बराबर पट्टियाँ काटें और उन्हें L, U और सीधी पट्टी के आकार में मोड़ें। हर एक को दो किताबों के बीच टिकाएँ।","हर आकार पर एक-एक सिक्का रखें। गिनें कि झुकने से पहले कितने सिक्के सँभले।","लिखें कि कौन-सा आकार सबसे मज़बूत रहा और अंदाज़ा लगाएँ कि मोड़ने से वह अकड़ा क्यों होता है।"]},"result":{"en":"You will know why metal parts are bent into shapes to make them strong.","hi":"आप समझेंगे कि धातु के पुर्ज़ों को मज़बूती के लिए खास आकार में क्यों मोड़ा जाता है।"},"time":"30 min","cost":"Free"},"g":["build","science"]},{"id":"c238","s":"trades","p":937,"n":{"en":"Home Delivery Boy","hi":"होम डिलीवरी बॉय"},"w":{"en":"Picks up orders and delivers them to customers' doors on time, finding the best route and being polite and careful with each parcel.","hi":"होम डिलीवरी बॉय ऑर्डर उठाकर ग्राहकों के दरवाज़े तक समय पर पहुँचाता है, सबसे अच्छा रास्ता ढूँढता है और हर पार्सल का ध्यान रखता है।"},"t":{"title":{"en":"Plan the shortest route for 5 drops","hi":"5 डिलीवरी का सबसे छोटा रास्ता तय करें"},"steps":{"en":["On Google Maps, pick a start point and five landmarks in your area as 'delivery addresses'. Don't go there.","Try three different visiting orders and note the total distance of each from the app.","Choose the shortest route and write the order in a table with the distance."],"hi":["गूगल मैप्स पर शुरुआती जगह और अपने इलाके की पाँच मशहूर जगहें 'डिलीवरी पते' मानकर चुनें। वहाँ जाना नहीं है।","तीन अलग क्रम आज़माएँ और ऐप से हर क्रम की कुल दूरी लिखें।","सबसे छोटा रास्ता चुनें और क्रम व दूरी तालिका में लिखें।"]},"result":{"en":"You will have a best route and see how smart planning saves time.","hi":"आपके पास सबसे अच्छा रास्ता होगा और दिखेगा कि सोच-समझकर योजना बनाने से समय बचता है।"},"time":"30 min","cost":"Free"},"g":["travel","numbers"]},{"id":"c239","s":"trades","p":939,"n":{"en":"Home Cook","hi":"होम कुक"},"w":{"en":"Cooks everyday meals in people's homes, planning what to make, preparing ingredients hygienically and serving tasty, healthy food on time.","hi":"होम कुक लोगों के घरों में रोज़ का खाना बनाता है, क्या बनाना है तय करता है, सामग्री साफ़-सफ़ाई से तैयार करता है और स्वादिष्ट व सेहतमंद खाना समय पर परोसता है।"},"t":{"title":{"en":"Make a no-cook snack and write the recipe","hi":"बिना पकाए नाश्ता बनाएँ और रेसिपी लिखें"},"steps":{"en":["Wash your hands. Pick a no-flame snack such as bhel, a chutney sandwich or fruit chaat, and measure ingredients in spoons.","Prepare it with an adult nearby for any cutting. Write the steps as you go.","Serve it to family, then note their feedback and one change for next time."],"hi":["हाथ धोएँ। बिना आग का नाश्ता चुनें, जैसे भेल, चटनी सैंडविच या फल चाट, और सामग्री चम्मच से नापें।","कुछ भी काटते समय किसी बड़े को पास रखें। बनाते हुए कदम लिखते जाएँ।","घरवालों को परोसें, फिर उनकी राय और अगली बार के लिए एक बदलाव लिखें।"]},"result":{"en":"You will have a tested recipe and know if feeding people makes you happy.","hi":"आपके पास आज़माई हुई रेसिपी होगी और पता चलेगा कि लोगों को खिलाकर आपको खुशी मिलती है या नहीं।"},"time":"45 min","cost":"Under ₹100"},"g":["food","service"]},{"id":"c240","s":"trades","p":941,"n":{"en":"Housekeeping Attendant (Manual Cleaning)","hi":"हाउसकीपिंग अटेंडेंट (मैनुअल क्लीनिंग)"},"w":{"en":"Cleans rooms and common areas by hand, making beds, wiping, sweeping and mopping so that places are hygienic and ready for guests.","hi":"हाउसकीपिंग अटेंडेंट कमरों और साझा जगहों को हाथ से साफ़ करता है, बिस्तर लगाता, पोंछता, झाड़ू-पोछा करता है ताकि जगहें स्वच्छ और मेहमानों के लिए तैयार रहें।"},"t":{"title":{"en":"Make a hotel-style bed against the clock","hi":"घड़ी देखकर होटल जैसा बिस्तर लगाएँ"},"steps":{"en":["Strip a bed. Spread the bottom sheet tight and tuck in the corners in a neat fold.","Lay the top sheet and blanket, fold the edge back, and fit the pillows neatly.","Time yourself, then ask someone to check for wrinkles. Try again to beat your time."],"hi":["बिस्तर से चादर हटाएँ। नीचे की चादर कसकर बिछाएँ और कोनों को सलीके से मोड़कर दबाएँ।","ऊपर की चादर और कंबल बिछाएँ, किनारा मोड़ें और तकिए सलीके से लगाएँ।","समय देखें, फिर किसी से सिलवटें जँचवाएँ। अपना समय तोड़ने के लिए फिर कोशिश करें।"]},"result":{"en":"You will have a neat bed, your own timing, and a sense of the speed and care this work needs.","hi":"आपके पास सलीकेदार बिस्तर और अपना समय होगा, और समझ आएगा कि इस काम में कितनी फुर्ती और सावधानी चाहिए।"},"time":"15 min","cost":"Free"},"g":["service","health"]},{"id":"c241","s":"trades","p":943,"n":{"en":"Industrial Production Worker (Food Processing)","hi":"औद्योगिक उत्पादन कार्यकर्ता (खाद्य प्रसंस्करण)"},"w":{"en":"Works in a food factory, sorting, cleaning, cooking, weighing and packing food on a line while following strict hygiene and quality rules.","hi":"औद्योगिक उत्पादन कार्यकर्ता (खाद्य प्रसंस्करण) खाने की फ़ैक्टरी में लाइन पर खाना छाँटता, साफ़ करता, पकाता, तौलता और पैक करता है और सख्त साफ़-सफ़ाई व क्वालिटी नियम मानता है।"},"t":{"title":{"en":"Pack five equal bags like a factory line","hi":"फ़ैक्टरी लाइन की तरह पाँच बराबर पैकेट भरें"},"steps":{"en":["Wash your hands and tie your hair back. Set out dal or rice, a cup, five clean bags and a pen.","Sort out stones or bad grains, then fill each bag with the same level cup measures.","Seal and label each bag with the name and date. Compare them and fix any that look uneven."],"hi":["हाथ धोएँ और बाल बाँध लें। दाल या चावल, एक कटोरी, पाँच साफ़ थैलियाँ और पेन तैयार रखें।","कंकड़ या खराब दाने छाँट लें, फिर हर थैली में कटोरी भर-भरकर बराबर मात्रा डालें।","हर थैली बंद करके उस पर नाम और तारीख लिखें। उन्हें मिलाएँ और जो असमान लगे उसे ठीक करें।"]},"result":{"en":"You will have five matching labelled packs and know how repeat packing work feels.","hi":"आपके पास पाँच एक जैसे लेबल लगे पैकेट होंगे और पता चलेगा कि बार-बार दोहराने वाला पैकिंग का काम कैसा लगता है।"},"time":"30 min","cost":"Free"},"g":["food","numbers"]},{"id":"c242","s":"trades","p":945,"n":{"en":"Installer - Frameless Glass Doors/Windows","hi":"इंस्टॉलर – फ्रेमलेस ग्लास डोर्स/विंडोज"},"w":{"en":"Measures openings and fits frameless glass doors and windows, using fittings and careful levelling so they sit straight and safe.","hi":"फ्रेमलेस ग्लास डोर्स/विंडोज इंस्टॉलर खुली जगह नापकर बिना फ्रेम के काँच के दरवाज़े और खिड़कियाँ लगाता है और फिटिंग व सही लेवल से उन्हें सीधा और सुरक्षित रखता है।"},"t":{"title":{"en":"Cut and fit a cardboard 'glass' panel","hi":"गत्ते का 'काँच' काटकर फिट करें"},"steps":{"en":["Measure the height and width of a cupboard door opening. Decide a 3 mm gap on each side and calculate the panel size.","Cut cardboard to that size with a ruler and blunt scissors. Do not use real glass.","Place it in the opening, check the gaps, and hang a plumb string to see if it sits straight."],"hi":["अलमारी के दरवाज़े वाली खुली जगह की ऊँचाई और चौड़ाई नापें। हर तरफ़ 3 मिमी जगह छोड़ने की सोचकर पैनल का साइज़ निकालें।","स्केल और कुंद कैंची से उस साइज़ का गत्ता काटें। असली काँच का इस्तेमाल बिल्कुल न करें।","उसे खुली जगह में रखें, गैप जाँचें और साहुल लटकाकर देखें कि वह सीधा बैठा है या नहीं।"]},"result":{"en":"You will know how fit depends on exact measurement and gap allowance.","hi":"आप समझेंगे कि सही फिटिंग सटीक नाप और गैप छोड़ने पर टिकी होती है।"},"time":"45 min","cost":"Free"},"g":["build","numbers"]},{"id":"c243","s":"trades","p":947,"n":{"en":"Jute Handloom Weaver","hi":"जूट हथकरघा बुनकर"},"w":{"en":"Weaves jute yarn on a handloom into cloth, mats, bags and home items, passing threads over and under with steady hands.","hi":"जूट हथकरघा बुनकर हथकरघे पर जूट के धागों से कपड़ा, चटाई, थैले और घर का सामान बुनता है, धागों को हाथ की स्थिरता से ऊपर-नीचे पार कराते हुए।"},"t":{"title":{"en":"Weave a mat on a cardboard loom","hi":"गत्ते के करघे पर चटाई बुनें"},"steps":{"en":["Cut small notches at the top and bottom edges of a cardboard piece. Wind string or jute twine up and down through the notches as warp.","Cut strips of old cloth or paper. Weave one strip over and under the warp, then the next strip opposite.","Push each row snug. Continue to the end and tie off, then slide it off the card."],"hi":["गत्ते के टुकड़े के ऊपर और नीचे के किनारों पर छोटे खाँचे काटें। उनमें डोरी या जूट की सुतली ऊपर-नीचे लपेटकर ताना बनाएँ।","पुराने कपड़े या कागज़ की पट्टियाँ काटें। एक पट्टी ताने के ऊपर-नीचे बुनें, अगली पट्टी उल्टे क्रम से।","हर पंक्ति को कसकर दबाएँ। अंत तक बुनें, गाँठ लगाएँ और फिर गत्ते से उतार लें।"]},"result":{"en":"You will have a small woven mat and a feel for how weaving works.","hi":"आपके पास एक छोटी बुनी हुई चटाई होगी और बुनाई कैसे होती है इसका अंदाज़ा मिलेगा।"},"time":"1 hour","cost":"Under ₹100"},"g":["art","build"]},{"id":"c244","s":"trades","p":949,"n":{"en":"Kitchen Manager","hi":"रसोईघर प्रबंधक"},"w":{"en":"Runs a kitchen by organising cooks, checking stock, ordering ingredients, keeping hygiene standards and making sure meals come out on time.","hi":"रसोईघर प्रबंधक रसोई चलाता है: रसोइयों की ड्यूटी तय करता है, स्टॉक जाँचता है, सामान मँगवाता है, साफ़-सफ़ाई के नियम निभाता है और खाना समय पर तैयार करवाता है।"},"t":{"title":{"en":"Make a kitchen stock sheet","hi":"रसोई का स्टॉक शीट बनाएँ"},"steps":{"en":["In Google Sheets or a notebook, list ten kitchen items with quantity left and 'use by' date.","Mark the ones that expire soonest as 'use first', and the ones that are low as 'buy'.","Plan three simple meals using the 'use first' items and write the shopping list."],"hi":["गूगल शीट या कॉपी में रसोई की दस चीज़ों के साथ बची मात्रा और 'इस तारीख तक इस्तेमाल करें' लिखें।","जो सबसे पहले खराब होंगी उन पर 'पहले इस्तेमाल' और जो कम बची हैं उन पर 'खरीदना है' लिखें।","'पहले इस्तेमाल' वाली चीज़ों से तीन सादे भोजन सोचें और खरीदारी की सूची लिखें।"]},"result":{"en":"You will have a stock sheet and shopping list, like a real kitchen manager's daily check.","hi":"आपके पास स्टॉक शीट और खरीदारी सूची होगी, जैसी असली रसोईघर प्रबंधक रोज़ जाँचता है।"},"time":"30 min","cost":"Free"},"g":["food","numbers"]},{"id":"c245","s":"trades","p":951,"n":{"en":"Lapidarist","hi":"लैपिडारिस्ट"},"w":{"en":"Cuts, shapes and polishes stones and gems by hand or machine so they shine and can be set in jewellery or used as decor.","hi":"लैपिडारिस्ट पत्थरों और रत्नों को हाथ या मशीन से काटता, आ
