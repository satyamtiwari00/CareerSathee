से जोड़ता है।"},"time":"45 min","cost":"Free"},"g":["service","people"]},{"id":"c117","s":"mgmt","p":687,"n":{"en":"Sales and Marketing Manager","hi":"बिक्री एवं विपणन प्रबंधक"},"w":{"en":"Finds out what customers want, promotes a product to them and leads the team that sells it.","hi":"पता लगाता है कि ग्राहक क्या चाहते हैं, उन्हें प्रोडक्ट के बारे में बताता है और उसे बेचने वाली टीम को लीड करता है।"},"t":{"title":{"en":"Make two posters and test which one sells","hi":"दो पोस्टर बनाकर परखें कि कौन सा बेहतर बिकवाता है"},"steps":{"en":["Pick a product, like homemade lemonade. Make 2 posters in free Canva with different slogans.","Show both to at least 5 people and ask which one makes them want to buy.","Count the votes, then write why you think the winner worked."],"hi":["कोई प्रोडक्ट चुनें, जैसे घर का बना नींबू पानी। फ्री Canva में अलग-अलग स्लोगन के 2 पोस्टर बनाएँ।","दोनों कम से कम 5 लोगों को दिखाएँ और पूछें कि किससे खरीदने का मन करता है।","वोट गिनें और लिखें कि आपको क्यों लगता है कि जीतने वाला पोस्टर चला।"]},"result":{"en":"You will have real feedback on your message and see how marketing is tested.","hi":"आपको अपने संदेश पर असली फीडबैक मिलेगा और समझ आएगा कि मार्केटिंग को कैसे परखा जाता है।"},"time":"45 min","cost":"Free"},"g":["money","art","people"]},{"id":"c118","s":"mgmt","p":689,"n":{"en":"Sports Agent / Manager","hi":"खेल एजेंट/प्रबंधक"},"w":{"en":"Represents athletes, helps them find teams and sponsors, negotiates deals and plans their career.","hi":"खिलाड़ियों का प्रतिनिधित्व करता है, उन्हें टीम और स्पॉन्सर दिलाने में मदद करता है, सौदे की बातचीत करता है और उनका करियर प्लान करता है।"},"t":{"title":{"en":"Create a player profile and pitch","hi":"खिलाड़ी की प्रोफाइल और पिच बनाएँ"},"steps":{"en":["Choose a friend or yourself playing a sport. Record 3 simple stats, like 5 sprint times with a phone stopwatch.","Make a one-page profile card with strengths, stats and one area to improve.","Write and say a 5-line pitch to an imaginary team on why they should pick this player."],"hi":["कोई दोस्त या खुद को चुनें जो कोई खेल खेलता हो। 3 आसान आँकड़े लिखें, जैसे फोन की स्टॉपवॉच से 5 दौड़ों का समय।","एक पेज का प्रोफाइल कार्ड बनाएँ जिसमें खूबियाँ, आँकड़े और सुधार की एक बात हो।","काल्पनिक टीम के लिए 5 लाइन की पिच लिखें और बोलकर सुनाएँ कि वे इस खिलाड़ी को क्यों चुनें।"]},"result":{"en":"You will have a profile card and a short pitch, and try the persuading side of sports.","hi":"आपके पास प्रोफाइल कार्ड और छोटी पिच होगी, और खेलों के मनाने-समझाने वाले पक्ष का अनुभव मिलेगा।"},"time":"45 min","cost":"Free"},"g":["people","money"]},{"id":"c119","s":"mgmt","p":691,"n":{"en":"Sports Equipment Manager","hi":"खेल उपकरण प्रबंधक"},"w":{"en":"Looks after a team's or school's sports gear: ordering, storing, checking condition and making sure it is ready for every practice and match.","hi":"किसी टीम या स्कूल के खेल के सामान की देखभाल करता है: मँगाना, रखना, हालत जाँचना और हर प्रैक्टिस व मैच के लिए तैयार रखना।"},"t":{"title":{"en":"Make an equipment register and issue sheet","hi":"सामान का रजिस्टर और इश्यू शीट बनाएँ"},"steps":{"en":["List the sports items you can find at home or school, such as balls, bats and ropes, with the count of each.","Add columns for condition (good, needs repair) and storage place.","Make an issue sheet: who took what, on which day, and when it was returned. Try it with a friend."],"hi":["घर या स्कूल में जो खेल का सामान मिले, जैसे गेंद, बल्ला, रस्सी, उसकी गिनती के साथ लिस्ट बनाएँ।","हालत (ठीक है, मरम्मत चाहिए) और रखने की जगह के कॉलम जोड़ें।","इश्यू शीट बनाएँ: किसने क्या, किस दिन लिया और कब लौटाया। दोस्त के साथ आज़माएँ।"]},"result":{"en":"You will have a register that shows what you have, its condition and who has it.","hi":"आपके पास ऐसा रजिस्टर होगा जो बताए कि क्या है, किस हालत में है और किसके पास है।"},"time":"30 min","cost":"Free"},"g":["numbers","service"]},{"id":"c120","s":"ops","p":695,"n":{"en":"Air Hostess / Flight Attendant","hi":"एयर होस्टेस/परिचारक"},"w":{"en":"Looks after passengers' safety and comfort on a flight, explains safety rules, serves food and helps in emergencies.","hi":"उड़ान में यात्रियों की सुरक्षा और आराम का ध्यान रखता है, सुरक्षा नियम समझाता है, खाना परोसता है और आपात स्थिति में मदद करता है।"},"t":{"title":{"en":"Run a mock cabin safety demo and service","hi":"नकली केबिन सेफ्टी डेमो और सर्विस करें"},"steps":{"en":["Set chairs in rows like a plane. Give a one-minute welcome and show how to wear a seatbelt.","Point out the exits clearly, like a real safety announcement. Speak slowly with a smile.","Serve water to your 'passengers' politely and ask if anyone needs help."],"hi":["कुर्सियों को हवाई जहाज़ की तरह कतारों में लगाएँ। एक मिनट का स्वागत करें और सीटबेल्ट लगाना दिखाएँ।","असली सेफ्टी अनाउंसमेंट की तरह निकलने के रास्ते साफ बताएँ। धीरे और मुस्कुराकर बोलें।","अपने 'यात्रियों' को विनम्रता से पानी दें और पूछें कि किसी को मदद चाहिए क्या।"]},"result":{"en":"You will know if staying calm, clear and caring in front of people feels natural to you.","hi":"आपको पता चलेगा कि लोगों के सामने शांत, साफ और प्यार से पेश आना आपको कितना स्वाभाविक लगता है।"},"time":"30 min","cost":"Free"},"g":["people","service","travel"]},{"id":"c121","s":"ops","p":697,"n":{"en":"Air Traffic Controller","hi":"हवाई यातायात नियंत्रक"},"w":{"en":"Guides pilots by radio, keeping aircraft safely apart in the sky and on the ground, and sequencing take-offs and landings.","hi":"रेडियो से पायलटों को रास्ता बताता है, आसमान और ज़मीन पर विमानों को सुरक्षित दूरी पर रखता है और टेक-ऑफ व लैंडिंग का क्रम तय करता है।"},"t":{"title":{"en":"Guide 3 coin planes to land safely","hi":"3 सिक्का-विमानों को सुरक्षित उतारें"},"steps":{"en":["Draw a runway and an airspace on paper. Place 3 coins as planes at different starting points.","Give a friend short, clear spoken instructions to move each coin, one at a time. No pointing.","Land all three one after another without any two coins crossing paths. Swap roles."],"hi":["कागज़ पर रनवे और हवाई क्षेत्र बनाएँ। 3 सिक्के विमान की तरह अलग-अलग जगह रखें।","दोस्त को छोटे और साफ बोले निर्देश दें कि हर सिक्का कैसे चले, एक बार में एक। इशारे नहीं।","तीनों को एक के बाद एक उतारें, बिना किन्हीं दो सिक्कों का रास्ता कटे। फिर भूमिकाएँ बदलें।"]},"result":{"en":"You will feel how clear words and calm focus are needed to keep many moving things safe.","hi":"आपको महसूस होगा कि कई चलती चीज़ों को सुरक्षित रखने के लिए साफ शब्द और शांत ध्यान कितना ज़रूरी है।"},"time":"30 min","cost":"Free"},"g":["machines","travel"]},{"id":"c122","s":"ops","p":699,"n":{"en":"Aircraft Pilot","hi":"एयरक्राफ्ट पायलट"},"w":{"en":"Flies aircraft safely, planning the route, checking weather and instruments, and making quick decisions during the flight.","hi":"विमान को सुरक्षित उड़ाता है, रूट प्लान करता है, मौसम और इंस्ट्रूमेंट जाँचता है और उड़ान के दौरान जल्दी फैसले लेता है।"},"t":{"title":{"en":"Test-fly paper planes and improve the design","hi":"कागज़ के विमान उड़ाकर डिज़ाइन सुधारें"},"steps":{"en":["Fold 3 different paper plane designs. Fly each one 3 times in an open room.","Measure the distance of each flight in steps and write the average in a table.","Change one thing on the best plane, like folding the wing tips, and test again."],"hi":["कागज़ के 3 अलग डिज़ाइन के विमान मोड़ें। खुले कमरे में हर एक को 3 बार उड़ाएँ।","हर उड़ान की दूरी कदमों में नापें और औसत तालिका में लिखें।","सबसे अच्छे विमान में एक चीज़ बदलें, जैसे पंखों के सिरे मोड़ना, और फिर परखें।"]},"result":{"en":"You will see how small changes affect flight and enjoy testing, measuring and improving.","hi":"आप देखेंगे कि छोटे बदलाव उड़ान पर कैसे असर डालते हैं और परखना, नापना और सुधारना कैसा लगता है।"},"time":"30 min","cost":"Free"},"g":["machines","science","travel"]},{"id":"c123","s":"ops","p":701,"n":{"en":"Airline Cargo Assistant","hi":"एयरलाइन कार्गो असिस्टेंट"},"w":{"en":"Weighs, labels, records and loads goods and parcels carried by aircraft, making sure they are packed safely and reach the right place.","hi":"विमान से जाने वाले माल और पार्सल को तौलता, लेबल लगाता, रिकॉर्ड करता और लोड करता है, ताकि वे सुरक्षित पैक हों और सही जगह पहुँचें।"},"t":{"title":{"en":"Pack a cargo box and write its manifest","hi":"कार्गो बॉक्स पैक करें और उसकी मैनिफेस्ट लिस्ट लिखें"},"steps":{"en":["Pick 8 light household items. Weigh them on a kitchen or bathroom scale, or sort as light, medium and heavy.","Make paper labels like Fragile, Heavy and This Side Up, and stick them on the right items.","Pack a box with heavy items at the bottom and write a cargo list with the item and weight."],"hi":["घर की 8 हल्की चीज़ें चुनें। किचन या बाथरूम के तराज़ू से तौलें, या हल्की, मध्यम और भारी में छाँट लें।","कागज़ के लेबल बनाएँ, जैसे नाज़ुक, भारी और यह तरफ ऊपर, और सही चीज़ों पर चिपकाएँ।","बॉक्स में भारी चीज़ें नीचे रखकर पैक करें और चीज़ व वज़न के साथ कार्गो लिस्ट लिखें।"]},"result":{"en":"You will have a packed box with a manifest and see why weight and labels matter.","hi":"आपके पास मैनिफेस्ट के साथ पैक किया हुआ बॉक्स होगा और समझ आएगा कि वज़न और लेबल क्यों ज़रूरी हैं।"},"time":"30 min","cost":"Free"},"g":["machines","numbers"]},{"id":"c124","s":"ops","p":703,"n":{"en":"Aircraft Customer Service Executive","hi":"वायुयान ग्राहक सेवा कार्यकारी"},"w":{"en":"Helps passengers at the airport counter or on call with check-in, delays, lost baggage and other problems, staying calm and helpful.","hi":"एयरपोर्ट काउंटर या कॉल पर यात्रियों की चेक-इन, देरी, खोए सामान और दूसरी परेशानियों में शांत रहकर मदद करता है।"},"t":{"title":{"en":"Role-play a lost-baggage desk","hi":"खोए सामान वाले डेस्क का रोल-प्ले करें"},"steps":{"en":["Design a simple lost-baggage form on paper with 6 questions, like name, flight, bag colour and contact number.","Ask a friend to be an upset passenger whose bag is missing. Listen, say sorry and fill the form together.","End by telling them clearly what happens next and when. Ask your friend how it felt."],"hi":["कागज़ पर 6 सवालों का सीधा सा खोए सामान का फॉर्म बनाएँ, जैसे नाम, फ्लाइट, बैग का रंग और फोन नंबर।","किसी दोस्त को परेशान यात्री बनाएँ जिसका बैग खो गया है। सुनें, अफसोस जताएँ और मिलकर फॉर्म भरें।","अंत में साफ बताएँ कि आगे क्या होगा और कब। दोस्त से पूछें कि उसे कैसा लगा।"]},"result":{"en":"You will have a useful form and know if calming a worried person feels rewarding to you.","hi":"आपके पास काम का फॉर्म होगा और पता चलेगा कि परेशान इंसान को शांत करना आपको अच्छा लगता है या नहीं।"},"time":"30 min","cost":"Free"},"g":["people","service","travel"]},{"id":"c125","s":"ops","p":705,"n":{"en":"Airline Ground Support Equipment Operator","hi":"एयरलाइन ग्राउंड सपोर्ट इक्विपमेंट ऑपरेटर"},"w":{"en":"Drives and operates vehicles like baggage tractors, stairs and loaders that service aircraft safely on the ground between flights.","hi":"यह इंसान हवाई अड्डे पर बैगेज ट्रैक्टर, सीढ़ी और लोडर जैसी गाड़ियाँ चलाकर उड़ानों के बीच विमान की ज़मीनी सेवा करता है।"},"t":{"title":{"en":"Plan a 10-minute aircraft turnaround","hi":"विमान की 10 मिनट की ग्राउंड सर्विस का प्लान बनाओ"},"steps":{"en":["Draw a simple airport apron on paper with a plane, bags area, fuel truck and stairs spots.","Use small objects as vehicles and move them in order so none blocks another.","Time yourself and fix any traffic jam until the whole turnaround fits in 10 minutes."],"hi":["कागज़ पर हवाई अड्डे का छोटा नक्शा बनाओ, जिसमें विमान, बैगेज की जगह, फ्यूल ट्रक और सीढ़ी की जगह हो।","छोटी चीज़ों को गाड़ी मानकर क्रम से चलाओ, ताकि कोई किसी का रास्ता न रोके।","समय नोट करो और जाम ठीक करो, जब तक पूरा काम 10 मिनट में न हो जाए।"]},"result":{"en":"You will have a simple turnaround plan and a feel for coordinating machines safely.","hi":"तुम्हारे पास एक छोटा ग्राउंड सर्विस प्लान होगा और मशीनों को सुरक्षित तालमेल से चलाने का अंदाज़ा होगा।"},"time":"30 min","cost":"Free"},"g":["machines","travel"]},{"id":"c126","s":"ops","p":707,"n":{"en":"Auctioneer","hi":"नीलामकर्ता"},"w":{"en":"Runs auctions by presenting items, calling out rising bids quickly and clearly, and declaring the highest bidder the buyer.","hi":"नीलामकर्ता चीज़ों को पेश करता है, बढ़ती बोलियाँ साफ़ और तेज़ आवाज़ में बोलता है और सबसे ऊँची बोली वाले को खरीदार घोषित करता है।"},"t":{"title":{"en":"Run a mini auction with family","hi":"घर वालों के साथ छोटी नीलामी करो"},"steps":{"en":["Pick 3 old items like a book or pen and give each a starting price in pretend rupees.","Give family or friends paper play money and call out bids, raising the price step by step.","Say 'going once, going twice, sold!' and note the final price for each item."],"hi":["किताब या पेन जैसी 3 पुरानी चीज़ें चुनो और हर एक की नकली रुपयों में शुरुआती कीमत रखो।","घरवालों या दोस्तों को कागज़ के नकली नोट दो और बोली लगवाओ, कीमत धीरे-धीरे बढ़ाते जाओ।","'एक बार, दो बार, बिक गया!' बोलो और हर चीज़ की आख़िरी कीमत लिख लो।"]},"result":{"en":"You will know how it feels to lead a room, speak clearly and handle quick numbers.","hi":"तुम्हें पता चलेगा कि भीड़ को सँभालना, साफ़ बोलना और तेज़ गिनती करना कैसा लगता है।"},"time":"30 min","cost":"Free"},"g":["people","money"]},{"id":"c127","s":"ops","p":709,"n":{"en":"Bartender / Mixologist","hi":"बारटेंडर/मिक्सोलोजिस्ट"},"w":{"en":"Prepares and serves drinks, creates new recipes, and keeps the bar counter clean while chatting politely with guests.","hi":"यह इंसान पेय तैयार करके परोसता है, नए रेसिपी बनाता है और मेहमानों से अच्छे से बात करते हुए काउंटर साफ़ रखता है।"},"t":{"title":{"en":"Create your own mocktail","hi":"अपना खुद का मॉकटेल बनाओ"},"steps":{"en":["Pick a base like lemon juice, a sweet like sugar or honey, and a fizz like soda or water.","Mix a small glass, taste, and adjust the amounts until the balance feels right.","Name it, write the recipe and serve it to a family member for feedback."],"hi":["बेस के लिए नींबू का रस, मीठे के लिए चीनी या शहद और सोडा या पानी चुनो।","छोटा गिलास बनाओ, चखो और मात्रा बदलते रहो जब तक स्वाद सही न लगे।","उसका नाम रखो, रेसिपी लिखो और घर के किसी सदस्य को पिलाकर राय लो।"]},"result":{"en":"You will have your own written drink recipe and know if you enjoy mixing flavours.","hi":"तुम्हारे पास अपने पेय की लिखी रेसिपी होगी और पता चलेगा कि स्वाद मिलाना तुम्हें पसंद है या नहीं।"},"time":"30 min","cost":"Free"},"g":["food","people"]},{"id":"c128","s":"ops","p":711,"n":{"en":"Bulldozer Operator","hi":"बुलडोजर ऑपरेटर"},"w":{"en":"Operates a bulldozer to clear land, push soil and level ground for roads, buildings and farms.","hi":"बुलडोज़र चलाकर ज़मीन साफ़ करता है, मिट्टी खिसकाता है और सड़क, इमारत या खेत के लिए ज़मीन समतल करता है।"},"t":{"title":{"en":"Level a sand or soil patch","hi":"रेत या मिट्टी का टुकड़ा समतल करो"},"steps":{"en":["Heap some soil or sand in a tray or on the ground and mark a target flat area with a stick.","Use a flat piece of cardboard as a blade to push the heap and level it in as few passes as possible.","Count your passes, then try again to beat your count."],"hi":["ट्रे या ज़मीन पर थोड़ी मिट्टी या रेत का ढेर लगाओ और छड़ी से समतल होने वाली जगह चिह्नित करो।","गत्ते के सपाट टुकड़े को ब्लेड मानकर ढेर को कम से कम बार धकेलकर समतल करो।","कितने बार धकेला गिनो, फिर कम बार में करने की कोशिश करो।"]},"result":{"en":"You will see how careful pushing and planning makes ground level and smooth.","hi":"तुम देखोगे कि सोच-समझकर धकेलने से ज़मीन कैसे बराबर और चिकनी होती है।"},"time":"30 min","cost":"Free"},"g":["machines","build"]},{"id":"c129","s":"ops","p":713,"n":{"en":"Cold Chain Process Management Specialist","hi":"कोल्ड चेन प्रक्रिया प्रबंधक विशेषज्ञ"},"w":{"en":"Makes sure items like vaccines, milk and fruits stay at the right cold temperature from farm or factory all the way to the customer.","hi":"यह इंसान सुनिश्चित करता है कि टीके, दूध और फल जैसी चीज़ें खेत या फैक्ट्री से ग्राहक तक सही ठंडे तापमान पर रहें।"},"t":{"title":{"en":"Test which cover keeps ice longest","hi":"देखो किस ढक्कन से बर्फ़ देर तक टिकती है"},"steps":{"en":["Put one ice cube each in 3 small containers: bare, wrapped in cloth, wrapped in newspaper.","Check every 10 minutes and note how much has melted in a table.","Decide which wrapping works best and say why."],"hi":["3 छोटे डिब्बों में एक-एक बर्फ़ का टुकड़ा रखो: खुला, कपड़े में लिपटा और अख़बार में लिपटा।","हर 10 मिनट पर देखो और टेबल में लिखो कि कितनी पिघली।","तय करो कौन-सा लपेटना सबसे अच्छा रहा और क्यों।"]},"result":{"en":"You will have a small data table showing how insulation slows warming.","hi":"तुम्हारे पास एक छोटी तालिका होगी जो दिखाएगी कि इन्सुलेशन गर्मी को कैसे धीमा करता है।"},"time":"1 hour","cost":"Free"},"g":["science","food"]},{"id":"c130","s":"ops","p":715,"n":{"en":"Commercial Vehicle Driver","hi":"व्यावसायिक वाहन चालक"},"w":{"en":"Drives trucks, buses or other commercial vehicles to carry goods or passengers safely and on time across routes.","hi":"ट्रक, बस या दूसरी व्यावसायिक गाड़ियाँ चलाकर सामान या यात्रियों को सुरक्षित और समय पर पहुँचाता है।"},"t":{"title":{"en":"Plan a delivery route on a map","hi":"नक्शे पर डिलीवरी का रास्ता तय करो"},"steps":{"en":["Open Google Maps on your phone and pick 4 nearby places to deliver to, such as shops.","Try two different visiting orders and note the total distance and time of each.","Choose the shortest route and write the stops in order."],"hi":["फ़ोन पर गूगल मैप्स खोलो और डिलीवरी के लिए पास की 4 जगहें चुनो, जैसे दुकानें।","जगहों पर जाने के दो अलग क्रम आज़माओ और हर का कुल फ़ासला और समय लिखो।","सबसे छोटा रास्ता चुनो और जगहें क्रम से लिख लो।"]},"result":{"en":"You will have a planned route and know how drivers save time and fuel.","hi":"तुम्हारे पास एक तय रूट होगा और पता चलेगा कि ड्राइवर समय और तेल कैसे बचाते हैं।"},"time":"30 min","cost":"Free"},"g":["travel","machines"]},{"id":"c131","s":"ops","p":717,"n":{"en":"Conveyor Operation and Maintenance Technician","hi":"कन्वेयर संचालन और रख-रखाव तकनीशियन"},"w":{"en":"Keeps conveyor belts in factories and warehouses running smoothly by checking, cleaning and fixing parts like belts and rollers.","hi":"फैक्ट्री और गोदाम की कन्वेयर बेल्ट को चलता रखने के लिए बेल्ट और रोलर जैसे पुर्ज़ों की जाँच, सफ़ाई और मरम्मत करता है।"},"t":{"title":{"en":"Build a paper conveyor model","hi":"कागज़ का कन्वेयर मॉडल बनाओ"},"steps":{"en":["Loop a strip of paper around two pencils or bottles placed apart to make a belt.","Rotate one pencil by hand so the belt moves and carries a small eraser along.","Check what makes it slip and fix it by changing tension or spacing."],"hi":["दो पेंसिल या बोतलें दूर-दूर रखकर उन पर कागज़ की पट्टी का छल्ला डालो, यह बेल्ट बन गई।","एक पेंसिल हाथ से घुमाओ ताकि बेल्ट चले और छोटा रबर आगे ले जाए।","देखो किस वजह से फिसलती है और कसाव या दूरी बदलकर ठीक करो।"]},"result":{"en":"You will have a working mini belt and know how to troubleshoot a simple machine.","hi":"तुम्हारे पास चलने वाली छोटी बेल्ट होगी और साधारण मशीन की गड़बड़ी ढूँढना आ जाएगा।"},"time":"30 min","cost":"Free"},"g":["machines","build"]},{"id":"c132","s":"ops","p":719,"n":{"en":"Distribution Manager","hi":"वितरण प्रबंधक"},"w":{"en":"Plans how products move from warehouses to shops and customers, managing stock, vehicles and delivery schedules.","hi":"योजना बनाता है कि सामान गोदाम से दुकानों और ग्राहकों तक कैसे पहुँचे, और स्टॉक, गाड़ियों और डिलीवरी का समय सँभालता है।"},"t":{"title":{"en":"Split stock across 3 shops in Sheets","hi":"शीट्स में 3 दुकानों में स्टॉक बाँटो"},"steps":{"en":["In Google Sheets list 3 shops with the weekly sales you imagine for 4 products.","Add a column for the stock to send so each shop gets just enough.","Change one shop's sales and see what you must redistribute."],"hi":["गूगल शीट्स में 3 दुकानें और 4 चीज़ों की सोची हुई साप्ताहिक बिक्री लिखो।","एक कॉलम जोड़ो कि कितना स्टॉक भेजना है, ताकि हर दुकान को ज़रूरत भर मिले।","एक दुकान की बिक्री बदलो और देखो स्टॉक दोबारा कैसे बाँटना पड़ेगा।"]},"result":{"en":"You will have a simple stock sheet and a sense of balancing supply with demand.","hi":"तुम्हारे पास एक सरल स्टॉक शीट होगी और माँग के हिसाब से सप्लाई संतुलित करने की समझ आएगी।"},"time":"45 min","cost":"Free"},"g":["numbers","money"]},{"id":"c133","s":"ops","p":721,"n":{"en":"Food and Beverage Manager","hi":"खाद्य और पेय प्रबंधक"},"w":{"en":"Oversees restaurant or hotel kitchens and dining areas, planning menus, controlling costs and making sure guests are happy.","hi":"रेस्तरां या होटल की रसोई और डाइनिंग देखता है, मेन्यू बनाता है, खर्च नियंत्रित करता है और मेहमानों को खुश रखता है।"},"t":{"title":{"en":"Design a 5-dish menu and cost it","hi":"5 व्यंजनों का मेन्यू बनाओ और लागत निकालो"},"steps":{"en":["Choose a theme, like a school canteen, and list 5 dishes in Canva or on paper.","Estimate the ingredient cost of each dish and set a fair selling price.","Ask 3 people to pick their favourites and note which dish is most popular."],"hi":["कैंटीन जैसी कोई थीम चुनो और कैनवा या कागज़ पर 5 व्यंजन लिखो।","हर व्यंजन की सामग्री की अंदाज़ी लागत निकालो और ठीक बिक्री कीमत रखो।","3 लोगों से पसंदीदा चुनवाओ और लिखो कौन-सा सबसे ज़्यादा पसंद आया।"]},"result":{"en":"You will have a menu with prices and a first taste of how restaurants decide what to sell.","hi":"तुम्हारे पास कीमतों वाला मेन्यू होगा और पता चलेगा कि रेस्तरां क्या बेचना है, यह कैसे तय करते हैं।"},"time":"45 min","cost":"Free"},"g":["food","money","people"]},{"id":"c134","s":"ops","p":723,"n":{"en":"Front Office Associate","hi":"फ्रंट ऑफिस एसोसिएट"},"w":{"en":"Greets visitors, answers calls, handles bookings and queries at a hotel or office desk, and is the first friendly face people meet.","hi":"होटल या दफ़्तर के डेस्क पर आने वालों का स्वागत करता है, फ़ोन उठाता है, बुकिंग और सवाल सँभालता है और लोगों को सबसे पहले मिलने वाला चेहरा होता है।"},"t":{"title":{"en":"Role-play a hotel check-in","hi":"होटल चेक-इन का रोल-प्ले करो"},"steps":{"en":["Ask a family member to be a guest with a booking, a question and one small complaint.","Greet them, note their details on paper and answer politely, solving the complaint.","Swap roles and ask them what felt friendly and what felt confusing."],"hi":["घर के किसी सदस्य को मेहमान बनाओ जिसकी बुकिंग हो, एक सवाल हो और एक छोटी शिकायत हो।","स्वागत करो, उनकी जानकारी कागज़ पर लिखो और नम्रता से जवाब देकर शिकायत सुलझाओ।","भूमिकाएँ बदलो और पूछो कि क्या अच्छा लगा और क्या उलझाने वाला था।"]},"result":{"en":"You will know if talking to guests and solving small problems feels natural to you.","hi":"तुम्हें पता चलेगा कि मेहमानों से बात करना और छोटी समस्याएँ सुलझाना तुम्हें सहज लगता है या नहीं।"},"time":"15 min","cost":"Free"},"g":["people","service"]},{"id":"c135","s":"ops","p":725,"n":{"en":"Logistics Analyst","hi":"रसद विश्लेषक"},"w":{"en":"Studies data on deliveries, stock and transport to find delays and costs, then suggests ways to make the movement of goods faster and cheaper.","hi":"डिलीवरी, स्टॉक और ट्रांसपोर्ट के आँकड़े देखकर देरी और खर्च का कारण खोजता है और सामान को तेज़ और सस्ता पहुँचाने के तरीके सुझाता है।"},"t":{"title":{"en":"Find the slow step in a delivery log","hi":"डिलीवरी लॉग में सबसे धीमा चरण ढूँढो"},"steps":{"en":["In Google Sheets, make up 10 deliveries with pickup time, dispatch time and delivery time.","Calculate the minutes spent in each step for every delivery.","Average each step and find which one causes the most delay."],"hi":["गूगल शीट्स में 10 काल्पनिक डिलीवरी बनाओ, जिनमें पिकअप, रवाना होने और पहुँचने का समय हो।","हर डिलीवरी में हर चरण के मिनट निकालो।","हर चरण का औसत निकालो और देखो सबसे ज़्यादा देरी कहाँ है।"]},"result":{"en":"You will have a small analysis pointing to the biggest bottleneck.","hi":"तुम्हारे पास एक छोटा विश्लेषण होगा जो सबसे बड़ी रुकावट दिखाएगा।"},"time":"45 min","cost":"Free"},"g":["numbers","travel"]},{"id":"c136","s":"ops","p":727,"n":{"en":"Logistics Manager","hi":"रसद प्रबंधक"},"w":{"en":"Plans and manages storage, transport and delivery of goods, coordinating drivers, warehouses and suppliers so orders arrive on time.","hi":"सामान के भंडारण, ट्रांसपोर्ट और डिलीवरी की योजना बनाता है और ड्राइवरों, गोदामों व सप्लायरों को जोड़कर ऑर्डर समय पर पहुँचवाता है।"},"t":{"title":{"en":"Plan a school event's supplies","hi":"स्कूल कार्यक्रम के सामान की योजना बनाओ"},"steps":{"en":["Imagine a school fair and list 8 things needed, like chairs, water and posters.","Write who supplies each item, how it gets there and when it must arrive.","Make a one-page timeline and spot what could go wrong."],"hi":["स्कूल मेले की कल्पना करो और 8 ज़रूरी चीज़ें लिखो, जैसे कुर्सियाँ, पानी और पोस्टर।","लिखो कि हर चीज़ कौन देगा, कैसे पहुँचेगी और कब तक आनी चाहिए।","एक पन्ने की समय-सारणी बनाओ और सोचो कहाँ गड़बड़ हो सकती है।"]},"result":{"en":"You will have a one-page logistics plan with backup ideas.","hi":"तुम्हारे पास बैकअप विचारों के साथ एक पन्ने की लॉजिस्टिक योजना होगी।"},"time":"45 min","cost":"Free"},"g":["people","numbers"]},{"id":"c137","s":"ops","p":729,"n":{"en":"Multi-Tasking Staff","hi":"मल्टी-टास्किंग स्टाफ"},"w":{"en":"Handles many small jobs in an office or hotel, like helping guests, cleaning, filing and fetching things, wherever help is needed.","hi":"दफ़्तर या होटल में कई छोटे काम सँभालता है, जैसे मेहमानों की मदद, सफ़ाई, फ़ाइलिंग और सामान लाना, जहाँ भी ज़रूरत हो।"},"t":{"title":{"en":"Juggle 5 chores in 30 minutes","hi":"30 मिनट में 5 काम निपटाओ"},"steps":{"en":["List 5 small home tasks, like tidying a shelf, watering plants and sorting papers.","Rank them by urgency, set a time for each and start a timer.","Finish what you can and note what you would do differently."],"hi":["घर के 5 छोटे काम लिखो, जैसे अलमारी जमाना, पौधों को पानी देना और कागज़ छाँटना।","ज़रूरत के हिसाब से क्रम लगाओ, हर काम का समय तय करो और टाइमर चालू करो।","जितना हो सके निपटाओ और लिखो कि अगली बार क्या अलग करोगे।"]},"result":{"en":"You will see how well you switch between tasks and keep calm under a clock.","hi":"तुम देखोगे कि काम बदलते हुए और समय के दबाव में तुम कितने शांत और व्यवस्थित रहते हो।"},"time":"30 min","cost":"Free"},"g":["service","people"]},{"id":"c138","s":"ops","p":731,"n":{"en":"Nature Guide","hi":"नेचर गाइड"},"w":{"en":"Leads visitors through forests, parks or reserves, spots plants, birds and animals, and explains how nature works while keeping people safe.","hi":"लोगों को जंगल, पार्क या अभयारण्य में घुमाता है, पौधे, पक्षी और जानवर पहचानता है और प्रकृति के बारे में समझाते हुए सबकी सुरक्षा का ध्यान रखता है।"},"t":{"title":{"en":"Run a 20-minute nature walk","hi":"20 मिनट की नेचर वॉक कराओ"},"steps":{"en":["Walk around a nearby park or your school ground and note 5 plants, birds or insects.","Take a photo or sketch of each and find its name with a free app like Google Lens.","Present your 5 finds to a friend like a guide telling a story."],"hi":["पास के पार्क या स्कूल के मैदान में घूमो और 5 पौधे, पक्षी या कीड़े नोट करो।","हर एक की फोटो या स्केच बनाओ और गूगल लेंस जैसे फ्री ऐप से नाम खोजो।","अपनी 5 खोजें किसी दोस्त को गाइड की तरह कहानी बनाकर सुनाओ।"]},"result":{"en":"You will know 5 local species and how it feels to explain nature to others.","hi":"तुम्हें अपने आसपास की 5 प्रजातियाँ पता होंगी और दूसरों को प्रकृति समझाने का अनुभव मिलेगा।"},"time":"45 min","cost":"Free"},"g":["nature","people"]},{"id":"c139","s":"ops","p":733,"n":{"en":"Office Administrator","hi":"कार्यालय प्रशासक"},"w":{"en":"Keeps an office running by organising files, schedules, supplies, meetings and records so that everyone else can do their work.","hi":"दफ़्तर चलाए रखता है, फ़ाइलें, शेड्यूल, सामान, मीटिंग और रिकॉर्ड व्यवस्थित करता है ताकि बाकी सब अपना काम कर सकें।"},"t":{"title":{"en":"Organise a messy study desk system","hi":"बिखरे पढ़ाई के सामान की व्यवस्था बनाओ"},"steps":{"en":["Collect your notes, papers and stationery and sort them into groups with labels.","Create a Google Sheets list of subjects with deadlines and submission dates.","Check after two days if you could find anything within a minute."],"hi":["अपने नोट्स, कागज़ और स्टेशनरी इकट्ठा करो और लेबल लगाकर समूहों में छाँटो।","गूगल शीट्स में विषयों की सूची बनाओ, साथ में डेडलाइन और जमा करने की तारीख लिखो।","दो दिन बाद जाँचो कि कुछ भी एक मिनट में ढूँढ पाते हो या नहीं।"]},"result":{"en":"You will have a tidy filing system and a deadline tracker.","hi":"तुम्हारे पास सुव्यवस्थित फ़ाइलिंग और डेडलाइन ट्रैकर होगा।"},"time":"45 min","cost":"Free"},"g":["service","numbers"]},{"id":"c140","s":"ops","p":735,"n":{"en":"Operations Manager","hi":"संचालन प्रबंधक"},"w":{"en":"Oversees the daily work of a company or unit, improving processes, managing teams and resources, and making sure goals are met efficiently.","hi":"किसी कंपनी या विभाग का रोज़ का काम देखता है, प्रक्रियाएँ बेहतर बनाता है, टीम और संसाधन सँभालता है और लक्ष्य कुशलता से पूरे करवाता है।"},"t":{"title":{"en":"Speed up a family chore process","hi":"घर के किसी काम की प्रक्रिया तेज़ करो"},"steps":{"en":["Pick a routine like making tea or morning getting-ready and time each step.","Find the slowest step and try reordering or doing two steps together.","Time it again and compare before and after."],"hi":["चाय बनाना या सुबह तैयार होना जैसा कोई रोज़ का काम चुनो और हर चरण का समय नापो।","सबसे धीमा चरण ढूँढो और क्रम बदलकर या दो काम साथ करके देखो।","फिर समय नापो और पहले-बाद की तुलना करो।"]},"result":{"en":"You will have before-and-after timings showing how small changes save time.","hi":"तुम्हारे पास पहले-बाद का समय होगा जो दिखाएगा कि छोटे बदलाव से समय कैसे बचता है।"},"time":"30 min","cost":"Free"},"g":["people","numbers"]},{"id":"c141","s":"ops","p":737,"n":{"en":"Package Dying Machine Operator","hi":"पैकेज डाइंग मशीन ऑपरेटर"},"w":{"en":"Runs and monitors machines that dye materials like cloth or packaging in set colours, checking quality and fixing small problems.","hi":"कपड़े या पैकेजिंग जैसी चीज़ों को तय रंगों में रंगने वाली मशीनें चलाता और देखता है, गुणवत्ता जाँचता है और छोटी गड़बड़ियाँ ठीक करता है।"},"t":{"title":{"en":"Test colour on paper with tea or turmeric","hi":"चाय या हल्दी से कागज़ पर रंग जाँचो"},"steps":{"en":["Make weak and strong tea or turmeric water and dip 3 paper or cloth strips for different times.","Dry them and line them up to see how time changes the shade.","Record the time needed for your target shade like a recipe."],"hi":["हल्की और गाढ़ी चाय या हल्दी का पानी बनाओ और कागज़ या कपड़े की 3 पट्टियाँ अलग-अलग समय डुबाओ।","उन्हें सुखाओ और साथ रखकर देखो कि समय से रंग कैसे बदला।","मनचाहे रंग के लिए ज़रूरी समय रेसिपी की तरह लिख लो।"]},"result":{"en":"You will have a colour-time chart and know how operators repeat the same shade.","hi":"तुम्हारे पास रंग और समय का चार्ट होगा और समझ आएगा कि ऑपरेटर एक जैसा रंग बार-बार कैसे लाते हैं।"},"time":"1 hour","cost":"Free"},"g":["machines","art"]},{"id":"c142","s":"ops","p":739,"n":{"en":"Port Operations Manager","hi":"बंदरगाह परिचालन प्रबंधक"},"w":{"en":"Manages how ships, cranes, containers and trucks move through a port so cargo is loaded, unloaded and shipped safely and on time.","hi":"बंदरगाह पर जहाज़, क्रेन, कंटेनर और ट्रकों की आवाजाही सँभालता है ताकि माल सुरक्षित और समय पर चढ़े, उतरे और भेजा जाए।"},"t":{"title":{"en":"Stack and schedule toy containers","hi":"खिलौना कंटेनर जमाओ और शेड्यूल बनाओ"},"steps":{"en":["Use small boxes as containers and label each with a destination and a pickup day.","Stack them so the ones leaving first are on top and easy to reach.","Make a ship arrival timetable and check that no box has to be moved twice."],"hi":["छोटे डिब्बों को कंटेनर मानो और हर पर मंज़िल और उठाने का दिन लिखो।","उन्हें ऐसे जमाओ कि जो पहले जाने हैं वे ऊपर और आसानी से निकल सकें।","जहाज़ के आने की समय-सारणी बनाओ और जाँचो कि कोई डिब्बा दो बार न हिलाना पड़े।"]},"result":{"en":"You will understand why stacking order and timing matter in busy ports.","hi":"तुम्हें समझ आएगा कि व्यस्त बंदरगाह में जमाने का क्रम और समय क्यों अहम हैं।"},"time":"30 min","cost":"Free"},"g":["travel","machines"]},{"id":"c143","s":"ops","p":741,"n":{"en":"Secretary / Personal Assistant","hi":"सचिव/निजी सहायक"},"w":{"en":"Supports a senior person by managing their calendar, calls, emails, travel plans and documents so their time is used well.","hi":"किसी बड़े अधिकारी का कैलेंडर, फ़ोन, ईमेल, यात्रा और कागज़ात सँभालकर उनका समय अच्छे से उपयोग करवाता है।"},"t":{"title":{"en":"Build a busy person's weekly schedule","hi":"किसी व्यस्त व्यक्ति का साप्ताहिक शेड्यूल बनाओ"},"steps":{"en":["Take a made-up boss with 6 meetings, a trip and two calls, some at clashing times.","Use Google Calendar or a paper grid to fix the clashes and add travel time.","Write a short polite email asking to reschedule one meeting."],"hi":["एक काल्पनिक बॉस लो जिसकी 6 मीटिंग, एक यात्रा और दो कॉल हैं, कुछ एक ही समय पर टकराती हैं।","गूगल कैलेंडर या कागज़ की ग्रिड में टकराव ठीक करो और सफ़र का समय जोड़ो।","एक मीटिंग बदलने के लिए छोटा, विनम्र ईमेल लिखो।"]},"result":{"en":"You will have a clash-free weekly schedule and a sample rescheduling email.","hi":"तुम्हारे पास बिना टकराव वाला साप्ताहिक शेड्यूल और एक नमूना ईमेल होगा।"},"time":"45 min","cost":"Free"},"g":["service","people"]},{"id":"c144","s":"ops","p":743,"n":{"en":"Wine Steward","hi":"वाइन परिचारक"},"w":{"en":"Advises guests on drinks that go with their meal, stores and serves beverages properly, and knows the menu well.","hi":"मेहमानों को उनके खाने के साथ जँचने वाले पेय सुझाता है, पेय सही तरह रखता और परोसता है और मेन्यू की अच्छी जानकारी रखता है।"},"t":{"title":{"en":"Pair juices with snacks by taste","hi":"स्वाद के हिसाब से जूस और नाश्ते की जोड़ी बनाओ"},"steps":{"en":["Take 3 non-alcoholic drinks like lemon water, buttermilk and fruit juice and 3 snacks.","Taste each snack with each drink and score the match from 1 to 5.","Write a short recommendation card for the best pairs."],"hi":["3 बिना शराब वाले पेय लो, जैसे नींबू पानी, छाछ और फलों का जूस, और 3 नाश्ते।","हर नाश्ता हर पेय के साथ चखो और जोड़ी को 1 से 5 अंक दो।","सबसे अच्छी जोड़ियों के लिए छोटा सुझाव कार्ड लिखो।"]},"result":{"en":"You will have a pairing card and know if matching flavours interests you.","hi":"तुम्हारे पास जोड़ी वाला कार्ड होगा और पता चलेगा कि स्वादों का मेल बिठाना तुम्हें रुचता है या नहीं।"},"time":"30 min","cost":"Free"},"g":["food","people"]},{"id":"c145","s":"ops","p":745,"n":{"en":"Supply Chain Manager","hi":"आपूर्ति शृंखला प्रबंधक"},"w":{"en":"Plans the whole journey of a product from raw materials to factory to shop, balancing cost, time, quality and supplier reliability.","hi":"किसी उत्पाद का कच्चे माल से फैक्ट्री और फिर दुकान तक का पूरा सफ़र तय करता है, लागत, समय, गुणवत्ता और सप्लायर के भरोसे का संतुलन बनाकर।"},"t":{"title":{"en":"Map a pencil's journey from forest to desk","hi":"पेंसिल का जंगल से डेस्क तक का सफ़र मैप करो"},"steps":{"en":["Pick a pencil or notebook and list its parts and the materials each comes from.","Draw a flow chart with boxes for each stage from raw material to shop.","Mark one stage that could be delayed and write a backup plan."],"hi":["कोई पेंसिल या कॉपी चुनो और उसके हिस्से व हर हिस्से का कच्चा माल लिखो।","कच्चे माल से दुकान तक हर चरण का एक बॉक्स बनाकर फ़्लो चार्ट बनाओ।","एक ऐसा चरण चुनो जहाँ देरी हो सकती है और उसका बैकअप प्लान लिखो।"]},"result":{"en":"You will have a supply-chain flow chart for an everyday item.","hi":"तुम्हारे पास रोज़ की किसी चीज़ का सप्लाई चेन फ़्लो चार्ट होगा।"},"time":"45 min","cost":"Free"},"g":["numbers","travel"]},{"id":"c146","s":"ops","p":747,"n":{"en":"Tour Guide","hi":"टूर गाइड"},"w":{"en":"Takes visitors around places of interest, tells stories about history and culture, answers questions and keeps the group safe and interested.","hi":"पर्यटकों को घुमाता है, इतिहास और संस्कृति की कहानियाँ सुनाता है, सवालों के जवाब देता है और समूह को सुरक्षित और उत्साहित रखता है।"},"t":{"title":{"en":"Guide your family around your locality","hi":"घर वालों को अपने मोहल्ले की सैर कराओ"},"steps":{"en":["Choose 4 spots near home, like a temple, market or old tree, and find one story for each.","Write a 2-minute script per spot with one fun fact and one question for visitors.","Lead your family on the short walk or tour it at home using photos."],"hi":["घर के पास 4 जगहें चुनो, जैसे मंदिर, बाज़ार या पुराना पेड़, और हर जगह की एक कहानी खोजो।","हर जगह के लिए 2 मिनट की स्क्रिप्ट लिखो, जिसमें एक मज़ेदार बात और पर्यटकों के लिए एक सवाल हो।","परिवार को छोटी सैर कराओ या फ़ोटो दिखाकर घर पर ही टूर दो।"]},"result":{"en":"You will have a tour script and know if storytelling to a group feels fun.","hi":"तुम्हारे पास टूर की स्क्रिप्ट होगी और पता चलेगा कि समूह को कहानी सुनाना तुम्हें मज़ेदार लगता है या नहीं।"},"time":"1 hour","cost":"Free"},"g":["travel","people"]},{"id":"c147","s":"ops","p":749,"n":{"en":"Tour Operator","hi":"टूर ऑपरेटर"},"w":{"en":"Designs and sells travel packages by arranging transport, stays, sightseeing and meals, and makes sure the trip runs smoothly.","hi":"यात्रा के पैकेज बनाता और बेचता है, जिसमें सफ़र, ठहरना, घूमना और खाना तय करता है, और यात्रा सुचारु चले यह देखता है।"},"t":{"title":{"en":"Design a 3-day trip package with budget","hi":"बजट के साथ 3 दिन का ट्रिप पैकेज बनाओ"},"steps":{"en":["Pick a destination in India and list the travel, stay, food and sightseeing for 3 days.","Add estimated costs in Google Sheets and total them for a group of 4.","Make a one-page Canva flyer to sell your package."],"hi":["भारत की कोई जगह चुनो और 3 दिन का सफ़र, ठहरना, खाना और घूमना लिखो।","गूगल शीट्स में अंदाज़ी खर्च जोड़ो और 4 लोगों के समूह का कुल निकालो।","अपना पैकेज बेचने के लिए कैनवा पर एक पन्ने का फ़्लायर बनाओ।"]},"result":{"en":"You will have a costed trip plan and a flyer to show.","hi":"तुम्हारे पास खर्च सहित ट्रिप प्लान और दिखाने के लिए फ़्लायर होगा।"},"time":"1 hour","cost":"Free"},"g":["travel","money","art"]},{"id":"c148","s":"ops","p":751,"n":{"en":"Transport Manager","hi":"परिवहन प्रबंधक"},"w":{"en":"Plans and manages fleets of vehicles and their drivers, schedules routes, controls fuel and repair costs and keeps services safe and on time.","hi":"गाड़ियों के बेड़े और ड्राइवरों की योजना बनाता है, रूट तय करता है, तेल और मरम्मत का खर्च सँभालता है और सेवा को सुरक्षित व समय पर रखता है।"},"t":{"title":{"en":"Make a school bus timetable","hi":"स्कूल बस की समय-सारणी बनाओ"},"steps":{"en":["Imagine 2 buses and 12 student stops, and place the stops on a hand-drawn map.","Split the stops between buses so each trip stays under 30 minutes.","Write a timetable with pick-up times and check that no bus is double-booked."],"hi":["2 बसें और 12 छात्र स्टॉप सोचो और हाथ से बने नक्शे पर स्टॉप दिखाओ।","स्टॉप बसों में ऐसे बाँटो कि हर फेरा 30 मिनट से कम रहे।","पिक-अप समय के साथ समय-सारणी लिखो और जाँचो कि कोई बस दो जगह एक साथ न हो।"]},"result":{"en":"You will have a working bus timetable and a taste of fleet planning.","hi":"तुम्हारे पास चलने लायक बस टाइमटेबल होगा और बेड़ा प्रबंधन का अनुभव मिलेगा।"},"time":"45 min","cost":"Free"},"g":["travel","numbers"]},{"id":"c149","s":"ops","p":753,"n":{"en":"Travel Consultant","hi":"यात्रा सलाहकार"},"w":{"en":"Helps people plan trips by suggesting places, routes, tickets and stays that match their interests, time and budget.","hi":"लोगों की रुचि, समय और बजट के हिसाब से जगहें, रूट, टिकट और ठहरने की जगह सुझाकर उनकी यात्रा की योजना बनाने में मदद करता है।"},"t":{"title":{"en":"Plan a weekend trip for a friend","hi":"किसी दोस्त के लिए वीकेंड ट्रिप प्लान करो"},"steps":{"en":["Ask a friend or relative their budget, days and interests, like food, history or nature.","Search free sites for places, travel options and rough prices matching their answers.","Present a simple day-wise plan and ask what they would change."],"hi":["किसी दोस्त या रिश्तेदार से बजट, दिन और रुचि पूछो, जैसे खाना, इतिहास या प्रकृति।","उनके जवाबों के हिसाब से मुफ़्त वेबसाइटों पर जगहें, सफ़र के विकल्प और मोटी कीमतें खोजो।","दिन के हिसाब से सरल प्लान दिखाओ और पूछो कि वे क्या बदलेंगे।"]},"result":{"en":"You will have a personalised trip plan and feedback on your advice.","hi":"तुम्हारे पास अपनी तरह का बनाया ट्रिप प्लान होगा और अपनी सलाह पर प्रतिक्रिया मिलेगी।"},"time":"1 hour","cost":"Free"},"g":["travel","people"]},{"id":"c150","s":"ops","p":755,"n":{"en":"Urban Planner","hi":"शहरी योजनाकार"},"w":{"en":"Designs how neighbourhoods and cities are laid out, deciding where roads, homes, parks, schools and markets should go so people can live well.","hi":"तय करता है कि मोहल्लों और शहरों का ढाँचा कैसा हो, यानी सड़कें, घर, पार्क, स्कूल और बाज़ार कहाँ हों ताकि लोग अच्छे से रह सकें।"},"t":{"title":{"en":"Design a mini neighbourhood on paper","hi":"कागज़ पर छोटा मोहल्ला डिज़ाइन करो"},"steps":{"en":["On a big sheet mark roads, then place 20 homes, a school, a park, a market and a bus stop.","Check that every home is within a 10-minute walk of a school and a park.","Ask someone to spot problems like noise, traffic or missing facilities and revise."],"hi":["बड़े कागज़ पर सड़कें बनाओ, फिर 20 घर, एक स्कूल, पार्क, बाज़ार और बस स्टॉप रखो।","जाँचो कि हर घर से स्कूल और पार्क 10 मिनट पैदल की दूरी पर हों।","किसी से शोर, ट्रैफ़िक या कमी वाली सुविधाएँ ढूँढवाओ और नक्शा सुधारो।"]},"result":{"en":"You will have a neighbourhood map and know if shaping spaces for people excites you.","hi":"तुम्हारे पास मोहल्ले का नक्शा होगा और पता चलेगा कि लोगों के लिए जगहें गढ़ना तुम्हें रोमांचक लगता है या नहीं।"},"time":"1 hour","cost":"Free"},"g":["build","art","people"]},{"id":"c151","s":"law","p":759,"n":{"en":"Referee / Umpire","hi":"पंच"},"w":{"en":"Enforces the rules of a sport during a match, makes fair and quick decisions and keeps the game safe and respectful.","hi":"खेल के दौरान नियम लागू करता है, निष्पक्ष और तुरंत फ़ैसले लेता है और खेल को सुरक्षित और सम्मानजनक रखता है।"},"t":{"title":{"en":"Umpire a friendly game","hi":"दोस्तों के खेल में अंपायर बनो"},"steps":{"en":["Pick a simple game like kabaddi tag or a paper-ball toss and write its 5 rules on a card.","Watch a round with friends and call fouls and points clearly, using hand signals.","Afterwards ask players if your calls felt fair and what was hard to judge."],"hi":["कबड्डी जैसा या कागज़ की गेंद फेंकने वाला सरल खेल चुनो और उसके 5 नियम कार्ड पर लिखो।","दोस्तों का एक राउंड देखो और हाथ के इशारों से फ़ाउल और अंक साफ़ बोलो।","बाद में खिलाड़ियों से पूछो कि फ़ैसले निष्पक्ष लगे या नहीं और क्या तय करना मुश्किल था।"]},"result":{"en":"You will learn how it feels to make quick fair decisions under pressure.","hi":"तुम्हें पता चलेगा कि दबाव में जल्दी और निष्पक्ष फ़ैसला लेना कैसा लगता है।"},"time":"30 min","cost":"Free"},"g":["justice","people"]},{"id":"c152","s":"law","p":761,"n":{"en":"Corporate Legal Advisor / Compliance Officer","hi":"कॉर्पोरेट कानूनी सलाहकार/अनुपालन अधिकारी"},"w":{"en":"Helps a company follow laws and rules, reviews contracts and policies, and warns the business about legal risks before they become problems.","hi":"कंपनी को कानून और नियमों का पालन करने में मदद करता है, अनुबंधों और नीतियों की जाँच करता है और समस्या बनने से पहले क़ानूनी जोखिम बताता है।"},"t":{"title":{"en":"Spot risks in a made-up club rulebook","hi":"काल्पनिक क्लब के नियमों में खतरे ढूँढो"},"steps":{"en":["Write a one-page rulebook for an imaginary school club with fees, membership and event rules.","Swap with a friend and highlight unclear or unfair lines that could cause disputes.","Rewrite those lines in plain, clear words."],"hi":["किसी काल्पनिक स्कूल क्लब के लिए फ़ीस, सदस्यता और कार्यक्रम के नियमों वाली एक पन्ने की नियमावली लिखो।","किसी दोस्त से अदला-बदली करो और अस्पष्ट या अनुचित पंक्तियाँ चिह्नित करो जिनसे झगड़ा हो सकता है।","उन पंक्तियों को सरल और साफ़ शब्दों में दोबारा लिखो।"]},"result":{"en":"You will have a clearer rulebook and know if close reading of rules appeals to you.","hi":"तुम्हारे पास ज़्यादा साफ़ नियमावली होगी और पता चलेगा कि नियमों को ध्यान से पढ़ना तुम्हें भाता है या नहीं।"},"time":"45 min","cost":"Free"},"g":["justice","money"]},{"id":"c153","s":"law","p":763,"n":{"en":"Detective","hi":"जासूस"},"w":{"en":"Investigates cases by collecting clues, interviewing people, studying records and putting facts together to find out what really happened.","hi":"सुराग इकट्ठे करके, लोगों से पूछताछ करके और रिकॉर्ड देखकर तथ्य जोड़ता है और पता लगाता है कि असल में क्या हुआ था।"},"t":{"title":{"en":"Solve a missing-snack mystery","hi":"गायब नाश्ते का रहस्य सुलझाओ"},"steps":{"en":["Set up a harmless mystery at home, like a missing biscuit, with 3 clues and 3 suspects.","Ask a friend or sibling to question suspects and note who says what and when.","Compare the statements with the clues and name the culprit with your reasons."],"hi":["घर पर कोई हानिरहित रहस्य बनाओ, जैसे गायब बिस्कुट, जिसमें 3 सुराग और 3 संदिग्ध हों।","किसी दोस्त या भाई-बहन से संदिग्धों से सवाल करवाओ और लिखो किसने क्या और कब कहा।","बयानों को सुरागों से मिलाओ और कारण सहित असली दोषी का नाम बताओ।"]},"result":{"en":"You will have a solved case file and a feel for reasoning from evidence.","hi":"तुम्हारे पास सुलझी हुई केस फ़ाइल होगी और सबूतों से तर्क करने का अनुभव मिलेगा।"},"time":"45 min","cost":"Free"},"g":["justice","science"]},{"id":"c154","s":"law","p":765,"n":{"en":"Firefighter","hi":"अग्निशामक"},"w":{"en":"Responds to fires and emergencies, rescues people, uses hoses and equipment, and teaches communities how to stay safe from fire.","hi":"आग और आपात स्थितियों में पहुँचता है, लोगों को बचाता है, पाइप और उपकरण चलाता है और समुदाय को आग से बचाव सिखाता है।"},"t":{"title":{"en":"Make a home fire escape plan","hi":"घर के लिए आग से बचने का प्लान बनाओ"},"steps":{"en":["Draw your home's floor plan and mark every door, window and two exits from each room.","Pick a safe meeting spot outside and write the plan's steps for family members.","Do a calm walk-through drill with your family and time how long it takes."],"hi":["अपने घर का नक्शा बनाओ और हर दरवाज़ा, खिड़की और हर कमरे से निकलने के दो रास्ते दिखाओ।","बाहर मिलने की सुरक्षित जगह चुनो और घरवालों के लिए प्लान के कदम लिखो।","परिवार के साथ शांति से अभ्यास करो और देखो कितना समय लगता है।"]},"result":{"en":"You will have a real escape plan and know how safety planning feels.","hi":"तुम्हारे पास सचमुच काम आने वाला बचाव प्लान होगा और सुरक्षा की योजना बनाने का अनुभव मिलेगा।"},"time":"45 min","cost":"Free"},"g":["service","health"]},{"id":"c155","s":"law","p":767,"n":{"en":"Human Rights Lawyer","hi":"मानवाधिकार वकील"},"w":{"en":"Uses the law to defend people whose basic rights are threatened, researching cases, arguing in court and speaking up for fairness.","hi":"जिन लोगों के बुनियादी अधिकार ख़तरे में हों, उनके लिए कानून की मदद से लड़ता है, मामलों पर शोध करता है, अदालत में बहस करता है और न्याय की आवाज़ उठाता है।"},"t":{"title":{"en":"Hold a 10-minute mock debate","hi":"10 मिनट की नकली बहस करो"},"steps":{"en":["Pick a fairness issue like equal access to school and write 3 points for it and 3 for the other side.","Argue one side for 2 minutes with a friend or family member judging.","Swap sides and then say which arguments felt strongest."],"hi":["बराबर स्कूल पहुँच जैसा कोई न्याय का मुद्दा चुनो और पक्ष में 3 और विपक्ष में 3 तर्क लिखो।","दोस्त या घरवाले को जज बनाकर एक पक्ष में 2 मिनट बहस करो।","पक्ष बदलो और फिर बताओ कि कौन-से तर्क सबसे मज़बूत लगे।"]},"result":{"en":"You will have practised building arguments and know if standing up for others energises you.","hi":"तुमने तर्क बनाने का अभ्यास किया होगा और पता चलेगा कि दूसरों के लिए आवाज़ उठाना तुम्हें ऊर्जा देता है या नहीं।"},"time":"30 min","cost":"Free"},"g":["justice","people"]},{"id":"c156","s":"law","p":769,"n":{"en":"International Relations Specialist","hi":"अंतर्राष्ट्रीय संबंध विशेषज्ञ"},"w":{"en":"Studies how countries deal with each other and helps them talk, negotiate and solve problems peacefully.","hi":"यह देखता है कि अलग-अलग देश आपस में कैसे बात करते हैं, और उन्हें बातचीत से समझौते तक पहुँचने में मदद करता है।"},"t":{"title":{"en":"Run a mini river-sharing negotiation","hi":"नदी के पानी के बँटवारे की मिनी बातचीत करें"},"steps":{"en":["Invent two countries that share one river. Write one need and one worry for each country on paper.","With a friend or family member, play one country each. Negotiate for 10 minutes and try to reach a deal.","Write the deal in three lines. Note what each side gave up and what it gained."],"hi":["दो काल्पनिक देश सोचें जो एक नदी साझा करते हैं। हर देश की एक ज़रूरत और एक चिंता कागज़ पर लिखें।","किसी दोस्त या घरवाले के साथ एक-एक देश बन जाएँ। 10 मिनट बात करें और समझौता करने की कोशिश करें।","समझौते को तीन लाइनों में लिखें। हर पक्ष ने क्या छोड़ा और क्या पाया, यह भी लिखें।"]},"result":{"en":"A written three-line deal and a feel for how give-and-take works in negotiation.","hi":"तीन लाइन का लिखा समझौता, और यह अनुभव कि बातचीत में देना-लेना कैसे चलता है।"},"time":"30 min","cost":"Free"},"g":["people","justice"]},{"id":"c157","s":"law","p":771,"n":{"en":"Judge","hi":"न्यायाधीश"},"w":{"en":"Listens carefully to both sides in a dispute, studies the facts and the law, and gives a fair, reasoned decision.","hi":"झगड़े में दोनों पक्षों को ध्यान से सुनता है, तथ्य और कानून देखता है, और सोच-समझकर निष्पक्ष फ़ैसला देता है।"},"t":{"title":{"en":"Write a verdict on a made-up case","hi":"एक काल्पनिक केस पर फ़ैसला लिखें"},"steps":{"en":["Write a short case: a student says a friend never returned a borrowed book; the friend says it was returned.","List the facts each side gives, and what proof could settle it, like a witness or a note.","Write your verdict in five lines with reasons. Ask yourself: would both sides feel they were heard?"],"hi":["एक छोटा केस लिखें: एक छात्र कहता है दोस्त ने किताब वापस नहीं की, दोस्त कहता है कि कर दी थी।","दोनों पक्षों की बातें लिखें, और यह भी कि कौन-सा सबूत मदद करेगा, जैसे गवाह या कोई पर्ची।","पाँच लाइनों में कारण सहित फ़ैसला लिखें। खुद से पूछें: क्या दोनों को लगेगा कि उनकी बात सुनी गई?"]},"result":{"en":"A reasoned verdict, plus a sense of how hard fair decisions can be.","hi":"कारण सहित लिखा फ़ैसला, और यह समझ कि निष्पक्ष फ़ैसला लेना कितना मुश्किल हो सकता है।"},"time":"30 min","cost":"Free"},"g":["justice","people"]},{"id":"c158","s":"law","p":773,"n":{"en":"Lawyer / Legal Officer / Advocate","hi":"वकील/विधि अधिकारी/अधिवक्ता"},"w":{"en":"Advises people on their legal rights and argues their case clearly, using facts, rules and well-prepared reasons.","hi":"लोगों को उनके कानूनी अधिकार बताता है और तथ्यों, नियमों और मज़बूत तर्कों के साथ उनका पक्ष अदालत में रखता है।"},"t":{"title":{"en":"Prepare and deliver a 2-minute argument","hi":"2 मिनट की दलील तैयार करें और बोलें"},"steps":{"en":["Pick a topic, like 'Should phones be allowed in school?' Choose one side, even if you don't agree.","Write three strong points, each with one example. Guess what the other side will say and prepare a reply.","Speak for two minutes in front of a family member and ask which point was most convincing."],"hi":["कोई विषय चुनें, जैसे 'क्या स्कूल में फ़ोन की अनुमति होनी चाहिए?' एक पक्ष लें, भले ही आप सहमत न हों।","तीन मज़बूत बातें उदाहरण सहित लिखें। सोचें कि सामने वाला क्या कहेगा और उसका जवाब तैयार रखें।","किसी घरवाले के सामने दो मिनट बोलें और पूछें कि कौन-सी बात सबसे ज़्यादा असरदार लगी।"]},"result":{"en":"A short argument you have spoken aloud, and a sense of whether you enjoy arguing a case.","hi":"एक छोटी दलील जो आपने बोलकर रखी, और यह एहसास कि दलील देना आपको पसंद है या नहीं।"},"time":"30 min","cost":"Free"},"g":["justice","people"]},{"id":"c159","s":"law","p":775,"n":{"en":"Medical Legal Advisor","hi":"चिकित्सक कानूनी सलाहकार"},"w":{"en":"Helps doctors and hospitals follow the law, such as getting patient consent and keeping records properly.","hi":"डॉक्टरों और अस्पतालों को कानून के हिसाब से काम करने में मदद करता है, जैसे मरीज़ की सहमति लेना और रिकॉर्ड सही रखना।"},"t":{"title":{"en":"Draft a patient-consent checklist","hi":"मरीज़ की सहमति की चेकलिस्ट बनाएँ"},"steps":{"en":["Imagine a clinic is about to give a child a small treatment. Write who must agree, and why.","List five things the family should be told first, like what will happen, risks and other choices.","Make a tick-box checklist on one page, in simple words that any parent could follow."],"hi":["सोचें कि एक क्लिनिक बच्चे को छोटा-सा इलाज देने वाला है। लिखें कि किसकी सहमति ज़रूरी है और क्यों।","पाँच बातें लिखें जो परिवार को पहले बतानी चाहिए, जैसे क्या होगा, जोखिम क्या हैं और दूसरे विकल्प।","एक पन्ने पर टिक-बॉक्स वाली चेकलिस्ट बनाएँ, इतनी आसान भाषा में कि कोई भी अभिभावक समझ सके।"]},"result":{"en":"A one-page consent checklist and an idea of where medicine and law meet.","hi":"एक पन्ने की सहमति चेकलिस्ट, और यह समझ कि चिकित्सा और कानून कहाँ मिलते हैं।"},"time":"30 min","cost":"Free"},"g":["justice","health"]},{"id":"c160","s":"law","p":777,"n":{"en":"Patent Lawyer","hi":"पेटेंट वकील"},"w":{"en":"Helps inventors protect new ideas by checking if they are really new and describing them precisely in legal papers.","hi":"आविष्कारकों के नए विचारों को सुरक्षित करवाता है। देखता है कि विचार सचमुच नया है या नहीं, और उसे कानूनी कागज़ों में सटीक लिखता है।"},"t":{"title":{"en":"Describe an invention and check if it is new","hi":"एक आविष्कार का वर्णन करें और जाँचें कि वह नया है या नहीं"},"steps":{"en":["Invent a small gadget idea, like a bag that shows when your water bottle is empty. Sketch it.","Search the free Google Patents website with simple keywords to see if something similar already exists.","Write one paragraph on what your idea does and what is different from what you found."],"hi":["एक छोटा गैजेट सोचें, जैसे ऐसा बैग जो बताए कि पानी की बोतल खाली है। उसका स्केच बनाएँ।","मुफ़्त वेबसाइट Google Patents पर आसान कीवर्ड डालकर देखें कि मिलता-जुलता कुछ पहले से है या नहीं।","एक पैराग्राफ़ लिखें कि आपका विचार क्या करता है और जो मिला उससे अलग क्या है।"]},"result":{"en":"A sketch plus a short written description showing what is new in your idea.","hi":"एक स्केच और छोटा विवरण, जो बताए कि आपके विचार में नया क्या है।"},"time":"45 min","cost":"Free"},"g":["justice","build"]},{"id":"c161","s":"law","p":779,"n":{"en":"Election Analyst","hi":"चुनाव विश्लेषक"},"w":{"en":"Studies voting data and surveys to explain how people vote and what results may mean, without picking sides.","hi":"वोटिंग के आँकड़ों और सर्वे को देखकर समझाता है कि लोग कैसे वोट करते हैं और नतीजों का क्या मतलब हो सकता है, बिना किसी का पक्ष लिए।"},"t":{"title":{"en":"Run a mock class-monitor poll","hi":"क्लास मॉनिटर का मॉक पोल कराएँ"},"steps":{"en":["Pick three made-up candidates for a school task, like choosing a picnic spot. Ask 15 people for their vote.","Enter the votes in Google Sheets and make a bar chart of the results.","Write two lines: who leads, and why your small sample may not match the whole school."],"hi":["किसी स्कूल के काम के लिए तीन विकल्प चुनें, जैसे पिकनिक की जगह। 15 लोगों से उनका वोट पूछें।","वोट गूगल शीट्स में डालें और नतीजों का बार चार्ट बनाएँ।","दो लाइन लिखें: कौन आगे है, और आपका छोटा सैंपल पूरे स्कूल जैसा क्यों नहीं हो सकता।"]},"result":{"en":"A bar chart of poll results and a first lesson in why sample size matters.","hi":"पोल के नतीजों का बार चार्ट, और यह पहला सबक कि सैंपल का आकार क्यों मायने रखता है।"},"time":"45 min","cost":"Free"},"g":["numbers","people"]},{"id":"c162","s":"law","p":781,"n":{"en":"Public Policy Advisor","hi":"सार्वजनिक नीति सलाहकार"},"w":{"en":"Studies a public problem, compares possible solutions and advises governments or organisations on the best plan.","hi":"किसी सार्वजनिक समस्या को समझता है, अलग-अलग हल की तुलना करता है और सरकार या संस्था को सबसे अच्छी योजना की सलाह देता है।"},"t":{"title":{"en":"Write a one-page policy memo","hi":"एक पन्ने का पॉलिसी मेमो लिखें"},"steps":{"en":["Choose a local problem, like litter near your school. Write who is affected and how.","Write three possible solutions. For each, list one benefit, one difficulty and a rough idea of who would do it.","Pick your best option and explain it in five lines, as if writing to your principal."],"hi":["अपने आसपास की कोई समस्या चुनें, जैसे स्कूल के पास कचरा। लिखें कि किस पर कैसा असर पड़ता है।","तीन संभावित हल लिखें। हर एक का एक फ़ायदा, एक मुश्किल और यह कि काम कौन करेगा, लिखें।","सबसे अच्छा विकल्प चुनें और प्रिंसिपल को लिखने के अंदाज़ में पाँच लाइन में समझाएँ।"]},"result":{"en":"A short memo recommending one solution, in your own words.","hi":"एक छोटा मेमो जिसमें आपने अपने शब्दों में एक हल सुझाया है।"},"time":"45 min","cost":"Free"},"g":["justice","people"]},{"id":"c163","s":"law","p":783,"n":{"en":"Social Worker","hi":"सामाजिक कार्यकर्ता"},"w":{"en":"Works with individuals, families and communities to understand their problems and connect them with help and support.","hi":"व्यक्तियों, परिवारों और समुदायों की परेशानियाँ समझता है और उन्हें मदद और सहारे से जोड़ता है।"},"t":{"title":{"en":"Do a listening interview on a community need","hi":"समुदाय की ज़रूरत पर सुनने वाला इंटरव्यू करें"},"steps":{"en":["With a family member beside you, ask a trusted neighbour or relative: what is one thing that would make our area better?","Listen without interrupting. Jot down their exact words and ask one gentle follow-up question.","Write three needs you heard and one small thing you could do to help."],"hi":["किसी घरवाले के साथ जाकर किसी जान-पहचान के पड़ोसी या रिश्तेदार से पूछें: हमारे इलाके में एक क्या बदलना चाहिए?","बीच में टोके बिना सुनें। उनकी बातें उन्हीं के शब्दों में लिखें और एक नरम-सा सवाल और पूछें।","तीन ज़रूरतें लिखें जो आपने सुनीं, और एक छोटा काम जो आप मदद के लिए कर सकते हैं।"]},"result":{"en":"Three real community needs in your notes and practice in listening with care.","hi":"आपके नोट्स में तीन असली ज़रूरतें, और ध्यान से सुनने का अभ्यास।"},"time":"30 min","cost":"Free"},"g":["service","people"]},{"id":"c164","s":"law","p":785,"n":{"en":"Sports Lawyer","hi":"खेल वकील"},"w":{"en":"Helps athletes, teams and sports bodies with contracts, rules and disputes, such as unfair decisions or player agreements.","hi":"खिलाड़ियों, टीमों और खेल संस्थाओं की मदद करता है, जैसे अनुबंध, नियम और विवाद, जिनमें गलत फ़ैसले या खिलाड़ी के समझौते आते हैं।"},"t":{"title":{"en":"Write a rulebook and settle a dispute","hi":"नियम-पुस्तिका लिखें और एक विवाद सुलझाएँ"},"steps":{"en":["Pick a game you play, like carrom or gully cricket. Write five clear rules, including what happens on a foul.","Invent a dispute: a player says the shot was a foul, the other disagrees. Write both sides.","Use your rules to decide the case, and fix any rule that was unclear."],"hi":["कोई खेल चुनें जो आप खेलते हैं, जैसे कैरम या गली क्रिकेट। पाँच साफ़ नियम लिखें, फ़ाउल होने पर क्या होगा, यह भी।","एक विवाद सोचें: एक खिलाड़ी कहता है शॉट फ़ाउल था, दूसरा नहीं मानता। दोनों की बात लिखें।","अपने नियमों से फ़ैसला करें, और जो नियम साफ़ नहीं था उसे सुधारें।"]},"result":{"en":"A five-rule rulebook tested on a real-looking dispute.","hi":"पाँच नियमों की पुस्तिका, जिसे एक असली जैसे विवाद पर आज़माया गया।"},"time":"30 min","cost":"Free"},"g":["justice","people"]},{"id":"c165","s":"law","p":787,"n":{"en":"Unarmed Security Guard","hi":"नि:शस्त्र सुरक्षा गार्ड"},"w":{"en":"Keeps a building or area safe by watching for risks, checking entry and exit points, and responding calmly to problems.","hi":"किसी इमारत या इलाके को सुरक्षित रखता है: खतरों पर नज़र रखता है, आने-जाने के रास्ते जाँचता है और समस्या में शांति से काम करता है।"},"t":{"title":{"en":"Do a safety walk-through of your home or school","hi":"अपने घर या स्कूल का सुरक्षा निरीक्षण करें"},"steps":{"en":["Draw a simple map of your home or school corridor. Mark all entrances and exits.","Walk through with a family member or teacher, and mark five possible risks, like a blocked exit or a dark corner.","For each risk, write one simple fix and who should be told."],"hi":["अपने घर या स्कूल के गलियारे का सरल नक्शा बनाएँ। सारे आने-जाने के रास्ते निशान लगाएँ।","किसी घरवाले या शिक्षक के साथ घूमें और पाँच संभावित खतरे चिह्नित करें, जैसे बंद रास्ता या अँधेरा कोना।","हर खतरे के लिए एक आसान उपाय और किसे बताना है, यह लिखें।"]},"result":{"en":"A marked safety map with five risks and fixes.","hi":"एक सुरक्षा नक्शा जिसमें पाँच खतरे और उनके उपाय लिखे हैं।"},"time":"45 min","cost":"Free"},"g":["service","justice"]},{"id":"c166","s":"research","p":791,"n":{"en":"Anthropologist","hi":"मानव विज्ञानी"},"w":{"en":"Studies how people live, including their customs, beliefs and traditions, by observing and talking with them respectfully.","hi":"लोगों के जीने के तरीके, यानी रीति-रिवाज, मान्यताएँ और परंपराएँ, सम्मान से देखकर और बात करके समझता है।"},"t":{"title":{"en":"Interview an elder about a family tradition","hi":"परिवार की किसी परंपरा पर बड़े से इंटरव्यू लें"},"steps":{"en":["Pick one family or festival tradition, like a special meal or ritual. Write five open questions about it.","Interview a grandparent or elder. Listen closely and note not just what they do but why.","Write a half-page 'field note' describing the tradition and what it means to your family."],"hi":["परिवार या त्योहार की कोई परंपरा चुनें, जैसे कोई खास पकवान या रस्म। उस पर पाँच खुले सवाल लिखें।","दादा-दादी या किसी बड़े का इंटरव्यू लें। ध्यान से सुनें और सिर्फ़ क्या, नहीं, बल्कि क्यों भी लिखें।","आधे पन्ने का 'फ़ील्ड नोट' लिखें कि परंपरा क्या है और आपके परिवार के लिए क्या मायने रखती है।"]},"result":{"en":"A field note on a living tradition, written like a real researcher.","hi":"एक जीवित परंपरा पर फ़ील्ड नोट, जैसा असली शोधकर्ता लिखता है।"},"time":"1 hour","cost":"Free"},"g":["people","art"]},{"id":"c167","s":"research","p":793,"n":{"en":"Archaeologist","hi":"पुरातत्ववेत्ता"},"w":{"en":"Studies objects and remains from the past to understand how people lived long ago, recording each find with great care.","hi":"पुरानी चीज़ों और अवशेषों से समझता है कि बहुत पहले लोग कैसे रहते थे, और हर खोज को बहुत सावधानी से दर्ज करता है।"},"t":{"title":{"en":"Be a detective for three old objects","hi":"तीन पुरानी चीज़ों के जासूस बनें"},"steps":{"en":["Choose three old household items, like a brass lota or an old key. Sketch each and measure it with a ruler.","For each, write what material it is, how it was used and how old you think it is.","Ask an elder to check your guesses, then note what you got right and wrong."],"hi":["घर की तीन पुरानी चीज़ें चुनें, जैसे पीतल का लोटा या पुरानी चाबी। हर एक का स्केच बनाएँ और स्केल से नापें।","हर चीज़ के बारे में लिखें कि वह किस चीज़ की बनी है, कैसे इस्तेमाल होती थी और कितनी पुरानी लगती है।","किसी बड़े से अपने अंदाज़े जँचवाएँ, फिर लिखें कि क्या सही था और क्या गलत।"]},"result":{"en":"A mini find-record for three objects, like an archaeologist's notebook.","hi":"तीन चीज़ों का छोटा खोज-रिकॉर्ड, जैसा पुरातत्ववेत्ता की नोटबुक में होता है।"},"time":"45 min","cost":"Free"},"g":["science","art"]},{"id":"c168","s":"research","p":795,"n":{"en":"Astrophysicist","hi":"खगोल भौतिकीविद्"},"w":{"en":"Uses physics and careful observation to understand stars, planets, galaxies and how the universe works.","hi":"भौतिकी और ध्यान से किए गए अवलोकन से तारों, ग्रहों, आकाशगंगाओं और ब्रह्मांड के चलने का तरीका समझता है।"},"t":{"title":{"en":"Track the Moon for three evenings","hi":"तीन शामों तक चाँद पर नज़र रखें"},"steps":{"en":["At the same time each evening, look at the Moon from the same spot. Draw its shape and mark where it is in the sky.","Repeat for three evenings. Note the time, the shape and how high it is, using your fist held at arm's length.","Compare your drawings and write one pattern you noticed in how the Moon changed."],"hi":["हर शाम एक ही समय पर एक ही जगह से चाँद देखें। उसका आकार बनाएँ और आकाश में उसकी जगह लिखें।","तीन शाम तक दोहराएँ। समय, आकार और ऊँचाई लिखें; ऊँचाई के लिए हाथ फैलाकर मुट्ठी से नापें।","अपने चित्रों की तुलना करें और एक पैटर्न लिखें जो आपने चाँद के बदलने में देखा।"]},"result":{"en":"A three-night Moon log and your first self-observed pattern in the sky.","hi":"तीन रातों का चाँद-लॉग, और आसमान में आपका खुद देखा पहला पैटर्न।"},"time":"weekend","cost":"Free"},"g":["science","nature"]},{"id":"c169","s":"research","p":797,"n":{"en":"Botanist","hi":"वनस्पतिशास्त्री"},"w":{"en":"Studies plants, how they grow, how they are different from one another and how they live in nature.","hi":"पौधों का अध्ययन करता है: वे कैसे बढ़ते हैं, एक-दूसरे से कैसे अलग हैं और प्रकृति में कैसे रहते हैं।"},"t":{"title":{"en":"Sort leaves into your own mini plant key","hi":"पत्तियों से अपनी मिनी पहचान-चाबी बनाएँ"},"steps":{"en":["Collect five fallen leaves of different plants. Do not pluck from living plants. Sketch each one and measure its length.","Look at edges, veins and shape. Sort the leaves into two groups using one clear feature.","Split each group again, and draw your sorting as a simple tree diagram."],"hi":["पाँच अलग पौधों की गिरी हुई पत्तियाँ इकट्ठी करें। जीवित पौधे से न तोड़ें। हर पत्ती का स्केच बनाएँ और लंबाई नापें।","किनारे, नसें और आकार देखें। एक साफ़ खासियत लेकर पत्तियों को दो समूहों में बाँटें।","हर समूह को फिर बाँटें, और अपनी छँटाई को एक सरल ट्री डायग्राम में बनाएँ।"]},"result":{"en":"A leaf-sorting tree diagram that can identify your five leaves.","hi":"पत्तियों की छँटाई का ट्री डायग्राम, जिससे आपकी पाँचों पत्तियाँ पहचानी जा सकें।"},"time":"45 min","cost":"Free"},"g":["nature","science"]},{"id":"c170","s":"research","p":799,"n":{"en":"Child Development Specialist","hi":"बाल विकास विशेषज्ञ"},"w":{"en":"Studies how children grow in body, mind and behaviour, and helps families and schools support them at each age.","hi":"बच्चों के शरीर, दिमाग और व्यवहार के विकास को समझता है, और परिवारों और स्कूलों को हर उम्र में उनकी मदद करने में सहयोग देता है।"},"t":{"title":{"en":"Observe a young child at play","hi":"छोटे बच्चे को खेलते हुए देखें"},"steps":{"en":["With a parent present, ask a young cousin or neighbour's child to stack blocks or sort coloured items. Do not correct them.","Watch quietly for 10 minutes. Note what they can do alone, what they find hard and how they react.","Write three observations without judging, and one game you could try next to help them learn."],"hi":["किसी बड़े की मौजूदगी में छोटे चचेरे-ममेरे भाई-बहन या पड़ोस के बच्चे से ब्लॉक जमाने या रंग छाँटने को कहें। उन्हें टोकें नहीं।","10 मिनट चुपचाप देखें। लिखें कि वह अकेले क्या कर पाता है, क्या मुश्किल लगता है और कैसे प्रतिक्रिया देता है।","बिना राय बनाए तीन बातें लिखें, और एक खेल सोचें जो अगली बार उसे सीखने में मदद करे।"]},"result":{"en":"Three careful observations of a child at play and a simple next-step idea.","hi":"बच्चे के खेल की तीन ध्यान से देखी बातें और अगला कदम सुझाने वाला एक आसान आइडिया।"},"time":"30 min","cost":"Free"},"g":["people","health"]},{"id":"c171","s":"research","p":801,"n":{"en":"Criminologist","hi":"अपराध विज्ञानी"},"w":{"en":"Studies why crimes happen and how they follow patterns, using data and reasoning to help make communities safer.","hi":"यह समझता है कि अपराध क्यों होते हैं और उनमें कैसे पैटर्न दिखते हैं, और आँकड़ों व तर्क से इलाकों को सुरक्षित बनाने में मदद करता है।"},"t":{"title":{"en":"Spot a pattern in a made-up case file","hi":"काल्पनिक केस फ़ाइल में पैटर्न ढूँढें"},"steps":{"en":["In Google Sheets, make a table of 10 made-up incidents of lost water bottles, with columns for day, time and place.","Sort and count by place and by time of day. Colour the cells that repeat the most.","Write the pattern you see and two simple ways to prevent such losses."],"hi":["गूगल शीट्स में पानी की बोतल खोने की 10 काल्पनिक घटनाओं की तालिका बनाएँ: दिन, समय और जगह के कॉलम के साथ।","जगह और समय के हिसाब से छाँटें और गिनें। जो सबसे ज़्यादा दोहराए, उन खानों को रंग दें।","जो पैटर्न दिखे वह लिखें, और ऐसे नुकसान रोकने के दो आसान तरीके भी लिखें।"]},"result":{"en":"A coloured data table, one pattern and two prevention ideas.","hi":"रंगीन डेटा तालिका, एक पैटर्न और रोकथाम के दो आइडिया।"},"time":"45 min","cost":"Free"},"g":["justice","numbers"]},{"id":"c172","s":"research","p":803,"n":{"en":"Museum Curator","hi":"संग्रहाध्यक्ष"},"w":{"en":"Chooses, cares for and displays objects in a museum, and writes labels that tell visitors the story behind each one.","hi":"संग्रहालय की चीज़ें चुनता है, उनकी देखभाल करता है, उन्हें सजाकर दिखाता है और हर चीज़ की कहानी बताने वाले लेबल लिखता है।"},"t":{"title":{"en":"Set up a five-object home museum","hi":"घर में पाँच चीज़ों का संग्रहालय सजाएँ"},"steps":{"en":["Choose a theme, like 'Things from my childhood'. Pick five objects that fit it from around your home.","Write a label of up to 30 words for each, saying what it is and why it matters.","Arrange them on a table in a story order, and show the museum to your family."],"hi":["कोई थीम चुनें, जैसे 'मेरे बचपन की चीज़ें'। घर में से पाँच चीज़ें चुनें जो उस पर फिट बैठें।","हर चीज़ के लिए 30 शब्द तक का लेबल लिखें कि वह क्या है और क्यों खास है।","उन्हें मेज़ पर कहानी के क्रम में सजाएँ और अपने परिवार को अपना संग्रहालय दिखाएँ।"]},"result":{"en":"A small themed museum with written labels, ready for visitors.","hi":"लेबल के साथ एक छोटा थीम वाला संग्रहालय, जो आने वालों के लिए तैयार है।"},"time":"45 min","cost":"Free"},"g":["art","people"]},{"id":"c173","s":"research","p":805,"n":{"en":"Cytologist / Cell Technologist","hi":"कोशिका विज्ञानी/कोशिका प्रौद्योगिकीविद्"},"w":{"en":"Examines cells under a microscope to understand how they look and work, and to spot anything unusual.","hi":"माइक्रोस्कोप से कोशिकाओं को देखकर समझता है कि वे कैसी दिखती हैं और कैसे काम करती हैं, और कुछ असामान्य हो तो पकड़ता है।"},"t":{"title":{"en":"Look at onion cells with a phone","hi":"फ़ोन से प्याज़ की कोशिकाएँ देखें"},"steps":{"en":["Ask an adult to separate a thin, clear layer from an onion. Lay it flat on clear tape stuck on card.","Put a small clean water drop over it as a lens, or use a cheap magnifier, and zoom in with your phone camera.","Take a photo and sketch the brick-like cells you can see. Count how many fit in one row."],"hi":["किसी बड़े से प्याज़ की पतली, पारदर्शी परत अलग करवाएँ। उसे कार्ड पर चिपके साफ़ टेप पर सीधा रखें।","उसके ऊपर पानी की छोटी साफ़ बूँद लेंस की तरह रखें, या सस्ता आवर्धक काँच लें, और फ़ोन कैमरे से ज़ूम करें।","फ़ोटो लें और ईंट जैसी दिखती कोशिकाओं का स्केच बनाएँ। एक पंक्ति में कितनी आती हैं, गिनें।"]},"result":{"en":"A photo and sketch of real plant cells that you saw yourself.","hi":"पौधे की असली कोशिकाओं की फ़ोटो और स्केच, जो आपने खुद देखीं।"},"time":"30 min","cost":"Free"},"g":["science","health"]},{"id":"c174","s":"research","p":807,"n":{"en":"Data Collector / Field Survey Enumerator","hi":"डेटा संग्रहकर्ता या क्षेत्र सर्वेक्षण प्रगणक"},"w":{"en":"Goes out and collects facts and answers from people in a planned, careful way so that researchers can count and study them.","hi":"योजना बनाकर और सावधानी से लोगों से जानकारी और जवाब इकट्ठा करता है, ताकि शोधकर्ता उन्हें गिन और समझ सकें।"},"t":{"title":{"en":"Run a 4-question survey and tally it","hi":"4 सवालों का सर्वे करें और गिनती करें"},"steps":{"en":["Write four simple, clear questions, such as 'How do you travel to school?' Make a paper form with tick boxes.","Ask 10 family members, relatives or classmates. Note each answer exactly and politely.","Tally the answers and write one line on what the data shows."],"hi":["चार सीधे और साफ़ सवाल लिखें, जैसे 'आप स्कूल कैसे आते हैं?' टिक-बॉक्स वाला कागज़ी फ़ॉर्म बनाएँ।","परिवार, रिश्तेदारों या सहपाठियों में से 10 लोगों से पूछें। हर जवाब सही और विनम्रता से लिखें।","जवाबों की गिनती करें और एक लाइन लिखें कि आँकड़े क्या बताते हैं।"]},"result":{"en":"A filled survey form with a tally and one finding.","hi":"भरा हुआ सर्वे फ़ॉर्म, गिनती और एक निष्कर्ष।"},"time":"45 min","cost":"Free"},"g":["numbers","people"]},{"id":"c175","s":"research","p":809,"n":{"en":"Demographer","hi":"जनसांख्यिकीविद्"},"w":{"en":"Studies how populations change, such as how many people there are, their ages, births and movement, to help in planning.","hi":"आबादी में होने वाले बदलाव समझता है, जैसे कितने लोग हैं, उनकी उम्र, जन्म और आवाजाही, ताकि योजना बनाने में मदद मिले।"},"t":{"title":{"en":"Draw an age pyramid of your extended family","hi":"अपने बड़े परिवार का आयु-पिरामिड बनाएँ"},"steps":{"en":["List the ages of 20 people in your extended family or street, with their permission. Names are not needed.","Group them in bands: 0-10, 11-20, 21-30, and so on. Count each band in Google Sheets.","Make a bar chart of the counts and write one line on which age group is biggest."],"hi":["अपने बड़े परिवार या गली के 20 लोगों की उम्र उनकी इजाज़त से लिखें। नाम की ज़रूरत नहीं।","उन्हें समूहों में बाँटें: 0-10, 11-20, 21-30 आदि। गूगल शीट्स में हर समूह गिनें।","गिनती का बार चार्ट बनाएँ और एक लाइन लिखें कि कौन-सा आयु वर्ग सबसे बड़ा है।"]},"result":{"en":"An age chart of your own community and a first taste of population study.","hi":"अपने समुदाय का आयु चार्ट और आबादी के अध्ययन का पहला स्वाद।"},"time":"45 min","cost":"Free"},"g":["numbers","people"]},{"id":"c176","s":"research","p":811,"n":{"en":"Ecologist","hi":"परिस्थितिकी विज्ञानी"},"w":{"en":"Studies how plants, animals and their surroundings depend on each other, and how nature stays in balance or changes.","hi":"यह समझता है कि पौधे, जानवर और उनका वातावरण एक-दूसरे पर कैसे निर्भर हैं, और प्रकृति का संतुलन कैसे बना रहता या बदलता है।"},"t":{"title":{"en":"Survey one square metre of nature","hi":"प्रकृति के एक वर्ग मीटर का सर्वे करें"},"steps":{"en":["Mark a one-metre square on a lawn or garden patch with string or sticks. Sit by it for 15 minutes.","Count and sketch every kind of plant and small creature you see. Do not touch insects.","Draw arrows showing who eats what, to make a small food web of your patch."],"hi":["बगीचे या घास के हिस्से में रस्सी या डंडियों से एक मीटर का वर्ग बनाएँ। 15 मिनट उसके पास बैठें।","जितनी तरह के पौधे और छोटे जीव दिखें, गिनें और स्केच करें। कीड़ों को छुएँ नहीं।","तीर बनाकर दिखाएँ कि कौन किसे खाता है, और अपने टुकड़े का छोटा फ़ूड वेब बनाएँ।"]},"result":{"en":"A species count and food web for one square metre of nature.","hi":"एक वर्ग मीटर प्रकृति की प्रजातियों की गिनती और फ़ूड वेब।"},"time":"45 min","cost":"Free"},"g":["nature","science"]},{"id":"c177","s":"research","p":813,"n":{"en":"Economist","hi":"अर्थशास्त्री"},"w":{"en":"Studies how people, businesses and governments use money and resources, and explains trends in prices, jobs and growth.","hi":"यह देखता है कि लोग, कारोबार और सरकारें पैसे और संसाधनों का कैसे इस्तेमाल करते हैं, और कीमतों, रोज़गार और तरक्की के रुझान समझाता है।"},"t":{"title":{"en":"Draw a demand curve for a snack","hi":"एक नाश्ते की माँग का ग्राफ़ बनाएँ"},"steps":{"en":["Pick a snack, like a samosa. Ask 10 people if they would buy it at Rs 5, 10, 15 and 20.","In Google Sheets, count how many say yes at each price.","Make a line chart of price against buyers and write what happens when the price goes up."],"hi":["कोई नाश्ता चुनें, जैसे समोसा। 10 लोगों से पूछें कि वे इसे 5, 10, 15 और 20 रुपये में खरीदेंगे या नहीं।","गूगल शीट्स में गिनें कि हर कीमत पर कितने लोग हाँ कहते हैं।","कीमत और खरीदारों का लाइन चार्ट बनाएँ और लिखें कि कीमत बढ़ने पर क्या होता है।"]},"result":{"en":"Your own demand curve built from real answers.","hi":"असली जवाबों से बना आपका अपना माँग ग्राफ़।"},"time":"45 min","cost":"Free"},"g":["money","numbers"]},{"id":"c178","s":"research","p":815,"n":{"en":"Engineering Physicist","hi":"अभियांत्रिकी भौतिक विज्ञानी"},"w":{"en":"Uses physics ideas and measurements to design and improve machines, materials and devices.","hi":"भौतिकी के सिद्धांतों और माप का इस्तेमाल करके मशीनें, पदार्थ और उपकरण बनाता और बेहतर करता है।"},"t":{"title":{"en":"Test a string pendulum at three lengths","hi":"तीन लंबाइयों पर धागे के पेंडुलम की जाँच करें"},"steps":{"en":["Tie a small weight, like a key or nut, to a string. Hang it from a table edge or doorframe.","Time 10 swings with a phone stopwatch at three string lengths, such as 20, 40 and 80 cm. Swing gently.","Divide to get time per swing, plot length against time in Google Sheets and note the pattern."],"hi":["धागे में छोटा वज़न बाँधें, जैसे चाबी या नट। उसे मेज़ के किनारे या चौखट से लटकाएँ।","फ़ोन के स्टॉपवॉच से तीन लंबाइयों, जैसे 20, 40 और 80 सेमी, पर 10 झूले का समय नापें। धीरे झुलाएँ।","समय को भाग देकर एक झूले का समय निकालें, गूगल शीट्स में लंबाई बनाम समय का ग्राफ़ बनाएँ और पैटर्न लिखें।"]},"result":{"en":"A graph from your own measurements showing how length changes swing time.","hi":"अपने मापों से बना ग्राफ़, जो दिखाता है कि लंबाई से झूले का समय कैसे बदलता है।"},"time":"45 min","cost":"Free"},"g":["science","machines"]},{"id":"c179","s":"research","p":817,"n":{"en":"English Literature Scholar","hi":"अंग्रेजी साहित्य विद्वान"},"w":{"en":"Reads stories, poems and plays closely, explains their meaning and style, and shares ideas about why they matter.","hi":"कहानियाँ, कविताएँ और नाटक गहराई से पढ़ता है, उनका मतलब और शैली समझाता है, और बताता है कि वे क्यों मायने रखते हैं।"},"t":{"title":{"en":"Do a close reading of a short poem","hi":"छोटी कविता को ध्यान से पढ़कर समझें"},"steps":{"en":["Pick a short poem you like in English. Read it twice and underline words and images that stand out.","Write what the poem seems to say, what feeling it gives and which words create that feeling.","Share your reading with a friend and note where their interpretation differs from yours."],"hi":["अंग्रेज़ी की कोई छोटी पसंदीदा कविता चुनें। दो बार पढ़ें और जो शब्द और चित्र उभरें, उन्हें रेखांकित करें।","लिखें कि कविता क्या कहती लगती है, कौन-सा भाव देती है और कौन-से शब्द वह भाव बनाते हैं।","अपनी समझ किसी दोस्त को बताएँ और देखें कि उसकी व्याख्या आपसे कहाँ अलग है।"]},"result":{"en":"A five-line interpretation and proof that two readers can see one poem differently.","hi":"पाँच लाइन की व्याख्या, और यह अनुभव कि दो पाठक एक ही कविता अलग तरह से देख सकते हैं।"},"time":"30 min","cost":"Free"},"g":["art"]},{"id":"c180","s":"research","p":819,"n":{"en":"Archivist","hi":"पुरालेखवेत्ता"},"w":{"en":"Sorts, labels and safely stores important records and documents so that people can find them years later.","hi":"ज़रूरी रिकॉर्ड और कागज़ात छाँटता, लेबल लगाता और सुरक्षित रखता है, ताकि सालों बाद भी लोग उन्हें ढूँढ सकें।"},"t":{"title":{"en":"Catalogue 15 old papers or photos","hi":"15 पुराने कागज़ या फ़ोटो की सूची बनाएँ"},"steps":{"en":["Ask permission to take 15 old photos or papers from home. Give each a number written lightly in pencil on the back.","In Google Sheets, make columns for number, date, people, place and a one-line description.","Fill in the details with help from family, then store them in order in an envelope."],"hi":["घर से 15 पुरानी फ़ोटो या कागज़ लेने की इजाज़त लें। हर एक के पीछे हल्के पेंसिल से नंबर लिखें।","गूगल शीट्स में नंबर, तारीख, लोग, जगह और एक लाइन के विवरण के कॉलम बनाएँ।","घरवालों की मदद से जानकारी भरें, फिर उन्हें क्रम से एक लिफ़ाफ़े में रखें।"]},"result":{"en":"A searchable catalogue of 15 items and a tidy envelope of memories.","hi":"15 चीज़ों की खोजने लायक सूची और यादों से भरा सलीके का लिफ़ाफ़ा।"},"time":"1 hour","cost":"Free"},"g":["art","numbers"]},{"id":"c181","s":"research","p":821,"n":{"en":"Forensic Scientist","hi":"फोरेंसिक वैज्ञानिक"},"w":{"en":"Examines evidence from a scene, such as fingerprints or fibres, carefully and objectively to help establish what happened.","hi":"घटनास्थल के सबूत, जैसे उँगलियों के निशान या रेशे, सावधानी और निष्पक्षता से जाँचकर पता लगाने में मदद करता है कि क्या हुआ था।"},"t":{"title":{"en":"Lift and classify a fingerprint","hi":"उँगली का निशान उठाएँ और उसकी पहचान करें"},"steps":{"en":["Rub a soft pencil on paper to make a dark graphite patch. Rub a clean fingertip on it, then press on clear tape.","Stick the tape on white paper. Look closely, with a magnifier if you have one, at the ridges.","Classify the print as loop, whorl or arch, and compare with family members' prints."],"hi":["कागज़ पर नरम पेंसिल रगड़कर काला ग्रेफ़ाइट वाला हिस्सा बनाएँ। साफ़ उँगली उस पर रगड़ें, फिर साफ़ टेप पर दबाएँ।","टेप को सफ़ेद कागज़ पर चिपकाएँ। निशान की रेखाएँ ध्यान से देखें, आवर्धक काँच हो तो उससे।","निशान को लूप, व्होर्ल या आर्च में बाँटें, और घरवालों के निशानों से मिलान करें।"]},"result":{"en":"A real fingerprint lift with a type label and a family comparison.","hi":"टाइप के लेबल के साथ असली निशान, और परिवार के निशानों से तुलना।"},"time":"30 min","cost":"Free"},"g":["science","justice"]},{"id":"c182","s":"research","p":823,"n":{"en":"Genetic Engineer","hi":"आनुवंशिक अभियंता"},"w":{"en":"Studies genes and finds ways to change or use them, for example to improve crops or help treat diseases.","hi":"जीन का अध्ययन करता है और उन्हें बदलने या इस्तेमाल करने के तरीके खोजता है, जैसे फ़सलें बेहतर करना या बीमारियों के इलाज में मदद।"},"t":{"title":{"en":"Simulate inheritance with coin flips","hi":"सिक्के उछालकर आनुवंशिकता का मॉडल बनाएँ"},"steps":{"en":["Say a plant has two genes for flower colour. Capital R means red, small r means white. Both parents are Rr. Heads is R, tails is r.","Flip a coin twice for each baby plant, 20 times in all. Record the pair you get each time.","Count RR, Rr and rr. Note how many babies would be red, and compare with what you expected."],"hi":["मान लें किसी पौधे में फूल के रंग के दो जीन हैं। बड़ा R मतलब लाल, छोटा r मतलब सफ़ेद। दोनों माता-पिता Rr हैं। चित R और पट r।","हर बच्चे पौधे के लिए दो बार सिक्का उछालें, कुल 20 बार। हर बार जो जोड़ी आए, लिखें।","RR, Rr और rr गिनें। देखें कितने बच्चे लाल होंगे, और अपने अंदाज़े से तुलना करें।"]},"result":{"en":"A tally of 20 offspring and an idea of h
