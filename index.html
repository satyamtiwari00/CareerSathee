d and what help is needed."],"hi":["10 गुणा 10 का ग्रिड वाला समुद्र का नक्शा बनाइए। तट, बचाव जहाज़ का अड्डा और संकट में नाव को निर्देशांक से दिखाइए।","जहाज़ की गति चुनिए, जैसे 2 खाने प्रति मिनट, और गिनिए कि बचाव जहाज़ को पहुँचने में कितना समय लगेगा।","रेडियो का छोटा संदेश लिखिए: आप कौन हैं, कहाँ हैं, क्या हुआ और कौन-सी मदद चाहिए।"]},"result":{"en":"You will have a rescue plan with timings and practice at clear emergency messages.","hi":"आपके पास समय के साथ बचाव योजना होगी और साफ़ आपातकालीन संदेश देने का अभ्यास।"},"time":"45 min","cost":"Free"},"g":["service","travel"]},{"id":"c053","s":"govt","p":555,"n":{"en":"CRPF Officer","hi":"सी.आर.पी.एफ. अधिकारी"},"w":{"en":"Helps states keep law and order, supports elections and emergencies, and leads teams on internal security duties.","hi":"राज्यों को क़ानून-व्यवस्था बनाए रखने में मदद करता है, चुनाव और आपात स्थितियों में सहयोग देता है और आंतरिक सुरक्षा की ड्यूटी में टीम का नेतृत्व करता है।"},"t":{"title":{"en":"Practise tying a first-aid sling","hi":"प्राथमिक उपचार वाली स्लिंग बाँधने का अभ्यास करें"},"steps":{"en":["Fold a large clean dupatta or cloth square diagonally into a triangle to make a sling.","Practise tying it on a willing family member's arm so the hand rests a little higher than the elbow.","Check the fingers stay visible and comfortable, then explain each step aloud as you do it."],"hi":["एक बड़े साफ़ दुपट्टे या चौकोर कपड़े को तिरछा मोड़कर तिकोना बनाइए, यह आपकी स्लिंग है।","किसी तैयार परिवारजन की बाँह पर इसे ऐसे बाँधने का अभ्यास कीजिए कि हथेली कोहनी से थोड़ी ऊपर रहे।","देखिए कि उँगलियाँ दिखती रहें और आराम रहे, फिर हर कदम बोलकर समझाइए।"]},"result":{"en":"You will be able to make a basic sling and explain it calmly, a useful skill in any emergency.","hi":"आप एक बुनियादी स्लिंग बना पाएँगे और शांति से समझा पाएँगे, जो किसी भी आपात स्थिति में काम आएगा।"},"time":"30 min","cost":"Free"},"g":["service","health"]},{"id":"c054","s":"govt","p":557,"n":{"en":"Customs Officer","hi":"सीमा शुल्क अधिकारी"},"w":{"en":"Checks goods and travellers crossing borders, collects duty on imports, and stops banned or illegal items from entering or leaving.","hi":"सीमा पार करने वाले सामान और यात्रियों की जाँच करता है, आयात पर शुल्क वसूलता है और प्रतिबंधित या ग़ैरक़ानूनी चीज़ों को आने-जाने से रोकता है।"},"t":{"title":{"en":"Match a packed bag against its declaration list","hi":"पैक किए बैग को उसकी घोषणा-सूची से मिलाएँ"},"steps":{"en":["Ask a family member to pack a bag with 8 items and write a list with 2 mistakes.","Check the bag item by item against the list and mark every mismatch.","Write a short report of what did not match and 3 questions you would ask the traveller."],"hi":["किसी परिवारजन से 8 चीज़ों का बैग पैक करवाइए और सूची लिखवाइए, जिसमें दो ग़लतियाँ हों।","बैग की हर चीज़ को सूची से एक-एक करके मिलाइए और हर फ़र्क पर निशान लगाइए।","छोटी रिपोर्ट लिखिए कि क्या नहीं मिला और यात्री से आप कौन-से तीन सवाल पूछेंगे।"]},"result":{"en":"You will have a mini inspection report and a feel for careful checking and fair questioning.","hi":"आपके पास एक छोटी जाँच रिपोर्ट होगी और ध्यान से जाँचने और निष्पक्ष सवाल पूछने का अनुभव।"},"time":"30 min","cost":"Free"},"g":["justice","numbers"]},{"id":"c055","s":"govt","p":559,"n":{"en":"FSSAI Officer","hi":"एफ.एस.एस.ए.आई. अधिकारी"},"w":{"en":"Checks that food sold to people is safe, clean and properly labelled, and takes action when food safety rules are broken.","hi":"जाँचता है कि लोगों को बिकने वाला खाना सुरक्षित, साफ़ और सही लेबल वाला हो, और नियम टूटने पर कार्रवाई करता है।"},"t":{"title":{"en":"Audit the labels on 3 packaged foods","hi":"तीन पैकेट वाले खाने के लेबल की जाँच करें"},"steps":{"en":["Pick 3 packaged foods from your kitchen. Make a checklist: ingredients, dates, veg mark, nutrition table, FSSAI logo.","Check each pack against your checklist and score it out of 5.","Note anything missing or hard to read, and write one suggestion to make the label clearer."],"hi":["रसोई से तीन पैकेट वाली खाने की चीज़ें लीजिए। चेकलिस्ट बनाइए: सामग्री, तारीख़ें, वेज का निशान, पोषण तालिका, FSSAI लोगो।","हर पैकेट को अपनी चेकलिस्ट से मिलाइए और 5 में से अंक दीजिए।","जो चीज़ ग़ायब या पढ़ने में मुश्किल हो उसे लिखिए और लेबल को साफ़ बनाने का एक सुझाव दीजिए।"]},"result":{"en":"You will have a label audit scorecard and learn to read what food packs really tell you.","hi":"आपके पास लेबल जाँच का स्कोरकार्ड होगा और आप सीखेंगे कि खाने के पैकेट असल में क्या बताते हैं।"},"time":"30 min","cost":"Free"},"g":["food","health"]},{"id":"c056","s":"govt","p":561,"n":{"en":"Gramin Dak Sevak","hi":"ग्रामीण डाक सेवक"},"w":{"en":"Delivers letters and parcels in villages and offers postal and basic money services from the village post office.","hi":"गाँवों में चिट्ठियाँ और पार्सल पहुँचाता है और गाँव के डाकघर से डाक और बुनियादी पैसों की सेवाएँ देता है।"},"t":{"title":{"en":"Sort letters and plan the shortest delivery round","hi":"चिट्ठियाँ छाँटें और सबसे छोटा डिलीवरी रास्ता बनाएँ"},"steps":{"en":["Write 10 paper slips with a name, house number and lane. Sort them into cups, one per lane.","Sketch a map of a village with 3 lanes and mark each house.","Plan the shortest walking route to deliver everything, then hand real notes to family at home."],"hi":["कागज़ की 10 पर्चियों पर नाम, मकान नंबर और गली लिखिए। उन्हें कपों में छाँटिए, हर गली का एक कप।","तीन गलियों वाले गाँव का नक्शा बनाइए और हर मकान दिखाइए।","सब चिट्ठियाँ बाँटने का सबसे छोटा पैदल रास्ता सोचिए, फिर घर पर परिवार को असली पर्चियाँ दीजिए।"]},"result":{"en":"You will have a sorted mail set and a delivery route, the daily work of a village postman.","hi":"आपके पास छँटी हुई डाक और डिलीवरी का रास्ता होगा, जो गाँव के डाकिए का रोज़ का काम है।"},"time":"45 min","cost":"Free"},"g":["service","people"]},{"id":"c057","s":"govt","p":563,"n":{"en":"Indian Administrative Service (IAS) Officer","hi":"भारतीय प्रशासनिक सेवा"},"w":{"en":"Runs public services in districts and government departments, puts government policies into action, keeps order and solves local problems.","hi":"ज़िलों और सरकारी विभागों में जन-सेवाएँ चलाता है, सरकारी नीतियों को लागू करता है, व्यवस्था बनाए रखता है और स्थानीय समस्याएँ सुलझाता है।"},"t":{"title":{"en":"Write an action plan for a local problem","hi":"किसी स्थानीय समस्या के लिए कार्य-योजना लिखें"},"steps":{"en":["Pick one problem near you, like garbage in a lane, and write 3 facts you can observe.","List who is affected and which people or offices would need to act.","Write a 5-line plan with who does what by when, then present it to family as a meeting."],"hi":["अपने पास की एक समस्या चुनिए, जैसे गली में कचरा, और तीन बातें लिखिए जो आप ख़ुद देख सकते हैं।","लिखिए किन लोगों पर असर पड़ता है और किन लोगों या दफ़्तरों को कदम उठाना होगा।","पाँच लाइन की योजना लिखिए कि कौन, क्या, कब तक करेगा, फिर परिवार के सामने मीटिंग की तरह पेश कीजिए।"]},"result":{"en":"You will have a one-page plan and a taste of how officers turn problems into steps.","hi":"आपके पास एक पन्ने की योजना होगी और अंदाज़ा कि अधिकारी समस्याओं को कदमों में कैसे बदलते हैं।"},"time":"1 hour","cost":"Free"},"g":["people","service"]},{"id":"c058","s":"govt","p":565,"n":{"en":"Indian Air Force Officer","hi":"भारतीय वायु सेना अधिकारी"},"w":{"en":"Flies aircraft or manages technical, ground and logistics work to help defend India's airspace and support air operations.","hi":"विमान उड़ाता है या तकनीकी, ज़मीनी और लॉजिस्टिक्स का काम संभालता है ताकि भारत के आसमान की रक्षा और हवाई अभियानों में मदद हो सके।"},"t":{"title":{"en":"Fly-test two paper planes and compare","hi":"दो कागज़ के जहाज़ उड़ाकर उनकी तुलना करें"},"steps":{"en":["Fold two different paper planes, one with wide wings and one narrow and pointed.","Throw each 5 times from the same spot with similar force and measure each distance with a tape or footsteps.","Record results in a table and write why you think the winner flew farther."],"hi":["दो अलग कागज़ के जहाज़ बनाइए, एक चौड़े पंखों वाला और एक पतला और नुकीला।","हर एक को एक ही जगह से लगभग बराबर ताक़त से 5 बार उड़ाइए और दूरी फ़ीते या कदमों से नापिए।","नतीजे तालिका में लिखिए और सोचकर लिखिए कि जीतने वाला जहाज़ ज़्यादा दूर क्यों गया।"]},"result":{"en":"You will see how wing shape affects flight and how pilots and engineers test designs.","hi":"आप देखेंगे कि पंखों की बनावट उड़ान पर कैसे असर डालती है और पायलट तथा इंजीनियर डिज़ाइन कैसे जाँचते हैं।"},"time":"30 min","cost":"Free"},"g":["science","travel"]},{"id":"c059","s":"govt","p":567,"n":{"en":"Indian Army Officer","hi":"भारतीय थल सेना अधिकारी"},"w":{"en":"Leads a team of soldiers, plans tasks, makes decisions under pressure and looks after the welfare of the people in the unit.","hi":"सैनिकों की टीम का नेतृत्व करता है, कामों की योजना बनाता है, दबाव में फ़ैसले लेता है और अपनी टुकड़ी के लोगों का ख़याल रखता है।"},"t":{"title":{"en":"Lead a team to build a newspaper tower","hi":"अख़बार की मीनार बनाने में टीम का नेतृत्व करें"},"steps":{"en":["Gather 2 to 3 family members or friends and old newspapers. Goal: the tallest freestanding tower in 10 minutes.","Assign a role to each person, give clear orders and keep time as the leader.","Afterwards ask what made your instructions clear or confusing and note one thing to improve."],"hi":["परिवार या दोस्तों में से 2-3 लोग और पुराने अख़बार इकट्ठे कीजिए। एक साफ़ लक्ष्य रखिए: 10 मिनट में सबसे ऊँची अपने-आप खड़ी मीनार।","हर व्यक्ति को एक भूमिका दीजिए, साफ़ निर्देश दीजिए और लीडर बनकर समय का ध्यान रखिए।","बाद में पूछिए कि आपके निर्देशों में क्या साफ़ था या उलझा रहा और सुधार की एक बात लिखिए।"]},"result":{"en":"You will experience leading a team and learn how clear instructions change the result.","hi":"आपको टीम का नेतृत्व करने का अनुभव मिलेगा और समझ आएगा कि साफ़ निर्देश नतीजा कैसे बदलते हैं।"},"time":"30 min","cost":"Free"},"g":["people","service"]},{"id":"c060","s":"govt","p":569,"n":{"en":"Indian Foreign Service (IFS) Officer","hi":"भारतीय विदेश सेवा"},"w":{"en":"Represents India abroad, talks with other countries, helps Indians living overseas and works on trade, culture and friendly ties.","hi":"विदेश में भारत का प्रतिनिधित्व करता है, दूसरे देशों से बातचीत करता है, विदेश में रहने वाले भारतीयों की मदद करता है और व्यापार, संस्कृति व मित्रता के रिश्तों पर काम करता है।"},"t":{"title":{"en":"Role-play a river-sharing negotiation","hi":"नदी का पानी बाँटने की बातचीत का रोल-प्ले करें"},"steps":{"en":["Imagine two neighbouring countries sharing one river. Write 3 needs for each side.","Play both sides in turns, or ask a friend to play one, and find 2 things each can give up.","Write a 5-line agreement both sides could accept."],"hi":["सोचिए कि दो पड़ोसी देश एक नदी बाँटते हैं। हर पक्ष की तीन ज़रूरतें लिखिए।","बारी-बारी से दोनों पक्ष निभाइए, या किसी दोस्त से एक पक्ष निभाने को कहिए, और हर पक्ष की दो छूटें ढूँढिए।","पाँच लाइन का समझौता लिखिए जिसे दोनों पक्ष मान सकें।"]},"result":{"en":"You will have a mock agreement and see how give and take helps solve disagreements.","hi":"आपके पास एक नकली समझौता होगा और दिखेगा कि लेन-देन से झगड़े कैसे सुलझते हैं।"},"time":"45 min","cost":"Free"},"g":["people","travel"]},{"id":"c061","s":"govt","p":571,"n":{"en":"Indian Forest Service (IFS) Officer","hi":"भारतीय वन सेवा"},"w":{"en":"Protects and manages forests and wildlife, plans plantations and works with villagers who depend on the forest.","hi":"जंगलों और वन्यजीवों की रक्षा और देखभाल करता है, पौधारोपण की योजना बनाता है और जंगल पर निर्भर गाँव वालों के साथ काम करता है।"},"t":{"title":{"en":"Do a mini tree survey in your neighbourhood","hi":"अपने मोहल्ले में पेड़ों का छोटा सर्वे करें"},"steps":{"en":["With an adult, go to a nearby park or lane and pick 5 trees. Sketch one leaf from each.","Wrap a string around each trunk at chest height, then measure the string with a ruler.","Enter names, girth and notes in a table or Google Sheets and rank the trees by thickness."],"hi":["किसी बड़े के साथ पास के पार्क या गली में जाकर 5 पेड़ चुनिए। हर पेड़ की एक पत्ती का स्केच बनाइए।","हर तने पर छाती की ऊँचाई पर धागा लपेटिए, फिर धागे को स्केल से नापिए।","नाम, मोटाई और टिप्पणियाँ तालिका या गूगल शीट्स में भरिए और पेड़ों को मोटाई के हिसाब से क्रम में लगाइए।"]},"result":{"en":"You will have a tree survey table, the same kind of records foresters keep.","hi":"आपके पास पेड़ों के सर्वे की तालिका होगी, वैसा ही रिकॉर्ड जो वन अधिकारी रखते हैं।"},"time":"1 hour","cost":"Free"},"g":["nature","numbers"]},{"id":"c062","s":"govt","p":573,"n":{"en":"Home Guard","hi":"भारतीय होमगार्ड"},"w":{"en":"A trained volunteer who assists police and local authorities with traffic, crowd control, disaster relief and keeping the community safe.","hi":"प्रशिक्षित स्वयंसेवक जो ट्रैफ़िक, भीड़ संभालने, आपदा राहत और समुदाय की सुरक्षा में पुलिस और स्थानीय प्रशासन की मदद करता है।"},"t":{"title":{"en":"Make a family emergency plan and practise it","hi":"परिवार की आपातकालीन योजना बनाएँ और उसका अभ्यास करें"},"steps":{"en":["Draw your home's floor plan, mark two exits and choose a safe meeting point outside.","Write a card with emergency number 112 and your family contacts, and stick it somewhere visible.","Run a 2-minute practice with your family: everyone walks calmly to the meeting point."],"hi":["अपने घर का नक्शा बनाइए, दो निकासें दिखाइए और बाहर मिलने की एक सुरक्षित जगह चुनिए।","एक कार्ड पर आपातकालीन नंबर 112 और परिवार के नंबर लिखिए और उसे दिखने वाली जगह चिपकाइए।","परिवार के साथ दो मिनट का अभ्यास कीजिए: सब शांति से मिलने की जगह तक जाएँ।"]},"result":{"en":"You will have a ready emergency plan and know how calm teamwork helps in a crisis.","hi":"आपके पास तैयार आपातकालीन योजना होगी और समझ आएगा कि संकट में शांत टीमवर्क कैसे काम आता है।"},"time":"30 min","cost":"Free"},"g":["service","people"]},{"id":"c063","s":"govt","p":575,"n":{"en":"Indian Navy Officer","hi":"भारतीय नौसेना अधिकारी"},"w":{"en":"Leads a team on a warship, navigates the seas, operates ship systems and keeps the crew and vessel ready to protect the coastline.","hi":"युद्धपोत पर टीम को लीड करता है, समुद्र में रास्ता तय करता है, जहाज़ के सिस्टम चलाता है और तटों की सुरक्षा के लिए तैयार रहता है।"},"t":{"title":{"en":"Send a secret message with paper flags","hi":"काग़ज़ के झंडों से गुप्त संदेश भेजें"},"steps":{"en":["Cut two paper squares and tape each to a pencil to make flags.","Look up the semaphore flag chart online and learn the positions for 5 letters.","Stand across the room and send your friend a 5-letter word using only the flags."],"hi":["दो काग़ज़ के चौकोर टुकड़े काटकर पेंसिल पर चिपकाएँ और झंडे बना लें।","ऑनलाइन सेमाफोर फ़्लैग चार्ट देखकर 5 अक्षरों की पोज़िशन सीखें।","कमरे के दूसरी तरफ़ खड़े होकर दोस्त को सिर्फ़ झंडों से 5 अक्षर का शब्द भेजें।"]},"result":{"en":"You will know if you enjoy clear signalling and teamwork at a distance.","hi":"आपको पता चलेगा कि दूर से साफ़ इशारों में संदेश देना और टीम में काम करना आपको पसंद है या नहीं।"},"time":"30 min","cost":"Free"},"g":["travel","people"]},{"id":"c064","s":"govt","p":577,"n":{"en":"Indian Police Service (IPS) Officer","hi":"भारतीय पुलिस सेवा"},"w":{"en":"Leads police forces in a district or state, plans how to prevent crime, supervises investigations and works to keep law and order.","hi":"ज़िले या राज्य में पुलिस बल का नेतृत्व करता है, अपराध रोकने की योजना बनाता है, जाँच की निगरानी करता है और कानून-व्यवस्था बनाए रखता है।"},"t":{"title":{"en":"Crack a mini mystery with clues","hi":"छोटी-सी पहेली को सुराग़ से सुलझाएँ"},"steps":{"en":["Write a 5-line made-up mystery, such as a missing tiffin, with 5 clues on separate slips.","Give the slips to a friend or family member to read in a random order.","Ask them to name the culprit and explain which clues led them there."],"hi":["5 लाइन की एक काल्पनिक पहेली लिखें, जैसे टिफ़िन गायब हो गया, और 5 सुराग़ अलग पर्चियों पर लिखें।","पर्चियाँ किसी दोस्त या घरवाले को किसी भी क्रम में पढ़ने को दें।","उनसे कहें कि वे बताएँ कि गड़बड़ किसने की और किन सुराग़ों से यह समझा।"]},"result":{"en":"You will have a small case file and a feel for logical, fair reasoning.","hi":"आपके पास एक छोटी केस-फ़ाइल होगी और तर्क से सोचने का अनुभव मिलेगा।"},"time":"45 min","cost":"Free"},"g":["justice","people"]},{"id":"c065","s":"govt","p":579,"n":{"en":"Indian Railway Accounts Service Officer","hi":"भारतीय रेलवे लेखा सेवा"},"w":{"en":"Manages the railways' money matters: checks bills and payments, prepares budgets and accounts, and makes sure public money is spent properly.","hi":"रेलवे के पैसों का हिसाब संभालता है: बिल और भुगतान जाँचता है, बजट और खाते बनाता है और देखता है कि सरकारी पैसा सही जगह खर्च हो।"},"t":{"title":{"en":"Keep the books of a pretend station kiosk","hi":"एक काल्पनिक स्टेशन दुकान का हिसाब रखें"},"steps":{"en":["In Google Sheets, make columns for date, item, income and expense. Fill 10 made-up entries for a tea stall.","Add a SUM formula for each column and a closing balance cell.","Deliberately change one entry, then ask a friend to find the error by checking the totals."],"hi":["गूगल शीट्स में तारीख़, सामान, आमदनी और खर्च के कॉलम बनाएँ। चाय की दुकान की 10 काल्पनिक एंट्री भरें।","हर कॉलम के लिए SUM फ़ॉर्मूला और आख़िर में बचत का सेल जोड़ें।","जान-बूझकर एक एंट्री बदलें, फिर दोस्त से जोड़ चेक करके गलती पकड़ने को कहें।"]},"result":{"en":"You will have a working mini ledger and know if careful accounting suits you.","hi":"आपके पास एक चलता हुआ छोटा हिसाब-किताब होगा और पता चलेगा कि बारीकी से हिसाब रखना आपको भाता है या नहीं।"},"time":"45 min","cost":"Free"},"g":["numbers","money"]},{"id":"c066","s":"govt","p":581,"n":{"en":"Indian Railway Personnel Service Officer","hi":"भारतीय रेलवे कार्मिक सेवा"},"w":{"en":"Handles the human side of the railways: recruitment, postings, training, staff welfare and making sure the right people are in the right jobs.","hi":"रेलवे के कर्मचारियों से जुड़े काम देखता है: भर्ती, तैनाती, ट्रेनिंग, कर्मचारियों की भलाई और सही काम पर सही आदमी।"},"t":{"title":{"en":"Make a fair weekly duty roster","hi":"हफ़्ते की न्यायपूर्ण ड्यूटी लिस्ट बनाएँ"},"steps":{"en":["List 6 friends or family members as staff. Note one limit for each, such as 'no night shift'.","Draw a 7-day table with morning, evening and night shifts and fill it with names.","Check that nobody is overloaded and every limit is respected. Fix clashes."],"hi":["6 दोस्तों या घरवालों को स्टाफ़ मानकर लिखें। हर किसी की एक पाबंदी लिखें, जैसे 'रात की शिफ़्ट नहीं'।","7 दिन की तालिका बनाएँ, जिसमें सुबह, शाम और रात की शिफ़्ट हों, और नाम भरें।","देखें कि किसी पर ज़्यादा बोझ न हो और सबकी पाबंदी मानी गई हो। टकराव ठीक करें।"]},"result":{"en":"You will have a finished roster and know how it feels to balance people's needs.","hi":"आपके पास पूरी ड्यूटी लिस्ट होगी और लोगों की ज़रूरतें संतुलित करने का अंदाज़ा मिलेगा।"},"time":"45 min","cost":"Free"},"g":["people","numbers"]},{"id":"c067","s":"govt","p":583,"n":{"en":"Indian Railway Electrical Engineer","hi":"भारतीय रेलवे विद्युत अभियंता सेवा"},"w":{"en":"Looks after the electrical systems of the railways, such as train lighting, signalling power, locomotives and the overhead wires, and keeps them running safely.","hi":"रेलवे की बिजली व्यवस्था संभालता है, जैसे डिब्बों की लाइट, सिग्नल की बिजली, इंजन और ऊपर के तार, और उन्हें सुरक्षित चलाता है।"},"t":{"title":{"en":"Wire a train-coach light in a free simulator","hi":"फ्री सिमुलेटर में डिब्बे की लाइट का सर्किट बनाएँ"},"steps":{"en":["Open the free Tinkercad Circuits website on a computer and start a new circuit.","Connect a battery, a switch and a bulb so the bulb lights when the switch is on.","Add a second bulb and switch so each coach light can be controlled separately."],"hi":["कंप्यूटर पर फ्री वेबसाइट टिंकरकैड सर्किट्स खोलें और नया सर्किट शुरू करें।","बैटरी, स्विच और बल्ब ऐसे जोड़ें कि स्विच दबाने पर बल्ब जले।","दूसरा बल्ब और स्विच जोड़ें ताकि हर डिब्बे की लाइट अलग से चल सके।"]},"result":{"en":"You will have a working virtual circuit and a sense of how electrical design works.","hi":"आपके पास एक चलता वर्चुअल सर्किट होगा और बिजली के डिज़ाइन की समझ बनेगी।"},"time":"45 min","cost":"Free"},"g":["machines","science"]},{"id":"c068","s":"govt","p":585,"n":{"en":"Indian Railway Engineer (Civil)","hi":"भारतीय रेलवे अभियंता सेवा"},"w":{"en":"Plans, builds and maintains tracks, bridges, tunnels and stations so trains can run safely.","hi":"पटरियाँ, पुल, सुरंग और स्टेशन की योजना बनाता है, उन्हें बनवाता है और उनकी देखभाल करता है ताकि ट्रेनें सुरक्षित चलें।"},"t":{"title":{"en":"Build a paper bridge and load-test it","hi":"काग़ज़ का पुल बनाकर उसका भार परखें"},"steps":{"en":["Place two books 20 cm apart. Make a bridge from one sheet of A4 paper to span the gap.","Fold the paper in different ways, such as flat, pleated or rolled, and test each one.","Add coins one by one and note how many each design holds before it bends."],"hi":["दो किताबें 20 सेमी की दूरी पर रखें। A4 काग़ज़ से इस खाई पर पुल बनाएँ।","काग़ज़ को अलग-अलग तरह से मोड़ें, जैसे सपाट, प्लीट वाला या गोल, और हर डिज़ाइन आज़माएँ।","एक-एक करके सिक्के रखें और लिखें कि कौन-सा डिज़ाइन कितने सिक्के सह पाया।"]},"result":{"en":"You will find which shape is strongest and feel what a structural engineer tests.","hi":"आपको पता चलेगा कि कौन-सा आकार सबसे मज़बूत है और स्ट्रक्चरल इंजीनियर क्या परखता है।"},"time":"30 min","cost":"Free"},"g":["build","science"]},{"id":"c069","s":"govt","p":587,"n":{"en":"Indian Railway Mechanical Engineer","hi":"भारतीय रेलवे यांत्रिक अभियंता सेवा"},"w":{"en":"Takes care of locomotives, coaches and wagons, including their wheels, brakes and workshops, so they run reliably and are repaired on time.","hi":"इंजन, डिब्बों और वैगनों की देखभाल करता है, जिनमें पहिए, ब्रेक और वर्कशॉप आते हैं, ताकि वे भरोसे से चलें और समय पर ठीक हों।"},"t":{"title":{"en":"Build a rolling cart from straws and bottle caps","hi":"स्ट्रॉ और बोतल के ढक्कन से लुढ़कने वाली गाड़ी बनाएँ"},"steps":{"en":["Make a body from cardboard. Fit two straws as axle holders and push skewer-free paper rolls or thin pens through them as axles.","Attach four bottle caps as wheels and test that they spin freely.","Roll it down a slanted board, then try loading it with coins and compare."],"hi":["गत्ते से गाड़ी की बॉडी बनाएँ। दो स्ट्रॉ एक्सल होल्डर की तरह लगाएँ और उनमें पतले पेन एक्सल बनाकर डालें।","चार बोतल के ढक्कन पहिए की तरह लगाएँ और देखें कि वे आसानी से घूमते हैं।","इसे ढलान वाले तख़्ते पर लुढ़काएँ, फिर सिक्के रखकर चलाएँ और फ़र्क़ देखें।"]},"result":{"en":"You will have a working model and see how wheels and axles behave under load.","hi":"आपके पास चलने वाला मॉडल होगा और दिखेगा कि भार पड़ने पर पहिए और एक्सल कैसे चलते हैं।"},"time":"1 hour","cost":"Under ₹100"},"g":["machines","build"]},{"id":"c070","s":"govt","p":589,"n":{"en":"Indian Railway Signal Engineer","hi":"भारतीय रेलवे सेवा सिग्नल अभियंता"},"w":{"en":"Designs and maintains the signals and control systems that tell train drivers when to stop or go so trains never collide.","hi":"सिग्नल और कंट्रोल सिस्टम डिज़ाइन करता है और उनकी देखभाल करता है, जो ड्राइवर को बताते हैं कि कब रुकना है और कब चलना है ताकि ट्रेनें न टकराएँ।"},"t":{"title":{"en":"Run two toy trains on one track safely","hi":"एक पटरी पर दो खिलौना ट्रेनें सुरक्षित चलाएँ"},"steps":{"en":["Draw a single track with a passing loop in the middle on a big sheet. Use two coins as trains.","Make red and green paper signal cards and write 3 rules, such as 'only one train in a section'.","Move the trains from opposite ends using your rules and fix any rule that lets them collide."],"hi":["बड़ी शीट पर बीच में लूप वाली एक पटरी बनाएँ। दो सिक्कों को ट्रेन मानें।","लाल और हरे काग़ज़ के सिग्नल कार्ड बनाएँ और 3 नियम लिखें, जैसे 'एक हिस्से में एक ही ट्रेन'।","दोनों ट्रेनों को आमने-सामने से चलाएँ और जो नियम टक्कर होने दे, उसे सुधारें।"]},"result":{"en":"You will have a safe signalling rule-set and see how careful logic prevents accidents.","hi":"आपके पास सुरक्षित सिग्नल नियमों का सेट होगा और दिखेगा कि सोच-समझकर बनाए नियम हादसे रोकते हैं।"},"time":"30 min","cost":"Free"},"g":["machines","science"]},{"id":"c071","s":"govt","p":591,"n":{"en":"Indian Railway Stores Service Officer","hi":"भारतीय रेलवे भंडार सेवा"},"w":{"en":"Buys and manages everything the railways need, from rail tracks to uniforms, and keeps stores stocked, recorded and used wisely.","hi":"रेलवे को जो भी चाहिए, पटरी से लेकर वर्दी तक, उसकी ख़रीद और भंडार का काम देखता है, और स्टॉक का रिकॉर्ड व सही इस्तेमाल पक्का करता है।"},"t":{"title":{"en":"Run a stock register for your home stationery","hi":"घर की स्टेशनरी का स्टॉक रजिस्टर बनाएँ"},"steps":{"en":["Count all pens, notebooks and similar items at home and list them in a Google Sheet.","Add columns for 'used this week' and 'minimum needed' and fill them using a formula for what is left.","Mark items that need re-ordering and make a short shopping list from them."],"hi":["घर के सारे पेन, कॉपियाँ और ऐसी चीज़ें गिनकर गूगल शीट में लिखें।","'इस हफ़्ते इस्तेमाल' और 'कम से कम ज़रूरी' के कॉलम जोड़ें और बचा हुआ निकालने का फ़ॉर्मूला लगाएँ।","जिन चीज़ों का दोबारा ऑर्डर चाहिए उन्हें चिह्नित करें और उनसे छोटी ख़रीद-सूची बनाएँ।"]},"result":{"en":"You will have a working stock sheet and a sense of managing supplies.","hi":"आपके पास चलती हुई स्टॉक शीट होगी और सामान का प्रबंधन करने की समझ बनेगी।"},"time":"45 min","cost":"Free"},"g":["numbers","service"]},{"id":"c072","s":"govt","p":593,"n":{"en":"Indian Railway Traffic Service Officer","hi":"भारतीय रेलवे यातायात सेवा"},"w":{"en":"Plans how trains and goods move across the network: timetables, crew, platforms and how to handle delays and heavy rush.","hi":"पूरे नेटवर्क में ट्रेनों और माल की आवाजाही की योजना बनाता है: समय-सारणी, स्टाफ़, प्लेटफ़ॉर्म और देरी या भीड़ से निपटना।"},"t":{"title":{"en":"Make a four-station timetable and fix a clash","hi":"चार स्टेशन की समय-सारणी बनाएँ और टकराव सुलझाएँ"},"steps":{"en":["Draw a line with 4 stations. Choose travel times between them and plan 3 trains in a table.","Add one train going the opposite way on the same single line.","Spot where two trains meet and adjust the timings or add a waiting stop to fix it."],"hi":["4 स्टेशनों की एक लाइन खींचें। उनके बीच का सफ़र-समय चुनकर तालिका में 3 ट्रेनें बनाएँ।","उसी इकलौती लाइन पर उल्टी दिशा की एक ट्रेन जोड़ें।","देखें कि दो ट्रेनें कहाँ मिलती हैं और समय बदलकर या कहीं रुकवाकर टकराव ठीक करें।"]},"result":{"en":"You will have a clash-free timetable and see how planning keeps trains moving.","hi":"आपके पास बिना टकराव वाली समय-सारणी होगी और समझ आएगा कि योजना से ट्रेनें कैसे चलती हैं।"},"time":"45 min","cost":"Free"},"g":["travel","numbers"]},{"id":"c073","s":"govt","p":595,"n":{"en":"Indian Revenue Service Officer","hi":"भारतीय राजस्व सेवा"},"w":{"en":"Works in the government's tax and customs departments, helping collect taxes fairly, checking returns and making policies that keep revenue flowing.","hi":"सरकार के कर और सीमा-शुल्क विभागों में काम करता है, ताकि कर सही तरह से जमा हो, रिटर्न जाँचे जाएँ और राजस्व के लिए नीतियाँ बनें।"},"t":{"title":{"en":"Calculate a pretend tax on shop bills","hi":"दुकान के बिलों पर काल्पनिक टैक्स निकालें"},"steps":{"en":["Make 8 made-up bills for a small shop in Google Sheets with item and price.","Pick a pretend tax rate, like 5 percent, and use a formula to find tax and total for each bill.","Add the tax column and write one line on why a country needs taxes."],"hi":["गूगल शीट्स में एक छोटी दुकान के 8 काल्पनिक बिल बनाएँ, जिनमें सामान और दाम हों।","5 प्रतिशत जैसी काल्पनिक टैक्स दर चुनें और फ़ॉर्मूला से हर बिल का टैक्स और कुल निकालें।","टैक्स का कॉलम जोड़ें और एक लाइन लिखें कि देश को टैक्स क्यों चाहिए।"]},"result":{"en":"You will have a tax calculator sheet and see how rates turn into collected money.","hi":"आपके पास टैक्स कैलकुलेटर शीट होगी और दिखेगा कि दर से कैसे पैसा जमा होता है।"},"time":"30 min","cost":"Free"},"g":["money","numbers"]},{"id":"c074","s":"govt","p":597,"n":{"en":"Income Tax Inspector","hi":"आयकर निरीक्षक"},"w":{"en":"Checks tax records, visits businesses and individuals to verify details, and helps find where income and tax paid do not match.","hi":"टैक्स रिकॉर्ड जाँचता है, कारोबारियों और लोगों से मिलकर जानकारी पक्की करता है और देखता है कि कमाई और भरा टैक्स कहाँ मेल नहीं खाते।"},"t":{"title":{"en":"Spot the mismatch in a made-up record","hi":"काल्पनिक रिकॉर्ड में गड़बड़ी पकड़ें"},"steps":{"en":["Invent a fictional shopkeeper and write 6 months of income and spending in a table.","Hide 2 mistakes, like a missing entry and a wrongly added total.","Swap tables with a friend and find each other's mistakes using totals and cross-checks."],"hi":["एक काल्पनिक दुकानदार सोचें और 6 महीने की कमाई और खर्च तालिका में लिखें।","इसमें 2 गलतियाँ छिपाएँ, जैसे एक एंट्री गायब और एक जोड़ गलत।","दोस्त से तालिका बदलें और जोड़ व मिलान से एक-दूसरे की गलतियाँ पकड़ें।"]},"result":{"en":"You will find out if detective-style checking of numbers excites you.","hi":"आपको पता चलेगा कि आँकड़ों की जासूसी जैसी जाँच आपको मज़ेदार लगती है या नहीं।"},"time":"45 min","cost":"Free"},"g":["justice","numbers"]},{"id":"c075","s":"govt","p":599,"n":{"en":"ITBP Officer","hi":"आई.टी.बी.पी. अधिकारी"},"w":{"en":"Serves in the Indo-Tibetan Border Police, guarding high mountain borders, patrolling difficult terrain and helping people during disasters.","hi":"इंडो-तिब्बतन बॉर्डर पुलिस में सेवा करता है, ऊँचे पहाड़ी सीमा क्षेत्रों की रखवाली करता है, कठिन इलाक़ों में गश्त करता है और आपदा में मदद करता है।"},"t":{"title":{"en":"Draw a contour map of a model hill","hi":"छोटी पहाड़ी का कंटूर नक्शा बनाएँ"},"steps":{"en":["Make a small hill from clay or a mound of sand on a tray, about 10 cm tall.","Lay a ruler beside it and mark heights at 2 cm, 4 cm and 6 cm on the hill's side.","Look from above and draw closed lines at each height on paper to make a contour map."],"hi":["ट्रे में मिट्टी या रेत से लगभग 10 सेमी ऊँची छोटी पहाड़ी बनाएँ।","पास में स्केल रखें और पहाड़ी की ढलान पर 2, 4 और 6 सेमी की ऊँचाई के निशान लगाएँ।","ऊपर से देखकर हर ऊँचाई की बंद रेखाएँ काग़ज़ पर खींचें। यही कंटूर नक्शा है।"]},"result":{"en":"You will have a contour map and know how mountain terrain is read on maps.","hi":"आपके पास कंटूर नक्शा होगा और समझ आएगा कि पहाड़ी इलाक़ा नक्शे पर कैसे पढ़ते हैं।"},"time":"45 min","cost":"Free"},"g":["nature","travel"]},{"id":"c076","s":"govt","p":601,"n":{"en":"Loco Pilot","hi":"लोको पायलट"},"w":{"en":"Drives a train, watches signals and track conditions, follows safety rules and keeps the train running on time and safely.","hi":"ट्रेन चलाता है, सिग्नल और पटरी की हालत पर नज़र रखता है, सुरक्षा नियम मानता है और ट्रेन को समय पर और सुरक्षित चलाता है।"},"t":{"title":{"en":"Test how far a rolling toy stops","hi":"लुढ़कते खिलौने के रुकने की दूरी नापें"},"steps":{"en":["Make a slope from a board and a few books. Release a toy car from the same mark each time.","Measure the stopping distance on three surfaces: floor, cloth and paper.","Write which surface needs the most distance to stop and why drivers must brake early."],"hi":["तख़्ते और कुछ किताबों से ढलान बनाएँ। खिलौना गाड़ी को हर बार एक ही निशान से छोड़ें।","तीन सतहों पर रुकने की दूरी नापें: फ़र्श, कपड़ा और काग़ज़।","लिखें कि किस सतह पर सबसे ज़्यादा दूरी लगी और ड्राइवर को ब्रेक जल्दी क्यों लगाने पड़ते हैं।"]},"result":{"en":"You will have measured results and understand why braking distance matters.","hi":"आपके पास नापे हुए नतीजे होंगे और समझ आएगा कि ब्रेक की दूरी क्यों मायने रखती है।"},"time":"30 min","cost":"Free"},"g":["machines","science"]},{"id":"c077","s":"govt","p":603,"n":{"en":"Merchant Navy Officer","hi":"मर्चेंट नेवी"},"w":{"en":"Works on cargo ships and tankers, navigating, managing cargo and ship machinery, and carrying goods across the world's seas.","hi":"मालवाहक और टैंकर जहाज़ों पर काम करता है, रास्ता तय करता है, माल और जहाज़ की मशीनें संभालता है और दुनिया के समुद्रों में सामान पहुँचाता है।"},"t":{"title":{"en":"Float a foil cargo ship and load it","hi":"फ़ॉइल का मालवाहक जहाज़ बनाकर उसमें माल भरें"},"steps":{"en":["Shape a boat from a piece of aluminium foil and float it in a bucket of water.","Add coins one at a time, spreading them evenly, and count how many it carries before sinking.","Redesign the hull with taller sides or a wider base and compare."],"hi":["एल्युमीनियम फ़ॉइल के टुकड़े से नाव बनाकर पानी की बाल्टी में तैराएँ।","सिक्के एक-एक करके बराबर फैलाकर रखें और गिनें कि डूबने से पहले कितने आए।","नाव का ढाँचा ऊँची दीवारों या चौड़े तले वाला बनाकर दोबारा तुलना करें।"]},"result":{"en":"You will see how hull shape affects the cargo a ship can carry.","hi":"आपको दिखेगा कि जहाज़ का आकार उसकी माल ढोने की क्षमता कैसे बदलता है।"},"time":"30 min","cost":"Free"},"g":["travel","machines"]},{"id":"c078","s":"govt","p":605,"n":{"en":"Police Constable","hi":"पुलिस आरक्षक"},"w":{"en":"Patrols the area, helps people in trouble, records complaints, keeps order at events and supports officers in investigations.","hi":"इलाक़े में गश्त करता है, मुसीबत में पड़े लोगों की मदद करता है, शिकायतें दर्ज करता है, कार्यक्रमों में व्यवस्था रखता है और जाँच में अफ़सरों का साथ देता है।"},"t":{"title":{"en":"Role-play helping a lost child","hi":"खोए हुए बच्चे की मदद का रोल-प्ले करें"},"steps":{"en":["Ask a friend or sibling to play a lost child. You are the constable.","Practise calm steps: kneel down, ask their name and parent's name, and note where they last saw family.","Write a short note of the details and swap roles to feel how it is to be helped."],"hi":["किसी दोस्त या भाई-बहन को खोया हुआ बच्चा बनने को कहें। आप सिपाही बनें।","शांत तरीक़े से बात करें: झुककर नाम और माता-पिता का नाम पूछें और जानें कि घरवाले आख़िरी बार कहाँ दिखे।","जानकारी का छोटा नोट लिखें और भूमिकाएँ बदलकर देखें कि मदद पाना कैसा लगता है।"]},"result":{"en":"You will practise calm, kind communication that a constable needs.","hi":"आप शांत और दयालु बातचीत की प्रैक्टिस करेंगे, जो सिपाही के काम में चाहिए।"},"time":"15 min","cost":"Free"},"g":["people","service"]},{"id":"c079","s":"govt","p":607,"n":{"en":"Railway Protection Force (RPF) Personnel","hi":"रेलवे सुरक्षा बल"},"w":{"en":"Protects railway property, passengers and goods, keeps stations and trains safe and helps people in emergencies on railway premises.","hi":"रेलवे की संपत्ति, यात्रियों और माल की रक्षा करता है, स्टेशनों और ट्रेनों को सुरक्षित रखता है और रेलवे परिसर में आपात स्थिति में मदद करता है।"},"t":{"title":{"en":"Do a safety check of your school stairs or corridor","hi":"स्कूल की सीढ़ी या गलियारे का सुरक्षा ऑडिट करें"},"steps":{"en":["With permission, walk through a busy stairway or corridor at home or school with a notebook.","Note 5 risks such as slippery floor, blocked exit or bad light, and sketch a simple map of them.","Write one practical fix for each and share it with a teacher or elder."],"hi":["अनुमति लेकर घर या स्कूल की किसी भीड़ वाली सीढ़ी या गलियारे में कॉपी लेकर घूमें।","5 जोखिम लिखें, जैसे फिसलन, रुका हुआ निकास या कम रोशनी, और उनका सादा नक्शा बनाएँ।","हर जोखिम का एक व्यावहारिक हल लिखें और किसी शिक्षक या बड़े से साझा करें।"]},"result":{"en":"You will have a mini safety report and see if protecting people appeals to you.","hi":"आपके पास छोटी सुरक्षा रिपोर्ट होगी और पता चलेगा कि लोगों की हिफ़ाज़त का काम आपको भाता है या नहीं।"},"time":"30 min","cost":"Free"},"g":["service","justice"]},{"id":"c080","s":"govt","p":609,"n":{"en":"Sashastra Seema Bal (SSB) Officer","hi":"सशस्त्र सीमा बल अधिकारी"},"w":{"en":"Leads a team in the Sashastra Seema Bal, guarding border areas, building trust in border villages and staying physically fit for tough duty.","hi":"सशस्त्र सीमा बल में टीम का नेतृत्व करता है, सीमा के इलाक़ों की रक्षा करता है, सीमावर्ती गाँवों का भरोसा जीतता है और कठिन ड्यूटी के लिए फ़िट रहता है।"},"t":{"title":{"en":"Plan and try a 7-day fitness routine","hi":"7 दिन का फ़िटनेस रूटीन बनाकर आज़माएँ"},"steps":{"en":["Draw a 7-day chart with a mix of brisk walking, stretching, squats and rest.","Do day 1 safely, warming up first, and note how long and how you felt.","Adjust the chart for the coming days based on what felt too easy or too hard."],"hi":["7 दिन का चार्ट बनाएँ जिसमें तेज़ चलना, स्ट्रेचिंग, स्क्वैट्स और आराम शामिल हों।","पहले वार्म-अप करके पहला दिन सुरक्षित तरीक़े से करें और समय व अपना अनुभव लिखें।","जो आसान या मुश्किल लगा, उसके हिसाब से आगे के दिनों का चार्ट बदलें।"]},"result":{"en":"You will have a personal fitness plan and know if disciplined training suits you.","hi":"आपके पास अपना फ़िटनेस प्लान होगा और पता चलेगा कि अनुशासन वाली ट्रेनिंग आपको सूट करती है या नहीं।"},"time":"30 min","cost":"Free"},"g":["health","service"]},{"id":"c081","s":"govt","p":611,"n":{"en":"Police Sub-Inspector","hi":"पुलिस उप-निरीक्षक"},"w":{"en":"Runs a police station's day-to-day work, registers and investigates cases, collects evidence and supervises constables.","hi":"थाने का रोज़ का काम चलाता है, मामले दर्ज करके जाँच करता है, सबूत जुटाता है और सिपाहियों की निगरानी करता है।"},"t":{"title":{"en":"Write a proper incident report","hi":"घटना की सही रिपोर्ट लिखें"},"steps":{"en":["Ask a friend to tell you a short true or made-up incident, like a lost bag.","Note the who, what, when, where, why and how in a notebook.","Write a clear 5-line report using only facts, no guesses, and read it back to check."],"hi":["किसी दोस्त से कोई छोटी सच्ची या काल्पनिक घटना सुनें, जैसे बैग खो जाना।","कौन, क्या, कब, कहाँ, क्यों और कैसे कॉपी में नोट करें।","सिर्फ़ तथ्यों से 5 लाइन की साफ़ रिपोर्ट लिखें, अंदाज़े नहीं, और दोबारा पढ़कर जाँचें।"]},"result":{"en":"You will have a factual report and know how precise police writing needs to be.","hi":"आपके पास तथ्यों वाली रिपोर्ट होगी और समझ आएगा कि पुलिस की लिखाई कितनी सटीक होनी चाहिए।"},"time":"30 min","cost":"Free"},"g":["justice","people"]},{"id":"c082","s":"it","p":615,"n":{"en":"Artificial Intelligence Engineer","hi":"आर्टिफिशियल इंटेलिजेंस इंजीनियर"},"w":{"en":"Builds computer systems that learn from data to do tasks like recognising images, understanding speech or making predictions.","hi":"ऐसे कंप्यूटर सिस्टम बनाता है जो डेटा से सीखकर इमेज पहचानने, बोली समझने या अनुमान लगाने जैसे काम करते हैं।"},"t":{"title":{"en":"Train an image-recognition model in your browser","hi":"ब्राउज़र में इमेज पहचानने वाला मॉडल सिखाएँ"},"steps":{"en":["Open Google's free Teachable Machine website and choose an Image Project.","Show your webcam 3 objects, such as pen, bottle and book, capturing 30 samples of each.","Train the model and test it by showing the objects again from different angles."],"hi":["गूगल की फ्री वेबसाइट टीचेबल मशीन खोलें और इमेज प्रोजेक्ट चुनें।","वेबकैम को 3 चीज़ें दिखाएँ, जैसे पेन, बोतल और किताब, और हर एक के 30 सैंपल लें।","मॉडल को ट्रेन करें और चीज़ों को अलग-अलग कोण से दिखाकर परखें।"]},"result":{"en":"You will have a model that recognises objects and see why more examples help.","hi":"आपके पास चीज़ें पहचानने वाला मॉडल होगा और समझ आएगा कि ज़्यादा उदाहरण क्यों मदद करते हैं।"},"time":"30 min","cost":"Free"},"g":["code","science"]},{"id":"c083","s":"it","p":617,"n":{"en":"Augmented Reality Engineer","hi":"ऑगमेंटेड रियलिटी इंजीनियर"},"w":{"en":"Creates apps that place digital objects, such as 3D models or information, into the real world through a phone camera.","hi":"ऐसे ऐप बनाता है जो फ़ोन कैमरे के ज़रिए असली दुनिया में डिजिटल चीज़ें, जैसे 3D मॉडल या जानकारी, दिखाते हैं।"},"t":{"title":{"en":"Place a 3D animal in your room, then design an AR app","hi":"कमरे में 3D जानवर रखें, फिर AR ऐप डिज़ाइन करें"},"steps":{"en":["On your phone, search for an animal on Google and tap 'View in 3D' to place it in your room.","Take a screenshot of it next to a real object to see how size and shadow look.","Sketch 3 screens of your own AR study app idea on paper."],"hi":["फ़ोन पर गूगल में किसी जानवर को खोजें और 'View in 3D' दबाकर उसे अपने कमरे में रखें।","किसी असली चीज़ के पास उसका स्क्रीनशॉट लें और देखें कि आकार और परछाईं कैसी दिखती है।","अपने AR पढ़ाई वाले ऐप आइडिया की 3 स्क्रीन काग़ज़ पर बनाएँ।"]},"result":{"en":"You will have an AR screenshot and a paper design of your own idea.","hi":"आपके पास AR का स्क्रीनशॉट और अपने आइडिया का काग़ज़ी डिज़ाइन होगा।"},"time":"45 min","cost":"Free"},"g":["code","art"]},{"id":"c084","s":"it","p":619,"n":{"en":"Big Data Analyst","hi":"बिग डेटा विश्लेषक"},"w":{"en":"Collects and studies very large sets of data to find patterns that help businesses and organisations make better decisions.","hi":"बहुत बड़े डेटा को जमा करके उसका अध्ययन करता है ताकि पैटर्न मिलें और कंपनियाँ व संस्थाएँ बेहतर फ़ैसले ले सकें।"},"t":{"title":{"en":"Survey 20 people and chart the pattern","hi":"20 लोगों का सर्वे करके पैटर्न का चार्ट बनाएँ"},"steps":{"en":["Ask 20 classmates or neighbours one question, like how they travel to school.","Type the answers in Google Sheets and count each type with COUNTIF.","Insert a bar chart and write two things the data tells you."],"hi":["20 साथियों या पड़ोसियों से एक सवाल पूछें, जैसे वे स्कूल कैसे जाते हैं।","जवाब गूगल शीट्स में लिखें और COUNTIF से हर तरह के जवाब गिनें।","बार चार्ट लगाएँ और लिखें कि डेटा आपको कौन-सी दो बातें बताता है।"]},"result":{"en":"You will have a chart with insights and see if finding patterns excites you.","hi":"आपके पास निष्कर्षों वाला चार्ट होगा और पता चलेगा कि पैटर्न खोजना आपको अच्छा लगता है या नहीं।"},"time":"45 min","cost":"Free"},"g":["numbers","code"]},{"id":"c085","s":"it","p":621,"n":{"en":"Blockchain Developer","hi":"ब्लॉकचेन डेवलपर"},"w":{"en":"Builds secure digital record-keeping systems where data is stored in linked blocks that are very hard to change secretly.","hi":"सुरक्षित डिजिटल रिकॉर्ड सिस्टम बनाता है, जिनमें डेटा जुड़े हुए ब्लॉकों में रखा जाता है और चुपके से बदलना बहुत मुश्किल होता है।"},"t":{"title":{"en":"Build a paper blockchain and try to cheat it","hi":"काग़ज़ का ब्लॉकचेन बनाकर उसे धोखा देने की कोशिश करें"},"steps":{"en":["Write 4 cards as blocks, each with a short transaction. Define a code as the sum of its letter positions, A=1, B=2.","On each card, also write the previous card's code, linking them in a chain.","Change one old card's text and recalculate the codes to see how every later card breaks."],"hi":["4 कार्ड बनाएँ, हर पर एक छोटा लेन-देन लिखें। कोड ऐसे तय करें कि अक्षरों के नंबर का जोड़ हो, A=1, B=2।","हर कार्ड पर पिछले कार्ड का कोड भी लिखें, ताकि वे चेन की तरह जुड़ जाएँ।","एक पुराने कार्ड का लिखा बदलें और कोड दोबारा निकालें, देखें कि आगे के सब कार्ड कैसे बिगड़ जाते हैं।"]},"result":{"en":"You will see why tampering with a chain of linked records is easy to spot.","hi":"आप देखेंगे कि जुड़े हुए रिकॉर्ड में छेड़छाड़ पकड़ना क्यों आसान है।"},"time":"30 min","cost":"Free"},"g":["code","money"]},{"id":"c086","s":"it","p":623,"n":{"en":"Cloud Engineer","hi":"क्लाउड इंजीनियर"},"w":{"en":"Sets up and manages online computing services so apps and files can be stored, shared and run reliably over the internet.","hi":"ऑनलाइन कंप्यूटिंग सेवाएँ तैयार करता और संभालता है ताकि ऐप और फ़ाइलें इंटरनेट पर भरोसे से रखी, साझा की और चलाई जा सकें।"},"t":{"title":{"en":"Set up a shared cloud folder with permissions","hi":"अनुमति वाला साझा क्लाउड फ़ोल्डर बनाएँ"},"steps":{"en":["In Google Drive, create a folder and upload 3 files, such as a photo and a note.","Share it with a trusted friend or parent as view-only, and test that they cannot edit.","Open the folder from a different device and change one permission to editor, then back."],"hi":["गूगल ड्राइव में एक फ़ोल्डर बनाएँ और उसमें 3 फ़ाइलें डालें, जैसे फ़ोटो और नोट।","किसी भरोसेमंद दोस्त या माता-पिता से केवल देखने की अनुमति पर शेयर करें और जाँचें कि वे एडिट नहीं कर पाते।","किसी दूसरे डिवाइस से फ़ोल्डर खोलें, एक अनुमति एडिटर कर दें और फिर वापस बदलें।"]},"result":{"en":"You will understand storing, sharing and access control, the basics of cloud work.","hi":"आपको स्टोरेज, शेयरिंग और एक्सेस कंट्रोल समझ आएगा, जो क्लाउड के काम की बुनियाद है।"},"time":"30 min","cost":"Free"},"g":["code"]},{"id":"c087","s":"it","p":625,"n":{"en":"Computer Hardware Engineer","hi":"कंप्यूटर हार्डवेयर इंजीनियर"},"w":{"en":"Designs and tests the physical parts of computers, such as chips, circuit boards, memory and devices, so they work fast and reliably.","hi":"कंप्यूटर के भौतिक पुर्ज़े, जैसे चिप, सर्किट बोर्ड, मेमोरी और डिवाइस, डिज़ाइन और टेस्ट करता है ताकि वे तेज़ और भरोसेमंद चलें।"},"t":{"title":{"en":"Build a 1-bit adder from paper logic gates","hi":"काग़ज़ के लॉजिक गेट से 1-बिट जोड़ने वाली मशीन बनाएँ"},"steps":{"en":["Draw the rules of AND and XOR gates on cards using 0 and 1 inputs.","Connect one XOR gate for the sum and one AND gate for the carry on paper.","Test all 4 input pairs, such as 1+1, and write each result to check it adds correctly."],"hi":["कार्ड पर AND और XOR गेट के नियम 0 और 1 के इनपुट के साथ लिखें।","काग़ज़ पर जोड़ के लिए एक XOR गेट और कैरी के लिए एक AND गेट जोड़ें।","चारों इनपुट जोड़ियाँ, जैसे 1+1, आज़माएँ और हर नतीजा लिखकर देखें कि जोड़ सही है।"]},"result":{"en":"You will see how simple on-off parts can add numbers, the heart of a chip.","hi":"आप देखेंगे कि सादे ऑन-ऑफ़ पुर्ज़े भी अंक जोड़ सकते हैं, जो चिप का मूल है।"},"time":"45 min","cost":"Free"},"g":["machines","science"]},{"id":"c088","s":"it","p":627,"n":{"en":"Computer Network Architect","hi":"कंप्यूटर नेटवर्क वास्तुकार"},"w":{"en":"Designs how computers, phones and servers are connected, such as Wi-Fi, cables and routers, so data moves quickly and safely.","hi":"डिज़ाइन करता है कि कंप्यूटर, फ़ोन और सर्वर कैसे जुड़ें, जैसे वाई-फ़ाई, केबल और राउटर, ताकि डेटा तेज़ और सुरक्षित चले।"},"t":{"title":{"en":"Map your home Wi-Fi signal room by room","hi":"घर के वाई-फ़ाई सिग्नल का कमरे-दर-कमरे नक्शा बनाएँ"},"steps":{"en":["Draw your home's floor plan on paper and mark where the router is.","Stand in each room, check the Wi-Fi bars on your phone, and colour the room green, yellow or red.","Suggest a better router spot or an extra device to cover the red rooms."],"hi":["घर का नक्शा काग़ज़ पर बनाएँ और राउटर की जगह दिखाएँ।","हर कमरे में खड़े होकर फ़ोन पर वाई-फ़ाई के बार देखें और कमरे को हरा, पीला या लाल रंगें।","लाल कमरों के लिए राउटर की बेहतर जगह या कोई अतिरिक्त डिवाइस सुझाएँ।"]},"result":{"en":"You will have a signal map and a design suggestion like a network planner.","hi":"आपके पास सिग्नल का नक्शा और नेटवर्क प्लानर जैसा सुझाव होगा।"},"time":"30 min","cost":"Free"},"g":["machines","science"]},{"id":"c089","s":"it","p":629,"n":{"en":"Computer Science Engineer","hi":"कम्प्यूटर साइंस इंजीनियर"},"w":{"en":"Designs, writes and tests software, from apps and websites to systems that run behind the scenes, solving problems with code.","hi":"सॉफ़्टवेयर डिज़ाइन करता, लिखता और टेस्ट करता है, ऐप और वेबसाइट से लेकर पर्दे के पीछे चलने वाले सिस्टम तक, और कोड से समस्याएँ सुलझाता है।"},"t":{"title":{"en":"Code a tiny quiz game in Scratch","hi":"स्क्रैच में छोटा क्विज़ गेम कोड करें"},"steps":{"en":["Open Scratch, add a sprite and use 'ask and wait' blocks to ask 3 questions.","Use 'if-else' blocks to check each answer and keep a 'score' variable.","Show the final score at the end and play it with a friend."],"hi":["स्क्रैच खोलें, एक स्प्राइट जोड़ें और 'ask and wait' ब्लॉक से 3 सवाल पूछें।","'if-else' ब्लॉक से हर जवाब जाँचें और 'score' वेरिएबल रखें।","आख़िर में स्कोर दिखाएँ और दोस्त के साथ खेलकर देखें।"]},"result":{"en":"You will have a working mini game and know if building with code is fun for you.","hi":"आपके पास चलता हुआ छोटा गेम होगा और पता चलेगा कि कोड से चीज़ें बनाना आपको मज़ेदार लगता है या नहीं।"},"time":"1 hour","cost":"Free"},"g":["code"]},{"id":"c090","s":"it","p":631,"n":{"en":"Computer Scientist","hi":"संगणक वैज्ञानिक"},"w":{"en":"Researches how computers can solve problems better, inventing new methods, called algorithms, and testing how fast and efficient they are.","hi":"खोजता है कि कंप्यूटर समस्याएँ और बेहतर तरीक़े से कैसे सुलझाएँ, नए तरीक़े यानी एल्गोरिदम बनाता है और परखता है कि वे कितने तेज़ और कारगर हैं।"},"t":{"title":{"en":"Race two ways of sorting cards","hi":"पत्तों को सजाने के दो तरीक़ों की दौड़ कराएँ"},"steps":{"en":["Shuffle 8 playing cards or number slips. Sort them by repeatedly swapping neighbours, and count the swaps.","Shuffle again and sort by picking the smallest each time and placing it first. Count the moves.","Compare the counts and try with 12 cards to see which way grows slower."],"hi":["8 पत्ते या नंबर की पर्चियाँ मिलाएँ। पड़ोसी पत्ते बार-बार बदलकर क्रम में लगाएँ और बदलाव गिनें।","फिर मिलाएँ और हर बार सबसे छोटा पत्ता चुनकर आगे रखें। चालें गिनें।","गिनती की तुलना करें और 12 पत्तों से भी आज़माएँ कि कौन-सा तरीक़ा कम बढ़ता है।"]},"result":{"en":"You will see that different algorithms do the same job in different effort.","hi":"आप देखेंगे कि अलग-अलग एल्गोरिदम एक ही काम में अलग मेहनत लेते हैं।"},"time":"30 min","cost":"Free"},"g":["code","numbers","science"]},{"id":"c091","s":"it","p":633,"n":{"en":"Cybersecurity Specialist","hi":"साइबर सुरक्षा विशेषज्ञ"},"w":{"en":"Protects computers, networks and personal data from hackers, scams and viruses by finding weaknesses and fixing them.","hi":"कंप्यूटर, नेटवर्क और निजी डेटा को हैकर, ठगी और वायरस से बचाता है, कमज़ोरियाँ ढूँढता है और उन्हें ठीक करता है।"},"t":{"title":{"en":"Spot the fake: a phishing message quiz","hi":"नकली पहचानें: फ़िशिंग संदेशों की क्विज़"},"steps":{"en":["Write 6 short messages on cards, 3 real and 3 fake, such as a fake prize or 'your account is blocked'.","Show them to a family member and ask which are fake and why.","Note the warning signs, like urgency, odd links or spelling mistakes, and make a 3-point safety tip list."],"hi":["6 छोटे संदेश कार्ड पर लिखें, 3 असली और 3 नकली, जैसे नकली इनाम या 'आपका खाता बंद हो गया'।","किसी घरवाले को दिखाएँ और पूछें कि कौन-से नकली हैं और क्यों।","चेतावनी के संकेत लिखें, जैसे जल्दबाज़ी, अजीब लिंक या गलत वर्तनी, और 3 सुरक्षा सुझाव बनाएँ।"]},"result":{"en":"You will have a checklist to spot scams and a taste of a defender's thinking.","hi":"आपके पास ठगी पहचानने की चेकलिस्ट होगी और सुरक्षा करने वाले की सोच का स्वाद मिलेगा।"},"time":"30 min","cost":"Free"},"g":["code","people"]},{"id":"c092","s":"it","p":635,"n":{"en":"Data Scientist","hi":"डाटा वैज्ञानिक"},"w":{"en":"Uses maths, coding and statistics to turn raw data into predictions and clear answers that help people make decisions.","hi":"गणित, कोडिंग और सांख्यिकी से कच्चे डेटा को अनुमानों और साफ़ जवाबों में बदलता है ताकि लोग फ़ैसले ले सकें।"},"t":{"title":{"en":"Find a link between two body measurements","hi":"शरीर के दो नापों के बीच संबंध खोजें"},"steps":{"en":["Measure hand span and height of 10 friends or family members and write them in Google Sheets.","Make a scatter chart with hand span on one axis and height on the other.","Add a trendline and write whether taller people tend to have bigger hands, and why this may not be perfect."],"hi":["10 दोस्तों या घरवालों का हाथ का फैलाव और क़द नापकर गूगल शीट्स में लिखें।","स्कैटर चार्ट बनाएँ, एक अक्ष पर हाथ का फैलाव और दूसरे पर क़द।","ट्रेंडलाइन जोड़ें और लिखें कि क्या लंबे लोगों के हाथ बड़े होते हैं और यह पूरी तरह सही क्यों नहीं हो सकता।"]},"result":{"en":"You will have a chart showing a trend and learn to be careful when reading patterns.","hi":"आपके पास रुझान दिखाने वाला चार्ट होगा और पैटर्न पढ़ते समय सावधानी सीखेंगे।"},"time":"45 min","cost":"Free"},"g":["numbers","science"]},{"id":"c093","s":"it","p":637,"n":{"en":"Database Administrator","hi":"डेटाबेस एडमिनिस्ट्रेटर"},"w":{"en":"Organises, protects and maintains the databases that store a company's information, making sure data is accurate, safe and quick to find.","hi":"कंपनी की जानकारी रखने वाले डेटाबेस को व्यवस्थित, सुरक्षित और ठीक रखता है और देखता है कि डेटा सही हो और जल्दी मिल सके।"},"t":{"title":{"en":"Build a small library database in Google Sheets","hi":"गूगल शीट्स में छोटा लाइब्रेरी डेटाबेस बनाएँ"},"steps":{"en":["Make one tab for 10 books with ID, title and author, and another tab for members and their borrowed book ID.","Use VLOOKUP or XLOOKUP to show the book title next to each member's borrowed ID.","Add a duplicate ID on purpose, then use Data cleanup tools or a filter to find it."],"hi":["एक टैब में 10 किताबों की ID, नाम और लेखक लिखें और दूसरे टैब में सदस्य व उनकी ली हुई किताब की ID लिखें।","VLOOKUP या XLOOKUP से हर सदस्य की ID के आगे किताब का नाम दिखाएँ।","जान-बूझकर एक डुप्लीकेट ID डालें और डेटा क्लीनअप या फ़िल्टर से उसे ढूँढें।"]},"result":{"en":"You will have a linked two-table database and see why clean, unique records matter.","hi":"आपके पास जुड़े हुए दो टेबल का डेटाबेस होगा और समझ आएगा कि साफ़ और अलग-अलग रिकॉर्ड क्यों ज़रूरी हैं।"},"time":"1 hour","cost":"Free"},"g":["code","numbers"]},{"id":"c094","s":"it","p":639,"n":{"en":"Full Stack Developer","hi":"फुल स्टैक डेवलपर"},"w":{"en":"Builds both the part of a website or app that users see and the behind-the-scenes part that stores and handles data.","hi":"वेबसाइट या ऐप का वह हिस्सा बनाता है जो यूज़र देखते हैं, और वह भी जो पीछे डेटा संभालता है।"},"t":{"title":{"en":"Build a web page with a working button","hi":"चलने वाले बटन वाला वेब पेज बनाएँ"},"steps":{"en":["Open a free online HTML editor like W3Schools Tryit and type a heading and a button.","Add 3 lines of JavaScript so clicking the button changes the heading text.","Change the colours and words, then click the button to test it."],"hi":["W3Schools Tryit जैसा कोई फ्री ऑनलाइन HTML एडिटर खोलें और एक हेडिंग और एक बटन लिखें।","JavaScript की 3 लाइनें जोड़ें ताकि बटन दबाने पर हेडिंग का टेक्स्ट बदल जाए।","रंग और शब्द बदलें, फिर बटन दबाकर चेक करें कि सब चल रहा है।"]},"result":{"en":"You will have your own tiny working web page and know how a page and its code connect.","hi":"आपके पास अपना छोटा सा चलता हुआ वेब पेज होगा और समझ आएगा कि पेज और कोड कैसे जुड़ते हैं।"},"time":"45 min","cost":"Free"},"g":["code","build"]},{"id":"c095","s":"it","p":641,"n":{"en":"Game Designer and Developer","hi":"गेम डिजाइनर और डेवलपर"},"w":{"en":"Imagines game ideas, designs the levels and rules, and writes code so that the game actually runs and feels fun.","hi":"गेम के आइडिया सोचता है, लेवल और नियम बनाता है, और कोड लिखकर गेम को चलाता है ताकि खेलने में मज़ा आए।"},"t":{"title":{"en":"Make a catch-the-apple game in Scratch","hi":"Scratch में सेब पकड़ने वाला गेम बनाएँ"},"steps":{"en":["Open Scratch (free, online) and add a basket sprite that moves left and right with arrow keys.","Add an apple sprite that falls from the top; if the basket touches it, add 1 to the score.","Play it, then make it harder by speeding up the apple. Ask a friend to try."],"hi":["Scratch (फ्री, ऑनलाइन) खोलें और एक टोकरी स्प्राइट जोड़ें जो ऐरो की से दाएँ-बाएँ चले।","एक सेब स्प्राइट जोड़ें जो ऊपर से गिरे; टोकरी से छू जाए तो स्कोर में 1 जोड़ें।","गेम खेलें, फिर सेब की स्पीड बढ़ाकर उसे मुश्किल बनाएँ। किसी दोस्त से खिलवाकर देखें।"]},"result":{"en":"You will have a playable game and see how rules, score and difficulty make a game fun.","hi":"आपके पास खेलने लायक गेम होगा और समझ आएगा कि नियम, स्कोर और लेवल गेम को मज़ेदार कैसे बनाते हैं।"},"time":"1 hour","cost":"Free"},"g":["code","art"]},{"id":"c096","s":"it","p":643,"n":{"en":"Helpdesk Analyst","hi":"हेल्पडेस्क विश्लेषक"},"w":{"en":"Helps people solve computer, phone or software problems by asking the right questions and guiding them step by step.","hi":"कंप्यूटर, फोन या सॉफ्टवेयर की दिक्कत में सही सवाल पूछकर और स्टेप-बाय-स्टेप बताकर लोगों की मदद करता है।"},"t":{"title":{"en":"Solve a pretend tech problem by asking questions","hi":"सवाल पूछकर एक नकली टेक प्रॉब्लम सुलझाएँ"},"steps":{"en":["Ask a family member to pretend 'my phone will not charge' without telling you the cause.","Ask short questions one at a time (cable? socket? battery icon?) and note each answer.","Write your final checklist of steps, then see which question solved it fastest."],"hi":["घर के किसी सदस्य से कहें कि वे बिना कारण बताए बोलें 'मेरा फोन चार्ज नहीं हो रहा'।","एक-एक करके छोटे सवाल पूछें (केबल? सॉकेट? बैटरी का आइकन?) और हर जवाब लिखते जाएँ।","स्टेप्स की अपनी चेकलिस्ट बनाएँ और देखें कि कौन सा सवाल सबसे जल्दी काम आया।"]},"result":{"en":"You will have a troubleshooting checklist and a feel for how patient questioning finds the problem.","hi":"आपके पास प्रॉब्लम ढूँढने की चेकलिस्ट होगी और अंदाज़ा होगा कि धैर्य से सवाल पूछना कैसे काम आता है।"},"time":"30 min","cost":"Free"},"g":["people","service","machines"]},{"id":"c097","s":"it","p":645,"n":{"en":"Information Technology Engineer","hi":"सूचना प्रौद्योगिकी इंजीनियर"},"w":{"en":"Plans, sets up and looks after the computers, networks and software that an organisation needs to run smoothly.","hi":"किसी संस्था के कंप्यूटर, नेटवर्क और सॉफ्टवेयर को लगाता है, चलाता है और उनकी देखभाल करता है ताकि काम बिना रुकावट चले।"},"t":{"title":{"en":"Map the devices in your home","hi":"घर के डिवाइस का नक्शा बनाएँ"},"steps":{"en":["List every device at home that uses internet: phones, TV, laptop, speaker and so on.","Draw the Wi-Fi router in the middle and connect each device to it with lines.","Mark what would stop working if the router went off, and write one backup idea."],"hi":["घर के हर उस डिवाइस की लिस्ट बनाएँ जो इंटरनेट चलाता है: फोन, टीवी, लैपटॉप, स्पीकर वगैरह।","बीच में वाई-फाई राउटर बनाएँ और हर डिवाइस को लाइन से उससे जोड़ें।","निशान लगाएँ कि राउटर बंद होने पर क्या-क्या रुक जाएगा, और एक बैकअप आइडिया लिखें।"]},"result":{"en":"You will have a clear system diagram and see how one weak point can affect many things.","hi":"आपके पास साफ सिस्टम डायग्राम होगा और समझ आएगा कि एक कमज़ोर कड़ी कई चीज़ें रोक सकती है।"},"time":"30 min","cost":"Free"},"g":["machines","build"]},{"id":"c098","s":"it","p":647,"n":{"en":"Internet of Things Solutions Architect","hi":"इंटरनेट ऑफ थिंग्स सॉल्यूशंस आर्किटेक्ट"},"w":{"en":"Designs systems where sensors and everyday devices connect to the internet, collect data and act on it automatically.","hi":"ऐसे सिस्टम डिज़ाइन करता है जिनमें सेंसर और रोज़मर्रा के डिवाइस इंटरनेट से जुड़कर डेटा लेते हैं और खुद काम करते हैं।"},"t":{"title":{"en":"Design a smart plant-watering system on paper","hi":"कागज़ पर स्मार्ट पौधा-सिंचाई सिस्टम डिज़ाइन करें"},"steps":{"en":["Draw a plant pot and write which sensor you would add, such as a soil-moisture sensor.","Draw boxes: sensor, small brain, water pump, phone alert. Connect them with arrows.","Write the rules, like 'if soil is dry, pump for 5 seconds and message me'."],"hi":["पौधे का गमला बनाएँ और लिखें कि कौन सा सेंसर लगाएँगे, जैसे मिट्टी की नमी वाला सेंसर।","बॉक्स बनाएँ: सेंसर, छोटा दिमाग, पानी का पंप, फोन अलर्ट। उन्हें तीरों से जोड़ें।","नियम लिखें, जैसे 'मिट्टी सूखी हो तो 5 सेकंड पंप चलाओ और मुझे मैसेज भेजो'।"]},"result":{"en":"You will have a working design plan and learn the sense, decide, act pattern behind smart devices.","hi":"आपके पास एक डिज़ाइन प्लान होगा और स्मार्ट डिवाइस के पीछे का पैटर्न समझ आएगा: महसूस करो, तय करो, काम करो।"},"time":"45 min","cost":"Free"},"g":["machines","build"]},{"id":"c099","s":"it","p":649,"n":{"en":"Network Administrator","hi":"नेटवर्क एडमिनिस्ट्रेटर"},"w":{"en":"Keeps an organisation's computer network running, secure and fast, and fixes it when connections slow down or fail.","hi":"किसी संस्था के कंप्यूटर नेटवर्क को चालू, सुरक्षित और तेज़ रखता है, और कनेक्शन धीमा या बंद होने पर ठीक करता है।"},"t":{"title":{"en":"Find the Wi-Fi dead spots at home","hi":"घर में वाई-फाई की कमज़ोर जगहें ढूँढें"},"steps":{"en":["Draw a simple floor plan. Run a free speed-test website or app in 5 different rooms.","Write each speed on your plan and colour strong spots green and weak spots red.","Test a fix, like moving the router a little, and measure again to compare."],"hi":["घर का सीधा-सादा नक्शा बनाएँ। 5 अलग कमरों में फ्री स्पीड-टेस्ट वेबसाइट या ऐप चलाएँ।","हर कमरे की स्पीड नक्शे पर लिखें; तेज़ जगह हरी और कमज़ोर जगह लाल रंग से भरें।","एक उपाय आज़माएँ, जैसे राउटर थोड़ा हटाना, और फिर से नापकर तुलना करें।"]},"result":{"en":"You will have a Wi-Fi coverage map and know how testing and measuring guide network fixes.","hi":"आपके पास वाई-फाई कवरेज का नक्शा होगा और समझ आएगा कि नापकर नेटवर्क कैसे सुधारा जाता है।"},"time":"30 min","cost":"Free"},"g":["machines","science"]},{"id":"c100","s":"it","p":651,"n":{"en":"Programmer / Coder / Software Engineer","hi":"प्रोग्रामर/कोडर/सॉफ्टवेयर इंजीनियर"},"w":{"en":"Writes step-by-step instructions in a programming language so that computers can do useful tasks, and tests that they work.","hi":"प्रोग्रामिंग भाषा में स्टेप-बाय-स्टेप निर्देश लिखता है ताकि कंप्यूटर काम के काम कर सके, और जाँचता है कि वे सही चलें।"},"t":{"title":{"en":"Write a times-table program in Python","hi":"Python में पहाड़ा बनाने वाला प्रोग्राम लिखें"},"steps":{"en":["Open a free online Python editor and write code that asks the user for a number.","Add a loop that prints that number's table from 1 to 10.","Run it with 3 different numbers and fix any error message you see."],"hi":["कोई फ्री ऑनलाइन Python एडिटर खोलें और ऐसा कोड लिखें जो यूज़र से एक नंबर पूछे।","एक लूप जोड़ें जो उस नंबर का पहाड़ा 1 से 10 तक प्रिंट करे।","3 अलग नंबर डालकर चलाएँ और कोई एरर दिखे तो उसे ठीक करें।"]},"result":{"en":"You will have written and debugged a real program, and felt the write, run, fix cycle.","hi":"आपने एक असली प्रोग्राम लिखा और ठीक किया होगा, और लिखो, चलाओ, सुधारो वाला चक्र महसूस किया होगा।"},"time":"45 min","cost":"Free"},"g":["code","numbers"]},{"id":"c101","s":"it","p":653,"n":{"en":"SEO Manager","hi":"एस.ई.ओ. प्रबंधक"},"w":{"en":"Works to make a website show up higher in search results by understanding what words people type and improving the content.","hi":"यह समझकर कि लोग सर्च में क्या लिखते हैं, वेबसाइट का कंटेंट बेहतर करता है ताकि वह सर्च रिज़ल्ट में ऊपर आए।"},"t":{"title":{"en":"Write a page title that matches what people search","hi":"ऐसा पेज टाइटल लिखें जो लोगों की सर्च से मेल खाए"},"steps":{"en":["Pick a topic like 'study tips for class 10'. Type it in Google and note the suggested searches.","Look at the titles of the top 5 results and note common words.","Write your own page title under 60 characters and a one-line description using those words."],"hi":["कोई टॉपिक चुनें, जैसे 'क्लास 10 के लिए पढ़ाई के टिप्स'। Google में लिखें और सुझाए गए सर्च नोट करें।","टॉप 5 रिज़ल्ट के टाइटल देखें और उनमें बार-बार आने वाले शब्द लिखें।","उन्हीं शब्दों से 60 अक्षरों से कम का अपना पेज टाइटल और एक लाइन का डिस्क्रिप्शन लिखें।"]},"result":{"en":"You will have a search-friendly title and description and see how keywords connect people to pages.","hi":"आपके पास सर्च-फ्रेंडली टाइटल और डिस्क्रिप्शन होगा और समझ आएगा कि कीवर्ड लोगों को पेज तक कैसे पहुँचाते हैं।"},"time":"30 min","cost":"Free"},"g":["code","numbers"]},{"id":"c102","s":"it","p":655,"n":{"en":"Software Application Packager","hi":"सॉफ्टवेयर एप्लीकेशन पैकेजर"},"w":{"en":"Bundles software with everything it needs and clear install steps, so it can be set up easily on many computers.","hi":"सॉफ्टवेयर को उसकी ज़रूरी फाइलों और साफ इंस्टॉल स्टेप्स के साथ पैक करता है ताकि वह कई कंप्यूटरों पर आसानी से लग सके।"},"t":{"title":{"en":"Pack a pretend app with install steps","hi":"एक नकली ऐप को इंस्टॉल स्टेप्स के साथ पैक करें"},"steps":{"en":["Make a folder named for an imaginary app. Add an app file, an icon image and a readme note.","Write 5 numbered install steps in the readme, in very simple words.","Ask a family member to follow them without your help; note where they get stuck and fix it."],"hi":["किसी काल्पनिक ऐप के नाम से एक फोल्डर बनाएँ। उसमें ऐप फाइल, आइकन इमेज और एक readme नोट रखें।","readme में बहुत आसान शब्दों में 5 नंबर वाले इंस्टॉल स्टेप्स लिखें।","किसी घरवाले से बिना आपकी मदद के उन्हें फॉलो करवाएँ; जहाँ अटकें वह नोट करें और स्टेप्स सुधारें।"]},"result":{"en":"You will have a neat package with clear instructions and see why simple steps matter.","hi":"आपके पास साफ निर्देशों वाला एक सुथरा पैकेज होगा और समझ आएगा कि आसान स्टेप्स क्यों ज़रूरी हैं।"},"time":"45 min","cost":"Free"},"g":["build","machines","people"]},{"id":"c103","s":"it","p":657,"n":{"en":"Systems Analyst","hi":"सिस्टम एनालिस्ट"},"w":{"en":"Studies how a business or process works, finds where it is slow or confusing, and plans how a computer system can improve it.","hi":"देखता है कि कोई कारोबार या प्रोसेस कैसे चलता है, कहाँ धीमा या उलझा है, और कंप्यूटर सिस्टम से उसे कैसे सुधारा जाए।"},"t":{"title":{"en":"Draw a flowchart and find the slow step","hi":"फ्लोचार्ट बनाकर धीमा स्टेप ढूँढें"},"steps":{"en":["Pick a process like issuing a library book. Write every step in order, with who does it.","Draw the steps as boxes and arrows, and note roughly how long each takes.","Circle the slowest step and write one idea to make it faster."],"hi":["कोई प्रोसेस चुनें, जैसे लाइब्रेरी से किताब इश्यू होना। हर स्टेप क्रम से लिखें और यह भी कि कौन करता है।","स्टेप्स को बॉक्स और तीरों से बनाएँ और हर एक में लगभग कितना समय लगता है लिखें।","सबसे धीमे स्टेप पर गोला लगाएँ और उसे तेज़ करने का एक आइडिया लिखें।"]},"result":{"en":"You will have a process flowchart with one clear improvement idea.","hi":"आपके पास प्रोसेस का फ्लोचार्ट होगा और सुधार का एक साफ आइडिया भी।"},"time":"30 min","cost":"Free"},"g":["numbers","people"]},{"id":"c104","s":"it","p":659,"n":{"en":"User Experience Designer","hi":"यूजर एक्सपीरियंस डिजाइनर"},"w":{"en":"Designs apps and websites so they are easy, clear and pleasant to use, by studying how real people use them.","hi":"ऐप और वेबसाइट को ऐसा डिज़ाइन करता है कि वे आसान, साफ और इस्तेमाल में अच्छे लगें, यह देखकर कि असली लोग उन्हें कैसे चलाते हैं।"},"t":{"title":{"en":"Make and test a paper app prototype","hi":"कागज़ का ऐप प्रोटोटाइप बनाकर टेस्ट करें"},"steps":{"en":["Pick an app idea, like a homework reminder. Sketch 3 screens on separate paper cards.","Ask a family member to 'tap' the cards to add a reminder; you swap the screens.","Note where they hesitated or got confused, then redraw one screen to fix it."],"hi":["ऐप का आइडिया चुनें, जैसे होमवर्क रिमाइंडर। अलग-अलग कागज़ के कार्ड पर 3 स्क्रीन बनाएँ।","किसी घरवाले से कार्ड पर 'टैप' करके रिमाइंडर लगवाएँ; स्क्रीन आप बदलते जाएँ।","जहाँ वे अटके या उलझे वह लिखें, फिर एक स्क्रीन दोबारा बनाकर सुधारें।"]},"result":{"en":"You will have a tested prototype and learn that users show you what needs fixing.","hi":"आपके पास टेस्ट किया हुआ प्रोटोटाइप होगा और समझ आएगा कि यूज़र ही बताते हैं कि क्या सुधारना है।"},"time":"45 min","cost":"Free"},"g":["art","people"]},{"id":"c105","s":"it","p":661,"n":{"en":"Virtual Reality Engineer","hi":"वर्चुअल रियलिटी इंजीनियर"},"w":{"en":"Builds immersive 3D worlds and the hardware and software that let people look around and interact as if they were there.","hi":"3D की ऐसी दुनिया और उसे चलाने वाले हार्डवेयर-सॉफ्टवेयर बनाता है जिनमें लोग चारों ओर देख सकें और ऐसे चीज़ें छू सकें जैसे वहीं हों।"},"t":{"title":{"en":"Capture a room in panorama and test the illusion","hi":"कमरे का पैनोरमा लेकर भ्रम को परखें"},"steps":{"en":["Use your phone camera's panorama mode to capture your room slowly while turning on the spot.","View it on your phone and turn around with it. Note what feels real and what feels odd.","List 3 things a real VR system needs to fix the odd parts, such as head tracking or sound."],"hi":["फोन के कैमरे के पैनोरमा मोड से अपनी जगह पर घूमते हुए धीरे-धीरे कमरा कैप्चर करें।","उसे फोन पर देखें और खुद भी घूमकर देखें। लिखें कि क्या असली लगा और क्या अजीब।","अजीब बातें ठीक करने के लिए असली VR को जो 3 चीज़ें चाहिए वे लिखें, जैसे हेड ट्रैकिंग या आवाज़।"]},"result":{"en":"You will understand what makes a space feel real and what VR must add.","hi":"आपको समझ आएगा कि कोई जगह असली कैसे लगती है और VR को उसमें क्या जोड़ना पड़ता है।"},"time":"30 min","cost":"Free"},"g":["machines","science"]},{"id":"c106","s":"it","p":663,"n":{"en":"Web Analyst","hi":"वेब एनालिस्ट"},"w":{"en":"Studies data about how visitors use a website, then explains what is working and suggests changes to get better results.","hi":"वेबसाइट पर आने वालों के डेटा को देखकर बताता है कि क्या काम कर रहा है और नतीजे बेहतर करने के लिए क्या बदलें।"},"t":{"title":{"en":"Chart visitor numbers in Google Sheets","hi":"Google Sheets में विज़िटर के नंबर का चार्ट बनाएँ"},"steps":{"en":["In Google Sheets, make practice data: 7 days of visitors to an imaginary blog, plus pages viewed.","Insert a line chart of visitors per day and find the best and worst day.","Write two guesses why, and one change you would test, like posting at a different time."],"hi":["Google Sheets में प्रैक्टिस डेटा बनाएँ: किसी काल्पनिक ब्लॉग पर 7 दिन के विज़िटर और देखे गए पेज।","रोज़ के विज़िटर का लाइन चार्ट बनाएँ और सबसे अच्छा और सबसे खराब दिन ढूँढें।","दो अंदाज़े लिखें कि ऐसा क्यों हुआ, और एक बदलाव जो आप आज़माएँगे, जैसे दूसरे समय पर पोस्ट करना।"]},"result":{"en":"You will have a chart and a short data story with one idea to test.","hi":"आपके पास एक चार्ट और डेटा की छोटी कहानी होगी, साथ में आज़माने लायक एक आइडिया।"},"time":"30 min","cost":"Free"},"g":["numbers","code"]},{"id":"c107","s":"it","p":665,"n":{"en":"Web Designer","hi":"वेब डिजाइनर"},"w":{"en":"Designs how websites look, from layout, colours and fonts to buttons and images, so that pages are attractive and easy to read.","hi":"वेबसाइट का रूप तय करता है, यानी लेआउट, रंग, फॉन्ट, बटन और तस्वीरें, ताकि पेज सुंदर दिखें और पढ़ने में आसान हों।"},"t":{"title":{"en":"Design a one-page personal website in Canva","hi":"Canva में अपनी एक पेज की वेबसाइट डिज़ाइन करें"},"steps":{"en":["Open free Canva and choose a website template. Replace the text with your name and hobbies.","Pick 2 colours and 1 or 2 fonts, then arrange a heading, a photo and 3 sections.","View it at phone size and fix anything hard to read."],"hi":["फ्री Canva खोलें और वेबसाइट टेम्पलेट चुनें। टेक्स्ट की जगह अपना नाम और शौक लिखें।","2 रंग और 1-2 फॉन्ट चुनें, फिर हेडिंग, एक फोटो और 3 सेक्शन सजाएँ।","उसे फोन की साइज़ में देखें और जो पढ़ने में मुश्किल लगे उसे ठीक करें।"]},"result":{"en":"You will have a finished page design and learn how layout and colour guide the eye.","hi":"आपके पास पूरा पेज डिज़ाइन होगा और समझ आएगा कि लेआउट और रंग नज़र को कैसे रास्ता दिखाते हैं।"},"time":"45 min","cost":"Free"},"g":["art","code"]},{"id":"c108","s":"mgmt","p":669,"n":{"en":"Assistant Catering Manager","hi":"सहायक खान-पान प्रबंधक"},"w":{"en":"Helps plan menus, manage kitchen and serving staff, control food quantity and cost, and make sure guests are served well.","hi":"मेन्यू बनाने, किचन और सर्विस स्टाफ संभालने, खाने की मात्रा और खर्च पर नज़र रखने और मेहमानों की अच्छी सेवा में मदद करता है।"},"t":{"title":{"en":"Plan a menu and budget for 10 guests","hi":"10 मेहमानों का मेन्यू और बजट बनाएँ"},"steps":{"en":["Choose 4 dishes for a small party of 10 people, including one for guests who do not eat spicy food.","Write the ingredients and quantity needed per person, then multiply for 10.","Ask at home for real prices of the ingredients and add up the total cost per plate."],"hi":["10 लोगों की छोटी पार्टी के लिए 4 डिश चुनें, जिनमें एक कम मसालेदार खाने वालों के लिए हो।","सामग्री और प्रति व्यक्ति मात्रा लिखें, फिर 10 से गुणा करें।","घर पर असली दाम पूछकर कुल खर्च और प्रति प्लेट खर्च जोड़ें।"]},"result":{"en":"You will have a menu with a quantity list and cost per plate.","hi":"आपके पास मात्रा की लिस्ट और प्रति प्लेट खर्च के साथ तैयार मेन्यू होगा।"},"time":"45 min","cost":"Free"},"g":["food","numbers","people"]},{"id":"c109","s":"mgmt","p":671,"n":{"en":"BPO Executive","hi":"बी.पी.ओ. कार्यकारी"},"w":{"en":"Talks to customers on calls or chat for a company, answers questions, solves problems and keeps the customer happy.","hi":"किसी कंपनी की तरफ से कॉल या चैट पर ग्राहकों से बात करता है, सवालों के जवाब देता है और उनकी समस्या सुलझाकर उन्हें खुश रखता है।"},"t":{"title":{"en":"Role-play and record a customer call","hi":"कस्टमर कॉल का रोल-प्ले करके रिकॉर्ड करें"},"steps":{"en":["Ask a friend to be a customer asking 'where is my order?'. You greet, listen and note the details.","Repeat the problem back, offer a clear answer and close politely. Record it on your phone.","Play it back and check your tone, speed and clarity. Then try once more."],"hi":["किसी दोस्त को ग्राहक बनाएँ जो पूछे 'मेरा ऑर्डर कहाँ है?'। आप नमस्ते करें, ध्यान से सुनें और जानकारी नोट करें।","समस्या दोहराएँ, साफ जवाब दें और विनम्रता से कॉल खत्म करें। फोन पर रिकॉर्ड करें।","रिकॉर्डिंग सुनें और अपनी आवाज़, स्पीड और साफ बोलने की जाँच करें। फिर एक बार और करें।"]},"result":{"en":"You will hear yourself as a customer would and know if you enjoy this kind of talking and helping.","hi":"आप खुद को ग्राहक की तरह सुनेंगे और पता चलेगा कि आपको इस तरह बात करके मदद करना पसंद है या नहीं।"},"time":"30 min","cost":"Free"},"g":["people","service"]},{"id":"c110","s":"mgmt","p":673,"n":{"en":"Programme Manager","hi":"कार्यक्रम प्रबंधक"},"w":{"en":"Leads a group of related projects towards one big goal, keeping plans, people, time and budget on track.","hi":"एक बड़े लक्ष्य के लिए कई जुड़े हुए प्रोजेक्ट चलाता है और प्लान, लोग, समय और बजट को ठीक रास्ते पर रखता है।"},"t":{"title":{"en":"Plan a one-week class reading drive","hi":"क्लास के लिए एक हफ्ते का रीडिंग अभियान प्लान करें"},"steps":{"en":["Write the goal, like 'every classmate reads 1 book this week', and list 5 tasks needed.","Make a table of task, who does it and the deadline. Put it in a Google Sheet or on paper.","Add 3 things that could go wrong, with a backup plan for each."],"hi":["लक्ष्य लिखें, जैसे 'इस हफ्ते क्लास का हर बच्चा 1 किताब पढ़े', और ज़रूरी 5 काम लिखें।","काम, करने वाला और आखिरी तारीख की तालिका बनाएँ। Google Sheet या कागज़ पर बना लें।","3 बातें लिखें जो गड़बड़ हो सकती हैं और हर एक के लिए बैकअप प्लान सोचें।"]},"result":{"en":"You will have a clear one-page plan with owners, dates and risks.","hi":"आपके पास एक पेज का साफ प्लान होगा जिसमें ज़िम्मेदार लोग, तारीखें और जोखिम लिखे होंगे।"},"time":"45 min","cost":"Free"},"g":["people","service"]},{"id":"c111","s":"mgmt","p":675,"n":{"en":"Human Resource Manager","hi":"मानव संसाधन प्रबंधक"},"w":{"en":"Hires the right people, helps them learn and grow, handles their concerns, and builds a fair and healthy workplace.","hi":"सही लोगों को चुनता है, उन्हें सीखने-बढ़ने में मदद करता है, उनकी परेशानियाँ सुनता है और काम की जगह को निष्पक्ष और अच्छा बनाता है।"},"t":{"title":{"en":"Run a mock interview for class monitor","hi":"क्लास मॉनिटर के लिए मॉक इंटरव्यू लें"},"steps":{"en":["Write a short job ad for 'class monitor' with 3 skills needed.","Prepare 5 interview questions and a score sheet from 1 to 5 for each skill.","Interview a friend or family member, score them fairly and give one kind feedback line."],"hi":["'क्लास मॉनिटर' का छोटा सा जॉब विज्ञापन लिखें, जिसमें 3 ज़रूरी गुण हों।","5 इंटरव्यू सवाल और हर गुण के लिए 1 से 5 वाली स्कोर शीट बनाएँ।","किसी दोस्त या घरवाले का इंटरव्यू लें, निष्पक्षता से स्कोर दें और एक प्यार भरी फीडबैक लाइन बोलें।"]},"result":{"en":"You will have tried choosing people fairly and giving feedback kindly.","hi":"आपने लोगों को निष्पक्षता से चुनने और अच्छे ढंग से फीडबैक देने का अनुभव लिया होगा।"},"time":"45 min","cost":"Free"},"g":["people","justice"]},{"id":"c112","s":"mgmt","p":677,"n":{"en":"Inventory Manager","hi":"इन्वेंटरी प्रबंधक"},"w":{"en":"Keeps track of how much stock a business has, where it is stored, and when to order more so nothing runs out or gets wasted.","hi":"ध्यान रखता है कि कारोबार के पास कितना माल है, कहाँ रखा है और कब और मँगाना है, ताकि न कुछ खत्म हो और न बर्बाद हो।"},"t":{"title":{"en":"Make a stock sheet for your kitchen shelf","hi":"रसोई की शेल्फ की स्टॉक शीट बनाएँ"},"steps":{"en":["Pick one kitchen shelf and count 10 items such as rice, dal, tea or biscuits.","Write each in a table: item, quantity now, and how much the family uses in a week.","Set a 'reorder level' for each item and mark what needs to be bought soon."],"hi":["रसोई की कोई एक शेल्फ चुनें और 10 चीज़ें गिनें, जैसे चावल, दाल, चाय या बिस्कुट।","तालिका में लिखें: चीज़, अभी कितनी है और परिवार हफ्ते में कितनी इस्तेमाल करता है।","हर चीज़ का 'रीऑर्डर लेवल' तय करें और निशान लगाएँ कि कौन सी जल्दी मँगानी है।"]},"result":{"en":"You will have a working stock sheet and see how reorder levels prevent shortages.","hi":"आपके पास चलने वाली स्टॉक शीट होगी और समझ आएगा कि रीऑर्डर लेवल से कमी कैसे रोकी जाती है।"},"time":"30 min","cost":"Free"},"g":["numbers","money"]},{"id":"c113","s":"mgmt","p":679,"n":{"en":"Knowledge Process Outsourcing Executive","hi":"नॉलेज प्रोसेस आउटसोर्सिंग एग्जीक्यूटिव"},"w":{"en":"Does research, data analysis or expert-level writing for other companies, turning information into clear, reliable reports.","hi":"दूसरी कंपनियों के लिए रिसर्च, डेटा एनालिसिस या विशेषज्ञ स्तर की लिखाई करता है और जानकारी को साफ, भरोसेमंद रिपोर्ट में बदलता है।"},"t":{"title":{"en":"Research a question and write a one-page brief","hi":"एक सवाल पर रिसर्च करके एक पेज की रिपोर्ट लिखें"},"steps":{"en":["Pick a question like 'Which free apps help learn English?'. Find 3 different sources.","Make a comparison table of what each source says. Note the source name for every fact.","Write a 5-line summary with your recommendation, and mark anything you are unsure about."],"hi":["कोई सवाल चुनें, जैसे 'अंग्रेज़ी सीखने में कौन से फ्री ऐप मदद करते हैं?'। 3 अलग स्रोत ढूँढें।","तुलना की तालिका बनाएँ कि हर स्रोत क्या कहता है। हर बात के साथ स्रोत का नाम लिखें।","अपनी सिफारिश के साथ 5 लाइन का सार लिखें और जिस बात पर शक हो उस पर निशान लगाएँ।"]},"result":{"en":"You will have a sourced one-page brief and know how careful research feels.","hi":"आपके पास स्रोतों वाली एक पेज की रिपोर्ट होगी और समझ आएगा कि ध्यान से रिसर्च करना कैसा लगता है।"},"time":"1 hour","cost":"Free"},"g":["science","numbers"]},{"id":"c114","s":"mgmt","p":681,"n":{"en":"Purchase and Materials Manager","hi":"क्रय एवं सामग्री प्रबंधक"},"w":{"en":"Buys the materials and supplies a company needs, comparing sellers on price, quality and delivery to get the best deal.","hi":"कंपनी के लिए ज़रूरी सामान खरीदता है और दाम, क्वालिटी और डिलीवरी के हिसाब से विक्रेताओं की तुलना करके सबसे अच्छा सौदा चुनता है।"},"t":{"title":{"en":"Compare 3 sellers and choose the best deal","hi":"3 विक्रेताओं की तुलना करके सबसे अच्छा सौदा चुनें"},"steps":{"en":["Pick an item, like a pack of 6 notebooks. Check its price at 3 places: shops or free shopping websites.","Make a table with price, quality, delivery time and return option for each seller.","Give each a score, choose one and write 2 lines on why it won."],"hi":["कोई चीज़ चुनें, जैसे 6 कॉपियों का पैक। 3 जगह उसका दाम देखें: दुकानें या फ्री शॉपिंग वेबसाइट।","हर विक्रेता के लिए दाम, क्वालिटी, डिलीवरी का समय और वापसी की सुविधा की तालिका बनाएँ।","हर एक को अंक दें, एक चुनें और 2 लाइन में लिखें कि वही क्यों जीता।"]},"result":{"en":"You will have a comparison table and a reasoned buying decision.","hi":"आपके पास तुलना की तालिका और सोच-समझकर लिया गया खरीद का फैसला होगा।"},"time":"45 min","cost":"Free"},"g":["money","numbers"]},{"id":"c115","s":"mgmt","p":683,"n":{"en":"Retail Manager","hi":"खुदरा प्रबंधक"},"w":{"en":"Runs a shop or store day to day: arranging products, managing staff, keeping stock and making sure customers enjoy shopping.","hi":"दुकान या स्टोर रोज़ चलाता है: सामान सजाना, स्टाफ संभालना, स्टॉक रखना और ग्राहकों को खरीदारी का अच्छा अनुभव देना।"},"t":{"title":{"en":"Open a pretend shop at home","hi":"घर पर नकली दुकान खोलें"},"steps":{"en":["Pick 10 household items, make paper price tags and arrange them on a table like shelves.","Ask family to shop for 10 minutes using pretend money while you help them and bill them.","Note which items sold first and rearrange the shelf to help slower items."],"hi":["घर की 10 चीज़ें चुनें, कागज़ के प्राइस टैग बनाएँ और उन्हें मेज़ पर शेल्फ की तरह सजाएँ।","घरवालों से 10 मिनट नकली पैसों से खरीदारी करवाएँ; आप उनकी मदद करें और बिल बनाएँ।","लिखें कि कौन सी चीज़ें पहले बिकीं और धीमी बिकने वाली चीज़ों के लिए शेल्फ दोबारा सजाएँ।"]},"result":{"en":"You will see how display, pricing and service affect what customers buy.","hi":"आपको दिखेगा कि सजावट, दाम और सेवा से ग्राहक की खरीदारी कैसे बदलती है।"},"time":"45 min","cost":"Free"},"g":["money","people"]},{"id":"c116","s":"mgmt","p":685,"n":{"en":"Rural Development Manager / Specialist","hi":"ग्रामीण विकास प्रबंधक/विशेषज्ञ"},"w":{"en":"Works with villages and local people to plan and run projects on things like water, farming, roads, health and livelihoods.","hi":"गाँवों और स्थानीय लोगों के साथ मिलकर पानी, खेती, सड़क, स्वास्थ्य और रोज़गार जैसे कामों के प्रोजेक्ट बनाता और चलाता है।"},"t":{"title":{"en":"Make a problem tree for a village issue","hi":"गाँव की एक समस्या का प्रॉब्लम ट्री बनाएँ"},"steps":{"en":["Pick a local problem, like water shortage or poor road. Write it as the tree trunk.","Ask an elder or family member for 3 causes (roots) and write them down.","Add 3 practical solutions as branches and list who in the village should be involved."],"hi":["कोई स्थानीय समस्या चुनें, जैसे पानी की कमी या खराब सड़क। उसे पेड़ के तने की जगह लिखें।","किसी बुज़ुर्ग या घरवाले से 3 कारण (जड़ें) पूछकर लिखें।","3 व्यावहारिक समाधान शाखाओं की तरह जोड़ें और लिखें कि गाँव में किन-किन को शामिल करना चाहिए।"]},"result":{"en":"You will have a problem tree that links causes to solutions and people.","hi":"आपके पास प्रॉब्लम ट्री होगा जो कारणों को समाधान और लोगों
