कार देता और चमकाता है ताकि वे चमकें और गहनों या सजावट में लग सकें।"},"t":{"title":{"en":"Polish a pebble by hand","hi":"एक कंकड़ को हाथ से चमकाएँ"},"steps":{"en":["Pick a smooth pebble and photograph it. Get a coarse and a fine sandpaper sheet (about ₹20 each).","Dip the pebble in water and rub it on the coarse paper for 10 minutes. Then rub it on the fine paper for 10 more.","Dry it, and compare with your first photo for colour and shine. Wash your hands well afterwards."],"hi":["एक चिकना कंकड़ चुनें और उसकी फ़ोटो लें। मोटा और बारीक रेगमाल (करीब ₹20 प्रति शीट) लें।","कंकड़ को पानी में भिगोकर मोटे रेगमाल पर 10 मिनट घिसें। फिर बारीक रेगमाल पर 10 मिनट और घिसें।","सुखाएँ और पहली फ़ोटो से रंग और चमक की तुलना करें। बाद में हाथ अच्छे से धो लें।"]},"result":{"en":"You will have a polished stone and know if slow, patient shaping work suits you.","hi":"आपके पास चमकाया हुआ पत्थर होगा और पता चलेगा कि धैर्य वाला घिसने-तराशने का काम आपको जँचता है या नहीं।"},"time":"45 min","cost":"Under ₹100"},"g":["art","science"]},{"id":"c246","s":"trades","p":953,"n":{"en":"Leather Technician","hi":"चमड़ा तकनीशियन"},"w":{"en":"Works with leather in tanneries and workshops, checking quality, cutting and finishing it for shoes, bags, belts and other goods.","hi":"चमड़ा तकनीशियन टैनरी और वर्कशॉप में चमड़े पर काम करता है, उसकी क्वालिटी जाँचता है और जूते, बैग, बेल्ट जैसे सामान के लिए उसे काटता और फ़िनिश करता है।"},"t":{"title":{"en":"Compare leather, rexine and cloth","hi":"चमड़े, रेक्सीन और कपड़े की तुलना करें"},"steps":{"en":["Find small pieces of three materials from old belts, wallets, bags or shoes. Label them A, B, C.","Test each one: put a drop of water on it, stretch it gently, bend it 20 times and press a fingernail on it.","Record the results in a table and guess which one is real leather and which suits a bag."],"hi":["पुरानी बेल्ट, पर्स, बैग या जूतों से तीन चीज़ों के छोटे टुकड़े ढूँढें। उन पर A, B, C लिखें।","हर एक का टेस्ट करें: पानी की एक बूँद डालें, हल्का खींचें, 20 बार मोड़ें और नाखून से दबाएँ।","नतीजे तालिका में लिखें और अंदाज़ा लगाएँ कि असली चमड़ा कौन-सा है और बैग के लिए कौन-सा ठीक रहेगा।"]},"result":{"en":"You will have a materials test table and a feel for judging quality by testing.","hi":"आपके पास सामग्री-परीक्षण की तालिका होगी और टेस्ट करके क्वालिटी परखने का अनुभव मिलेगा।"},"time":"30 min","cost":"Free"},"g":["science","art"]},{"id":"c247","s":"trades","p":955,"n":{"en":"Light Motor Vehicle Driver","hi":"लाइट मोटर व्हीकल ड्राइवर"},"w":{"en":"Drives cars and small vehicles safely to carry people or goods, following traffic rules and staying alert on the road.","hi":"लाइट मोटर व्हीकल ड्राइवर कार और छोटे वाहन सुरक्षित चलाकर लोगों या सामान को पहुँचाता है, ट्रैफ़िक नियम मानता है और सड़क पर चौकस रहता है।"},"t":{"title":{"en":"Measure your reaction time with a ruler","hi":"स्केल से अपना रिएक्शन टाइम नापें"},"steps":{"en":["Ask a friend to hold a 30 cm ruler at its top while your fingers are open at the bottom, ready to catch it.","The friend drops it without warning. Catch it and read the number where your fingers stopped. Do five tries.","Repeat five times while chatting or looking at a phone screen. Compare the average distances."],"hi":["किसी दोस्त से 30 सेमी का स्केल ऊपर से पकड़वाएँ, आपकी खुली उँगलियाँ नीचे उसे पकड़ने को तैयार हों।","दोस्त बिना बताए स्केल छोड़ दे। पकड़ें और देखें उँगलियाँ किस अंक पर रुकीं। पाँच बार करें।","अब बातें करते हुए या फ़ोन स्क्रीन देखते हुए पाँच बार दोहराएँ। औसत दूरी की तुलना करें।"]},"result":{"en":"You will see how distraction slows your reaction, a key reason drivers must stay alert.","hi":"आप देखेंगे कि ध्यान भटकने से आपकी प्रतिक्रिया धीमी हो जाती है, यही वजह है कि ड्राइवर को चौकस रहना ज़रूरी है।"},"time":"15 min","cost":"Free"},"g":["travel","science"]},{"id":"c248","s":"trades","p":957,"n":{"en":"Mason (General)","hi":"राजमिस्त्री (सामान्य)"},"w":{"en":"Builds walls, floors and structures by laying bricks or blocks with mortar, keeping them level, straight and strong.","hi":"राजमिस्त्री (सामान्य) ईंटों या ब्लॉकों को गारे से जोड़कर दीवारें, फ़र्श और ढाँचे बनाता है और उन्हें बराबर, सीधा और मज़बूत रखता है।"},"t":{"title":{"en":"Build two mini walls and test them","hi":"दो छोटी दीवारें बनाकर परखें"},"steps":{"en":["Using 12 matchboxes or similar blocks, build one wall with joints lined up and one with each row shifted half a block.","Use a string with a weight as a plumb line and a half-filled water bottle as a level to check each wall.","Gently push the top of each wall. Note which one stays up better and why."],"hi":["12 माचिस की डिब्बियाँ या ऐसे ही ब्लॉक लेकर एक दीवार जोड़ें एक सीध में बनाएँ और दूसरी में हर पंक्ति आधा ब्लॉक खिसकाकर।","धागे और वज़न से साहुल और आधी भरी पानी की बोतल से लेवल बनाकर हर दीवार जाँचें।","हर दीवार के ऊपरी हिस्से को धीरे से धकेलें। देखें कौन-सी ज़्यादा टिकती है और क्यों।"]},"result":{"en":"You will learn why masons stagger bricks and how they check walls are straight.","hi":"आप जानेंगे कि राजमिस्त्री ईंटें आधी खिसकाकर क्यों लगाते हैं और दीवार सीधी है यह कैसे जाँचते हैं।"},"time":"30 min","cost":"Free"},"g":["build","science"]},{"id":"c249","s":"trades","p":959,"n":{"en":"Stone Mason","hi":"राजमिस्त्री (पत्थर)"},"w":{"en":"Cuts, shapes and stacks stone to build walls, steps, floors and monuments that stay strong for years.","hi":"पत्थर को काटकर, आकार देकर और जोड़कर दीवारें, सीढ़ियाँ और फर्श बनाता है, जो सालों तक मज़बूत रहते हैं।"},"t":{"title":{"en":"Build a dry-stone wall from pebbles","hi":"कंकड़-पत्थरों की सूखी दीवार बनाएँ"},"steps":{"en":["Collect 15 to 20 stones of different sizes and sort them: big for the base, flat for the top.","Stack them without any glue, a row at a time, so joints do not line up.","Gently push the wall and tap the top. Note which stones wobble and fix them."],"hi":["अलग-अलग आकार के 15-20 पत्थर इकट्ठा करें और छाँटें: बड़े नीचे के लिए, चपटे ऊपर के लिए।","बिना गोंद के एक-एक परत लगाएँ, ध्यान रखें कि जोड़ एक सीध में न आएँ।","दीवार को हल्के से धक्का दें और ऊपर थपथपाएँ। जो पत्थर हिले, उसे ठीक करें।"]},"result":{"en":"You will have a small stable wall and a feel for balancing and fitting stone.","hi":"आपके पास एक छोटी मज़बूत दीवार होगी और पत्थर जमाने का अंदाज़ा आ जाएगा।"},"time":"30 min","cost":"Free"},"g":["build","machines"]},{"id":"c250","s":"trades","p":961,"n":{"en":"Tile Mason (Tiling)","hi":"राजमिस्त्री (टाइलिंग)"},"w":{"en":"Lays tiles on floors and walls in straight, even lines, with neat gaps and clean cuts at the edges.","hi":"फर्श और दीवारों पर टाइलें सीधी, बराबर लाइन में, एक जैसे गैप के साथ लगाता है और किनारों पर सफ़ाई से कटाई करता है।"},"t":{"title":{"en":"Plan a tile layout on paper","hi":"कागज़ पर टाइल का नक्शा बनाएँ"},"steps":{"en":["Draw a floor of 120 cm by 90 cm on graph paper. Let each square be 10 cm.","Cut paper tiles of 30 cm by 30 cm and lay them out from the centre.","Count how many full tiles fit and how many need cutting at the edges."],"hi":["ग्राफ़ पेपर पर 120 सेमी x 90 सेमी का फर्श बनाएँ। हर खाना 10 सेमी का मानें।","30 सेमी x 30 सेमी की कागज़ की टाइलें काटें और बीच से बिछाना शुरू करें।","गिनें कि कितनी पूरी टाइलें आईं और किनारों पर कितनी काटनी पड़ेंगी।"]},"result":{"en":"You will have a tile plan and know how mistakes in measuring show up as crooked rows.","hi":"आपके पास टाइल का एक नक्शा होगा और समझ आएगा कि नाप की गलती से लाइन कैसे टेढ़ी होती है।"},"time":"45 min","cost":"Free"},"g":["build","numbers"]},{"id":"c251","s":"trades","p":963,"n":{"en":"Master Hand Embroiderer (Hand-Crafted Textiles)","hi":"मास्टर हैंड एम्ब्रॉयडर (हैंड क्राफ्टेड टेक्सटाइल्स)"},"w":{"en":"Decorates cloth by hand with needle and thread, making patterns and motifs for clothes, home items and crafts.","hi":"सुई-धागे से कपड़े पर हाथ से डिज़ाइन और बूटे बनाता है, जो कपड़ों, घर की चीज़ों और हस्तशिल्प में लगते हैं।"},"t":{"title":{"en":"Stitch a small flower motif","hi":"कपड़े पर एक छोटा फूल काढ़ें"},"steps":{"en":["Draw a small flower with a pencil on a piece of old cloth.","Stitch the outline with a running stitch, then fill the petals with a satin stitch.","Look at the back and front. Count where stitches are uneven and try one more petal."],"hi":["पुराने कपड़े के टुकड़े पर पेंसिल से एक छोटा फूल बनाएँ।","बाहरी लाइन पर सीधी सिलाई करें, फिर पंखुड़ियाँ सैटिन स्टिच से भरें।","आगे और पीछे दोनों तरफ़ देखें। जहाँ टाँके ऊँचे-नीचे हों, गिनें और एक पंखुड़ी और बनाएँ।"]},"result":{"en":"You will have a finished motif and know if slow, patient handwork suits you.","hi":"आपके पास एक तैयार बूटा होगा और पता चलेगा कि धीरज वाला हाथ का काम आपको अच्छा लगता है या नहीं।"},"time":"1 hour","cost":"Under ₹100"},"g":["art","build"]},{"id":"c252","s":"trades","p":965,"n":{"en":"Mechanical Fitter","hi":"मैकेनिकल फिटर"},"w":{"en":"Assembles, adjusts and fits machine parts together exactly, using measuring tools so everything moves smoothly.","hi":"मशीन के पुर्ज़ों को सही नाप से जोड़ता, कसता और फिट करता है, ताकि पूरी मशीन आसानी से चले।"},"t":{"title":{"en":"Take apart and refit an old pen","hi":"पुराना पेन खोलें और फिर से जोड़ें"},"steps":{"en":["Open a used pen and lay each part in order on paper. Draw round each one.","Measure the length of each part with a ruler and write it beside the drawing.","Put the pen back together using only your notes, then check that it clicks and writes."],"hi":["एक पुराना पेन खोलें और हर पुर्ज़ा क्रम से कागज़ पर रखें। हर पुर्ज़े की आउटलाइन बनाएँ।","रूलर से हर पुर्ज़े की लंबाई नापें और चित्र के पास लिख दें।","सिर्फ़ अपने नोट्स देखकर पेन वापस जोड़ें, फिर जाँचें कि क्लिक होता है और लिखता है।"]},"result":{"en":"You will have a labelled parts map and know how to fit small parts in the right order.","hi":"आपके पास पुर्ज़ों का नामी नक्शा होगा और छोटे पुर्ज़े सही क्रम में जोड़ना आ जाएगा।"},"time":"30 min","cost":"Free"},"g":["machines","build"]},{"id":"c253","s":"trades","p":967,"n":{"en":"Multi-Skill Technician (Electrical)","hi":"मल्टी-स्किल टेक्नीशियन (इलेक्ट्रिकल)"},"w":{"en":"Installs, tests and repairs wiring, switches and electrical fittings in homes and buildings, following safety rules.","hi":"घरों और इमारतों में वायरिंग, स्विच और बिजली के फिटिंग लगाता, जाँचता और ठीक करता है, सुरक्षा के नियम मानते हुए।"},"t":{"title":{"en":"Build a virtual circuit with a switch","hi":"वर्चुअल सर्किट बनाएँ, जिसमें स्विच हो"},"steps":{"en":["Open the free Tinkercad Circuits site in your browser and place a battery, a bulb and a switch.","Join them with wires so the bulb glows only when the switch is on.","Add a second bulb first in series, then in parallel. Note which way both stay bright."],"hi":["ब्राउज़र में फ्री Tinkercad Circuits खोलें और बैटरी, बल्ब और स्विच रखें।","तारों से जोड़ें ताकि स्विच ऑन होने पर ही बल्ब जले।","दूसरा बल्ब पहले सीरीज़ में, फिर पैरेलल में जोड़ें। देखें किसमें दोनों तेज़ जलते हैं।"]},"result":{"en":"You will have a working circuit and know how series and parallel wiring differ.","hi":"आपके पास चलता हुआ सर्किट होगा और सीरीज़ व पैरेलल का फ़र्क़ समझ आएगा।"},"time":"45 min","cost":"Free"},"g":["machines","science"]},{"id":"c254","s":"trades","p":969,"n":{"en":"Multi-Skill Technician (Food Processing)","hi":"मल्टी-स्किल टेक्नीशियन (फूड प्रोसेसिंग)"},"w":{"en":"Cleans, grades, processes and packs food in a plant, checking quality and hygiene at every step.","hi":"फैक्ट्री में खाने की चीज़ों को साफ़ करता, छाँटता, प्रोसेस करता और पैक करता है, और हर कदम पर क्वालिटी व सफ़ाई जाँचता है।"},"t":{"title":{"en":"Grade and pack a mini batch","hi":"थोड़े से माल को ग्रेड करें और पैक करें"},"steps":{"en":["Take 20 groundnuts or tomatoes. Wash your hands, then sort them into good, average and reject piles.","Write a three-line quality checklist, for example size, colour and damage. Use it to re-check each pile.","Pack the good pile in a clean bag and label it with the item, weight and date."],"hi":["20 मूँगफली या टमाटर लें। हाथ धोकर उन्हें अच्छा, ठीक-ठाक और खराब, तीन ढेरों में छाँटें।","तीन लाइन की क्वालिटी चेकलिस्ट लिखें, जैसे साइज़, रंग और खराबी। उससे हर ढेर दोबारा जाँचें।","अच्छे ढेर को साफ़ थैली में पैक करें और उस पर चीज़, वज़न और तारीख लिखें।"]},"result":{"en":"You will have a labelled pack and your own quality checklist.","hi":"आपके पास लेबल लगा पैकेट और अपनी बनाई क्वालिटी चेकलिस्ट होगी।"},"time":"30 min","cost":"Free"},"g":["food","science"]},{"id":"c255","s":"trades","p":971,"n":{"en":"Petroleum (Oil) Technologist","hi":"तेल प्रौद्योगिकीविद्"},"w":{"en":"Works with crude oil and fuels, testing samples and helping oil be drilled, separated and processed safely.","hi":"कच्चे तेल और ईंधन पर काम करता है, सैंपल जाँचता है और तेल निकालने, अलग करने व प्रोसेस करने में मदद करता है।"},"t":{"title":{"en":"Test an oil-spill cleanup","hi":"तेल फैलने की सफ़ाई का टेस्ट करें"},"steps":{"en":["Pour a little cooking oil on water in a wide plate. Watch how it floats and spreads.","Try to clean it with a spoon, cotton, a paper towel and a strip of cloth.","Note which one removes the most oil and how long each takes."],"hi":["चौड़ी प्लेट में पानी पर थोड़ा खाने का तेल डालें। देखें कि वह कैसे तैरता और फैलता है।","चम्मच, रुई, पेपर टॉवल और कपड़े की पट्टी से उसे साफ़ करने की कोशिश करें।","लिखें कि कौन सा सबसे ज़्यादा तेल हटाता है और हर एक में कितना समय लगा।"]},"result":{"en":"You will have a small test table showing which method separates oil best.","hi":"आपके पास एक छोटी टेबल होगी जो बताएगी कि तेल अलग करने का कौन सा तरीका सबसे अच्छा रहा।"},"time":"30 min","cost":"Free"},"g":["science","nature"]},{"id":"c256","s":"trades","p":973,"n":{"en":"Boring Machine Operator","hi":"बोरिंग मशीन ऑपरेटर"},"w":{"en":"Runs machines that bore holes in the ground, rock or metal to a set depth and size, following a plan.","hi":"ज़मीन, चट्टान या धातु में तय गहराई और नाप के छेद करने वाली मशीनें चलाता है, प्लान के हिसाब से।"},"t":{"title":{"en":"Take a core sample with a straw","hi":"स्ट्रॉ से कोर सैंपल निकालें"},"steps":{"en":["In a tall glass, press layers of wet sand, soil and flour dough, each about 2 cm thick.","Push a thick straw straight down to the bottom, then lift it out slowly with your finger on top.","Push the sample out onto paper, measure each layer and sketch what you found."],"hi":["ऊँचे गिलास में गीली रेत, मिट्टी और आटे की लोई की लगभग 2-2 सेमी मोटी परतें दबाकर लगाएँ।","मोटी स्ट्रॉ को सीधा तली तक दबाएँ, ऊपर उँगली रखकर धीरे से बाहर निकालें।","सैंपल कागज़ पर निकालें, हर परत नापें और जो दिखा उसका चित्र बनाएँ।"]},"result":{"en":"You will have a core-sample sketch and know how drillers read what lies below the ground.","hi":"आपके पास कोर सैंपल का चित्र होगा और समझ आएगा कि ड्रिलर ज़मीन के नीचे का हाल कैसे पढ़ते हैं।"},"time":"30 min","cost":"Free"},"g":["machines","science"]},{"id":"c257","s":"trades","p":975,"n":{"en":"Pastry Chef","hi":"पेस्ट्री शेफ"},"w":{"en":"Makes and decorates cakes, pastries, cookies and desserts, following exact recipes and creating attractive designs.","hi":"केक, पेस्ट्री, कुकीज़ और मिठाइयाँ बनाता और सजाता है, सटीक रेसिपी के साथ और आकर्षक डिज़ाइन के साथ।"},"t":{"title":{"en":"Pipe and decorate biscuits","hi":"बिस्किट पर क्रीम से सजावट करें"},"steps":{"en":["Mix thick hung curd with a little sugar. Put it in a clean zip bag and snip a tiny corner.","Pipe dots, lines and swirls on plain biscuits. Practise first on a plate.","Decorate three biscuits in a theme such as Diwali or a birthday, and photograph them."],"hi":["गाढ़ा छना हुआ दही थोड़ी चीनी के साथ मिलाएँ। साफ़ ज़िप बैग में भरकर कोना थोड़ा सा काटें।","सादे बिस्किट पर बिंदियाँ, लाइनें और गोले बनाएँ। पहले प्लेट पर अभ्यास करें।","दीवाली या जन्मदिन जैसी थीम पर तीन बिस्किट सजाएँ और फ़ोटो खींचें।"]},"result":{"en":"You will have three decorated biscuits and a sense of how steady piping needs to be.","hi":"आपके पास तीन सजे बिस्किट होंगे और पता चलेगा कि पाइपिंग में हाथ कितना स्थिर चाहिए।"},"time":"45 min","cost":"Under ₹100"},"g":["food","art"]},{"id":"c258","s":"trades","p":977,"n":{"en":"Plumber","hi":"प्लंबर"},"w":{"en":"Fits and repairs water pipes, taps, tanks and drains so water flows where it should and does not leak.","hi":"पानी के पाइप, नल, टंकी और नालियाँ लगाता और ठीक करता है, ताकि पानी सही जगह पहुँचे और लीक न हो।"},"t":{"title":{"en":"Map your home's water path and test the flow","hi":"घर में पानी का रास्ता बनाएँ और बहाव नापें"},"steps":{"en":["Walk around your home and sketch where water comes in, where the taps are and where the drains go.","Time how many seconds a tap takes to fill a one-litre bottle. Try it at two taps.","Check every tap and pipe you can see for drips, and write down what you find."],"hi":["घर में घूमकर स्केच बनाएँ कि पानी कहाँ से आता है, नल कहाँ हैं और नालियाँ कहाँ जाती हैं।","एक लीटर की बोतल नल से भरने में कितने सेकंड लगते हैं, नापें। दो नलों पर करें।","जितने नल और पाइप दिखें, उनमें टपकना देखें और जो मिले लिख लें।"]},"result":{"en":"You will have a home plumbing sketch and flow timings for two taps.","hi":"आपके पास घर के पानी का नक्शा और दो नलों का बहाव समय होगा।"},"time":"30 min","cost":"Free"},"g":["build","machines"]},{"id":"c259","s":"trades","p":979,"n":{"en":"Refrigeration Technician","hi":"रेफ्रिजरेशन तकनीशियन"},"w":{"en":"Installs, services and repairs fridges, freezers and air conditioners, and finds why something is not cooling properly.","hi":"फ्रिज, फ्रीज़र और एसी लगाता, सर्विस करता और ठीक करता है, और पता लगाता है कि ठंडा क्यों नहीं हो रहा।"},"t":{"title":{"en":"Test which wrap keeps ice longest","hi":"देखें कौन सा कवर बर्फ़ को सबसे देर तक रखता है"},"steps":{"en":["Put one ice cube in each of four cups: leave one bare, wrap others in cloth, foil and newspaper.","Keep all cups together in a shady spot and check every 10 minutes.","Record the time each cube takes to melt completely and rank the wraps."],"hi":["चार कपों में एक-एक बर्फ़ का टुकड़ा रखें: एक खुला, बाकी कपड़े, फॉइल और अख़बार में लपेटे।","सारे कप छाँव में साथ रखें और हर 10 मिनट पर देखें।","हर टुकड़े को पूरा पिघलने में लगा समय लिखें और कवर को क्रम में रखें।"]},"result":{"en":"You will have a ranked table that shows why fridge walls need good insulation.","hi":"आपके पास क्रम वाली टेबल होगी, जो बताएगी कि फ्रिज की दीवारों में अच्छा इंसुलेशन क्यों चाहिए।"},"time":"1 hour","cost":"Free"},"g":["science","machines"]},{"id":"c260","s":"trades","p":981,"n":{"en":"Retail Cashier","hi":"खुदरा कोषपाल"},"w":{"en":"Scans or enters items at the counter, makes the bill, takes payment, gives correct change and keeps the cash tally right.","hi":"काउंटर पर सामान स्कैन या दर्ज करता है, बिल बनाता है, पैसे लेता है, सही चिल्लर लौटाता है और कैश का हिसाब ठीक रखता है।"},"t":{"title":{"en":"Run a bill desk in Google Sheets","hi":"गूगल शीट्स में बिल काउंटर चलाएँ"},"steps":{"en":["In Google Sheets, list 8 household items with imaginary prices. Add columns for quantity and total.","Use a SUM formula for the bill total. Ask a family member to buy 4 items.","Take imaginary payment, compute the change and say it aloud politely."],"hi":["गूगल शीट्स में घर की 8 चीज़ें काल्पनिक दाम के साथ लिखें। मात्रा और कुल के कॉलम जोड़ें।","बिल का कुल जोड़ने के लिए SUM फ़ॉर्मूला लगाएँ। परिवार के किसी सदस्य से 4 चीज़ें खरीदने को कहें।","काल्पनिक पेमेंट लें, चिल्लर निकालें और विनम्रता से बोलकर बताएँ।"]},"result":{"en":"You will have a working bill sheet and practice at quick, accurate counter maths.","hi":"आपके पास चलती हुई बिल शीट होगी और तेज़ व सही काउंटर हिसाब का अभ्यास होगा।"},"time":"30 min","cost":"Free"},"g":["money","numbers","people"]},{"id":"c261","s":"trades","p":983,"n":{"en":"Retail Store Operations Assistant","hi":"रिटेल स्टोर ऑपरेशन असिस्टेंट"},"w":{"en":"Keeps a store running by arranging shelves, adding price tags, checking stock and helping customers find what they need.","hi":"दुकान चलाने में मदद करता है: शेल्फ सजाता है, प्राइस टैग लगाता है, स्टॉक जाँचता है और ग्राहकों को सामान ढूँढने में मदद करता है।"},"t":{"title":{"en":"Set up a mini shop at home","hi":"घर में एक छोटी दुकान सजाएँ"},"steps":{"en":["Pick 10 household items. Group them by type and make a paper price tag for each.","Put fast-selling items at eye level and place older items in front.","Ask a family member to shop. Note what they found easily and what they missed."],"hi":["घर की 10 चीज़ें चुनें। उन्हें किस्म के हिसाब से रखें और हर एक का कागज़ी प्राइस टैग बनाएँ।","जो ज़्यादा बिकने वाली हों उन्हें आँख की ऊँचाई पर रखें और पुराना सामान आगे रखें।","परिवार के किसी सदस्य को खरीदारी करने दें। देखें उन्हें क्या आसानी से मिला और क्या छूट गया।"]},"result":{"en":"You will have a neat mini shop and ideas on how arrangement helps customers.","hi":"आपके पास सजी हुई छोटी दुकान होगी और समझ आएगा कि सजावट ग्राहकों की कैसे मदद करती है।"},"time":"45 min","cost":"Free"},"g":["people","money"]},{"id":"c262","s":"trades","p":985,"n":{"en":"Room Attendant (Housekeeping)","hi":"रूम अटेंडेंट"},"w":{"en":"Cleans and prepares hotel or hospital rooms, changes bed linen, restocks supplies and makes sure each room is neat and ready.","hi":"होटल या अस्पताल के कमरे साफ़ करके तैयार करता है, चादरें बदलता है, सामान भरता है और कमरे को सलीकेदार रखता है।"},"t":{"title":{"en":"Reset a room like a hotel","hi":"कमरे को होटल की तरह तैयार करें"},"steps":{"en":["Write a checklist: bed, floor, surfaces, dustbin, curtains, supplies. Set a timer for 20 minutes.","Make the bed with tight, wrinkle-free sheets. Tuck corners neatly. Tidy and wipe surfaces.","Tick the checklist, take a before-and-after photo and note your time."],"hi":["चेकलिस्ट लिखें: बिस्तर, फर्श, सतहें, कूड़ेदान, पर्दे, सामान। 20 मिनट का टाइमर लगाएँ।","चादर कसकर और बिना सलवट के बिछाएँ। कोने सलीके से मोड़ें। सतहें साफ़ और ठीक करें।","चेकलिस्ट पर निशान लगाएँ, पहले-बाद की फ़ोटो खींचें और अपना समय लिखें।"]},"result":{"en":"You will have a neat room, a checklist and your own timing.","hi":"आपके पास साफ़ कमरा, चेकलिस्ट और अपना समय नोट होगा।"},"time":"30 min","cost":"Free"},"g":["service","people"]},{"id":"c263","s":"trades","p":987,"n":{"en":"Rubber Technologist","hi":"रबर प्रौद्योगिकीविद्"},"w":{"en":"Studies and tests rubber materials and helps make products such as tyres, belts and seals strong and long-lasting.","hi":"रबर की चीज़ों की जाँच करता है और टायर, बेल्ट व सील जैसी चीज़ें मज़बूत और टिकाऊ बनाने में मदद करता है।"},"t":{"title":{"en":"Stretch-test different rubber bands","hi":"अलग रबर बैंडों की खिंचाव जाँच करें"},"steps":{"en":["Take 3 rubber bands of different thickness. Hang each from a hook and measure its length.","Add a small bag of stones to each and measure the new length, then remove the weight.","Record stretch and whether each band returned to the old length. Rank them."],"hi":["अलग-अलग मोटाई के 3 रबर बैंड लें। हर एक को हुक पर लटकाकर उसकी लंबाई नापें।","हर पर पत्थरों की छोटी थैली लटकाएँ, नई लंबाई नापें और फिर वज़न हटा दें।","खिंचाव लिखें और देखें कि बैंड पहली लंबाई पर लौटा या नहीं। उन्हें क्रम दें।"]},"result":{"en":"You will have a stretch table showing which rubber is stronger and springier.","hi":"आपके पास खिंचाव की टेबल होगी जो बताएगी कि कौन सा रबर ज़्यादा मज़बूत और लचीला है।"},"time":"30 min","cost":"Under ₹100"},"g":["science","machines"]},{"id":"c264","s":"trades","p":989,"n":{"en":"Self-Employed E-tailer","hi":"स्व-नियोजित ई-टेलर"},"w":{"en":"Sells products online by listing them with photos and prices, taking orders, packing and delivering, and answering customers.","hi":"प्रोडक्ट को फ़ोटो और दाम के साथ ऑनलाइन लिस्ट करके बेचता है, ऑर्डर लेता है, पैक व डिलीवर करता है और ग्राहकों को जवाब देता है।"},"t":{"title":{"en":"Make a product listing in Canva","hi":"कैनवा में प्रोडक्ट लिस्टिंग बनाएँ"},"steps":{"en":["Choose something you could sell, such as a handmade bookmark. Take a clear photo in daylight.","In free Canva, design a listing card with photo, title, price and two benefit lines.","Share it with a friend, ask what they would order, and note any questions."],"hi":["कोई चीज़ चुनें जो आप बेच सकते हैं, जैसे हाथ से बना बुकमार्क। दिन की रोशनी में साफ़ फ़ोटो खींचें।","फ्री कैनवा में फ़ोटो, नाम, दाम और दो खूबियों की लाइन वाला कार्ड बनाएँ।","किसी दोस्त को दिखाएँ, पूछें कि वे क्या ऑर्डर करेंगे और उनके सवाल लिख लें।"]},"result":{"en":"You will have a ready listing card and early feedback from a real person.","hi":"आपके पास तैयार लिस्टिंग कार्ड होगा और एक असली इंसान की पहली राय मिलेगी।"},"time":"45 min","cost":"Free"},"g":["money","art"]},{"id":"c265","s":"trades","p":991,"n":{"en":"Sewing Machine Operator","hi":"सिलाई मशीन संचालक"},"w":{"en":"Stitches cloth pieces into garments and other items on a sewing machine, keeping seams straight, even and strong.","hi":"सिलाई मशीन पर कपड़े के टुकड़े जोड़कर कपड़े और दूसरी चीज़ें सिलता है, सिलाई सीधी, बराबर और मज़बूत रखते हुए।"},"t":{"title":{"en":"Sew a small pouch by hand","hi":"हाथ से एक छोटा पाउच सिलें"},"steps":{"en":["Cut two cloth pieces of 10 cm by 15 cm. Draw a seam line 1 cm from the edge.","Place them together and sew three sides with small, even running stitches on the line.","Turn it right side out, check the seam is straight and keep your pencil in it."],"hi":["कपड़े के 10 सेमी x 15 सेमी के दो टुकड़े काटें। किनारे से 1 सेमी पर सिलाई की लाइन खींचें।","दोनों को मिलाकर रखें और तीन तरफ़ लाइन पर छोटे, बराबर टाँकों से सिलें।","उलटकर सीधा करें, देखें कि सिलाई सीधी है और उसमें अपनी पेंसिल रखें।"]},"result":{"en":"You will have a stitched pouch and know how straight seams take steady hands.","hi":"आपके पास सिला हुआ पाउच होगा और समझ आएगा कि सीधी सिलाई के लिए स्थिर हाथ चाहिए।"},"time":"45 min","cost":"Free"},"g":["build","art"]},{"id":"c266","s":"trades","p":993,"n":{"en":"Showroom Hostess/Attendant","hi":"शोरूम होस्टेस/परिचारक"},"w":{"en":"Welcomes visitors to a showroom, shows them products, answers questions politely and helps them decide.","hi":"शोरूम में आने वालों का स्वागत करता है, प्रोडक्ट दिखाता है, विनम्रता से सवालों के जवाब देता है और फ़ैसला लेने में मदद करता है।"},"t":{"title":{"en":"Role-play a showroom welcome","hi":"शोरूम में स्वागत का रोल-प्ले करें"},"steps":{"en":["Pick an item at home, such as a phone or bag. Write its 3 best features in your own words.","Ask a family member to be a customer. Greet them, show the item and answer their questions.","Record it on your phone and watch it. Note your smile, voice and any hesitations."],"hi":["घर की कोई चीज़ चुनें, जैसे फ़ोन या बैग। उसकी 3 खास बातें अपने शब्दों में लिखें।","परिवार के किसी सदस्य को ग्राहक बनाएँ। उनका स्वागत करें, चीज़ दिखाएँ और सवालों के जवाब दें।","फ़ोन पर रिकॉर्ड करें और देखें। अपनी मुस्कान, आवाज़ और अटकने की जगहें नोट करें।"]},"result":{"en":"You will have a recorded role-play and one thing to improve next time.","hi":"आपके पास रिकॉर्ड किया रोल-प्ले होगा और अगली बार सुधारने की एक बात पता होगी।"},"time":"30 min","cost":"Free"},"g":["people","money"]},{"id":"c267","s":"trades","p":995,"n":{"en":"Smartphone Repair Technician","hi":"स्मार्टफोन रिपेयर तकनीशियन"},"w":{"en":"Finds out why a phone is not working, then fixes or replaces the part, or the software, and tests it again.","hi":"पता लगाता है कि फ़ोन क्यों नहीं चल रहा, फिर पुर्ज़ा या सॉफ़्टवेयर ठीक या बदलता है और दोबारा जाँचता है।"},"t":{"title":{"en":"Write a troubleshooting chart for a phone","hi":"फ़ोन की गड़बड़ी जाँचने का चार्ट बनाएँ"},"steps":{"en":["With a family member's permission, check your phone's battery, storage and apps in Settings. Do not open the phone.","Choose 3 problems: slow phone, battery drains fast, hangs. List causes and checks for each.","Draw a flowchart of yes/no questions that leads to a likely fix. Test it on a friend."],"hi":["परिवार की इजाज़त से फ़ोन की सेटिंग में बैटरी, स्टोरेज और ऐप्स देखें। फ़ोन खोलें नहीं।","3 समस्याएँ चुनें: फ़ोन धीमा, बैटरी जल्दी खत्म, हैंग होना। हर एक के कारण और जाँचें लिखें।","हाँ/ना सवालों वाला फ़्लोचार्ट बनाएँ जो संभावित हल तक ले जाए। दोस्त पर आज़माएँ।"]},"result":{"en":"You will have a flowchart that shows how repair people think step by step.","hi":"आपके पास फ़्लोचार्ट होगा जो दिखाता है कि रिपेयर करने वाले कदम-दर-कदम कैसे सोचते हैं।"},"time":"45 min","cost":"Free"},"g":["machines","code"]},{"id":"c268","s":"trades","p":997,"n":{"en":"Solar and LED Technician","hi":"सोलर एवं एल.ई.डी. तकनीशियन"},"w":{"en":"Installs and maintains solar panels and LED lights, checks that they work well and fixes faults.","hi":"सोलर पैनल और एलईडी लाइटें लगाता और उनकी देखभाल करता है, जाँचता है कि ठीक चल रही हैं और खराबी सुधारता है।"},"t":{"title":{"en":"Test how sun angle changes light","hi":"देखें धूप के कोण से रोशनी कैसे बदलती है"},"steps":{"en":["Use a solar calculator or a free light-meter app on a phone. Place it in sunlight, flat.","Tilt it to 3 angles, such as flat, 30 degrees and 60 degrees. Note the reading or display.","Cover half of it with paper and see what changes. Write what you learned."],"hi":["सोलर कैलकुलेटर या फ़ोन पर फ्री लाइट-मीटर ऐप लें। उसे धूप में सपाट रखें।","3 कोणों पर झुकाएँ, जैसे सपाट, 30 डिग्री और 60 डिग्री। रीडिंग या डिस्प्ले लिखें।","आधे हिस्से पर कागज़ ढकें और देखें क्या बदला। जो सीखा लिख दें।"]},"result":{"en":"You will know why solar panels are tilted and why shade matters.","hi":"आपको पता चलेगा कि सोलर पैनल झुकाकर क्यों लगाते हैं और छाया क्यों मायने रखती है।"},"time":"30 min","cost":"Free"},"g":["science","machines"]},{"id":"c269","s":"trades","p":999,"n":{"en":"Spa Therapist","hi":"स्पा थेरेपिस्ट"},"w":{"en":"Gives relaxing body and skin treatments such as massage, keeping the client comfortable, and follows hygiene and safety rules.","hi":"मसाज जैसे आराम देने वाले शरीर और त्वचा के ट्रीटमेंट देता है, ग्राहक को सहज रखता है और सफ़ाई व सुरक्षा के नियम मानता है।"},"t":{"title":{"en":"Plan a 10-minute relaxation session","hi":"10 मिनट का आराम सेशन प्लान करें"},"steps":{"en":["Write a 10-minute plan: welcome, hand wash, a hand massage, a shoulder stretch and closing.","Try the hand part gently on yourself, or a willing family member, asking about pressure.","Ask for feedback on comfort, then fix your plan. Always stop if anyone says it hurts."],"hi":["10 मिनट का प्लान लिखें: स्वागत, हाथ धोना, हाथ की मालिश, कंधे का स्ट्रेच और समापन।","हाथ वाला हिस्सा खुद पर या किसी राज़ी परिवार के सदस्य पर धीरे से आज़माएँ और दबाव पूछते रहें।","आराम के बारे में राय लें और प्लान सुधारें। किसी को दर्द हो तो तुरंत रुकें।"]},"result":{"en":"You will have a tested session plan and a feel for caring, careful touch.","hi":"आपके पास आज़माया हुआ सेशन प्लान होगा और देखभाल वाले, सावधान स्पर्श का अंदाज़ा आएगा।"},"time":"30 min","cost":"Free"},"g":["health","people","service"]},{"id":"c270","s":"trades","p":1001,"n":{"en":"Stone Cutter (Cutting Machine Operator), Stone Craft","hi":"स्टोन कटर (कटिंग मशीन ऑपरेटर) – स्टोन क्राफ्ट"},"w":{"en":"Operates stone-cutting machines to cut slabs and blocks to exact sizes for floors, counters and carved products.","hi":"पत्थर काटने की मशीनें चलाकर फर्श, काउंटर और नक्काशी की चीज़ों के लिए स्लैब और ब्लॉक सही नाप में काटता है।"},"t":{"title":{"en":"Slice a soap bar into equal tiles","hi":"साबुन की टिक्की को बराबर टाइलों में काटें"},"steps":{"en":["Take a new soap bar. Mark cut lines every 1 cm with a pencil and ruler on all sides.","Pull a stretched thread or dental floss through the lines to slice. Do not use a sharp knife.","Measure each slice thickness. Find the biggest error and think about how you could reduce it."],"hi":["नया साबुन लें। पेंसिल और रूलर से चारों तरफ़ हर 1 सेमी पर कटने की लाइन खींचें।","तना हुआ धागा या डेंटल फ्लॉस लाइनों पर खींचकर काटें। तेज़ चाकू इस्तेमाल न करें।","हर टुकड़े की मोटाई नापें। सबसे बड़ी गलती ढूँढें और सोचें कि उसे कैसे घटाएँ।"]},"result":{"en":"You will have equal slices and know how cutting accuracy is measured.","hi":"आपके पास बराबर टुकड़े होंगे और पता चलेगा कि कटाई की सटीकता कैसे नापी जाती है।"},"time":"30 min","cost":"Under ₹100"},"g":["machines","build"]},{"id":"c271","s":"trades","p":1003,"n":{"en":"Store Keeper (Construction)","hi":"स्टोर कीपर (कंस्ट्रक्शन)"},"w":{"en":"Receives, stores and issues materials such as cement, bricks and tools on a building site, and keeps exact stock records.","hi":"निर्माण साइट पर सीमेंट, ईंट और औज़ार जैसा सामान लेता, रखता और देता है, और स्टॉक का सही रिकॉर्ड रखता है।"},"t":{"title":{"en":"Keep a stock register for a mini site","hi":"छोटी साइट का स्टॉक रजिस्टर बनाएँ"},"steps":{"en":["List 8 items such as pencils, erasers, clips or coins as your site store. Count each one.","In Google Sheets, make columns for received, issued and balance. Add a formula for the balance.","Issue some items to a friend over a day, record each entry and find what is running low."],"hi":["8 चीज़ें, जैसे पेंसिल, रबर, क्लिप या सिक्के, अपनी साइट का भंडार मानकर लिखें। हर एक गिनें।","गूगल शीट्स में आया, दिया और बाकी के कॉलम बनाएँ। बाकी निकालने का फ़ॉर्मूला लगाएँ।","दिन भर में दोस्त को कुछ चीज़ें दें, हर एंट्री लिखें और देखें क्या कम पड़ रहा है।"]},"result":{"en":"You will have a live stock sheet and see why accurate records stop wastage.","hi":"आपके पास चलती स्टॉक शीट होगी और समझ आएगा कि सही रिकॉर्ड से बर्बादी कैसे रुकती है।"},"time":"45 min","cost":"Free"},"g":["numbers","build"]},{"id":"c272","s":"trades","p":1005,"n":{"en":"Stringing/Beading Artist (Fashion Jewellery)","hi":"स्ट्रिंगिंग/बीडिंग आर्टिस्ट (फैशन ज्वेलरी)"},"w":{"en":"Designs and makes necklaces, bracelets and earrings by stringing beads and other pieces into attractive patterns.","hi":"मोतियों और दूसरी चीज़ों को पिरोकर सुंदर पैटर्न में हार, ब्रेसलेट और झुमके डिज़ाइन करता और बनाता है।"},"t":{"title":{"en":"Make a patterned bracelet","hi":"पैटर्न वाला ब्रेसलेट बनाएँ"},"steps":{"en":["Collect beads, buttons or dry pasta tubes. Sketch a repeating pattern of 3 colours on paper.","Measure your wrist with a thread, add 3 cm and cut it. Thread beads following your sketch.","Tie it with a firm knot and try it on. Note what you would change in the design."],"hi":["मोती, बटन या सूखे पास्ता के ट्यूब इकट्ठा करें। कागज़ पर 3 रंगों का दोहराने वाला पैटर्न बनाएँ।","धागे से कलाई नापें, 3 सेमी जोड़कर काटें। अपने स्केच के हिसाब से मोती पिरोएँ।","पक्की गाँठ बाँधकर पहनकर देखें। लिखें कि डिज़ाइन में क्या बदलना चाहेंगे।"]},"result":{"en":"You will have a wearable bracelet and your first jewellery design.","hi":"आपके पास पहनने लायक ब्रेसलेट और अपना पहला ज्वेलरी डिज़ाइन होगा।"},"time":"30 min","cost":"Under ₹100"},"g":["art","build"]},{"id":"c273","s":"trades","p":1007,"n":{"en":"Sugar Technologist","hi":"शर्करा प्रौद्योगिकीविद्"},"w":{"en":"Works in sugar mills to turn sugarcane juice into sugar, testing quality and controlling each step of the process.","hi":"चीनी मिल में गन्ने के रस से चीनी बनाने का काम देखता है, क्वालिटी जाँचता है और हर चरण को नियंत्रित करता है।"},"t":{"title":{"en":"Find how much sugar water can hold","hi":"पता करें पानी कितनी चीनी घोल सकता है"},"steps":{"en":["Fill a glass with 100 ml of tap water. Add sugar one spoon at a time and stir well.","Count the spoons until sugar stops dissolving and stays at the bottom.","Repeat with cold water from the fridge. Compare the two counts and note the difference."],"hi":["गिलास में 100 मिली नल का पानी लें। एक-एक चम्मच चीनी डालकर अच्छी तरह घोलें।","गिनें कि कितने चम्मच के बाद चीनी घुलना बंद होकर नीचे बैठ जाती है।","फ्रिज के ठंडे पानी से दोहराएँ। दोनों गिनती की तुलना करें और फ़र्क़ लिखें।"]},"result":{"en":"You will know how temperature changes how much sugar dissolves, an idea used in sugar making.","hi":"आपको पता चलेगा कि तापमान से चीनी घुलना कैसे बदलता है, यह बात चीनी बनाने में काम आती है।"},"time":"30 min","cost":"Free"},"g":["science","food"]},{"id":"c274","s":"trades","p":1009,"n":{"en":"Tea Taster","hi":"टी टेस्टर"},"w":{"en":"Tastes and smells different teas, judges their look, aroma and flavour, and grades them for quality and blending.","hi":"अलग-अलग चाय को चखकर और सूँघकर उसकी रंगत, खुशबू और स्वाद परखता है और क्वालिटी व ब्लेंडिंग के लिए ग्रेड देता है।"},"t":{"title":{"en":"Score two teas blind","hi":"दो चाय को आँख बंद करके स्कोर करें"},"steps":{"en":["Get two tea types. Compare dry leaves by look and smell. Score colour and aroma from 1 to 5.","Ask an adult to brew each separately in a labelled cup. Let them cool a little.","Taste each with someone else shuffling the cups. Score flavour, then guess which is which."],"hi":["दो तरह की चाय लें। सूखी पत्ती को देखकर और सूँघकर तुलना करें। रंग और खुशबू को 1 से 5 अंक दें।","किसी बड़े से हर चाय अलग कप में बनवाएँ और कप पर लेबल लगाएँ। थोड़ा ठंडा होने दें।","कोई और कप आगे-पीछे कर दे, फिर चखें। स्वाद को अंक दें और अनुमान लगाएँ कौन सी कौन सी है।"]},"result":{"en":"You will have a scored tasting sheet and know how sharp your senses are.","hi":"आपके पास अंक वाली टेस्टिंग शीट होगी और पता चलेगा कि आपकी इंद्रियाँ कितनी तेज़ हैं।"},"time":"30 min","cost":"Under ₹100"},"g":["food","science"]},{"id":"c275","s":"trades","p":1011,"n":{"en":"Tour Operator","hi":"टूर ऑपरेटर"},"w":{"en":"Plans and organises trips for travellers, including routes, stays, meals and budgets, and makes sure the journey runs smoothly.","hi":"यात्रियों के लिए सफ़र प्लान और आयोजित करता है, जिसमें रास्ता, ठहरना, खाना और बजट शामिल है, ताकि यात्रा आराम से चले।"},"t":{"title":{"en":"Plan a 2-day trip for a group","hi":"एक समूह के लिए 2 दिन का ट्रिप प्लान करें"},"steps":{"en":["Pick a place near you and a group of 5 friends. Mark 4 sights on Google Maps and note travel times.","Make a day-by-day plan in Google Sheets with time, activity, food break and rest.","Add a budget column using your own approximate numbers and a simple backup plan for rain."],"hi":["अपने पास की कोई जगह और 5 दोस्तों का ग्रुप चुनें। गूगल मैप्स पर 4 जगहें चिह्नित करें और सफ़र का समय लिखें।","गूगल शीट्स में दिन-दर-दिन प्लान बनाएँ: समय, काम, खाने का ब्रेक और आराम।","अपने अंदाज़े के आँकड़ों से बजट कॉलम जोड़ें और बारिश के लिए एक सरल दूसरा प्लान रखें।"]},"result":{"en":"You will have a trip itinerary with a budget, ready to share with friends.","hi":"आपके पास बजट के साथ ट्रिप का कार्यक्रम होगा, जो दोस्तों को दिखाया जा सकता है।"},"time":"1 hour","cost":"Free"},"g":["travel","numbers","people"]},{"id":"c276","s":"trades","p":1013,"n":{"en":"Tower Technician","hi":"टावर तकनीशियन"},"w":{"en":"Installs, checks and maintains mobile and communication towers and their equipment, working carefully and following safety rules.","hi":"मोबाइल और संचार टावर व उनके उपकरण लगाता, जाँचता और उनकी देखभाल करता है, सावधानी से और सुरक्षा के नियमों के साथ।"},"t":{"title":{"en":"Map your phone signal at home","hi":"घर में फ़ोन सिग्नल का नक्शा बनाएँ"},"steps":{"en":["Draw a simple plan of your home. Pick 6 spots, including near a window and an inner room.","At each spot, note the signal bars or use a free signal-strength app. Stay on the ground, not on a roof.","Colour the plan by strength and explain how walls and distance affect the signal."],"hi":["घर का सरल नक्शा बनाएँ। 6 जगहें चुनें, जिनमें खिड़की के पास और अंदर का कमरा भी हो।","हर जगह सिग्नल की बार देखकर लिखें या फ्री सिग्नल-स्ट्रेंथ ऐप इस्तेमाल करें। छत पर न जाएँ, ज़मीन पर ही रहें।","नक्शे को सिग्नल की ताकत के हिसाब से रंगें और बताएँ कि दीवारें और दूरी सिग्नल को कैसे बदलती हैं।"]},"result":{"en":"You will have a signal map and a better idea of why towers are placed where they are.","hi":"आपके पास सिग्नल का नक्शा होगा और समझ आएगा कि टावर जहाँ लगते हैं वहाँ क्यों लगते हैं।"},"time":"30 min","cost":"Free"},"g":["machines","science"]},{"id":"c277","s":"trades","p":1015,"n":{"en":"Trainee Chef / Commis (Assistant Cook)","hi":"प्रशिक्षु शेफ/सहायक रसोइया"},"w":{"en":"Helps in a kitchen by washing, cutting and preparing ingredients, keeping the station clean and learning to cook under a chef.","hi":"रसोई में सब्ज़ी धोने, काटने और सामग्री तैयार करने में मदद करता है, अपनी जगह साफ़ रखता है और शेफ़ के साथ पकाना सीखता है।"},"t":{"title":{"en":"Prepare a no-cook salad like a kitchen pro","hi":"रसोई के जानकार की तरह बिना पकाए सलाद बनाएँ"},"steps":{"en":["Wash your hands. With an adult nearby, wash and prep cucumber, tomato and onion, in small bowls.","Cut soft items into even pieces with a blunt knife. Keep your board clean.","Mix with lemon and salt, taste, and adjust. Plate it neatly and clean your station."],"hi":["हाथ धोएँ। किसी बड़े के पास रहते हुए खीरा, टमाटर और प्याज़ धोकर छोटी कटोरियों में तैयार रखें।","नरम चीज़ें बिना धार वाले चाकू से बराबर टुकड़ों में काटें। बोर्ड साफ़ रखें।","नींबू और नमक मिलाएँ, चखें और ठीक करें। सलीके से परोसें और अपनी जगह साफ़ करें।"]},"result":{"en":"You will have a fresh salad and a taste of how a tidy, organised kitchen works.","hi":"आपके पास ताज़ा सलाद होगा और पता चलेगा कि सलीके वाली रसोई कैसे चलती है।"},"time":"30 min","cost":"Free"},"g":["food","service"]},{"id":"c278","s":"trades","p":1017,"n":{"en":"Waste Collector","hi":"अपशिष्ट संग्रहकर्ता"},"w":{"en":"Collects and separates household and street waste so it can be recycled, composted or disposed of safely, keeping neighbourhoods clean.","hi":"घरों और गलियों का कचरा इकट्ठा करके अलग करता है, ताकि उसे रीसायकल, खाद या सुरक्षित निपटान किया जा सके और मोहल्ला साफ़ रहे।"},"t":{"title":{"en":"Sort one day of home waste","hi":"घर के एक दिन के कचरे को अलग करें"},"steps":{"en":["Wear gloves. Use three boxes for wet, dry recyclable and other waste. Skip glass, sharp or medical items.","Sort a day's waste into the boxes. Count or weigh each box and note it in a table.","Think of one way your family could reduce the biggest pile."],"hi":["दस्ताने पहनें। गीले, सूखे रीसायकल और बाकी कचरे के लिए तीन डिब्बे लें। काँच, नुकीली और दवाई वाली चीज़ें न छुएँ।","एक दिन का कचरा डिब्बों में छाँटें। हर डिब्बा गिनें या तौलें और टेबल में लिखें।","सोचें कि आपका परिवार सबसे बड़े ढेर को कैसे घटा सकता है।"]},"result":{"en":"You will have a waste table and one practical idea to cut waste at home.","hi":"आपके पास कचरे की टेबल होगी और घर में कचरा घटाने का एक व्यावहारिक तरीका मिलेगा।"},"time":"45 min","cost":"Free"},"g":["service","nature"]},{"id":"c279","s":"trades","p":1019,"n":{"en":"Wood Polisher","hi":"वुड पालिशर"},"w":{"en":"Smooths and finishes wooden furniture and items with sanding and polish, giving them a clean, shiny and protected surface.","hi":"लकड़ी के फर्नीचर और सामान को घिसकर और पॉलिश करके चिकना, चमकदार और सुरक्षित बनाता है।"},"t":{"title":{"en":"Sand and finish a wooden scrap","hi":"लकड़ी के टुकड़े को घिसें और चमकाएँ"},"steps":{"en":["Take a rough wooden piece. Rub half of it with sandpaper along the grain until smooth.","Put a drop of coconut or mustard oil on a cloth and rub it onto half of the sanded part.","Compare the three zones by touch and look. Take a photo and note the difference."],"hi":["लकड़ी का खुरदुरा टुकड़ा लें। उसके आधे हिस्से को रेगमाल से रेशे की दिशा में चिकना होने तक घिसें।","कपड़े पर नारियल या सरसों के तेल की एक बूँद लगाकर घिसे हुए हिस्से के आधे पर रगड़ें।","तीनों हिस्सों को छूकर और देखकर तुलना करें। फ़ोटो खींचें और फ़र्क़ लिखें।"]},"result":{"en":"You will have a wood sample with three finishes and know how polish changes wood.","hi":"आपके पास तीन फ़िनिश वाला लकड़ी का नमूना होगा और पता चलेगा कि पॉलिश लकड़ी को कैसे बदलती है।"},"time":"30 min","cost":"Under ₹100"},"g":["build","art"]}];

  steps:'Steps', youllHave:'You will end up with', like:'I enjoyed this', skip:'Not for me', liked:'On my list', skipped:'Skipped',
  fullCard:'Study path, exams, fees and colleges are on the original card', ncert:'NCERT Career Cards Part 2', page:'page',

  heroSub:'NCERT करियर कार्ड्स के 279 करियर, हर एक के साथ घर पर करने लायक एक छोटी गतिविधि। मज़ा आए तो करियर अपनी सूची में रखो, वरना छोड़ दो।',
  browse:'करियर देखो', random:'कोई भी एक चुनो', another:'दूसरा दिखाओ',

  copy:'मेरी सूची कॉपी करो', copied:'कॉपी हो गया', emptyMine:'अभी कुछ नहीं है। कोई करियर खोलो, गतिविधि करो और “मुझे मज़ा आया” दबाओ।',

  foot2:'कुछ भी नुकीला या गरम इस्तेमाल करना हो तो पहले बड़ों से पूछ लो। ये गतिविधियाँ सिर्फ़ आज़माने के लिए हैं, यह नहीं बताती कि तुम्हें क्या बनना चाहिए।',
  pageShort:'NCERT पृ.', langLabel:'भाषा'
}};

/* ---------- state ---------- */
const store={
  get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let lang=store.get('cs.lang',null);
if(!LANGS.some(l=>l.code===lang)){lang=((navigator.language||'en').toLowerCase().startsWith('hi'))?'hi':'en'}
let V=store.get('cs.v',{});          // id -> 'y' | 'n'
const S={q:'',sec:'',tag:'',time:'',tab:'all',hide:false};
let heroId=null, openId=null;

const $=s=>document.querySelector(s);
const byId=Object.fromEntries(DATA.map(c=>[c.id,c]));
const T=k=>{const v=UI[lang][k];return v===undefined?UI.en[k]:v};
const L=o=>o?(o[lang]??o.en):'';
const other=o=>{const c=LANGS.find(l=>l.code!==lang);return c&&o?o[c.code]:''};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const ICON={
  heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.8 5.6a5 5 0 0 0-7.1 0L12 7.3l-1.7-1.7a5 5 0 0 0-7.1 7.1l1.7 1.7L12 21.5l7.1-7.1 1.7-1.7a5 5 0 0 0 0-7.1z"/></svg>',
  skip:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>',
  x:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>'
};

/* ---------- pieces ---------- */
function verdictBtns(id){
  const v=V[id];
  return `<button class="vbtn y" type="button" data-v="y" data-id="${id}" aria-pressed="${v==='y'}">${ICON.heart}${esc(v==='y'?T('liked'):T('like'))}</button>`+
         `<button class="vbtn n" type="button" data-v="n" data-id="${id}" aria-pressed="${v==='n'}">${ICON.skip}${esc(v==='n'?T('skipped'):T('skip'))}</button>`;
}
function pageRef(c){return `${T('pageShort')} ${c.p}`}
function metaPills(c){
  return `<span class="pill">${esc(L(TIME_L[c.t.time]))}</span><span class="pill">${esc(L(COST_L[c.t.cost]))}</span>`+
    c.g.map(g=>`<span class="pill">${esc(L(TAG_L[g]))}</span>`).join('');
}
function sheetHTML(c,tag){
  const steps=L(c.t.steps);
  return `<div class="sheet"><span class="tab">${esc(T('tryIt'))}</span>
    <div class="sheet-head"><div><${tag}>${esc(L(c.t.title))}</${tag}></div></div>
    <p class="what"><span>${esc(L(c.n))}: ${esc(L(c.w))}</span></p>
    <ul class="steps">${steps.map((s,i)=>`<li><label><input type="checkbox" aria-label="${i+1}"><span class="tx">${esc(s)}</span></label></li>`).join('')}</ul>
    <p class="res"><b>${esc(T('youllHave'))}:</b> <span>${esc(L(c.t.result))}</span></p>
    <div class="meta">${metaPills(c)}</div></div>`;
}

function renderHero(){
  const c=byId[heroId]; if(!c){return}
  $('#hero').innerHTML=sheetHTML(c,'h2').replace('<div class="meta">',`<div class="meta">`)+
   `<div class="cta" style="margin-top:16px"><button class="btn sm" type="button" id="heroOpen">${esc(T('open'))}</button><button class="btn sm" type="button" id="heroNext">${esc(T('another'))}</button></div>`;
  $('#heroOpen').onclick=()=>openCareer(c.id);
  $('#heroNext').onclick=pickRandom;
}
function pickRandom(){
  const pool=DATA.filter(c=>V[c.id]!=='n'&&c.id!==heroId);
  heroId=pool[Math.floor(Math.random()*pool.length)].id; renderHero();
}

function matches(c){
  if(S.tab==='mine'&&V[c.id]!=='y')return false;
  if(S.hide&&V[c.id]==='n'&&S.tab!=='mine')return false;
  if(S.sec&&c.s!==S.sec)return false;
  if(S.tag&&!c.g.includes(S.tag))return false;
  if(S.time&&c.t.time!==S.time)return false;
  if(S.q){
    const q=S.q.toLowerCase();
    const hay=(c.n.en+' '+c.n.hi+' '+c.w.en+' '+c.w.hi+' '+c.t.title.en+' '+c.t.title.hi).toLowerCase();
    if(!hay.includes(q))return false;
  }
  return true;
}
function cardHTML(c){
  const v=V[c.id];
  return `<article class="card${v==='y'?' liked':''}${v==='n'?' skipped':''}">
    <div class="c-top"><span class="c-sec">${esc(L(SEC_L[c.s]))}</span><span class="mono">${esc(pageRef(c))}</span></div>
    <div><h3><button type="button" data-open="${c.id}">${esc(L(c.n))}</button></h3>${lang!=='en'||true?`<div class="c-alt">${esc(other(c.n))}</div>`:''}</div>
    <p class="c-what">${esc(L(c.w))}</p>
    <div class="c-try"><span class="lbl">${esc(T('tryIt'))}</span><span class="ttl">${esc(L(c.t.title))}</span>
      <div class="meta" style="margin:0"><span class="pill">${esc(L(TIME_L[c.t.time]))}</span><span class="pill">${esc(L(COST_L[c.t.cost]))}</span></div></div>
    <div class="c-act">${verdictBtns(c.id)}</div></article>`;
}
function renderList(){
  const rows=DATA.filter(matches);
  $('#count').textContent=T('showing')(rows.length,DATA.length);
  let html='';
  if(!rows.length){
    html=`<div class="empty"><p>${esc(S.tab==='mine'&&!Object.values(V).includes('y')?T('emptyMine'):T('none'))}</p>${S.tab==='mine'?'':`<button class="btn sm" type="button" id="clr">${esc(T('clear'))}</button>`}</div>`;
  }else{
    html=`<div class="grid">${rows.map(cardHTML).join('')}</div>`;
  }
  if(S.tab==='mine'&&rows.length){
    html+=`<div class="cta" style="margin-top:24px"><button class="btn sm" id="copyL" type="button">${esc(T('copy'))}</button></div><textarea class="fb" id="fb" readonly hidden></textarea>`;
  }
  $('#list').innerHTML=html;
  const clr=$('#clr'); if(clr)clr.onclick=()=>{S.q=S.sec=S.tag=S.time='';$('#q').value='';syncControls();renderList()};
  const cp=$('#copyL'); if(cp)cp.onclick=copyList;
  $('#mineN').textContent=Object.values(V).filter(x=>x==='y').length;
}
function copyList(){
  const rows=DATA.filter(c=>V[c.id]==='y');
  const txt=rows.map(c=>`${L(c.n)} (${other(c.n)}) - ${T('ncert')}, ${T('page')} ${c.p}\n  ${L(c.t.title)}`).join('\n');
  const btn=$('#copyL');
  const fallback=()=>{const fb=$('#fb');fb.hidden=false;fb.value=txt;fb.focus();fb.select()};
  try{navigator.clipboard.writeText(txt).then(()=>{btn.textContent=T('copied');setTimeout(()=>btn.textContent=T('copy'),1600)},fallback)}catch(e){fallback()}
}

/* ---------- dialog ---------- */
function openCareer(id){
  openId=id; renderDialog();
  const d=$('#dlg');
  if(!d.open){try{d.showModal()}catch(e){d.setAttribute('open','')}}
}
function renderDialog(){
  if(!openId)return;
  const c=byId[openId];
  $('#dlg').innerHTML=`<div class="dlg"><button class="x" type="button" id="dx" aria-label="${esc(T('close'))}">${ICON.x}</button>
    <div class="head"><span class="c-sec">${esc(L(SEC_L[c.s]))}</span>
      <h2 id="dlgT">${esc(L(c.n))}</h2><div class="c-alt">${esc(other(c.n))}</div></div>
    ${sheetHTML(c,'h3')}
    <div class="verdict" id="dv">${verdictBtns(c.id)}</div>
    <p class="src">${esc(T('fullCard'))}: <span class="mono" style="font-size:13px">${esc(T('ncert'))}, ${esc(T('page'))} ${c.p}</span></p></div>`;
  $('#dx').onclick=()=>$('#dlg').close();
}
$('#dlg').addEventListener('close',()=>{openId=null});
$('#dlg').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const o=e.target.closest('[data-open]'); if(o){openCareer(o.dataset.open);return}
  const v=e.target.closest('.vbtn'); if(v){
    const id=v.dataset.id, val=v.dataset.v;
    if(V[id]===val)delete V[id]; else V[id]=val;
    store.set('cs.v',V); renderList();
    if(openId===id){const dv=$('#dv'); if(dv)dv.innerHTML=verdictBtns(id)}
  }
});
$('#q').addEventListener('input',e=>{S.q=e.target.value.trim();renderList()});
$('#selSec').addEventListener('change',e=>{S.sec=e.target.value;renderList()});
$('#selTime').addEventListener('change',e=>{S.time=e.target.value;renderList()});
$('#hide').addEventListener('change',e=>{S.hide=e.target.checked;renderList()});
$('#rand').addEventListener('click',pickRandom);
$('#goMine').addEventListener('click',()=>{S.tab='mine';syncControls();renderList();$('#browse').scrollIntoView()});

/* ---------- chrome ---------- */
function syncControls(){
  $('#tabs').innerHTML=['all','mine'].map(t=>`<button type="button" data-tab="${t}" aria-pressed="${S.tab===t}">${esc(T(t==='all'?'tabAll':'tabMine'))}</button>`).join('');
  $('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;syncControls();renderList()});
  $('#chips').innerHTML=`<button class="chip" type="button" data-tag="" aria-pressed="${S.tag===''}">${esc(T('allInterests'))}</button>`+
    Object.keys(TAG_L).map(g=>`<button class="chip" type="button" data-tag="${g}" aria-pressed="${S.tag===g}">${esc(L(TAG_L[g]))}</button>`).join('');
  $('#chips').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tag=b.dataset.tag;syncControls();renderList()});
  $('#selSec').innerHTML=`<option value="">${esc(T('allFields'))}</option>`+SEC.map(s=>`<option value="${s}"${S.sec===s?' selected':''}>${esc(L(SEC_L[s]))}</option>`).join('');
  $('#selTime').innerHTML=`<option value="">${esc(T('allTime'))}</option>`+Object.keys(TIME_L).map(k=>`<option value="${esc(k)}"${S.time===k?' selected':''}>${esc(L(TIME_L[k]))}</option>`).join('');
}
function renderLang(){
  $('#langSeg').innerHTML=LANGS.map(l=>`<button type="button" lang="${l.code}" data-lang="${l.code}" aria-pressed="${l.code===lang}">${esc(l.label)}</button>`).join('');
  $('#langSeg').setAttribute('aria-label',T('langLabel'));
  $('#langSeg').querySelectorAll('button').forEach(b=>b.onclick=()=>setLang(b.dataset.lang));
}
function applyText(){
  document.documentElement.lang=lang;
  document.querySelectorAll('[data-i]').forEach(el=>{el.textContent=T(el.dataset.i)});
  $('#h1').innerHTML=T('heroTitle');
  $('#q').placeholder=T('search'); $('#q').setAttribute('aria-label',T('search'));
}
function setLang(l){
  lang=l; store.set('cs.lang',l);
  applyText(); renderLang(); syncControls(); renderHero(); renderList(); renderDialog();
}

/* ---------- start ---------- */
(function init(){
  const pool=DATA.filter(c=>V[c.id]!=='n'); heroId=pool[Math.floor(Math.random()*pool.length)].id;
  applyText(); renderLang(); syncControls(); renderHero(); renderList();
})();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>{try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}})}
</script>
</html>
